<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">
<title>チョキチョキ！もじゃもじゃ床屋と積み木のおうち</title>
<style>
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#6f8293;
  touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
canvas{display:block;position:fixed;left:0;top:0;width:100%;height:100%;touch-action:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#safe{position:fixed;left:0;top:0;width:0;height:0;visibility:hidden;pointer-events:none;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="safe"></div>
<script>
'use strict';
(function(){
/* ============================================================
   チョキチョキ！もじゃもじゃ床屋と積み木のおうち
   髪やひげを横に切る → 切れ端の角材が落ちて家の材料になる
   ============================================================ */
const cv=document.getElementById('c');
const ctx=cv.getContext('2d',{alpha:false});

// ---------- constants ----------
const COLS=8, ROWS=14, MAXH=11, GAP=2, HEADY=22.5, GRAV=26, CUTMIN=1.2, MAXPART=120, MAXRUB=60;
const PAL={
  bg:'#6f8293', bg2:'#687c8d', base:'#53667a', wallShadow:'#5f7284',
  floor:'#d9caa4', floor2:'#c9b78f', slab:'#9a7255',
  hair:'#7a5236', beard:'#efe3c6', mint:'#7fcbb0', mintD:'#4f907d', ver:'#e2573b',
  skin:'#f0c9a0', cheek:'#eda98c', eye:'#3a2a20', mouth:'#7a3226', white:'#fff8ea',
  chair:'#c9503a', pole:'#55626e', glass:'#a8c6d0', frame:'#8a5a3a', cream:'#f6ecd2', door:'#6b4630'
};
const WIGS=[
  {bang:2.5,side:2.6,beard:3.3,mus:1.7,tuft:0.45},
  {bang:4.6,side:5.2,beard:7.4,mus:2.3,tuft:0.8},
  {bang:6.0,side:6.8,beard:9.2,mus:2.7,tuft:1.15}
];
const MESSY=[1,0.64,1.04,0.67,1.02,0.65,1,0.62];
const BEARDY=[5.0,5.8,6.4,6.8,6.8,6.4,5.8,5.0];
const TUFT=[0.6,1.0,0.7,1.1,0.8,1.0,0.6,0.9];

// ---------- utils ----------
const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t;
const ease=t=>t<=0?0:t>=1?1:t*t*(3-2*t);
const rnd=(a,b)=>a+Math.random()*(b-a);
function hex2rgb(h){const n=parseInt(h.slice(1),16);return [n>>16&255,n>>8&255,n&255];}
function tint(hex,f){const c=hex2rgb(hex);const q=x=>clamp(Math.round(x*f),0,255).toString(16).padStart(2,'0');return '#'+q(c[0])+q(c[1])+q(c[2]);}
function mix(a,b,t){const x=hex2rgb(a),y=hex2rgb(b);const q=i=>clamp(Math.round(lerp(x[i],y[i],t)),0,255).toString(16).padStart(2,'0');return '#'+q(0)+q(1)+q(2);}
const shadeCache=new Map();
function shade(hex,f){f=Math.round(f*50)/50;const k=hex+f;let v=shadeCache.get(k);
  if(!v){const c=hex2rgb(hex);v='rgb('+clamp(c[0]*f|0,0,255)+','+clamp(c[1]*f|0,0,255)+','+clamp(c[2]*f|0,0,255)+')';
    if(shadeCache.size>4000)shadeCache.clear();shadeCache.set(k,v);}return v;}

// ---------- layout ----------
let W=0,H=0,DPR=1,U=20,foundX=0,floorY=0,DX=0,DY=0;
const safe={t:0,r:0,b:0,l:0};
function readSafe(){try{const s=getComputedStyle(document.getElementById('safe'));
  safe.t=parseFloat(s.paddingTop)||0;safe.r=parseFloat(s.paddingRight)||0;safe.b=parseFloat(s.paddingBottom)||0;safe.l=parseFloat(s.paddingLeft)||0;}catch(e){}}
function resize(){
  DPR=Math.min(2,window.devicePixelRatio||1);W=Math.max(1,window.innerWidth);H=Math.max(1,window.innerHeight);
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);readSafe();
  const aw=W-safe.l-safe.r, ah=H-safe.t-safe.b;
  U=Math.max(6,Math.min(ah/26.6,aw/16));
  const extra=Math.max(0,ah-26.6*U);
  floorY=safe.t+extra*0.55+25.1*U;
  foundX=safe.l+aw/2-4*U;
  DX=0.36*U;DY=-0.28*U;
  G.trail.length=0;
}
const sx=X=>foundX+X*U, sy=Y=>floorY-Y*U;
const wx=px=>(px-foundX)/U, wy=py=>(floorY-py)/U;

// ---------- drawing primitive: flat-shaded prism ----------
const LX=-0.55,LY=-0.835;
function face(ax,ay,bx,by,dx,dy,nx,ny,col){
  if(nx*dx+ny*dy<=0.01)return;
  ctx.fillStyle=shade(col,0.92+0.28*(nx*LX+ny*LY));
  ctx.beginPath();ctx.moveTo(ax,ay);ctx.lineTo(bx,by);ctx.lineTo(bx+dx,by+dy);ctx.lineTo(ax+dx,ay+dy);ctx.closePath();ctx.fill();
}
function box(cx,cy,w,h,ang,dep,col,mask){
  if(mask===undefined)mask=15;
  const c=Math.cos(ang),s=Math.sin(ang),hw=w/2,hh=h/2;
  const ux=c*hw,uy=s*hw,vx=-s*hh,vy=c*hh;
  const p0x=cx-ux-vx,p0y=cy-uy-vy,p1x=cx+ux-vx,p1y=cy+uy-vy,p2x=cx+ux+vx,p2y=cy+uy+vy,p3x=cx-ux+vx,p3y=cy-uy+vy;
  if(dep>0){const dx=DX*dep,dy=DY*dep;
    if(mask&1)face(p0x,p0y,p1x,p1y,dx,dy,s,-c,col);
    if(mask&2)face(p1x,p1y,p2x,p2y,dx,dy,c,s,col);
    if(mask&4)face(p2x,p2y,p3x,p3y,dx,dy,-s,c,col);
    if(mask&8)face(p3x,p3y,p0x,p0y,dx,dy,-c,-s,col);
  }
  ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(p0x,p0y);ctx.lineTo(p1x,p1y);ctx.lineTo(p2x,p2y);ctx.lineTo(p3x,p3y);ctx.closePath();ctx.fill();
}
// world box: center in world units, size in units
function wbox(X,Y,w,h,ang,dep,col,mask,z){z=z||0;box(sx(X)-DX*z,sy(Y)-DY*z,w*U,h*U,ang,dep,col,mask);}

// ---------- audio (Web Audio synth) ----------
let AC=null,MG=null,NB=null;
function audioInit(){
  try{
    if(!AC){const A=window.AudioContext||window.webkitAudioContext;if(!A)return;AC=new A();
      MG=AC.createGain();MG.gain.value=0.55;MG.connect(AC.destination);
      const len=(AC.sampleRate*0.6)|0;NB=AC.createBuffer(1,len,AC.sampleRate);const d=NB.getChannelData(0);
      for(let i=0;i<len;i++)d[i]=Math.random()*2-1;}
    if(AC.state!=='running'&&AC.resume){const p=AC.resume();if(p&&p.catch)p.catch(()=>{});}
  }catch(e){AC=null;}
}
function tn(f,d,o){if(!AC)return;o=o||{};try{
  const t=AC.currentTime+(o.at||0),os=AC.createOscillator(),g=AC.createGain();
  os.type=o.type||'sine';os.frequency.setValueAtTime(f,t);if(o.to)os.frequency.exponentialRampToValueAtTime(o.to,t+d);
  const v=o.v||0.2;g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v,t+(o.a||0.006));g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  os.connect(g);g.connect(MG);os.start(t);os.stop(t+d+0.03);}catch(e){}}
function nz(d,o){if(!AC||!NB)return;o=o||{};try{
  const t=AC.currentTime+(o.at||0),src=AC.createBufferSource(),fl=AC.createBiquadFilter(),g=AC.createGain();
  src.buffer=NB;fl.type=o.type||'bandpass';fl.frequency.setValueAtTime(o.f||2000,t);if(o.to)fl.frequency.exponentialRampToValueAtTime(o.to,t+d);fl.Q.value=o.q||1;
  const v=o.v||0.2;g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v,t+0.004);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  src.connect(fl);fl.connect(g);g.connect(MG);src.start(t);src.stop(t+d+0.03);}catch(e){}}
const SND={
  snip(p){p=p||1;nz(0.035,{v:0.35,f:3800*p,q:2.5,type:'highpass'});tn(2100*p,0.025,{type:'square',v:0.05});nz(0.03,{v:0.3,f:5600*p,q:3,at:0.055});tn(2600*p,0.02,{type:'square',v:0.04,at:0.055});},
  land(size){const f=clamp(820/(0.7+size*0.45),150,900);tn(f,0.14,{type:'triangle',v:0.3,to:f*0.72});nz(0.05,{v:0.18,f:f*2.2,q:5});},
  squish(){tn(300,0.16,{v:0.22,to:520});tn(160,0.1,{type:'triangle',v:0.1,to:220});},
  blink(){tn(1300,0.05,{v:0.12});tn(1560,0.05,{v:0.12,at:0.15});},
  giggle(){for(let i=0;i<6;i++)tn(520+(i%2)*130+i*12,0.08,{type:'triangle',v:0.15,at:i*0.1,to:430});},
  shrug(){tn(330,0.12,{type:'triangle',v:0.15,to:420});tn(440,0.17,{type:'triangle',v:0.15,at:0.14,to:360});},
  hm(){tn(290,0.3,{type:'triangle',v:0.13,to:430});},
  creak(){tn(95,0.45,{type:'sawtooth',v:0.05,to:120});nz(0.4,{v:0.05,f:300,q:8});},
  crash(){for(let i=0;i<5;i++)tn(170-i*16,0.16,{type:'triangle',v:0.24,at:i*0.07,to:90});nz(0.35,{v:0.18,f:500,q:0.8});},
  click(i){tn(1400+i*95,0.035,{type:'square',v:0.07});nz(0.02,{v:0.14,f:5200,q:3});},
  fanfare(){const n=[523,659,784,1047];n.forEach((f,i)=>{tn(f,0.38,{type:'triangle',v:0.2,at:i*0.12});tn(f*2,0.25,{v:0.05,at:i*0.12});});
    [523,659,784].forEach(f=>tn(f,0.7,{type:'triangle',v:0.12,at:0.5}));tn(2093,0.5,{v:0.06,at:0.55});},
  bonk(){tn(210,0.16,{v:0.25,to:120});nz(0.06,{v:0.12,f:900});},
  pop(){tn(560,0.11,{v:0.2,to:1100});},
  glint(){tn(1760,0.2,{v:0.09});tn(2350,0.26,{v:0.07,at:0.07});},
  settle(){tn(440,0.14,{type:'triangle',v:0.15});tn(660,0.2,{type:'triangle',v:0.15,at:0.1});},
  step(i,up){const f=440*Math.pow(2,(up?i:-i)*2/12);tn(f,0.12,{type:'triangle',v:0.16});nz(0.02,{v:0.1,f:4000,q:3});},
  bridge(i){tn(660+i*20,0.1,{type:'triangle',v:0.12});},
  chime(){[784,988,1175,1568].forEach((f,i)=>tn(f,0.5,{v:0.1,at:i*0.09}));},
  tick(){tn(880,0.04,{v:0.06,type:'triangle'});},
  whoosh(){nz(0.3,{v:0.12,f:600,to:2400,q:1});},
  roll(){tn(140,0.09,{type:'triangle',v:0.18,to:110});}
};

// ---------- game state ----------
const G={
  t:0, phase:'play', strands:[], house:null, town:[], pieces:[], rolling:[], parts:[], trail:[],
  invite:null, lastInput:-10, demo:null, demoDone:false, combo:0, lastCut:-10, mirrorAt:-1,
  hat:{state:'hook',t:0,pop:1,wob:0,wv:0}, mirror:{wob:0,wv:0}, seq:null, seqHold:0, shift:null, wigs:[], wigHL:0,
  cycle:0, wig:1, firstTap:-1, strokeN:0,
  ev:{eyes:0,shrug:0,tilt:0,tiltFix:0,window:0,roll:0,tower:0,collapse:0,eave:0,laugh:0,complete:0,stairs:0,bridge:0,wig:0,cuts:0,landed:0,hm:0,mirror:0,part:0,demo:0}
};
const hd={rot:0,rv:0,dx:0,dy:0};
const UN={sur:0,laugh:0,shrug:0,sheep:0,proud:0,mirror:0,blinkT:-1,nextBlink:2.2,blinkQ:0,gx:0,gy:0.3,
  asym:0,body:0,bow:0,crouchT:-1,hand:null,faceWob:0,fv:0,partT:-1,partDone:false,eyeCov:[true,true],surBig:0};

function newHouse(){return {cells:Array.from({length:ROWS},()=>Array(COLS).fill(null)),win:new Set(),
  tilt:0,tiltV:0,tiltT:0,wob:0,wv:0,roof:0,eave:0,door:0,anim:new Map(),rubble:[],height:0,passage:null,
  nextId:1,flash:Array(COLS).fill(0),creaked:false,tiltBig:false,collapseCD:0,ledgeGlow:0};}
function topOf(h,c){for(let r=ROWS-1;r>=0;r--)if(h.cells[r][c])return r+1;return 0;}
function houseHeight(h){let m=0;for(let c=0;c<COLS;c++)m=Math.max(m,topOf(h,c));return m;}

function makeStrands(w,gk){
  const S=[],j=()=>rnd(-0.12,0.12);
  const mk=(g,ax,ay,a,max,col,wd)=>({g,ax,ay,a,max,len:Math.max(0.5,max),col,wd,wob:0,wv:0,sq:1,sv:0,gk:gk,dust:0,glow:0});
  for(let c=0;c<8;c++)S.push(mk('beard',c+0.5,BEARDY[c],(c-3.5)*0.03,w.beard*MESSY[(c+3)%8]+j(),c,0.95));
  S.push(mk('side',-1.3,1.7,0,w.side*0.82+j(),0,1.0),mk('side',-0.5,1.1,0,w.side+j(),0,1.0),
         mk('side',9.3,1.7,0,w.side*0.78+j(),7,1.0),mk('side',8.5,1.1,0,w.side*0.94+j(),7,1.0));
  for(let c=0;c<8;c++)S.push(mk('bang',c+0.5,0.55,(c-3.5)*0.025,w.bang*MESSY[c]+j(),c,0.92));
  const xs=[2.4,3.0,3.6,4.4,5.0,5.6];
  for(const x of xs)S.push(mk('mus',x,5.0,(x<4?-1:1)*(0.5+Math.abs(x-4)*0.35),w.mus*(1-Math.abs(x-4)*0.1),clamp(Math.floor(x),0,7),0.7));
  return S;
}

// ---------- head transform ----------
function H2S(x,y){const px=x-4,py=y-7,c=Math.cos(hd.rot),s=Math.sin(hd.rot);
  return [sx(4+px*c-py*s+hd.dx), sy(HEADY-(7+px*s+py*c+hd.dy))];}
function sGeom(s){const p=H2S(s.ax,s.ay);const A=s.a+s.wob-hd.rot;
  return {x:p[0],y:p[1],dx:Math.sin(A),dy:Math.cos(A),A,L:s.len*U*s.sq*s.gk};}
const cuttable=s=>s.len>CUTMIN&&s.gk>0.95;

// ---------- particles ----------
function addPart(X,Y,vx,vy,col,s,life,grav){if(G.parts.length>=MAXPART)G.parts.shift();
  G.parts.push({X,Y,vx,vy,col,s,life,max:life,grav:grav===undefined?1:grav,ang:rnd(0,3)});}

// ---------- cutting ----------
let stroke=null, activePointer=null;
function cutSeg(x0,y0,x1,y1){
  if(G.phase!=='play')return;
  const d=Math.hypot(x1-x0,y1-y0),n=Math.max(1,Math.ceil(d/(0.22*U)));
  const dir=Math.sign(x1-x0)||(stroke?stroke.dir:1);
  if(stroke&&Math.abs(x1-x0)>1)stroke.dir=dir;
  for(let i=1;i<=n;i++){const px=lerp(x0,x1,i/n),py=lerp(y0,y1,i/n);
    for(const s of G.strands){if(!cuttable(s))continue;const g=sGeom(s);
      const rx=px-g.x,ry=py-g.y,along=rx*g.dx+ry*g.dy,across=Math.abs(rx*g.dy-ry*g.dx);
      if(across<0.64*U&&along>0.38*U&&along<g.L-0.12*U){cutStrand(s,along/(U*s.sq*s.gk),dir,g);}
    }}
}
function cutStrand(s,at,dir,g){
  const cl=s.len-at;if(cl<0.25)return;
  s.len=at;s.sq=0.9;s.sv=2.2;s.wv+=dir*1.4;
  const t=G.t;
  G.combo=(t-G.lastCut<1.3)?Math.min(G.combo+1,10):0;G.lastCut=t;G.ev.cuts++;
  SND.snip(1+G.combo*0.035+(s.g==='mus'?0.15:0));
  // cut point & piece centre
  const cpx=g.x+g.dx*at*U, cpy=g.y+g.dy*at*U, mid=(at+cl/2)*U;
  const PX=wx(g.x+g.dx*mid),PY=wy(g.y+g.dy*mid);
  const col=(s.g==='beard')?PAL.beard:PAL.hair;
  for(let k=0;k<4;k++)addPart(wx(cpx),wy(cpy),rnd(-2,2)+dir*1.5,rnd(1,4),col,rnd(0.12,0.22),rnd(0.5,0.9));
  // reactions
  if(s.g==='beard'){UN.shrug=1.0;if(t-(UN.lastShrug||-9)>1.2){SND.shrug();UN.lastShrug=t;}G.ev.shrug++;}
  else if(s.g==='mus'){UN.laugh=1.5;hd.rv+=0.4*dir;if(t-(UN.lastLaugh||-9)>1.0){SND.giggle();UN.lastLaugh=t;}G.ev.laugh++;}
  else {UN.blinkQ=Math.max(UN.blinkQ,1);}
  G.mirrorAt=t+1.4;
  // piece
  const sid=stroke?stroke.id:-1;
  if(s.g==='mus'){
    let p=G.pieces.find(q=>q.type==='eave'&&q.sid===sid&&q.state==='fall'&&t-q.t0<0.4);
    if(p){p.len+=cl;p.tw=Math.min(3.2,0.6+p.len*0.4);}
    else G.pieces.push({type:'eave',sid,len:cl,X:PX,Y:PY,vx:dir*0.8,vy:2.5,ang:-g.A,va:dir*3,w:0.7,h:cl,tw:0.6+cl*0.4,th:0.32,
      col:tint(PAL.hair,0.85),t0:t,state:'fall',dir});
    return;
  }
  let cl2=cl;
  if(cl<0.5){s.dust+=cl;if(s.dust<0.85)return;cl2=s.dust;s.dust=0;}
  const pcol=tint(col,rnd(0.93,1.06));
  if(cl2<1.7){
    G.pieces.push({type:'small',sid,cmin:s.col,cmax:s.col,vox:cl2,n:1,X:PX,Y:PY,vx:dir*1.2,vy:rnd(1.5,3),ang:-g.A,va:dir*rnd(4,8),
      w:s.wd,h:cl2,tw:1,th:1,col:pcol,t0:t,state:'fall',dir,g:s.g});
    return;
  }
  // thick: merge with a chunk from the same stroke if adjacent
  let p=G.pieces.find(q=>q.type==='big'&&q.sid===sid&&q.state==='fall'&&t-q.t0<0.3&&s.col>=q.cmin-1&&s.col<=q.cmax+1&&((q.g==='beard')===(s.g==='beard')));
  if(p){p.cmin=Math.min(p.cmin,s.col);p.cmax=Math.max(p.cmax,s.col);p.vox+=cl;p.n++;p.X=(p.X*(p.n-1)+PX)/p.n;p.Y=Math.max(p.Y,PY);
    setBigDims(p);}
  else{p={type:'big',sid,cmin:s.col,cmax:s.col,vox:cl,n:1,X:PX,Y:PY,vx:dir*1.4,vy:rnd(2,3.2),ang:-g.A,va:dir*rnd(3,6),
      w:s.wd,h:cl,tw:1,th:1,col:pcol,t0:t,state:'fall',dir,g:s.g};setBigDims(p);G.pieces.push(p);}
}
function setBigDims(p){const w=p.cmax-p.cmin+1;p.tw=w;p.th=clamp(Math.round(p.vox/w/1.5),1,3);}

// ---------- landing / building ----------
function addAnim(h,id,ox,oy,dur){h.anim.set(id,{t:0,ox,oy,dur:dur||0.14});}
function place(h,c0,w,r0,hh,col,kind){const id=h.nextId++;let n=0;
  for(let r=r0;r<r0+hh;r++)for(let c=c0;c<c0+w;c++){if(r>=MAXH||r<0||c<0||c>=COLS)continue;
    if(h.cells[r][c])continue;h.cells[r][c]={id,col,k:kind};h.win.delete(r*COLS+c);n++;}
  return id;}
function land(p){
  const h=G.house;G.ev.landed++;
  if(p.type==='small'){
    let c=p.cmin;
    for(let i=0;i<3;i++){const t=topOf(h,c),tl=c>0?topOf(h,c-1):-9,tr=c<7?topOf(h,c+1):-9;
      const cand=[];if(c>0&&t-tl>=3)cand.push([tl,c-1]);if(c<7&&t-tr>=3)cand.push([tr,c+1]);
      if(!cand.length)break;cand.sort((a,b)=>a[0]-b[0]||((b[1]-c)*p.dir-(a[1]-c)*p.dir));c=cand[0][1];}
    const t=topOf(h,c);let r=t;

        for(let k=0;k<5;k++)addPart(c+0.5,t+0.5,rnd(-1,1),rnd(0.5,2),PAL.white,0.12,0.6,0.2);}}
    if(r>=MAXH){overflow(p);return;}
    const id=place(h,c,1,r,1,p.col,'s');addAnim(h,id,p.X-(c+0.5),-(p.Y-(r+0.5)));

        rest=0;for(let c=c0;c<c0+w;c++)rest=Math.max(rest,topOf(h,c));}}

function finalizeBig(h,c0,w,hh,rest,col,fromX,fromY){

function puff(X,Y,n){for(let k=0;k<n;k++)addPart(X+rnd(-0.5,0.5),Y+0.1,rnd(-2.5,2.5),rnd(0.5,2),PAL.cream,rnd(0.12,0.2),rnd(0.3,0.5),0.5);}
function knock(h,list,dir,big){

function spawnRubble(X,Y,vx,vy,col){const h=G.house;

function afterChange(h){

  const o=mx/(m+8);const ht=houseHeight(h);
  h.tiltT=clamp(o*0.085,-0.3,0.3);
  const big=Math.abs(o)>0.75&&m>=8;
  if(big&&!h.tiltBig){G.ev.tilt++;SND.creak();UN.sur=Math.max(UN.sur,0.6);}
  if(!big&&h.tiltBig){G.ev.tiltFix++;SND.settle();for(let k=0;k<6;k++)addPart(rnd(0,8),0.2,rnd(-1,1),rnd(1,2.5),PAL.mint,0.16,0.7,0.3);}
  h.tiltBig=big;
  if(Math.abs(o)>1.6&&ht>=4&&m>=16&&h.collapseCD<=0){
    const from=Math.floor(ht/2);const ks=[];

    UN.laugh=Math.max(UN.laugh,1.0);

  const H2=houseHeight(h);
  if(G.town.length&&Math.abs(H2-G.town[0].height)<=1&&H2>0){if(h.ledgeGlow<=0.05){h.ledgeGlow=1.2;SND.glint();}}
}

function updatePieces(dt){
  const h=G.house;
  for(let i=G.pieces.length-1;i>=0;i--){const p=G.pieces[i];
    p.w=lerp(p.w,p.tw,Math.min(1,dt*9));p.h=lerp(p.h,p.th,Math.min(1,dt*9));
    p.vy-=GRAV*dt;p.Y+=p.vy*dt;p.ang+=p.va*dt;p.va*=(1-dt*1.2);
    if(p.type==='eave'){
      p.X=lerp(p.X,4,Math.min(1,dt*4));
      const ty=2.3;if(p.Y<=ty+0.2&&p.vy<0){h.eave=Math.min(14,h.eave+p.len);G.ev.eave++;SND.land(0.8);SND.click(4);puff(4,2,4);
        G.pieces.splice(i,1);continue;}
      p.dist=p.Y-ty;continue;
    }
    const tx=p.cmin+p.tw/2;p.X+=(tx-p.X)*Math.min(1,dt*7);
    let rest=0;for(let c=p.cmin;c<=p.cmin+p.tw-1;c++)rest=Math.max(rest,topOf(h,c));
    p.dist=p.Y-p.h/2-rest;
    if(p.dist<=0&&p.vy<0){p.Y=rest+p.th/2;G.pieces.splice(i,1);land(p);}
  }
}
function updateRolling(dt){

    R.timer-=dt;R.hop=Math.max(0,R.hop-dt*5);
    if(R.timer>0)continue;R.timer=0.2;
    let stop=false;
    if(R.steps<=0)stop=true;else{
      const nc=R.c0+R.dir;
      if(nc<0||nc+R.w>COLS)stop=true;else{
        let nr=0;for(let c=nc;c<nc+R.w;c++)nr=Math.max(nr,topOf(h,c));
        if(nr>R.rest){const lc=R.dir>0?nc+R.w-1:nc;const tl=topOf(h,lc);
          if(tl-R.rest>=2){const ks=[];
            for(const cc of [lc,lc+R.dir]){if(cc<0||cc>=COLS)continue;if(topOf(h,cc)-R.rest<2)continue;
              for(let r=R.rest+1;r<ROWS;r++)if(h.cells[r][cc])ks.push([r,cc]);}
            knock(h,ks,R.dir,true);G.ev.tower++;SND.crash();UN.sur=1.3;UN.surBig=1;afterChangeLite(h);}
          else SND.tick();

        else{R.c0=nc;R.rest=nr;R.fx=nc;R.fy=nr;R.steps--;R.hop=1;R.ang+=R.dir*Math.PI/2;SND.roll();puff(nc+R.w/2,nr,2);}
      }}

}

function updateUncle(dt){

    if(UN.eyeCov[i]&&!cov&&G.phase==='play'){UN.blinkQ=2;UN.sur=Math.max(UN.sur,1.3);G.ev.eyes++;SND.blink();
      const p=H2S(i?6:2,3.2);for(let k=0;k<5;k++)addPart(wx(p[0]),wy(p[1]),rnd(-2,2),rnd(1,3),PAL.white,0.13,0.6,0.3);}

      for(let i=0;i<6;i++)addPart(4+rnd(-1,1),G.house.height+1+rnd(0,1),rnd(-3,3),rnd(2,4),PAL.cream,0.18,0.7,0.6);}}

function checkComplete(){

// ---------- completion sequence ----------
function startComplete(){
  G.phase='complete';G.ev.complete++;const h=G.house;h.tiltT=0;
  const S=[];let t=0.35;
  const rb=h.rubble.filter(r=>r.state==='rest');
  rb.forEach((r,i)=>{S.push({at:t,fn:()=>snapRubble(h,r,i)});t+=0.08;});
  if(rb.length)t+=0.35;
  for(let c=0;c<COLS;c++)S.push({at:t+c*0.08,fn:()=>{h.flash[c]=1;SND.click(c);h.wv+=0.4;}});
  t+=COLS*0.08+0.2;
  S.push({at:t,fn:()=>{h.height=houseHeight(h);h.door=1;SND.fanfare();UN.sur=0.7;
    for(let i=0;i<16;i++)addPart(rnd(-0.5,8.5),rnd(0,h.height+1),rnd(-2,2),rnd(2,6),[PAL.mint,PAL.ver,PAL.cream][i%3],0.18,1.0,0.6);}});
  t+=0.9;
  S.push({at:t,fn:()=>{UN.crouchT=0;}});t+=2.3;
  S.push({at:t,fn:()=>{G.hat.state='fly';G.hat.t=0;SND.whoosh();}});t+=1.8;
  S.push({at:t,fn:()=>{UN.proud=1.4;UN.bowT=0;SND.settle();}});t+=1.1;
  S.push({at:t,fn:()=>startPassage(h)});t+=0.1;
  S.push({at:t,fn:()=>showWigs()});
  G.seq={t:0,list:S,i:0};
}
function snapRubble(h,r,i){
  let best=-1,bt=99;
  for(let c=0;c<COLS;c++){const tp=topOf(h,c);const sc=tp+Math.abs(c+0.5-clamp(r.X,0,8))*0.15;if(tp<MAXH&&sc<bt){bt=sc;best=c;}}
  r.state='snap';r.st=0;r.sx0=r.X;r.sy0=r.Y;r.sz0=r.z;
  if(best<0){r.tc=-1;r.tx=r.X;r.ty=r.Y;}else{r.tc=best;r.tr=topOf(h,best);r.tx=best+0.5;r.ty=r.tr+0.5;
    // reserve the cell so following snaps stack
    h.cells[r.tr][best]={id:-999,col:r.col,k:'s',ghost:true};}
  SND.click(i%8);
}
function startPassage(h){

  const hp=G.town[0].height,hc=houseHeight(h);h.height=hc;const d=Math.abs(hp-hc);

function updateSeq(dt){
  if(!G.seq)return;

  const S=G.seq;S.t+=dt;
  while(S.i<S.list.length&&S.t>=S.list[S.i].at){const a=S.list[S.i++];a.fn();if(G.seqHold>0)break;}
  if(S.i>=S.list.length)G.seq=null;
}

const HL_SEQ=[0,0,2,1,1,2];

      ctx.strokeStyle=PAL.ver;ctx.lineWidth=Math.max(1,U*0.08);ctx.beginPath();ctx.moveTo(sx(xL+0.15),sy(P.hp+0.75));ctx.lineTo(sx(xR-0.15),sy(P.hc+0.75));ctx.stroke();}
  } else {const n=P.n,sw=GAP/n,show=Math.floor(P.prog*n+0.001),d=P.hc-P.hp;
    for(let i=0;i<show;i++){const top=P.hp+d*(i+1)/(n+1);wbox(xL+sw*(i+0.5),top/2,sw*1.002,top,0,1,i%2?PAL.beard:tint(PAL.hair,1.1),15);}
  }
}
function drawLedge(){
  if(!G.town.length||G.phase!=='play')return;const hp=G.town[0].height;const h=G.house;
  const gl=h.ledgeGlow>0?0.5+0.5*Math.sin(G.t*10):0;
  wbox(-GAP+0.3,hp-0.18,0.6,0.36,0,0.9,gl>0.5?PAL.white:PAL.mint);
}
function drawRubble(h,X0){
  for(const r of h.rubble){box(sx(X0+r.X)-DX*r.z,sy(r.Y)-DY*r.z,U*0.8,U*0.8,r.ang,0.8,r.col);}
}
function drawPieces(){
  const h=G.house;
  for(const p of G.pieces){
    if(p.type!=='eave'){let rest=0;for(let c=p.cmin;c<=p.cmin+p.tw-1;c++)rest=Math.max(rest,topOf(h,c));
      const k=clamp(1-(p.dist||0)/14,0.15,0.6);ctx.fillStyle='rgba(40,40,50,'+(k*0.45).toFixed(3)+')';
      const x0=sx(p.cmin+Math.tan(h.tilt)*rest),y0=sy(rest);ctx.beginPath();ctx.moveTo(x0,y0);ctx.lineTo(x0+p.tw*U,y0);ctx.lineTo(x0+p.tw*U+DX,y0+DY);ctx.lineTo(x0+DX,y0+DY);ctx.fill();}
    const q=p.type==='small'?Math.PI/2:Math.PI;let res=p.ang-Math.round(p.ang/q)*q;
    const f=clamp((p.dist||0)/3,0,1);const ang=res*f+(p.ang-res)*0;
    // early: show as the original strand piece rotating into a block
    const age=G.t-p.t0;const a2=age<0.15?lerp(p.ang,ang,age/0.15):ang;
    box(sx(p.X),sy(p.Y),p.w*U,p.h*U,a2,p.type==='eave'?0.8:1,p.col);
  }
  for(const R of G.rolling){const hop=Math.sin(R.hop*Math.PI)*0.35;const tw=Math.sin(R.hop*Math.PI)*0.35*R.dir;
    box(sx(R.X+Math.tan(h.tilt)*R.Y),sy(R.Y+hop),R.w*U,R.hh*U,tw,1,R.col);}
}
function drawParts(){for(const p of G.parts){ctx.globalAlpha=clamp(p.life/p.max*1.5,0,1);box(sx(p.X),sy(p.Y),p.s*U,p.s*U,p.ang,0.3,p.col);}ctx.globalAlpha=1;}
function drawTrail(){
  if(G.trail.length<2)return;ctx.lineCap='round';ctx.lineJoin='round';
  for(let i=1;i<G.trail.length;i++){const a=G.trail[i-1],b=G.trail[i];if(b.s!==a.s)continue;const age=G.t-b.t;
    ctx.strokeStyle='rgba(255,255,255,'+clamp(1-age/0.28,0,1).toFixed(3)+')';ctx.lineWidth=U*0.22*clamp(1-age/0.28,0.2,1);
    ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();}
}
function drawWigs(){
  if(!G.wigs.length&&!G.shift)return;
  const e=G.shift?clamp(G.shift.t/0.45,0,1):0;
  if(G.wigs.length){const shelfA=G.shift?1-e:1;
    if(shelfA>0.02){ctx.globalAlpha=shelfA;wbox(4,12.6,9.6,0.4,0,1.2,PAL.frame);ctx.globalAlpha=1;}}
  for(const w of G.wigs){
    const app=ease(w.t/0.35);if(app<=0)continue;
    let X=w.X,Y=w.Y,k=0.3*app;
    if(G.shift){if(w.i===G.shift.i){X=lerp(w.X,4,ease(e));Y=lerp(w.Y,HEADY-2,ease(e));k=lerp(0.3,1,ease(e));if(e>=1)continue;}
      else{Y=w.Y-ease(e)*3;k=0.3*(1-e);if(k<0.02)continue;}}
    if(!G.shift){wbox(X,13.1,0.3,0.6,0,0.5,PAL.pole);}
    const hl=(!G.shift&&w.i===G.wigHL);
    if(hl){ctx.globalAlpha=0.45+0.25*Math.sin(G.t*5);box(sx(X),sy(Y),U*3.3,U*4.6+WIGS[w.i].beard*U*0.3,0,0,'#fff6d6');ctx.globalAlpha=1;}
    ctx.save();ctx.translate(sx(X),sy(Y));ctx.scale(1,w.sq);drawMini(0,-0.2*U*k/0.3,k,WIGS[w.i],false);ctx.restore();
  }
}
function drawHand(x,y,press){
  const s=U*(1-press*0.12);
  box(x+0.2*s,y+0.75*s,0.95*s,0.95*s,0,0.8,PAL.skin);
  box(x,y+0.1*s,0.32*s,0.75*s,0,0.6,PAL.skin);
  box(x+0.65*s,y+0.45*s,0.3*s,0.4*s,0,0.6,tint(PAL.skin,0.95));
}
function drawDemo(){
  const D=G.demo;if(!D)return;const t=D.t;const a=t<0.2?t/0.2:t>1.3?Math.max(0,1-(t-1.3)/0.3):1;
  ctx.globalAlpha=a;
  if(D.kind==='swipe'){const k=ease(clamp((t-0.25)/0.8,0,1));const x=lerp(D.x0,D.x1,k),y=lerp(D.y0,D.y1,k);
    if(k>0&&k<1){ctx.strokeStyle='rgba(255,255,255,0.7)';ctx.lineWidth=U*0.18;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(lerp(D.x0,D.x1,Math.max(0,k-0.35)),lerp(D.y0,D.y1,Math.max(0,k-0.35)));ctx.lineTo(x,y);ctx.stroke();}
    drawHand(x,y,k>0&&k<1?1:0);}
  else{const px=sx(D.X),py=sy(D.Y);const pr=(t>0.5&&t<0.8)?1:0;drawHand(px,py-(pr?0:0.4*U),pr);}
  ctx.globalAlpha=1;
}
function render(){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  drawBG();
  drawMirror();drawHook();
  drawUncle();
  // town (previous houses) + current
  const se=shiftE(),step=8+GAP;
  for(let k=G.town.length-1;k>=0;k--){const X0=-step*(k+1+se);if(sx(X0+10)<-U*2)continue;drawHouse(G.town[k],X0,false);
    if(k+1<=G.town.length)drawPassage(G.town[k],X0);}
  drawLedge();
  drawHouse(G.house,-step*se,true);drawPassage(G.house,-step*se);
  if(G.shift&&se>0)wbox(step*(1-se)+4,-0.2,8.7,0.4,0,1.7,PAL.slab,15,0.2);
  drawRubble(G.house,-step*se);
  if(G.hat.state==='fly'&&G.hat.t>=0.35&&G.hat.X!==undefined)drawHat(G.hat.X,G.hat.Y,G.hat.s,G.hat.ang);
  if(UN.hand){const h=UN.hand;wbox(h.X,h.Y,1.15,1.05,0,0.9,PAL.skin,15,0.4);wbox(h.X-0.35,h.Y+0.72,0.38,0.6,0,0.7,PAL.skin,15,0.4);}
  drawWigs();
  drawPieces();drawParts();drawTrail();drawDemo();
}

// ---------- input ----------
function nearestStrand(x,y,rad){let best=null,bd=rad*U;
  for(const s of G.strands){if(s.gk<0.5)continue;const g=sGeom(s);const rx=x-g.x,ry=y-g.y;let al=rx*g.dx+ry*g.dy;al=clamp(al,0,g.L);
    const d=Math.hypot(x-(g.x+g.dx*al),y-(g.y+g.dy*al));if(d<bd){bd=d;best=s;}}return best;}
function tapAt(x,y){
  const X=wx(x),Y=wy(y);
  if(G.phase==='choose'){for(const w of G.wigs){if(Math.abs(X-w.X)<1.65&&Y>w.Y-2.6&&Y<w.Y+1.8){chooseWig(w.i);return;}}}
  const s=nearestStrand(x,y,0.85);
  if(s&&G.phase==='play'){
    for(const o of G.strands)if(o.g===s.g){const g1=sGeom(o),g2=sGeom(s);const d=Math.hypot(g1.x-g2.x,g1.y-g2.y)/U;const f=Math.max(0,1-d/3.5);
      if(f>0){o.sq=Math.min(o.sq,1-0.22*f);o.sv=-0.5*f;o.wv+=rnd(-1,1)*f;}}
    SND.squish();if(G.firstTap<0)G.firstTap=G.t;
    const g=sGeom(s);for(let k=0;k<3;k++)addPart(X,Y,rnd(-1.5,1.5),rnd(1,3),s.g==='beard'?PAL.beard:PAL.hair,0.14,0.5,0.6);void g;
    if(s.g==='bang')UN.blinkQ=Math.max(UN.blinkQ,1);
    return;}
  // unrelated objects: just a small wiggle
  if(Math.abs(X-10.25)<1.1&&Math.abs(Y-18.4)<1.7){G.mirror.wv+=1.2;SND.tick();return;}
  if(Math.abs(X+2.5)<1.6&&Y>19.6&&Y<22){G.hat.wv+=1.5;SND.tick();return;}
  const hc=H2S(4,3.5);if(Math.abs(x-hc[0])<4*U&&Math.abs(y-hc[1])<3.8*U){UN.fv-=1.5;UN.blinkQ=1;SND.tick();return;}
  const ht=houseHeight(G.house);if(X>-0.4&&X<8.4&&Y>-0.5&&Y<ht+0.5&&ht>0){G.house.wv+=1.2;SND.tick();return;}
}
function evPos(e){const r=cv.getBoundingClientRect();return [e.clientX-r.left,e.clientY-r.top];}
function onDown(e){
  e.preventDefault();audioInit();
  if(activePointer!==null)return; // extra fingers are ignored
  activePointer=e.pointerId;try{cv.setPointerCapture(e.pointerId);}catch(_){}
  const [x,y]=evPos(e);G.strokeN++;
  stroke={id:G.strokeN,x0:x,y0:y,lx:x,ly:y,moved:false,dir:1};
  G.lastInput=G.t;G.demo=null;G.demoDone=false;UN.partDone=false;
  tapAt(x,y);
}
function onMove(e){
  if(e.pointerId!==activePointer||!stroke)return;e.preventDefault();
  const evs=(e.getCoalescedEvents&&e.getCoalescedEvents().length)?e.getCoalescedEvents():[e];
  for(const ev of evs){const [x,y]=evPos(ev);
    if(!stroke.moved&&Math.hypot(x-stroke.x0,y-stroke.y0)>0.32*U){stroke.moved=true;}
    if(stroke.moved){cutSeg(stroke.lx,stroke.ly,x,y);G.trail.push({x,y,t:G.t,s:stroke.id});if(G.trail.length>40)G.trail.shift();}
    stroke.lx=x;stroke.ly=y;}
  G.lastInput=G.t;
}
function endStroke(e){if(e&&e.pointerId!==activePointer)return;
  if(e){try{cv.releasePointerCapture(e.pointerId);}catch(_){}}
  activePointer=null;stroke=null;G.lastInput=G.t;}
cv.addEventListener('pointerdown',onDown,{passive:false});
cv.addEventListener('pointermove',onMove,{passive:false});
cv.addEventListener('pointerup',endStroke);
cv.addEventListener('pointercancel',endStroke);
cv.addEventListener('lostpointercapture',endStroke);
const stop=e=>{e.preventDefault();};
document.addEventListener('contextmenu',stop);
document.addEventListener('gesturestart',stop);
document.addEventListener('gesturechange',stop);
document.addEventListener('dblclick',stop);
document.addEventListener('touchstart',e=>{if(e.touches.length>1)e.preventDefault();},{passive:false});
document.addEventListener('touchmove',stop,{passive:false});
document.addEventListener('selectstart',stop);

// ---------- loop ----------
let last=0,raf=0,running=true;
function frame(now){
  raf=0;if(!running)return;
  let dt=(now-last)/1000;last=now;if(!(dt>0))dt=0;dt=Math.min(dt,0.05);
  update(dt);render();raf=requestAnimationFrame(frame);
}
function update(dt){
  G.t+=dt;
  updateStrands(dt);updateUncle(dt);updatePieces(dt);updateRolling(dt);updateRubble(dt);
  updateHouse(G.house,dt);for(const h of G.town)updateHouse(h,dt);
  updateParticles(dt);updateSeq(dt);updateShift(dt);updateGuide(dt);
  if(G.phase==='play')checkComplete();
  // snapped ghosts cleanup
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){const e=G.house.cells[r][c];if(e&&e.ghost&&!G.house.rubble.some(q=>q.state==='snap'&&q.tc===c&&q.tr===r))G.house.cells[r][c]=null;}
}
function start(){if(raf)cancelAnimationFrame(raf);running=true;last=performance.now();raf=requestAnimationFrame(frame);}
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){running=false;if(raf)cancelAnimationFrame(raf);raf=0;activePointer=null;stroke=null;
    try{if(AC&&AC.state==='running')AC.suspend();}catch(_){}}
  else{activePointer=null;stroke=null;G.trail.length=0;G.lastInput=G.t;start();}
});
window.addEventListener('blur',()=>{activePointer=null;stroke=null;});
window.addEventListener('resize',resize);
window.addEventListener('orientationchange',()=>setTimeout(resize,120));

// ---------- boot ----------
G.house=newHouse();G.strands=makeStrands(WIGS[1],1);G.lastInput=0;
resize();start();

// read-only hooks for automated checks
window.__gf={G,UN,get layout(){return {U,foundX,floorY,W,H,DX,DY};},sGeom,H2S,sx,sy,topOf,houseHeight};
})();
</script>
