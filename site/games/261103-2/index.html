<script>
(()=>{'use strict';
/* ===== palette: 3 colors only (navy bg / amber-gold light / milk-pink dough) ===== */
const C_BG='#10173a',C_AMB='#f4b34a',C_MILK='#f8e4dc';
const TAU=Math.PI*2;
const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t;
const sstep=x=>x<=0?0:x>=1?1:x*x*(3-2*x), dsstep=x=>(x<=0||x>=1)?0:6*x*(1-x);
const ease=t=>{t=clamp(t,0,1);return t*t*(3-2*t);};
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function hash2(i,j){let h=(Math.imul(i|0,374761393)+Math.imul(j|0,668265263))|0;h=Math.imul(h^(h>>>13),1274126177);h^=h>>>16;return (h>>>0)/4294967296;}
const R01=Math.random;

const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const sc=document.getElementById('bg'),sctx=sc.getContext('2d');
let W=1,H=1,DPR=1;const SA={l:0,t:0,r:0,b:0};
function sprite(r,g,b){const s=document.createElement('canvas');s.width=s.height=32;const c=s.getContext('2d');const gr=c.createRadialGradient(16,16,0,16,16,16);gr.addColorStop(0,'rgba('+r+','+g+','+b+',1)');gr.addColorStop(0.32,'rgba('+r+','+g+','+b+',0.55)');gr.addColorStop(1,'rgba('+r+','+g+','+b+',0)');c.fillStyle=gr;c.fillRect(0,0,32,32);return s;}
const SPR_A=sprite(244,179,74),SPR_M=sprite(248,228,220);
const DBG={};
const lc=document.getElementById('gl'),lctx=lc.getContext('2d');const LQ=4;

/* ===== handles & dough deformation ===== */
const NH=8;
const HDEF=[{a:Math.PI,side:1},{a:0,side:1},{a:-Math.PI/2,side:1},{a:Math.PI/2,side:1},{a:-3*Math.PI/4,side:0},{a:-Math.PI/4,side:0},{a:3*Math.PI/4,side:0},{a:Math.PI/4,side:0}];
const S0=0.35,PW=0.8,RC=0.95;
function weightAt(h,x,y,o){
  const d=HDEF[h],c=Math.cos(d.a),s=Math.sin(d.a);
  if(d.side){
    const sp=x*c+y*s,p=-x*s+y*c,u=(sp-S0)/(1-S0),ws=sstep(u),dws=dsstep(u)/(1-S0);
    const q=p/PW,q3=q*q*q,pf=Math.exp(-q3*q),dpf=pf*(-4*q3/PW);
    o.w=ws*pf;o.gx=dws*pf*c+ws*dpf*(-s);o.gy=dws*pf*s+ws*dpf*c;
  }else{
    const dx=x-c,dy=y-s,r=Math.sqrt(dx*dx+dy*dy),q=r/RC;
    if(q>=1){o.w=0;o.gx=0;o.gy=0;}else{o.w=(1-q)*(1-q);const g=-2*(1-q)/RC/(r||1e-6);o.gx=g*dx;o.gy=g*dy;}
  }
}
const NP=640,CS=0.17,GMAX=64;
const MAXFOLD=8;
class Dough{
  constructor(seed){
    this.seed=seed>>>0;const r=mulberry32(this.seed^0x5bd1e995);const N=NP;this.N=N;
    this.rx=new Float32Array(N);this.ry=new Float32Array(N);this.base=new Float32Array(N);this.jit=new Float32Array(N);
    this.W=new Float32Array(N*NH);this.GX=new Float32Array(N*NH);this.GY=new Float32Array(N*NH);
    this.px=new Float32Array(N);this.py=new Float32Array(N);this.pt=new Float32Array(N);this.pl=new Uint8Array(N);this.hid=new Uint8Array(N);
    const ba=r()*TAU,beta=0.05+r()*0.05,ex=Math.cos(ba),ey=Math.sin(ba);this.biasA=ba;
    const gold=Math.PI*(3-Math.sqrt(5)),o={w:0,gx:0,gy:0};
    for(let i=0;i<N;i++){
      const rr=Math.sqrt((i+0.5)/N)*0.99,th=i*gold;
      let x=rr*Math.cos(th)+(r()-0.5)*0.045,y=rr*Math.sin(th)+(r()-0.5)*0.045;
      const dd=x*ex+y*ey,bb=1/(1-2*beta*dd),kk=beta*(1-(x*x+y*y));x+=kk*ex;y+=kk*ey;
      this.rx[i]=x;this.ry[i]=y;this.base[i]=bb;this.jit[i]=r();
      for(let h=0;h<NH;h++){weightAt(h,x,y,o);this.W[i*NH+h]=o.w;this.GX[i*NH+h]=o.gx;this.GY[i*NH+h]=o.gy;}
    }
    this.hrx=new Float32Array(NH);this.hry=new Float32Array(NH);this.HW=new Float32Array(NH*NH);
    for(let h=0;h<NH;h++){this.hrx[h]=Math.cos(HDEF[h].a);this.hry[h]=Math.sin(HDEF[h].a);}
    for(let h=0;h<NH;h++)for(let g=0;g<NH;g++){weightAt(g,this.hrx[h],this.hry[h],o);this.HW[h*NH+g]=(g===h)?1:o.w;}
    this.P=new Float32Array(NH*2);this.E=new Float32Array(NH*2);this.EV=new Float32Array(NH*2);this.ET=new Float32Array(NH*2);this.D=new Float32Array(NH*2);
    this.h0x=new Float32Array(NH);this.h0y=new Float32Array(NH);this.hbx=new Float32Array(NH);this.hby=new Float32Array(NH);
    this.hdx=new Float32Array(NH);this.hdy=new Float32Array(NH);this.hlay=new Uint8Array(NH);
    this.sq=new Float32Array(NH);this.sqv=new Float32Array(NH);
    this.fold=new Array(NH).fill(null);this.foldOrd=0;
    this.fmx=new Float32Array(MAXFOLD);this.fmy=new Float32Array(MAXFOLD);this.fux=new Float32Array(MAXFOLD);this.fuy=new Float32Array(MAXFOLD);this.nf=0;
    this.holes=[];this.hc=new Uint8Array(NH);
    this.minx=-1;this.maxx=1;this.miny=-1;this.maxy=1;
    this.compute();
    // reference occupancy for area ratio
    const occ=new Set();for(let i=0;i<N;i++)occ.add(Math.floor(this.px[i]/CS)*1000+Math.floor(this.py[i]/CS));
    this.areaRef=occ.size;this.n0=N/Math.PI*CS*CS;
  }
  nOut(h){const x=this.hrx[h]+this.P[2*h],y=this.hry[h]+this.P[2*h+1],l=Math.hypot(x,y)||1;return [x/l,y/l];}
  addHole(rx,ry,r,h){
    const o={w:0,gx:0,gy:0},ws=new Float32Array(NH),wgx=new Float32Array(NH),wgy=new Float32Array(NH);for(let g=0;g<NH;g++){weightAt(g,rx,ry,o);ws[g]=o.w;wgx[g]=o.gx;wgy[g]=o.gy;}
    const hole={rx,ry,r,h,ws,wgx,wgy,x:rx,y:ry,rd:r,cov:false,cn:0};this.holes.push(hole);
    for(let i=0;i<this.N;i++){const dx=this.rx[i]-rx,dy=this.ry[i]-ry;if(dx*dx+dy*dy<r*r)this.hid[i]=1;}
    return hole;
  }
  step(dt){
    const K=170,Cd=10.5;
    for(let k=0;k<NH*2;k++){const a=K*(this.ET[k]-this.E[k])-Cd*this.EV[k];this.EV[k]+=a*dt;this.E[k]+=this.EV[k]*dt;}
    for(let h=0;h<NH;h++){const a=260*(0-this.sq[h])-9*this.sqv[h];this.sqv[h]+=a*dt;this.sq[h]+=this.sqv[h]*dt;
      const f=this.fold[h];if(f){
        if(f.dying){f.gx=this.hbx[h];f.gy=this.hby[h];}
        const ax=140*(f.gx-f.tx)-17*f.vx,ay=140*(f.gy-f.ty)-17*f.vy;f.vx+=ax*dt;f.vy+=ay*dt;f.tx+=f.vx*dt;f.ty+=f.vy*dt;
        if(f.dying&&Math.hypot(f.tx-this.hbx[h],f.ty-this.hby[h])<0.03)this.fold[h]=null;
      }}
  }
  compute(){
    const N=this.N,P=this.P,E=this.E,D=this.D;
    for(let k=0;k<NH*2;k++)D[k]=P[k]+E[k];
    for(let h=0;h<NH;h++){let x=this.hrx[h],y=this.hry[h];for(let g=0;g<NH;g++){const w=this.HW[h*NH+g];x+=w*D[2*g];y+=w*D[2*g+1];}
      this.h0x[h]=x;this.h0y[h]=y;this.hbx[h]=x-E[2*h];this.hby[h]=y-E[2*h+1];}
    // fold lines ordered by creation
    const fl=[];for(let h=0;h<NH;h++)if(this.fold[h])fl.push(this.fold[h]);fl.sort((a,b)=>a.ord-b.ord);
    let nf=0;for(const f of fl){const hx=this.h0x[f.h],hy=this.h0y[f.h],dx=hx-f.tx,dy=hy-f.ty,l=Math.hypot(dx,dy);if(l<0.015||nf>=MAXFOLD)continue;
      this.fmx[nf]=(hx+f.tx)/2;this.fmy[nf]=(hy+f.ty)/2;this.fux[nf]=dx/l;this.fuy[nf]=dy/l;nf++;}
    this.nf=nf;const fmx=this.fmx,fmy=this.fmy,fux=this.fux,fuy=this.fuy;
    const Wt=this.W,GX=this.GX,GY=this.GY;
    let mnx=1e9,mxx=-1e9,mny=1e9,mxy=-1e9;
    for(let i=0;i<N;i++){
      if(this.hid[i])continue;
      let x=this.rx[i],y=this.ry[i],a=1,b=0,c=0,d=1;const o=i*NH;
      for(let h=0;h<NH;h++){const gx=GX[o+h],gy=GY[o+h],w=Wt[o+h];if(w===0&&gx===0&&gy===0)continue;const dx=D[2*h],dy=D[2*h+1];x+=w*dx;y+=w*dy;a+=dx*gx;b+=dx*gy;c+=dy*gx;d+=dy*gy;}
      const det=a*d-b*c;const t=this.base[i]/Math.max(0.15,Math.abs(det));
      let lay=0;for(let k=0;k<nf;k++){const s=(x-fmx[k])*fux[k]+(y-fmy[k])*fuy[k];if(s>0){x-=2*s*fux[k];y-=2*s*fuy[k];lay++;}}
      this.px[i]=x;this.py[i]=y;this.pt[i]=t;this.pl[i]=lay;
      if(x<mnx)mnx=x;if(x>mxx)mxx=x;if(y<mny)mny=y;if(y>mxy)mxy=y;
    }
    if(mnx>mxx){mnx=-1;mxx=1;mny=-1;mxy=1;}
    this.minx=mnx;this.maxx=mxx;this.miny=mny;this.maxy=mxy;
    for(let h=0;h<NH;h++){let x=this.h0x[h],y=this.h0y[h],lay=0;for(let k=0;k<nf;k++){const s=(x-fmx[k])*fux[k]+(y-fmy[k])*fuy[k];if(s>0){x-=2*s*fux[k];y-=2*s*fuy[k];lay++;}}this.hdx[h]=x;this.hdy[h]=y;this.hlay[h]=lay;}
    for(const ho of this.holes){let x=ho.rx,y=ho.ry,a=1,b=0,c=0,dd=1;for(let g=0;g<NH;g++){const dx=D[2*g],dy=D[2*g+1];x+=ho.ws[g]*dx;y+=ho.ws[g]*dy;a+=dx*ho.wgx[g];b+=dx*ho.wgy[g];c+=dy*ho.wgx[g];dd+=dy*ho.wgy[g];}
      ho.rd=ho.r*clamp(Math.sqrt(Math.abs(a*dd-b*c)),1,3);
      let hl=0;for(let k=0;k<nf;k++){const s=(x-fmx[k])*fux[k]+(y-fmy[k])*fuy[k];if(s>0){x-=2*s*fux[k];y-=2*s*fuy[k];hl++;}}ho.x=x;ho.y=y;ho.lay=hl;
      // covered by other layers?
      let cn=0;const rr=ho.rd*0.9,rr2=rr*rr,ex2=(ho.r*1.9)*(ho.r*1.9);
      for(let i=0;i<N;i++){if(this.hid[i])continue;const dx=this.px[i]-x,dy=this.py[i]-y;if(dx*dx+dy*dy<rr2){const qx=this.rx[i]-ho.rx,qy=this.ry[i]-ho.ry;if(this.pl[i]!==hl||qx*qx+qy*qy>ex2)cn++;}}
      ho.cn=cn;ho.cov=cn>=2;}
  }
}

const AREA_T=1.4;
const G={mode:'lamp',m:0,mT:0,round:0,seed:1,lx:0,lz:0.45,lxT:0,lzT:0.45,flags:{},fit:null,oldFit:null,tt:0,
  carry:{x:0,y:0,vx:0,vy:0,tx:0,ty:0},time:0,lastInput:-100,demoDone:{},target:null,tkey:'',area:1,map:{ox:0,oy:0,s:1},src:{x:0,y:0},k:2,

function freshFlags(){return {pullL:false,pullR:false,pullC:false,fold:false,unfold:false,lamp:false,lampNear:false,lampFar:false,hole:false,holeCover:false,plate:false,hung:false,mPull:false,cornerLit:false};}

function newRoundParams(seed){const r=mulberry32(seed^0x2545f491);G.lx=G.lxT=(r()-0.5)*0.5;G.lz=G.lzT=0.35+r()*0.2;}

/* ===== layout ===== */
function layoutAt(m){
  const sx=SA.l,sy=SA.t,sw=Math.max(120,W-SA.l-SA.r),sh=Math.max(120,H-SA.t-SA.b);
  const P=H>=W*1.02;let n,d,R,nd;
  if(P){
    n={win:[.06,.035,.42,.15],shY:.27,sh0:.55,sh1:.97,pl:[.66,.86],prx:.075,pry:.014,floor:.8,dcx:.5,dcy:.47};
    d={win:[.13,.03,.74,.3],shY:.58,sh0:.6,sh1:.97,pl:[.7,.88],prx:.075,pry:.014,floor:.67,dcx:.5,dcy:.47};
    R=Math.min(.18*sw,.135*sh);nd=[.8,.9,.075*sw];
  }else{
    n={win:[.04,.06,.2,.3],shY:.3,sh0:.72,sh1:.98,pl:[.79,.92],prx:.045,pry:.018,floor:.84,dcx:.44,dcy:.42};
    d={win:[.2,.05,.4,.5],shY:.42,sh0:.66,sh1:.98,pl:[.72,.88],prx:.05,pry:.018,floor:.72,dcx:.44,dcy:.42};
    R=Math.min(.15*sh,.12*sw);nd=[.88,.86,.045*sw];
  }
  const f=(a,b)=>lerp(a,b,m);
  const win={x:sx+f(n.win[0],d.win[0])*sw,y:sy+f(n.win[1],d.win[1])*sh,w:f(n.win[2],d.win[2])*sw,h:f(n.win[3],d.win[3])*sh};
  const shY=sy+f(n.shY,d.shY)*sh,prx=f(n.prx,d.prx)*sw,pry=Math.max(6,f(n.pry,d.pry)*sh);
  const plates=[0,1].map(i=>({x:sx+f(n.pl[i],d.pl[i])*sw,y:shY-pry*1.1,rx:prx,ry:pry}));
  const floorY=sy+f(n.floor,d.floor)*sh;
  const dc={x:sx+n.dcx*sw,y:sy+n.dcy*sh};
  const tableY=dc.y+1.75*R,nfloor=sy+n.floor*sh;
  return {sx,sy,sw,sh,P,R,win,shelf:{x0:sx+f(n.sh0,d.sh0)*sw,x1:sx+f(n.sh1,d.sh1)*sw,y:shY},plates,floorY,dc,tableY,
    lampFront:nfloor-0.025*sh,lampBack:tableY+0.035*sh,nd:{x:sx+nd[0]*sw,y:sy+nd[1]*sh,r:nd[2]},handS:clamp(0.15*Math.min(sw,sh),46,112)};
}

/* ===== audio (Web Audio synth) ===== */
const AU={ctx:null};
function auInit(){
  if(AU.ctx){if(AU.ctx.state==='suspended'&&!document.hidden)AU.ctx.resume().catch(()=>{});return;}
  const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
  try{
    const ac=new AC();AU.ctx=ac;
    const comp=ac.createDynamicsCompressor();comp.connect(ac.destination);
    const mg=ac.createGain();mg.gain.value=0.75;mg.connect(comp);AU.out=mg;
    const len=ac.sampleRate*2|0,nb=ac.createBuffer(1,len,ac.sampleRate),ch=nb.getChannelData(0);let s=12345;
    for(let i=0;i<len;i++){s=(Math.imul(s,1664525)+1013904223)>>>0;ch[i]=s/2147483648-1;}AU.nb=nb;
    const rs=ac.createBufferSource();rs.buffer=nb;rs.loop=true;const rf=ac.createBiquadFilter();rf.type='bandpass';rf.frequency.value=3000;rf.Q.value=0.7;
    const rg=ac.createGain();rg.gain.value=0;rs.connect(rf);rf.connect(rg);rg.connect(mg);rs.start();AU.rg=rg;AU.rf=rf;
    const so=ac.createOscillator();so.type='triangle';so.frequency.value=220;const so2=ac.createOscillator();so2.type='sine';so2.frequency.value=222;
    const sf=ac.createBiquadFilter();sf.type='lowpass';sf.frequency.value=1500;const sg=ac.createGain();sg.gain.value=0;
    so.connect(sf);so2.connect(sf);sf.connect(sg);sg.connect(mg);so.start();so2.start();AU.so=so;AU.so2=so2;AU.sg=sg;
    const ho=ac.createOscillator();ho.type='sine';ho.frequency.value=110;const hg=ac.createGain();hg.gain.value=0;ho.connect(hg);hg.connect(mg);ho.start();AU.ho=ho;AU.hg=hg;
    if(ac.state==='suspended')ac.resume().catch(()=>{});
  }catch(e){AU.ctx=null;}
}
function tone(f,dur,type,g,f2,delay){const ac=AU.ctx;if(!ac||ac.state!=='running')return;const t=ac.currentTime+(delay||0);
  const o=ac.createOscillator(),gg=ac.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dur);
  gg.gain.setValueAtTime(0.0001,t);gg.gain.exponentialRampToValueAtTime(g,t+0.008);gg.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(gg);gg.connect(AU.out);o.start(t);o.stop(t+dur+0.02);}
function noise(dur,ft,fr,g,delay,q){const ac=AU.ctx;if(!ac||ac.state!=='running')return;const t=ac.currentTime+(delay||0);
  const s=ac.createBufferSource();s.buffer=AU.nb;const fl=ac.createBiquadFilter();fl.type=ft;fl.frequency.value=fr;if(q)fl.Q.value=q;const gg=ac.createGain();
  gg.gain.setValueAtTime(0.0001,t);gg.gain.exponentialRampToValueAtTime(g,t+0.006);gg.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  s.connect(fl);fl.connect(gg);gg.connect(AU.out);s.start(t,R01()*1.5);s.stop(t+dur+0.02);}
const SND={
  squish(){noise(0.13,'lowpass',700,0.35);tone(150,0.14,'sine',0.25,85);},
  fold(){noise(0.22,'lowpass',420,0.4);tone(120,0.2,'sine',0.3,70);},
  unfold(){noise(0.18,'bandpass',1800,0.18,0,0.8);tone(300,0.16,'sine',0.12,520);},
  pop(){tone(950,0.13,'sine',0.35,260);noise(0.05,'highpass',3000,0.2);tone(1800,0.25,'triangle',0.08,2400,0.06);},
  cover(){noise(0.2,'lowpass',300,0.25);tone(200,0.18,'sine',0.12,120);},
  tick(){tone(1300,0.04,'sine',0.05);},
  wob(){tone(260,0.12,'sine',0.12,200);},
  lampGrab(){tone(330,0.08,'triangle',0.1,380);},
  snap(){tone(520,0.08,'square',0.06,780);noise(0.06,'bandpass',2500,0.15,0,2);},
  clap(){noise(0.07,'bandpass',1400,0.45,0,1.2);noise(0.05,'highpass',2500,0.2,0.01);},
  success(kind){const base=kind==='hang'?[523,659,784,1047,1319]:kind==='corner'?[587,740,880,1175]:kind==='new'?[392,523]:[659,784,988];
    base.forEach((f,i)=>{tone(f,0.5,'triangle',0.16,0,i*0.085);tone(f*2,0.35,'sine',0.05,0,i*0.085+0.01);});}
};
let auDrag=0,auTension=0,auSpeed=0,auLamp=0;
function audioUpdate(){const ac=AU.ctx;if(!ac||ac.state!=='running')return;const t=ac.currentTime;

  ctx.fillStyle=C_AMB;
  for(const r of RY){if(!r.on)continue;let x,y,al;if(r.t<r.d1){const e=r.t/r.d1;x=lerp(r.ax,r.cx,e);y=lerp(r.ay,r.cy,e);al=0.25;}else{const e=(r.t-r.d1)/r.d2;x=lerp(r.cx,r.px,e);y=lerp(r.cy,r.py,e);al=0.9*(1-e*0.6);}
    al*=0.4+0.6*r.a;ctx.globalAlpha=al;ctx.fillRect(x-1.5,y-1.5,3,3);ctx.globalAlpha=al*0.4;const bx=(r.px-r.cx),by=(r.py-r.cy),bl=Math.hypot(bx,by)||1;ctx.fillRect(x-bx/bl*6-1,y-by/bl*6-1,2,2);}
  if(!DBG.bulb)drawBulb();
  ctx.globalCompositeOperation='source-over';
  drawLamp();drawClips();
  if(old&&G.oldFit){const M=winMap(G.oldFit,L.win);drawDough(old,M,false,0.75*(1-ease(G.m)*0),2);}
  const gh=G.ghost.kind==='win'?G.ghost:null;const M0=G.map;const M=gh?{ox:M0.ox+gh.dx*0.4,oy:M0.oy+gh.dy*0.4,s:M0.s}:M0;
  if(!DBG.dough)drawDough(cur,M,true,1,1);
  // hole beams
  ctx.globalCompositeOperation='lighter';ctx.fillStyle=C_AMB;
  for(const ho of cur.holes){if(ho.cov||ho.sx===undefined)continue;for(let q=0;q<18;q++){const e=((q/18)+G.time*1.4)%1;const x=lerp(ho.sx,ho.px,e),y=lerp(ho.sy,ho.py,e);ctx.globalAlpha=0.85;ctx.fillRect(x-1.6,y-1.6,3.2,3.2);}
    const rr=ho.r*G.map.s*G.k*0.8;ctx.globalAlpha=0.85;ctx.drawImage(SPR_A,ho.px-rr*1.5,ho.py-rr*1.5,rr*3,rr*3);
    for(let q=0;q<10;q++){const a=q*2.4+G.time*2;ctx.globalAlpha=1;ctx.fillRect(ho.px+Math.cos(a)*rr*0.6-2,ho.py+Math.sin(a)*rr*0.6-2,4,4);}}
  ctx.globalCompositeOperation='source-over';
  drawNubs();drawND();
  // dust
  for(const p of DU){if(!p.on)continue;ctx.fillStyle=p.c?C_AMB:C_MILK;ctx.globalAlpha=Math.max(0,1-p.l/p.ml)*0.85;ctx.fillRect(p.x-p.s/2,p.y-p.s/2,p.s,p.s);}
  ctx.globalAlpha=1;
  if(!DBG.hand){HAND.sub.draw();HAND.main.draw();}ctx.globalAlpha=1;
}

/* ===== update ===== */
function update(dt){
  G.time+=dt;
  const ms=dt/1.3;if(G.m<G.mT)G.m=Math.min(G.mT,G.m+ms);else if(G.m>G.mT)G.m=Math.max(G.mT,G.m-ms);
  L=layoutAt(ease(G.m));
  const pl=G.lx,pz=G.lz;G.lx+=(G.lxT-G.lx)*Math.min(1,dt*14);G.lz+=(G.lzT-G.lz)*Math.min(1,dt*14);
  auLamp=ptr.kind==='lamp'&&(Math.abs(G.lx-pl)+Math.abs(G.lz-pz))>0.0005?1:0;
  const c=G.carry;for(let s=0;s<2;s++){const h=dt/2;const ax=140*(c.tx-c.x)-15*c.vx,ay=140*(c.ty-c.y)-15*c.vy;c.vx+=ax*h;c.vy+=ay*h;c.x+=c.vx*h;c.y+=c.vy*h;}
  if(G.mode==='hang'){G.tt+=dt;if(G.tt>=1.1){G.mode='window';onHung();}}
  else if(G.mode==='renew'){G.tt+=dt;if(G.tt>=1.2)G.mode='lamp';}
  const sub=dt>1/45?2:1;for(let s=0;s<sub;s++)cur.step(dt/sub);
  cur.compute();
  if((G.mode==='lamp'||G.mode==='window')&&ptr.kind!=='carry'){const mg=24;let ch=false;for(let h=0;h<NH;h++){if(cur.fold[h]||(ptr.kind==='handle'&&ptr.h===h))continue;const q=toScreen(cur.hbx[h],cur.hby[h]);const cx=clamp(q.x,L.sx+mg,L.sx+L.sw-mg),cy=clamp(q.y,L.sy+mg,L.sy+L.sh-mg);if(cx!==q.x||cy!==q.y){cur.P[2*h]+=(cx-q.x)/G.map.s*0.3;cur.P[2*h+1]+=(cy-q.y)/G.map.s*0.3;ch=true;}}if(ch)cur.compute();}
  if(old&&old.dirty!==false){old.compute();old.dirty=false;}
  updateMap();computeLight();coverCheck();updatePlates(dt);updateRays(dt);updateDust(dt);
  updateTarget();director(dt);HAND.main.update(dt);HAND.sub.update(dt);
  auDrag=ptr.kind==='handle'||ptr.kind==='carry'?1:0;auSpeed*=Math.pow(0.02,dt);audioUpdate();
}

/* ===== loop / lifecycle ===== */
let running=false,rafId=0,lastT=0;
function frame(ts){if(!running)return;rafId=requestAnimationFrame(frame);let dt=(ts-lastT)/1000;lastT=ts;if(!(dt>0))dt=1/60;if(dt>0.05)dt=0.05;
  const t0=performance.now();try{update(dt);render();G.ft=(G.ft||0)*0.95+(performance.now()-t0)*0.05;}catch(err){if(!G.errLogged){G.errLogged=1;G.lastErr=String(err&&err.stack||err);}}}
function startLoop(){if(running)return;running=true;lastT=performance.now();rafId=requestAnimationFrame(frame);}
function stopLoop(){running=false;cancelAnimationFrame(rafId);}
function resize(){
  W=Math.max(1,window.innerWidth);H=Math.max(1,window.innerHeight);DPR=Math.min(2,window.devicePixelRatio||1);
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
  const r=document.getElementById('sa').getBoundingClientRect();SA.l=Math.max(0,r.left);SA.t=Math.max(0,r.top);SA.r=Math.max(0,W-r.right);SA.b=Math.max(0,H-r.bottom);
  L=layoutAt(ease(G.m));if(ptr.kind!=='carry'){G.carry.x=G.carry.y=G.carry.tx=G.carry.ty=0;G.carry.vx=G.carry.vy=0;}
  G.skey='';if(cur){cur.compute();updateMap();computeLight();}if(!running)render();
}
window.addEventListener('resize',resize);window.addEventListener('orientationchange',()=>setTimeout(resize,60));
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){cancelPtr();stopLoop();saveNow();audioSilence();if(AU.ctx&&AU.ctx.state==='running')AU.ctx.suspend().catch(()=>{});}
  else{if(AU.ctx&&AU.ctx.state==='suspended')AU.ctx.resume().catch(()=>{});startLoop();}
});
window.addEventListener('pagehide',saveNow);

load();resize();G.lastInput=0;
{const hp=homePos();HAND.main.x=HAND.main.tx=hp.x;HAND.main.y=HAND.main.ty=hp.y+L.handS;HAND.sub.x=-600;HAND.sub.y=H*0.5;}
if(!document.hidden)startLoop();
setInterval(()=>{if(running)saveSoon();},5000);

/* ===== inspection hooks for automated tests (read-only views) ===== */
window.__gf={
  info(){const d=cur;return {ft:G.ft,time:G.time,mode:G.mode,round:G.round,seed:G.seed,flags:Object.assign({},G.flags),area:G.area,holes:d.holes.map(h=>({cov:h.cov,h:h.h})),
    folds:d.fold.map(f=>f?{dying:f.dying}:null).filter(Boolean).length,P:Array.from(d.P),stats:JSON.parse(JSON.stringify(G.stats)),nG,nB,k:G.k,lamp:[G.lx,G.lz],
    target:G.target,tkey:G.tkey,hand:{x:HAND.main.x,y:HAND.main.y,pose:HAND.main.pose,react:HD.react,demo:!!HD.demo},plates:G.plates.map(p=>({on:p.on,fit:p.fit})),
    corners:G.corners.map(c=>c.on),storageOk:G.storageOk,loadInfo:G.loadInfo,running,audio:AU.ctx?AU.ctx.state:'none',ptr:ptr.id,old:!!old,err:G.lastErr||null,
    particles:{dough:d.N,grains:nG,rays:RY.filter(r=>r.on).length,dust:DU.filter(p=>p.on).length,hands:HT.n*2},layout:{W,H,SA:Object.assign({},SA),R:L.R,win:L.win,nd:L.nd}};},
  handle(h){return handleScreen(h);},
  lampBase(){return {x:G.bx,y:G.basey};},
  doughCenter(){return toScreen((cur.minx+cur.maxx)/2,(cur.miny+cur.maxy)/2);},
  win(){return {x:L.win.x+L.win.w/2,y:L.win.y+L.win.h/2};},
  nd(){return {x:L.nd.x,y:L.nd.y};},
  holeScreen(i){const h=cur.holes[i];return h?toScreen(h.x,h.y):null;},
  local(x,y){return toScreen(x,y);},
  nOut(h){return cur.nOut(h);},
  scale(){return G.map.s;},
  dbg:DBG,
  dbgHoles(){return cur.holes.map(h=>({x:h.x,y:h.y,rx:h.rx,ry:h.ry,cn:h.cn,cov:h.cov}));},
  dbgFold(){return cur.fold.map((f,h)=>f?{h,tx:f.tx,ty:f.ty,h0x:cur.h0x[h],h0y:cur.h0y[h],dying:f.dying}:null).filter(Boolean);},
  bodyPoint(){const d=cur;let bi=-1,bv=-1;const hs=[];for(let h=0;h<NH;h++)hs.push([d.hdx[h],d.hdy[h]]);for(let i=0;i<d.N;i+=3){if(d.hid[i])continue;let m=1e9;for(const q of hs){m=Math.min(m,Math.hypot(d.px[i]-q[0],d.py[i]-q[1]));}if(m>bv){bv=m;bi=i;}}return toScreen(d.px[bi],d.py[bi]);}
};
})();
