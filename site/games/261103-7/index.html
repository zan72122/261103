<!DOCTYPE html>

<head>

<title>ひかり粒の花火おえかき</title>
<style>

  touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  -webkit-tap-highlight-color:transparent;overscroll-behavior:none;}

  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;}
#sa{position:fixed;left:0;top:0;width:0;height:0;visibility:hidden;pointer-events:none;
  padding-top:env(safe-area-inset-top);padding-right:env(safe-area-inset-right);
  padding-bottom:env(safe-area-inset-bottom);padding-left:env(safe-area-inset-left);}
</style>

<body>
<canvas id="c"></canvas>
<div id="sa"></div>
<script>
(function () {
'use strict';

/* =====================================================================
   さらさら、くるん！ひかり粒の花火おえかき
   - 線 = 粒が描いた順に流れる通路
   - 線の終点 = 宝石（集めた粒の量と色を反映）
   - 筒の口 = 宝石を吸い込み、色と量に応じた花火
   - 閉じた輪 = 周囲の粒を渦に巻き込み、巨大な光玉 → 大花火
   - 花火の残り粒 = 混色した新しい材料
   ===================================================================== */

var cv = document.getElementById('c');
var ctx = cv.getContext('2d', { alpha: false });

var SA = { t: 0, r: 0, b: 0, l: 0 };
var BG = '#090d2b';

function dist(ax, ay, bx, by) { var dx = ax - bx, dy = ay - by; return Math.sqrt(dx * dx + dy * dy); }

  var best = 0, bd = 1e9;
  for (var k = 0; k < CLASS_COLS.length; k++) {
    var c = CLASS_COLS[k], d = (c[0] - r) * (c[0] - r) + (c[1] - g) * (c[1] - g) + (c[2] - b) * (c[2] - b);
    if (d < bd) { bd = d; best = k; }

}
function bitCount(m) { var c = 0; while (m) { c += m & 1; m >>= 1; } return c; }

/* ------------------------------ 粒プール ------------------------------ */
var MAXP = 3000;
var px = new Float32Array(MAXP), py = new Float32Array(MAXP),
    vx = new Float32Array(MAXP), vy = new Float32Array(MAXP),
    cr = new Float32Array(MAXP), cg = new Float32Array(MAXP), cb = new Float32Array(MAXP),
    ps = new Float32Array(MAXP), sp = new Float32Array(MAXP), off = new Float32Array(MAXP),
    life = new Float32Array(MAXP), mlife = new Float32Array(MAXP), sz = new Float32Array(MAXP),
    hx = new Float32Array(MAXP), hy = new Float32Array(MAXP),
    ang = new Float32Array(MAXP), rad = new Float32Array(MAXP);
var st = new Uint8Array(MAXP), fl = new Uint8Array(MAXP);
var nc = new Int32Array(MAXP), cl = new Int16Array(MAXP);
var pobj = new Array(MAXP);
var freeStack = new Int32Array(MAXP), freeTop = 0, alive = 0;
for (var _i = 0; _i < MAXP; _i++) freeStack[freeTop++] = MAXP - 1 - _i;

var S_FREE = 1, S_FLOW = 2, S_GEM = 3, S_SPARK = 4, S_SWIRL = 5, S_TUBE = 6, S_FX = 7;
var F_EMBER = 1, F_GOLD = 2, F_TOEMBER = 4, F_STRAY = 8, F_WAIT = 16, F_TAIL = 32;

function alloc() {
  if (freeTop === 0) return -1;
  var i = freeStack[--freeTop];
  alive++;
  fl[i] = 0; cl[i] = -1; pobj[i] = null; vx[i] = 0; vy[i] = 0; off[i] = 0; nc[i] = 0;
  return i;
}
function kill(i) {
  if (st[i] === 0) return;
  if (st[i] === S_FREE && cl[i] >= 0 && clouds[cl[i]]) clouds[cl[i]].count--;
  st[i] = 0; pobj[i] = null; freeStack[freeTop++] = i; alive--;
}
function setCol(i, c) { cr[i] = c[0]; cg[i] = c[1]; cb[i] = c[2]; }

function spawnFX(x, y, vx0, vy0, c, l, s) {
  var i = alloc(); if (i < 0) return -1;
  st[i] = S_FX; px[i] = x; py[i] = y; vx[i] = vx0; vy[i] = vy0;
  setCol(i, c); life[i] = l; mlife[i] = l; sz[i] = s;
  return i;
}

/* ------------------------------ 状態 ------------------------------ */
var time = 0;
var clouds = [], lines = [], gems = [], rings = [], shells = [];
var stroke = null, activePointer = null, ringLock = false;
var lastInput = 0, demo = null, demoDone = false;
var guide = { type: 'cloud', ref: null, x: 0, y: 0, t: 0 };
var palette3 = [];
var paletteW = [];
var stats = { gems: 0, merges: 0, mixGems: 0, tubeFires: 0, rings: 0, ringFires: 0, emberGems: 0, cornerHolds: 0, captures: 0, taps: 0 };
var tapPulses = [];
var cloudTarget = 1000;

var tube = {
  x: 0, mouthY: 0, bottom: 0, w: 0, h: 0, n: 0, r: 0, g: 0, b: 0, gold: 0, cols: [],
  timer: 0, firstAt: 0, vis: 0, lidA: 0.55, lidV: 0, wob: 0, memory: null, pulse: 0
};
var brush = { x: 0, y: 0, ang: -2.3, bounce: 0, vb: 0, restX: 0, restY: 0, drawing: false };

/* ------------------------------ レイアウト ------------------------------ */
function readSafeArea() {
  try {

    SA.t = parseFloat(cs.paddingTop) || 0; SA.r = parseFloat(cs.paddingRight) || 0;
    SA.b = parseFloat(cs.paddingBottom) || 0; SA.l = parseFloat(cs.paddingLeft) || 0;
  } catch (e) { SA.t = SA.r = SA.b = SA.l = 0; }
}
function layoutTube() {
  tube.w = Math.min(112, W * 0.26);
  tube.h = Math.min(150, H * 0.19);
  tube.x = W / 2;
  tube.bottom = H - SA.b - 14;
  tube.mouthY = tube.bottom - tube.h;
  brush.restX = W - SA.r - Math.max(52, W * 0.09);
  brush.restY = H - SA.b - Math.max(70, H * 0.1);
}
var pStamp = new Int32Array(MAXP), frameNo = 1;
var gridW = 0, gridH = 0, CELL = 40, gHead = null, gNext = new Int32Array(MAXP);
function resize() {
  var nw = Math.max(1, window.innerWidth), nh = Math.max(1, window.innerHeight);
  DPR = Math.min(2, window.devicePixelRatio || 1);

  W = nw; H = nh;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  readSafeArea();
  layoutTube();
  gridW = Math.ceil(W / CELL) + 1; gridH = Math.ceil(H / CELL) + 1;
  gHead = new Int32Array(gridW * gridH);

}

  for (k = 0; k < lines.length; k++) {
    var L = lines[k];
    var oxs = L.xs, oys = L.ys;
    for (var j = 0; j < oxs.length; j++) { oxs[j] *= sx; oys[j] *= sy; }
    // 再サンプリングして等間隔を保つ
    var nl = rebuildLine(L, oxs, oys);
    // 流れている粒の位置パラメータを比率で移す
    var ratio = L.len > 0 ? nl.len / L.len : 1;
    for (i = 0; i < MAXP; i++) if (st[i] === S_FLOW && pobj[i] === L) { ps[i] *= ratio; nc[i] = 0; }
    for (j = 0; j < L.corners.length; j++) L.corners[j].s *= ratio;
    if (L.mergeLine) L.mergeS *= ratio;
    L.xs = nl.xs; L.ys = nl.ys; L.len = nl.len; L.ts = []; L.cap = [];
  }
  for (k = 0; k < lines.length; k++) {
    var M = lines[k];
    if (M.mergeLine) M.mergeS = Math.min(M.mergeS, M.mergeLine.len);
  }
  for (k = 0; k < gems.length; k++) { gems[k].x *= sx; gems[k].y *= sy; gems[k].hx *= sx; gems[k].hy *= sy; if (gems[k].line) gems[k].s = Math.min(gems[k].s, gems[k].line.len); }
  for (k = 0; k < rings.length; k++) {
    var R = rings[k]; R.cx *= sx; R.cy *= sy; R.y0 *= sy; R.x0 *= sx;
    for (var q = 0; q < R.px.length; q++) { R.px[q] *= sx; R.py[q] *= sy; }
  }
  for (k = 0; k < shells.length; k++) { shells[k].x *= sx; shells[k].y *= sy; shells[k].y0 *= sy; shells[k].apex *= sy; }
}
function rebuildLine(L, xs, ys) {
  var nx = [xs[0]], ny = [ys[0]], len = 0;
  var lx = xs[0], ly = ys[0];
  for (var j = 1; j < xs.length; j++) {
    var dx = xs[j] - lx, dy = ys[j] - ly, d = Math.sqrt(dx * dx + dy * dy);
    while (d >= STEP) {
      lx += dx / d * STEP; ly += dy / d * STEP; nx.push(lx); ny.push(ly); len += STEP;
      dx = xs[j] - lx; dy = ys[j] - ly; d = Math.sqrt(dx * dx + dy * dy);
    }
  }

}

/* ------------------------------ 粒雲 ------------------------------ */
function setupPalette() {
  var third = Math.random() < 0.5 ? C_PURPLE : C_WHITE;
  palette3 = [C_PINK, C_AQUA, third];
  var a = rnd(0.2, 0.55), b = rnd(0.2, 0.55), c = rnd(0.1, 0.35);
  var s = a + b + c; paletteW = [a / s, b / s, c / s];
}
function pickPalette(avoid) {
  for (var tries = 0; tries < 6; tries++) {
    var r = Math.random(), acc = 0;
    for (var k = 0; k < 3; k++) { acc += paletteW[k]; if (r <= acc) break; }
    k = Math.min(k, 2);
    if (palette3[k] !== avoid || tries === 5) return palette3[k];
  }
  return palette3[0];
}
function placeCloud(c) {
  var best = null, bestD = -1e9;
  var ymin = SA.t + c.rad + 24, ymax = Math.max(ymin + 10, Math.min(H * 0.6, tube.mouthY - 90) - c.rad);
  var xmin = SA.l + c.rad + 10, xmax = Math.max(xmin + 10, W - SA.r - c.rad - 10);
  for (var t = 0; t < 24; t++) {
    var x = rnd(xmin, xmax), y = rnd(ymin, ymax);
    var md = 1e9;
    for (var k = 0; k < clouds.length; k++) {
      var o = clouds[k]; if (o === c) continue;
      md = Math.min(md, dist(x, y, o.x, o.y) - o.rad - c.rad);

  var base = Math.min(W, H) * 0.12 + 18;
  c.gold = gold;
  c.col = gold ? C_GOLD : (forceCol || pickPalette(c.col));
  c.rad = base * (gold ? 0.6 : rnd(0.8, 1.25));
  c.tc = gold ? 70 : Math.round(rnd(0.75, 1.3) * cloudTarget / 5);
  c.vx = rnd(-7, 7); c.vy = rnd(-4, 4);
  c.rot = 0; c.spin = 0; c.cs = 1; c.sn = 0; c.scale = 1;

function initClouds() {
  clouds = [];
  // 3色は必ず1つずつ置き、残りは毎回違う偏りで選ぶ
  var order = [0, 1, 2].sort(function () { return Math.random() - 0.5; });
  for (var k = 0; k < 5; k++) { var c = { count: 0, col: null }; clouds.push(c); makeCloud(c, true, k < 3 ? palette3[order[k]] : null); }
  for (k = 0; k < clouds.length; k++) {
    var n = clouds[k].tc;
    for (var j = 0; j < n; j++) spawnCloudParticle(k, rnd(0.2, 1));
  }
}
function spawnCloudParticle(k, fade) {
  var c = clouds[k];

}
function relocateCloud(k) {
  var c = clouds[k];
  for (var i = 0; i < MAXP; i++) if (st[i] === S_FREE && cl[i] === k) { cl[i] = -1; fl[i] |= F_STRAY; life[i] = rnd(4, 9); }

function updateClouds(dt) {

  for (var k = 0; k < clouds.length; k++) {

    var ymin = SA.t + c.rad + 10, ymax = Math.min(H * 0.66, tube.mouthY - 70) - c.rad * 0.6;
    if (c.x < SA.l + c.rad * 0.7) c.vx = Math.abs(c.vx); else if (c.x > W - SA.r - c.rad * 0.7) c.vx = -Math.abs(c.vx);
    if (c.y < ymin) c.vy = Math.abs(c.vy); else if (c.y > ymax) c.vy = -Math.abs(c.vy);

    c.spin = guided && stats.tubeFires > 0 && stats.rings === 0 ? 0.9 : 0.06;
    c.rot += c.spin * dt; c.cs = Math.cos(c.rot); c.sn = Math.sin(c.rot);

      if (c.count < c.tc && time - c.lastHit > 3.5) {

/* ------------------------------ 線 ------------------------------ */
var STEP = 6, RC = 14, RA = 32;
function newLine(x, y) {

    endType: null, endGem: null, mergeLine: null, mergeS: 0, startGem: null,

var lineSeq = 0;
function addPoint(L, x, y) {
