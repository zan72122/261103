<title>ぎゅるるん！ハンカチ柄うつし工房とピクニック屋根</title>
<style>
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#2b1d13;overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
body{position:fixed;left:0;top:0;right:0;bottom:0}

#safe{position:absolute;left:0;top:0;visibility:hidden;pointer-events:none;padding-top:env(safe-area-inset-top);padding-right:env(safe-area-inset-right);padding-bottom:env(safe-area-inset-bottom);padding-left:env(safe-area-inset-left)}

<body>
<canvas id="c"></canvas>
<div id="safe"></div>
<script>
'use strict';
(function(){
// ============================================================
//  基本ユーティリティ
// ============================================================
const RES=192;          // 布の柄（インク）解像度
const DR=384;           // 表示用合成テクスチャ解像度
const UNLOCK_N=4;       // 日よけが開く完成枚数
const SHELF_N=6;        // 棚の枠数
const FEED_PER_RAD=0.4/(Math.PI*2); // 1回転で布の40%
const MAX_PARTICLES=90;
const TAU=Math.PI*2;
const cv=(w,h)=>{const c=document.createElement('canvas');c.width=Math.max(1,Math.round(w));c.height=Math.max(1,Math.round(h));return c};
const clamp=(v,a,b)=>v<a?a:(v>b?b:v);
const lerp=(a,b,t)=>a+(b-a)*t;
const easeOut=t=>1-Math.pow(1-clamp(t,0,1),3);
const easeInOut=t=>{t=clamp(t,0,1);return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2};
const easeBack=t=>{t=clamp(t,0,1);const c1=1.6,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2)};
function hash2(x,y,s){let h=(Math.imul(x|0,374761393)+Math.imul(y|0,668265263)+Math.imul(s|0,1442695041))|0;h=Math.imul(h^(h>>>13),1274126177);return((h^(h>>>16))>>>0)/4294967296}
function vnoise(x,y,s){const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi;const u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);const a=hash2(xi,yi,s),b=hash2(xi+1,yi,s),c=hash2(xi,yi+1,s),d=hash2(xi+1,yi+1,s);return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v}
function fbm(x,y,s){return vnoise(x,y,s)*.5+vnoise(x*2.03,y*2.03,s+7)*.3+vnoise(x*4.1,y*4.1,s+13)*.2}
function rr(c,x,y,w,h,r){r=Math.min(r,w/2,h/2);c.beginPath();c.moveTo(x+r,y);c.lineTo(x+w-r,y);c.quadraticCurveTo(x+w,y,x+w,y+r);c.lineTo(x+w,y+h-r);c.quadraticCurveTo(x+w,y+h,x+w-r,y+h);c.lineTo(x+r,y+h);c.quadraticCurveTo(x,y+h,x,y+h-r);c.lineTo(x,y+r);c.quadraticCurveTo(x,y,x+r,y);c.closePath()}
function polyPath(c,pts){c.beginPath();c.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<pts.length;i++)c.lineTo(pts[i][0],pts[i][1]);c.closePath()}
function dist(ax,ay,bx,by){const dx=ax-bx,dy=ay-by;return Math.sqrt(dx*dx+dy*dy)}
function inRect(x,y,r,pad){pad=pad||0;return x>=r.x-pad&&x<=r.x+r.w+pad&&y>=r.y-pad&&y<=r.y+r.h+pad}
function wrapAng(a){while(a>Math.PI)a-=TAU;while(a<-Math.PI)a+=TAU;return a}

const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');
const safeEl=document.getElementById('safe');

// ============================================================
//  音（Web Audio 合成）
// ============================================================
let AC=null,master=null,noiseBuf=null,rum=null,voices=0;
function initAudio(){
  if(AC){if(AC.state==='suspended'&&!document.hidden){try{AC.resume()}catch(e){}}return}
  const Ctor=window.AudioContext||window.webkitAudioContext;if(!Ctor)return;
  try{AC=new Ctor()}catch(e){AC=null;return}
  master=AC.createGain();master.gain.value=.75;
  const comp=AC.createDynamicsCompressor();comp.threshold.value=-14;comp.ratio.value=4;
  master.connect(comp);comp.connect(AC.destination);
  noiseBuf=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate);
  const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  // 回転中の鉄のごろごろ（連続音）
  const src=AC.createBufferSource();src.buffer=noiseBuf;src.loop=true;
  const bp=AC.createBiquadFilter();bp.type='bandpass';bp.frequency.value=140;bp.Q.value=2.2;
  const g=AC.createGain();g.gain.value=0;src.connect(bp);bp.connect(g);g.connect(master);src.start();
  const osc=AC.createOscillator();osc.type='sawtooth';osc.frequency.value=45;
  const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=260;
  const g2=AC.createGain();g2.gain.value=0;osc.connect(lp);lp.connect(g2);g2.connect(master);osc.start();
  rum={bp,g,osc,g2,lp};
  try{const b=AC.createBuffer(1,1,22050);const s=AC.createBufferSource();s.buffer=b;s.connect(AC.destination);s.start(0)}catch(e){}
  if(AC.state==='suspended'){try{AC.resume()}catch(e){}}
}
function audioOK(){return AC&&AC.state==='running'&&voices<26}
function tone(f,dur,o){
  if(!audioOK())return;o=o||{};
  const t=AC.currentTime+(o.at||0);
  const os=AC.createOscillator(),gn=AC.createGain();
  os.type=o.type||'sine';os.frequency.setValueAtTime(f,t);
  if(o.to)os.frequency.exponentialRampToValueAtTime(Math.max(20,o.to),t+dur);
  const g=o.g==null?.2:o.g,att=o.attack||.005;
  gn.gain.setValueAtTime(.0001,t);gn.gain.exponentialRampToValueAtTime(g,t+att);gn.gain.exponentialRampToValueAtTime(.0001,t+dur);
  let last=os;
  if(o.ft){const fl=AC.createBiquadFilter();fl.type=o.ft;fl.frequency.value=o.ff||800;fl.Q.value=o.fq||1;os.connect(fl);last=fl}
  last.connect(gn);gn.connect(master);os.start(t);os.stop(t+dur+.05);
  voices++;os.onended=()=>{voices--};
}
function noise(dur,o){
  if(!audioOK())return;o=o||{};
  const t=AC.currentTime+(o.at||0);
  const s=AC.createBufferSource();s.buffer=noiseBuf;
  const fl=AC.createBiquadFilter();fl.type=o.type||'bandpass';fl.frequency.setValueAtTime(o.f||1000,t);fl.Q.value=o.q||1;
  if(o.to)fl.frequency.exponentialRampToValueAtTime(o.to,t+dur);
  const gn=AC.createGain();const g=o.g==null?.2:o.g,att=o.attack||.004;
  gn.gain.setValueAtTime(.0001,t);gn.gain.exponentialRampToValueAtTime(g,t+att);gn.gain.exponentialRampToValueAtTime(.0001,t+dur);
  s.connect(fl);fl.connect(gn);gn.connect(master);s.start(t,Math.random()*1.5);s.stop(t+dur+.05);
  voices++;s.onended=()=>{voices--};
}
const SFX={
  press(){noise(.15,{type:'lowpass',f:650,g:.32});tone(96,.18,{g:.28,to:58});noise(.09,{f:2600,q:2,g:.05,at:.02})},
  knock(sp){tone(62+sp*7,.07,{type:'triangle',g:.10})},
  creak(sp){const f=170+sp*34;tone(f,.2,{type:'sawtooth',g:.045,to:f*1.35,ft:'bandpass',ff:f*3,fq:6})},
  pick(){noise(.12,{f:1700,q:.9,g:.13})},
  drop(){noise(.24,{f:950,q:.8,g:.24,to:380});tone(120,.08,{g:.06})},
  fold(){noise(.09,{type:'highpass',f:1400,g:.22});tone(150,.12,{g:.18,to:90})},
  unfold(){noise(.18,{f:600,to:1800,q:.8,g:.18})},
  success(){const n=[523.25,659.25,783.99,1046.5];n.forEach((f,i)=>{tone(f,.7,{type:'triangle',g:.16,at:i*.09});tone(f*3,.3,{g:.03,at:i*.09})})},
  discover(){[1318.5,1568,2093,2637].forEach((f,i)=>tone(f,.45,{g:.06,at:.38+i*.07}))},
  snag(){tone(88,.4,{type:'sawtooth',g:.09,to:66,ft:'lowpass',ff:500});tone(1250,.05,{type:'square',g:.04});noise(.25,{f:3000,q:4,g:.05})},
  strain(){tone(130+Math.random()*30,.12,{type:'sawtooth',g:.04,to:110,ft:'bandpass',ff:700,fq:5})},
  free(){tone(380,.16,{to:720,g:.11});noise(.12,{f:2000,g:.08})},
  unfurl(){noise(.65,{f:280,to:2600,q:.7,g:.42});tone(78,.32,{g:.3,to:48})},
  door(){tone(150,.9,{type:'sawtooth',g:.045,to:118,ft:'bandpass',ff:520,fq:5});tone(60,.3,{g:.2,at:.75})},
  tick(){tone(880,.045,{type:'triangle',g:.07})},
  stitch(){tone(2400+Math.random()*300,.03,{g:.04})},
  hook(){tone(1760,1.2,{g:.11});tone(2637,1,{g:.05,at:.02})},
  hop(){tone(300,.12,{to:520,g:.09})},
  hang(){tone(620,.05,{type:'triangle',g:.08});noise(.08,{f:2200,g:.07})},
  whoosh(){noise(.5,{f:450,to:1500,g:.1})},
  thunk(){tone(70,.1,{g:.15,to:50})}
};
function setRumble(sp){
  if(!AC||!rum||AC.state!=='running')return;
  const t=AC.currentTime,s=clamp(Math.abs(sp)/8,0,1);
  rum.g.gain.setTargetAtTime(s*.32,t,.05);
  rum.bp.frequency.setTargetAtTime(100+s*280,t,.05);
  rum.osc.frequency.setTargetAtTime(38+s*72,t,.05);
  rum.g2.gain.setTargetAtTime(s*.05,t,.05);
}

// ============================================================
//  布（柄）データ
// ============================================================
let PID=1;
function newMeta(){return{kinds:new Set(),foldedPrint:false,foldKind:null,configs:new Set(),posConfigs:new Set(),laceTop:false,throughLace:false,dotsOver:false,checkOver:false,reused:false,reusedKinds:0,rows:0,cover:0}}
function newPattern(kind){
  const p={id:PID++,kind,ink:new Uint8ClampedArray(RES*RES*4),inkCv:cv(RES,RES),comp:cv(DR,DR),thumb:null,sil:null,dy0:0,dy1:RES,meta:newMeta(),shade:0};
  p.inkCtx=p.inkCv.getContext('2d');p.compCtx=p.comp.getContext('2d');p.img=new ImageData(p.ink,RES,RES);
  return p;
}
function setInk(ink,x,y,r,g,b){const o=(y*RES+x)*4;ink[o]=r;ink[o+1]=g;ink[o+2]=b;ink[o+3]=255}
function genDenim(ink){
  for(let y=0;y<RES;y++){const slubRow=hash2(0,y,11)<.14;for(let x=0;x<RES;x++){
    const tw=((x+y)&3)<2;let r,g,b;
    if(tw){r=36;g=60;b=110}else{r=25;g=43;b=86}
    if(!tw&&hash2(x,y,5)<.11){r=96;g=116;b=152}
    const wash=(fbm(x/38,y/38,3)-.5)*.42,k=1+wash;
    const sl=slubRow?hash2(x>>3,y,12)*16:0;
    setInk(ink,x,y,r*k+sl,g*k+sl,b*k+sl*1.25);
  }}
}
function genCheck(ink){
  const NAVY=[30,38,74],RED=[170,34,40],CREAM=[218,200,164],DRED=[126,22,30];
  const band=t=>{t=((t%32)+32)%32;if(t<9)return NAVY;if(t===14||t===15)return CREAM;if(t>=22&&t<25)return DRED;return RED};
  for(let y=0;y<RES;y++)for(let x=0;x<RES;x++){
    const warp=((x+y)&3)<2;const c=warp?band(x):band(y+5);
    const n=(hash2(x,y,21)-.5)*18+(fbm(x/30,y/30,4)-.5)*14;
    setInk(ink,x,y,c[0]+n,c[1]+n*.6,c[2]+n*.6);
  }
}
function laceAt(u,v){ // 0=穴 1=糸 2=太い縁糸
  const e=Math.min(u,1-u,v,1-v);
  let t;if(e===u||e===1-u)t=v;else t=u;
  const s=Math.abs(Math.sin(Math.PI*t*11));
  const bnd=.006+.034*(1-Math.sqrt(s));
  if(e<bnd)return 0;
  if(e<bnd+.013)return 2;
  if(e<.088){const sp=1/26;const tt=((t%sp)+sp)%sp-sp/2;const de=e-.062;const dd=Math.sqrt(tt*tt+de*de);if(dd<.0105)return 0;if(dd<.017)return 2;if(e>.08)return 2;return 1}
  const g=.2075,cu=(u-.088)/g,cvv=(v-.088)/g;
  const ci=Math.floor(cu),cj=Math.floor(cvv);
  const mu=(ci+.5)*g+.088,mv=(cj+.5)*g+.088;
  const dm=Math.sqrt((u-mu)*(u-mu)+(v-mv)*(v-mv));
  if(dm<.078){
    const th=Math.atan2(v-mv,u-mu);
    if(dm<.011)return 0;if(dm<.024)return 2;
    if(dm<.062){return Math.cos(6*th+((ci+cj)&1)*.5)>.12?0:1}
    if(dm<.074)return 2;return 1;
  }
  const a=(u+v)/.042,b=(u-v)/.042;
  const fa=Math.abs(a-Math.round(a)),fb=Math.abs(b-Math.round(b));
  if(fa<.14||fb<.14)return 1;
  return 0;
}
function genLace(ink){
  for(let y=0;y<RES;y++)for(let x=0;x<RES;x++){
    const k=laceAt((x+.5)/RES,(y+.5)/RES);if(!k)continue;
    const n=(hash2(x,y,31)-.5)*14;
    if(k===2)setInk(ink,x,y,186+n,172+n,138+n);else setInk(ink,x,y,206+n,196+n,166+n);
  }
}
function genDots(ink){
  const sp=24,rad=8.2;
  for(let y=0;y<RES;y++)for(let x=0;x<RES;x++){
    const row=Math.round((y-12)/sp);let best=1e9;
    for(let rI=row-1;rI<=row+1;rI++){const cy=rI*sp+12;const off=(rI&1)?sp/2:0;const cxx=Math.round((x-off-12)/sp)*sp+off+12;for(let k=-1;k<=1;k++){const cx=cxx+k*sp;const dd=(x-cx)*(x-cx)+(y-cy)*(y-cy);if(dd<best)best=dd}}
    const d=Math.sqrt(best)+(hash2(x,y,41)-.5)*1.4;
    if(d>rad)continue;
    const kas=fbm(x/6.5,y/6.5,9);if(kas<.31)continue;
    const n=(hash2(x,y,43)-.5)*16;
    if(d>6.6)setInk(ink,x,y,214+n,148+n,24);else setInk(ink,x,y,230+n,174+n,34+n*.5);
  }
}
let HANKY_BASE=null,WEAVE=null;
function makeHankyBase(){
  const c=cv(DR,DR),x=c.getContext('2d'),d=x.createImageData(DR,DR),D=d.data;
  const hem=DR*.036,st=DR*.05;
  for(let j=0;j<DR;j++)for(let i=0;i<DR;i++){
    let v=247-((i%3===0)?6:0)-((j%3===0)?5:0)+(hash2(i,j,51)-.5)*6+(fbm(i/60,j/60,52)-.5)*6;
    const e=Math.min(i,j,DR-1-i,DR-1-j);
    if(e<hem)v-=9;
    if(Math.abs(e-st)<.9){const along=(e===i||e===DR-1-i)?j:i;if((along%10)<6)v-=26}
    if(e<2)v-=10;
    const o=(j*DR+i)*4;D[o]=v;D[o+1]=v-2;D[o+2]=v-8;D[o+3]=255;
  }
  x.putImageData(d,0,0);return c;
}
function makeWeave(){const c=cv(8,8),x=c.getContext('2d'),d=x.createImageData(8,8);for(let j=0;j<8;j++)for(let i=0;i<8;i++){const v=(((i>>1)+(j>>1))&1)?255:214;const o=(j*8+i)*4;d.data[o]=d.data[o+1]=d.data[o+2]=v;d.data[o+3]=255}x.putImageData(d,0,0);return c}
function composeFabric(p){
  const c=p.compCtx;c.clearRect(0,0,DR,DR);
  c.imageSmoothingEnabled=true;
  if(p.kind==='dots'){
    c.fillStyle='rgba(236,226,198,.58)';c.fillRect(0,0,DR,DR);
  }
  p.inkCtx.putImageData(p.img,0,0);
  c.drawImage(p.inkCv,0,0,DR,DR);
  // 接写の糸の凹凸
  const d=c.getImageData(0,0,DR,DR),D=d.data;
  for(let j=0;j<DR;j++)for(let i=0;i<DR;i++){
    const o=(j*DR+i)*4;if(D[o+3]===0)continue;
    let k=1+((((i>>1)+(j>>1))&1)?.05:-.05)+(hash2(i,j,61)-.5)*.09;
    if(p.kind==='denim'){k+=((((i+j)>>1)%3)===0)?.10:-.03;if(hash2(i,j,62)<.012)k+=.35}
    if(p.kind==='check'){k+=((i+j)&2)?.04:-.04}
    if(p.kind==='lace'){k+=(hash2(i>>1,j>>1,63)-.5)*.1}
    if(p.kind==='dots'&&D[o+3]<200){k=1+(hash2(i,j,64)-.5)*.05+(((i+j)&1)?.03:-.03)}
    D[o]=D[o]*k;D[o+1]=D[o+1]*k;D[o+2]=D[o+2]*k;
  }
  c.putImageData(d,0,0);
  if(p.kind==='lace'){ // 糸の立体感
    c.globalCompositeOperation='source-atop';
    const g=c.createLinearGradient(0,0,DR,DR);g.addColorStop(0,'rgba(255,255,240,.10)');g.addColorStop(1,'rgba(60,40,10,.10)');c.fillStyle=g;c.fillRect(0,0,DR,DR);
    c.globalCompositeOperation='source-over';
  }
  p.dy0=RES;p.dy1=0;
}
function recomposeHanky(p){
  if(p.dy1>p.dy0){p.inkCtx.putImageData(p.img,0,0,0,p.dy0,RES,p.dy1-p.dy0)}
  const c=p.compCtx;c.globalCompositeOperation='source-over';c.drawImage(HANKY_BASE,0,0);
  c.globalCompositeOperation='multiply';c.imageSmoothingEnabled=true;c.drawImage(p.inkCv,0,0,DR,DR);
  c.globalCompositeOperation='source-over';
  p.dy0=RES;p.dy1=0;p.dirty=false;
}
function makeSil(p){
  const c=cv(40,40),x=c.getContext('2d');x.drawImage(p.comp,0,0,40,40);x.globalCompositeOperation='source-in';x.fillStyle='#24160a';x.fillRect(0,0,40,40);p.sil=c;
}
function finalizePattern(p){
  recomposeHanky(p);
  const t1=cv(DR/2,DR/2);t1.getContext('2d').drawImage(p.comp,0,0,DR/2,DR/2);
  const t2=cv(96,96);t2.getContext('2d').drawImage(t1,0,0,96,96);p.thumb=t2;
  let s=0,n=0;const ink=p.ink;
  for(let i=0;i<RES*RES;i+=3){n++;const o=i*4;if(ink[o+3]>127){const l=(ink[o]*.3+ink[o+1]*.55+ink[o+2]*.15)/255;s+=1-l*.85}}
  p.shade=.08+s/n;p.meta.cover=s/n;
}
const FAB={};
function initFabrics(){
  HANKY_BASE=makeHankyBase();WEAVE=makeWeave();
  const g={denim:genDenim,check:genCheck,lace:genLace,dots:genDots};
  for(const k of ['denim','check','lace','dots']){const p=newPattern(k);g[k](p.ink);composeFabric(p);makeSil(p);p.meta.kinds.add(k);
    const t=cv(96,96);t.getContext('2d').drawImage(p.comp,0,0,96,96);p.thumb=t;FAB[k]=p}
}
function newHanky(){const p=newPattern('hanky');recomposeHanky(p);p.dirty=false;return p}

// ============================================================
//  保存（端末内のみ）
// ============================================================
const SAVE_KEY='gf261103_4_fav_v1';
function checksum(a){let s=7;for(let i=0;i<a.length;i++)s=(Math.imul(s,31)+a[i])>>>0;return s}
function saveFav(p){
  try{
    const a=p.ink;let bin='';for(let i=0;i<a.length;i+=8192)bin+=String.fromCharCode.apply(null,a.subarray(i,i+8192));
    const o={v:1,res:RES,sum:checksum(a),kinds:Array.from(p.meta.kinds).filter(k=>FAB[k]),data:btoa(bin)};
    localStorage.setItem(SAVE_KEY,JSON.stringify(o));S.saveState='ok';
  }catch(e){S.saveState='fail'}
  logEv('save',{state:S.saveState});
}
function loadFav(){
  let raw=null;
  try{raw=localStorage.getItem(SAVE_KEY)}catch(e){S.loadState='denied';return null}
  if(!raw){S.loadState='empty';return null}
  try{
    const o=JSON.parse(raw);
    if(!o||o.v!==1||o.res!==RES||typeof o.data!=='string')throw new Error('bad');
    const bin=atob(o.data);if(bin.length!==RES*RES*4)throw new Error('len');
    const p=newPattern('hanky');
    for(let i=0;i<bin.length;i++)p.ink[i]=bin.charCodeAt(i);
    if(checksum(p.ink)!==o.sum)throw new Error('sum');
    for(let i=3;i<p.ink.length;i+=4){if(p.ink[i]!==0&&p.ink[i]!==255)throw new Error('alpha')}

  // 草地
  const gw=Math.round(W/3),gh=Math.round((H-hz)/3)+2;const gc=cv(gw,gh),gx=gc.getContext('2d'),gd=gx.createImageData(gw,gh);
  for(let j=0;j<gh;j++)for(let i=0;i<gw;i++){const n=fbm(i/14,j/6,91),m=hash2(i,j,92);const k=.75+n*.4+m*.12;const dep=j/gh;const o=(j*gw+i)*4;gd.data[o]=(78+dep*10)*k;gd.data[o+1]=(108+dep*8)*k;gd.data[o+2]=(44)*k;gd.data[o+3]=255}

  for(let i=0;i<Math.min(1400,W*H/260);i++){const x=rnd()*W,y=hz+4+Math.pow(rnd(),.8)*(H-hz);const dep=(y-hz)/(H-hz);const len=3+dep*12*(.5+rnd());c.strokeStyle=`rgba(${(60+rnd()*60)|0},${(90+rnd()*60)|0},${(30+rnd()*20)|0},${.35+rnd()*.4})`;c.lineWidth=.6+dep*1.4;c.beginPath();c.moveTo(x,y);c.quadraticCurveTo(x+(rnd()-.5)*4,y-len*.6,x+(rnd()-.5)*6,y-len);c.stroke()}

function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

function clipHalf(poly,n,d,ge){const out=[];for(let i=0;i<poly.length;i++){const a=poly[i],b=poly[(i+1)%poly.length];const sa=n[0]*a[0]+n[1]*a[1]-d,sb=n[0]*b[0]+n[1]*b[1]-d;const ia=ge?sa>=0:sa<0,ib=ge?sb>=0:sb<0;if(ia)out.push(a);if(ia!==ib){const t=sa/(sa-sb);out.push([a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t])}}return out}
function reflectPt(q,n,d){const k=2*(n[0]*q[0]+n[1]*q[1]-d);return[q[0]-k*n[0],q[1]-k*n[1]]}
const SQ=[[0,0],[1,0],[1,1],[0,1]];
function drawCloth(c,p,x,y,s,fold,opt){
  opt=opt||{};
  if(!opt.noShadow){c.fillStyle='rgba(50,30,10,.2)';c.fillRect(x+2,y+3,s,s)}
  if(!fold||Math.abs(fold.d-fold.d0)<1e-4){
    c.drawImage(p.comp,x,y,s,s);
    if(opt.back){c.fillStyle='rgba(110,95,75,.16)';c.fillRect(x,y,s,s)}
    return;
  }
  const n=fold.n,d=fold.d;
  const st=clipHalf(SQ,n,d,true),fl=clipHalf(SQ,n,d,false);
  c.save();c.translate(x,y);c.scale(s,s);
  if(st.length>2){c.save();polyPath(c,st);c.clip();c.drawImage(p.comp,0,0,1,1);c.restore()}
  if(fl.length>2){
    const rf=fl.map(q=>reflectPt(q,n,d));
    c.save();c.translate(.012,.02);c.fillStyle='rgba(40,25,10,.25)';polyPath(c,rf);c.fill();c.restore();
    c.save();c.transform(1-2*n[0]*n[0],-2*n[0]*n[1],-2*n[0]*n[1],1-2*n[1]*n[1],2*d*n[0],2*d*n[1]);
    polyPath(c,fl);c.clip();c.drawImage(p.comp,0,0,1,1);c.fillStyle='rgba(120,100,78,.13)';c.fillRect(-1,-1,3,3);c.restore();
    const on=st.filter(q=>Math.abs(n[0]*q[0]+n[1]*q[1]-d)<1e-6);
    if(on.length>=2){c.strokeStyle='rgba(255,252,240,.8)';c.lineWidth=2/s;c.beginPath();c.moveTo(on[0][0],on[0][1]);c.lineTo(on[1][0],on[1][1]);c.stroke();
      c.strokeStyle='rgba(60,40,20,.18)';c.lineWidth=3/s;c.beginPath();c.moveTo(on[0][0]+n[0]*.008,on[0][1]+n[1]*.008);c.lineTo(on[1][0]+n[0]*.008,on[1][1]+n[1]*.008);c.stroke()}
  }
  c.restore();
}
function drawLayerPiece(c,ly,x,y,s,lift){
  lift=lift||0;
  const p=ly.pat;
  c.save();c.globalAlpha=.32+lift*.15;c.drawImage(p.sil||FAB.check.sil,x+2+lift*4,y+3+lift*6,s,s);c.restore();
  if(ly.kind==='hanky'){c.drawImage(p.comp,x,y,s,s);return}

}

let LID=1;

function layerRect(l){const L=LY.L;return{x:LY.hx0+l.ox*L,y:hankyTopY()+l.oy*L,w:l.s*L,h:l.s*L}}
function knobPos(){const a=S.wheel.angle+dispStrain();return{x:LY.wheel.x+Math.cos(a)*LY.R*.68,y:LY.wheel.y+Math.sin(a)*LY.R*.68}}
function dispStrain(){return .32*Math.tanh(S.wheel.strain*3)}

function layerSig(){return S.layers.map(l=>l.kind==='hanky'?'h'+l.pat.id:l.kind).join('>')}
function posSig(){return S.layers.map(l=>(l.kind==='hanky'?'h'+l.pat.id:l.kind)+':'+Math.round(l.ox*20)+','+Math.round(l.oy*20)).join('>')}

// ---- 転写 ----
function printRows(f0,f1){
  const yHi=1-f0,yLo=1-f1;
  const a=Math.max(0,Math.ceil(yLo*RES-.5)),b=Math.min(RES-1,Math.ceil(yHi*RES-.5)-1);
  if(b<a||!S.layers.length)return 0;
  const sig=layerSig(),ps=posSig();let tot=0;
  for(let iy=b;iy>=a;iy--)tot+=printRow(iy);
  if(tot>0){S.hanky.meta.configs.add(sig);S.hanky.meta.posConfigs.add(ps)}
  return tot;
}
function printRow(iy){
  const h=S.hanky,ink=h.ink,meta=h.meta,py=(iy+.5)/RES,fold=S.fold,ls=S.layers,nL=ls.length;
  let ci=-1,di=-1;for(let i=0;i<nL;i++){if(ls[i].kind==='check')ci=i;if(ls[i].kind==='dots')di=i}
  let cnt=0,used=0,colSum=[0,0,0];
  for(let ix=0;ix<RES;ix++){
    const px=(ix+.5)/RES;let tx2=-1,ty2=-1;
    if(fold){const s=fold.n[0]*px+fold.n[1]*py;if(s<fold.d-1e-6)continue;const k=2*(s-fold.d);const rx=px-k*fold.n[0],ry=py-k*fold.n[1];if(k>1e-6&&rx>=0&&rx<1&&ry>=0&&ry<1){tx2=(rx*RES)|0;ty2=(ry*RES)|0}}
    let hit=-1,top=-1,r=0,g=0,b=0;
    for(let li=nL-1;li>=0;li--){
      const L=ls[li];const u=(px-L.ox)/L.s,v=(py-L.oy)/L.s;
      if(u<0||u>=1||v<0||v>=1)continue;
      if(top<0)top=li;
      const pi=(((v*RES)|0)*RES+((u*RES)|0))*4,src=L.pat.ink;
      if(src[pi+3]>127){hit=li;r=src[pi];g=src[pi+1];b=src[pi+2];break}
    }
    if(ci>=0&&di>=0){const C=ls[ci],D=ls[di];const uc=(px-C.ox)/C.s,vc=(py-C.oy)/C.s,ud=(px-D.ox)/D.s,vd=(py-D.oy)/D.s;
      if(uc>=0&&uc<1&&vc>=0&&vc<1&&ud>=0&&ud<1&&vd>=0&&vd<1){if(di>ci)meta.dotsOver=true;else meta.checkOver=true}}
    if(hit<0)continue;
    const HL=ls[hit];
    if(HL.kind==='lace'&&hit===top)meta.laceTop=true;
    if(top>=0&&ls[top].kind==='lace'&&hit<top)meta.throughLace=true;
    used|=1<<hit;
    const pr=.955+.045*hash2(ix,iy,S.printSeed);
    const o=(iy*RES+ix)*4;ink[o]=r*pr;ink[o+1]=g*pr;ink[o+2]=b*pr;ink[o+3]=255;
    if(tx2>=0){const o2=(ty2*RES+tx2)*4;ink[o2]=r*pr;ink[o2+1]=g*pr;ink[o2+2]=b*pr;ink[o2+3]=255;if(ty2<h.dy0)h.dy0=ty2;if(ty2+1>h.dy1)h.dy1=ty2+1;meta.foldedPrint=true;meta.foldKind=fold.kind}
    cnt++;if((cnt&15)===1){colSum[0]=r;colSum[1]=g;colSum[2]=b}
  }
  if(cnt){
    if(iy<h.dy0)h.dy0=iy;if(iy+1>h.dy1)h.dy1=iy+1;h.dirty=true;meta.rows++;
    for(let i=0;i<nL;i++)if(used&(1<<i)){const L=ls[i];meta.kinds.add(L.kind==='hanky'?'hanky':L.kind);if(L.kind==='hanky'){meta.reused=true;L.pat.meta.kinds.forEach(k=>meta.kinds.add(k))}}
    if(Math.random()<.5)emitFiber(colSum);
  }
  return cnt;
}
function emitFiber(col){
  if(S.particles.length>=MAX_PARTICLES)return;
  const x=LY.hx0+Math.random()*LY.L,y=LY.nipY+(Math.random()<.5?-LY.rr:LY.rr)*(.9+Math.random()*.3);
  S.particles.push({x,y,vx:(Math.random()-.5)*30,vy:(y<LY.nipY?-1:1)*(10+Math.random()*25)-8,life:.9+Math.random()*.6,t:0,c:`rgba(${col[0]|0},${col[1]|0},${col[2]|0},`,len:2+Math.random()*4,rot:Math.random()*TAU,vr:(Math.random()-.5)*6});
}
function burst(x,y,w,h,pat,n){
  for(let i=0;i<n&&S.particles.length<MAX_PARTICLES;i++){
    let col=[230,220,200];
    if(pat){const ix=(Math.random()*RES)|0,iy=(Math.random()*RES)|0,o=(iy*RES+ix)*4;if(pat.ink[o+3]>127)col=[pat.ink[o],pat.ink[o+1],pat.ink[o+2]]}
    S.particles.push({x:x+Math.random()*w,y:y+Math.random()*h,vx:(Math.random()-.5)*120,vy:-40-Math.random()*90,life:1+Math.random()*.6,t:0,c:`rgba(${col[0]|0},${col[1]|0},${col[2]|0},`,len:3+Math.random()*5,rot:Math.random()*TAU,vr:(Math.random()-.5)*8,g:140});
  }
}

// ---- 回転 ----
function applyRotation(dA,demo){
  if(!dA)return;
  if(S.arrive>.6&&dA>0){return}
  const w=S.wheel;
  if(!demo){S.idle=0}
  if(dA>0){
    if(S.exit&&S.exit.phase==='wait'&&S.f<.02&&!demo)sendExitToShelf();
    if(S.snag){
      w.strain=clamp(w.strain+dA,0,.9);S.snag.strain=w.strain;S.snag.push+=dA;
      if(S.snag.push>.25){S.snag.push=0;SFX.strain()}
      return;
    }
    if(w.strain>0){const u=Math.min(w.strain,dA);w.strain-=u;dA-=u;if(dA<=0)return}
    let df=Math.min(dA*FEED_PER_RAD,.08);let nf=Math.min(1,S.f+df);
    // レース端の引っかかり
    for(const l of S.layers){
      if(l.kind!=='lace'||l.snagAt==null)continue;
      const yS=Math.min(1,l.oy+l.s)-l.snagAt;const y0=1-S.f,y1=1-nf;
      if(yS<y0&&yS>=y1&&yS>0.02&&yS<.98){nf=1-yS;S.snag={layer:l,f0:nf,strain:0,push:0,t:0};w.strain=.05;SFX.snag();logEv('snag',{f:+nf.toFixed(3)});break}
    }
    const used=(nf-S.f)/FEED_PER_RAD;
    printRows(S.f,nf);S.f=nf;w.angle+=used;w.frameDA+=used;
    if(S.f>=1)completeHanky();
  }else{
    if(w.strain>0){const u=Math.min(w.strain,-dA);w.strain-=u;dA+=u;if(dA>=0){if(S.snag&&w.strain<=.001){}return}}
    if(S.f<=0){w.blockT+=-dA;if(w.blockT>.6){w.blockT=0;SFX.thunk()}return}
    const df=Math.max(dA*FEED_PER_RAD,-.08);const nf=Math.max(0,S.f+df);
    const moved=S.f-nf;S.f=nf;w.angle+=-moved/FEED_PER_RAD;w.frameDA+=-moved/FEED_PER_RAD;
    S.revAcc+=moved;
    if(S.snag&&S.snag.f0-S.f>.022){freeSnag('reverse')}
    if(!S.disc.d6&&S.revAcc>.03&&!demo){S.disc.d6=true;logEv('discover',{id:'d6',f:+S.f.toFixed(3)});SFX.discover();celebrateSmall()}
  }
}
function freeSnag(how){
  if(!S.snag)return;const l=S.snag.layer;l.snagAt=null;S.snag=null;S.wheel.strain=0;SFX.free();
  logEv('snagFree',{how});
  burst(LY.hx0,LY.nipY-LY.rr*2,LY.L,LY.rr,FAB.lace,8);
}
function celebrateSmall(){S.handJoy=1}

// ---- 完成 ----
function allocShelf(pat){
  let i=S.shelf.findIndex(x=>!x);
  if(i<0){
    let best=-1,bo=1e9;for(let k=0;k<SHELF_N;k++){const it=S.shelf[k];if(it&&!it.out&&!it.fly&&it.order<bo){bo=it.order;best=k}}
    if(best<0)best=0;
    const ev=S.shelf[best];if(ev){const sl=LY.slots[best];S.falling.push({pat:ev.pat,x:sl.x,y:sl.y,s:sl.s,vy:0,rot:0,t:0});logEv('evict',{})}
    i=best;
  }
  const it={pat,out:true,order:S.order++,fly:null};S.shelf[i]=it;return it;
}
function completeHanky(){
  const pat=S.hanky;finalizePattern(pat);
  const m=pat.meta;
  const item=allocShelf(pat);
  const newDisc=[];
  if(m.laceTop&&!S.disc.d1){S.disc.d1=true;newDisc.push('d1')}
  if(m.configs.size>=2&&!S.disc.d2){S.disc.d2=true;newDisc.push('d2')}
  if(m.dotsOver)S.orderSeen.dotsOver=true;if(m.checkOver)S.orderSeen.checkOver=true;
  if(S.orderSeen.dotsOver&&S.orderSeen.checkOver&&!S.disc.d4&&(m.dotsOver||m.checkOver)){S.disc.d4=true;newDisc.push('d4')}
  if(m.reused&&!S.disc.d5){S.disc.d5=true;newDisc.push('d5')}
  const special=newDisc.length>0||m.kinds.size>=3||m.reused||m.configs.size>=2||m.foldedPrint;
  S.exit={item,pat,fold:S.fold?Object.assign({},S.fold):null,y0:LY.nipY,t:0,phase:'drop',lift:0,flip:0,special,waitT:0};
  S.completed++;S.madeSinceRoof++;
  logEv('complete',{n:S.completed,kinds:Array.from(m.kinds),configs:m.configs.size,posConfigs:m.posConfigs.size,folded:m.foldedPrint,foldKind:m.foldKind,laceTop:m.laceTop,throughLace:m.throughLace,dotsOver:m.dotsOver,checkOver:m.checkOver,reused:m.reused,cover:+m.cover.toFixed(3),newDisc});
  newDisc.forEach(id=>logEv('discover',{id}));
  SFX.success();if(newDisc.length||special)SFX.discover();
  burst(LY.hx0,LY.nipY+LY.rr,LY.L,LY.L*.5,pat,special?26:14);
  S.machineHop=1;
  // 次の白布
  S.hanky=newHanky();S.fold=null;S.f=0;S.spr.x=0;S.spr.v=0;S.arrive=1;S.printSeed++;S.revAcc=0;
  for(const l of S.layers)clampLayer(l);
  for(const l of S.layers){if(l.kind==='lace'){S.laceUses++;l.snagAt=(S.laceUses>1&&Math.random()<.25)?.12+Math.random()*.2:null}}
  if(S.hand.mode!=='rest'&&S.hand.mode!=='show'){S.hand.mode='rest'}
  S.hand.mode='show';S.hand.t=0;
}
function sendExitToShelf(){
  const e=S.exit;if(!e)return;
  const it=e.item;it.out=false;it.fly={x:LY.hx0,y:exitY(),s:LY.L,t:0};S.exit=null;SFX.hang();
  if(S.hand.mode==='show'||S.hand.mode==='assistUnfold')S.hand.mode='rest';
  checkUnlock();
}
function exitY(){const e=S.exit;if(!e)return LY.exitTop;return lerp(e.y0,LY.exitTop,easeOut(Math.min(1,e.t/.3)))-e.lift*LY.L*.05}
function checkUnlock(){
  if(!S.roof.unlocked&&S.completed>=UNLOCK_N&&!S.unlock){
    S.roof.unlocked=true;S.unlock={t:0};
    const pats=[];for(const it of S.shelf)if(it)pats.push(it.pat);
    for(let i=0;i<6;i++)S.roof.patches[i]=pats[i]||null;
    S.madeSinceRoof=0;SFX.door();logEv('unlock',{patches:pats.length});
  }
}

function wiggle(id){S.wiggles[id]=1;SFX.tick()}
function camSettled(){return Math.abs(S.camT-S.camTarget)<.01&&!(S.unlock&&S.unlock.t<1.7)}
function startAct(x,y){

  // 棚（両画面共通）
  const sh=hitShelf(x,y);

  if(S.view==='work')startWork(x,y);else startPic(x,y);
}
function hitShelf(x,y){
  if(!inRect(x,y,LY.shelf,4))return null;
  const hk=LY.hook;
  if(S.hook&&!S.hook.out&&dist(x,y,hk.cx,hk.cy)<hk.r+8)return{src:'hook',item:S.hook};
  for(let i=0;i<SHELF_N;i++){const it=S.shelf[i];if(!it||it.out||it.fly)continue;const sl=LY.slots[i];if(inRect(x,y,{x:sl.x,y:sl.y-10,w:sl.s,h:sl.s+14},6))return{src:'slot',i,item:it}}
  if(dist(x,y,hk.cx,hk.cy)<hk.r+8){wiggle('hook');act.type='none';return null}
  wiggle('shelf');act.type='none';return null;
}
function beginItemDrag(h,x,y){
  const it=h.item;
  act.type='item';act.item=it;act.src=h.src;act.slot=h.i;
  it.out=true;SFX.pick();
  S.drag={kind:'item',pat:it.pat,x,y,s:LY.slots[0].s,ts:LY.slots[0].s};
}
function startWork(x,y){
  const w=LY.wheel;
  // 出口のハンカチ
  if(S.exit&&S.exit.phase!=='drop'){

function hankyNorm(x,y){return{x:(x-LY.hx0)/LY.L,y:(y-hankyTopY())/LY.L}}

      if(!S.disc.d2&&S.f>.25&&S.f<.75){const has=new Set(S.layers.map(l=>l.kind));const k=['denim','dots','lace','check'].find(k=>!has.has(k));if(k)return'bin:'+k}
      if(!S.disc.d6&&S.f>.2)return'wheelRev';
      return'wheel';
    }
    if(S.layers.length===0)return'bin:'+(!S.disc.d1?'lace':'check');
    if(!S.disc.d1&&!S.layers.some(l=>l.kind==='lace'))return'bin:lace';
    if(!S.disc.d1)return'wheel';
    if(!S.disc.d3&&S.f<=.001&&!S.fold)return'fold';
    if(!S.disc.d4){const ks=S.layers.map(l=>l.kind);if(!ks.includes('check'))return'bin:check';if(!ks.includes('dots'))return'bin:dots';
      const ci=ks.indexOf('check'),di=ks.indexOf('dots');if(S.orderSeen.dotsOver&&di>ci)return'bin:check';if(S.orderSeen.checkOver&&ci>di)return'bin:dots';return'wheel'}
    if(!S.disc.d5){const i=S.shelf.findIndex(it=>it&&!it.out&&!it.fly);if(i>=0&&!S.layers.some(l=>l.kind==='hanky'))return'shelf:'+i}
    if(S.roof.unlocked&&S.madeSinceRoof>0)return'doors';
    if(S.roof.unlocked&&!S.hookPlaced){const i=S.shelf.findIndex(it=>it&&!it.out);if(i>=0)return'hook'}

  }else{

    const onRoof=new Set(S.roof.patches.filter(Boolean));

}
function hintPoint(id){

function centerOfFlap(F){const fl=clipHalf(SQ,F.n,F.d,false);if(!fl.length)return[.5,.5];let x=0,y=0;fl.forEach(q=>{const r=reflectPt(q,F.n,F.d);x+=r[0];y+=r[1]});return[x/fl.length,y/fl.length]}

// ============================================================
//  更新
// ============================================================
function update(dt){
  S.time+=dt;S.idle+=dt;
  const w=S.wheel;
  const inst=w.frameDA/dt;w.frameDA=0;w.speed+=(inst-w.speed)*Math.min(1,dt*12);
  if(!w.held)w.press=Math.max(0,w.press-dt*5);
  if(S.squeeze>0)S.squeeze=Math.max(w.held?.6:0,S.squeeze-dt*3);
  if(!w.held&&!S.snag&&w.strain>0)w.strain=Math.max(0,w.strain-dt*2);
  if(S.snag&&!w.held&&w.strain>0)w.strain=Math.max(0,w.strain-dt*1.5);
  // 停止時のはね返り
  const target=-clamp(w.speed,-12,12)*.0011;S.spr.v+=((target-S.spr.x)*220-S.spr.v*13)*dt;S.spr.x+=S.spr.v*dt;
  if(S.f<=0&&S.spr.x<0)S.spr.x*=.5;
  S.shake=Math.min(1,Math.abs(w.speed)/7)+(S.snag?w.strain*1.5:0);
  setRumble(document.hidden?0:w.speed);
  const asp=Math.abs(w.speed);w.knockAcc+=asp*dt;w.creakAcc+=asp*dt;
  if(w.knockAcc>.5){w.knockAcc=0;SFX.knock(asp)}
  if(w.creakAcc>1.9){w.creakAcc=0;SFX.creak(asp)}
  if(S.machineHop)S.machineHop=Math.max(0,S.machineHop-dt*3);
  if(S.snag)S.snag.t+=dt;
  // 粒子
  for(let i=S.particles.length-1;i>=0;i--){const p=S.particles[i];p.t+=dt;if(p.t>p.life){S.particles.splice(i,1);continue}p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.97;p.vy+=(p.g||-6)*dt;p.rot+=p.vr*dt}
  if(S.arrive>0)S.arrive=Math.max(0,S.arrive-dt/.45);
  // 折りのトゥイーン
  if(S.foldTw){const T=S.foldTw;T.t+=dt;const k=easeInOut(T.t/T.dur);const n=[lerp(T.n0[0],T.n1[0],k),lerp(T.n0[1],T.n1[1],k)];const l=Math.hypot(n[0],n[1])||1;T.obj.n=[n[0]/l,n[1]/l];T.obj.d=lerp(T.d0,T.d1,k);if(T.t>=T.dur){S.foldTw=null;if(T.cb)T.cb()}}
  // 出口
  const e=S.exit;
  if(e){e.t+=dt;
    if(e.phase==='drop'&&e.t>.3){e.phase='show';e.st=0}
    if(e.phase==='show'){e.st+=dt;const dur=e.special?2.3:1.4;
      e.lift=clamp(e.st/.35,0,1)*(1-clamp((e.st-dur+.35)/.35,0,1));
      if(e.special)e.flip=clamp((e.st-.5)/1.2,0,1);
      if(e.st>dur){e.phase='wait';e.lift=0;e.flip=0;e.waitT=0;if(S.hand.mode==='show')S.hand.mode='rest'}}
    if(e.phase==='wait'){e.waitT+=dt;
      if(!e.fold&&e.waitT>1.1&&!(act&&act.type==='unfold'))sendExitToShelf();
      else if(e.fold&&e.waitT>7&&S.hand.mode==='rest'&&!(act&&act.type==='unfold')){S.hand.mode='assistUnfold';S.hand.t=0;S.hand.data=null}}
  }
  for(const sl of S.shelf)if(sl&&sl.fly){sl.fly.t+=dt/.5;if(sl.fly.t>=1)sl.fly=null}
  if(S.hook&&S.hook.fly){S.hook.fly.t+=dt/.5;if(S.hook.fly.t>=1)S.hook.fly=null}
  for(let i=S.ghosts.length-1;i>=0;i--){const g=S.ghosts[i];g.t+=dt/.4;if(g.t>=1)S.ghosts.splice(i,1)}
  for(let i=S.falling.length-1;i>=0;i--){const f=S.falling[i];f.t+=dt;f.vy+=900*dt;f.y+=f.vy*dt;f.rot+=dt*2;if(f.y>H+40)S.falling.splice(i,1)}
  for(const k in S.wiggles){S.wiggles[k]-=dt*2.5;if(S.wiggles[k]<=0)delete S.wiggles[k]}
  if(S.roof.flash)for(const k in S.roof.flash){S.roof.flash[k]-=dt*1.5;if(S.roof.flash[k]<=0)delete S.roof.flash[k]}
  // 戸口・日よけ
  if(S.unlock){const u=S.unlock;u.t+=dt;S.doorOpen=clamp(u.t/.8,0,1);
    if(u.t>.85&&!u.pan){u.pan=1;goView('picnic')}
    if(u.t>1.75&&!u.unf){u.unf=1;SFX.unfurl()}
    if(u.t>1.75&&u.t<2.6){u.st=(u.st||0)+dt;if(u.st>.12){u.st=0;SFX.stitch()}}
    S.roof.unfurl=clamp((u.t-1.75)/.85,0,1);
    if(u.t>2.1&&!u.dolls){u.dolls=1;spawnDolls()}
    if(u.t>3)S.unlock=null;
  }
  const cs=S.camTarget-S.camT;S.camT+=cs*Math.min(1,dt*5);if(Math.abs(cs)<.002)S.camT=S.camTarget;
  // 日よけのスライド
  const r=S.roof;const prevX=r.x;r.x+=(r.tx-r.x)*Math.min(1,dt*10);r.swayV+=(-(r.x-prevX)*.6/Math.max(dt,.001)*.02-r.sway*30-r.swayV*4)*dt;r.sway+=r.swayV*dt;
  updateDolls(dt);
  // ヒント
  const hid=computeHint();if(hid!==S.hint.id){S.hint.id=hid;S.hint.t=0}else S.hint.t+=dt;
  updateHand(dt);
  if(S.hanky.dirty)recomposeHanky(S.hanky);
}

// ---- 布人形 ----
function spawnDolls(){
  const kinds=['check','denim','dots'];S.dolls=[];
  for(let i=0;i<3;i++){const fromL=i!==1;S.dolls.push({x:fromL?-30-i*40:W+40,y:LY.pic.footY-10-i*8,s:LY.pic.P*.55,kind:kinds[i],state:'walk',ph:Math.random()*TAU,hop:0,mat:false,tx:0,ty:0,face:fromL?1:-1})}
}
function shadowRect(i){const pc=LY.pic,P=pc.P,Ph=pc.Ph,c=i%3,r=(i/3)|0;const shTop=pc.footY-2*Ph*.92;return{x:awX0()+c*P+P*.18+r*P*.06,y:shTop+r*Ph,w:P,h:Ph}}
function updateDolls(dt){
  if(!S.dolls.length)return;
  const idx=[];for(let i=0;i<6;i++)if(S.roof.patches[i])idx.push(i);
  idx.sort((a,b)=>S.roof.patches[b].shade-S.roof.patches[a].shade);
  S.dolls.forEach((d,k)=>{
    let tx,ty;
    if(idx.length){const pi=idx[k%idx.length];const sr=shadowRect(pi);const sub=Math.floor(k/idx.length);tx=sr.x+sr.w*(.5+(sub?.25:0)*(k%2?1:-1));ty=sr.y+sr.h*.85}
    else{tx=W/2+(k-1)*60;ty=LY.pic.footY}
    d.tx=tx;d.ty=ty;
    const dd=dist(d.x,d.y,tx,ty);
    if(d.state==='sit'&&dd>20){d.state='walk';d.mat=false}
    if(d.state==='walk'){
      if(dd<4){d.state='sit';d.mat=true;d.sitT=0;SFX.hop()}
      else{const sp=Math.min(dd,90*dt);d.x+=(tx-d.x)/dd*sp;d.y+=(ty-d.y)/dd*sp;d.ph+=dt*9;if(Math.abs(tx-d.x)>1)d.face=tx>d.x?1:-1}
    }
    if(d.hop>0)d.hop=Math.max(0,d.hop-dt*2.5);
    if(d.sitT!=null)d.sitT+=dt;
  });
}

function render(){

  if(ct>.001){ctx.save();ctx.translate(0,(ct-1)*H);drawPic();ctx.restore()}

  // 飛んでいる布
  for(const g of S.ghosts){const k=easeInOut(g.t);const x=lerp(g.x,g.tx,k),y=lerp(g.y,g.ty,k)-Math.sin(k*Math.PI)*30,s=lerp(g.s,g.ts,k);ctx.save();ctx.globalAlpha=1-k*.5;ctx.drawImage(g.pat.comp,x,y,s,s);ctx.restore()}

      const sk=sw*(row+1)*.5;
      ctx.save();ctx.transform(1,0,sk*.004,1,0,0);
      const ha=hintAmt('patchSwap');
      if(p){ctx.drawImage(p.comp,r.x,yy,r.w,hh+.5);const fl=(S.roof.flash&&S.roof.flash[i])||0;if(fl>0){ctx.fillStyle=`rgba(255,250,230,${fl*.4})`;ctx.fillRect(r.x,yy,r.w,hh)}
        const lg=ctx.createLinearGradient(0,yy,0,yy+hh);lg.addColorStop(0,'rgba(255,250,235,.1)');lg.addColorStop(1,'rgba(40,25,10,.18)');ctx.fillStyle=lg;ctx.fillRect(r.x,yy,r.w,hh);
        if(ha>0&&i===0){ctx.fillStyle=`rgba(255,236,190,${.25*ha*(.5+.5*Math.sin(S.time*5))})`;ctx.fillRect(r.x,yy,r.w,hh)}}
      else{ctx.strokeStyle='rgba(200,185,150,.9)';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(r.x,yy);ctx.lineTo(r.x+r.w,yy+hh);ctx.moveTo(r.x+r.w,yy);ctx.lineTo(r.x,yy+hh);ctx.stroke();const wg=S.wiggles['patch'+i]||0;ctx.strokeRect(r.x+2+wg*3*Math.sin(S.time*30),yy+2,r.w-4,hh-4)}
      ctx.restore();
    }
    // 縫い目
    ctx.strokeStyle='rgba(70,45,25,.75)';ctx.lineWidth=1.3;ctx.setLineDash([4,3]);
    for(let c=1;c<3;c++){ctx.beginPath();ctx.moveTo(ax+c*P,top);ctx.lineTo(ax+c*P,top+pc.awH*u);ctx.stroke()}
    ctx.beginPath();ctx.moveTo(ax,top+P*u);ctx.lineTo(ax+pc.awW,top+P*u);ctx.stroke();ctx.setLineDash([]);
    // すそ飾り
    const vb=top+pc.awH*u;const sc=12;
    for(let k=0;k<sc;k++){const x=ax+k*pc.awW/sc;const yv=vb+Math.sin(S.time*3+k*.7)*1.5;const g=ctx.createLinearGradient(0,yv,0,yv+P*.16);g.addColorStop(0,'#2c4470');g.addColorStop(1,'#1d2d4c');ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(x,yv);ctx.lineTo(x+pc.awW/sc,yv);ctx.arc(x+pc.awW/sc/2,yv,pc.awW/sc/2,0,Math.PI);ctx.closePath();ctx.fill()}
    ctx.fillStyle='rgba(40,25,10,.4)';ctx.fillRect(ax,top-3,pc.awW,4);
    ctx.restore();
  }
  for(const d of ds)drawDoll(d);
  // 工房へ戻る角（取っ手）
  const cr=pc.corner;const ha=hintAmt('corner');const bob=ha*Math.sin(S.time*5)*.15;
  ctx.save();ctx.beginPath();rr(ctx,cr.x,cr.y,cr.w,cr.h,10);ctx.clip();
  ctx.drawImage(BG_WORK,0,0,BG_WORK.width*.3,BG_WORK.height*.2,cr.x,cr.y,cr.w,cr.h);
  ctx.fillStyle='rgba(40,25,10,.25)';ctx.fillRect(cr.x,cr.y,cr.w,cr.h);
  const ws=WHEEL_SP.width/DPR,R2=Math.min(cr.w,cr.h)*.42;
  ctx.save();ctx.translate(cr.x+cr.w*.55,cr.y+cr.h*.55);ctx.rotate(S.wheel.angle+bob);ctx.drawImage(WHEEL_SP,-R2,-R2,R2*2,R2*2);ctx.restore();
  ctx.restore();
  ctx.strokeStyle='rgba(60,35,15,.8)';ctx.lineWidth=3;rr(ctx,cr.x,cr.y,cr.w,cr.h,10);ctx.stroke();
  if(ha>0){const g=ctx.createRadialGradient(cr.x+cr.w/2,cr.y+cr.h/2,4,cr.x+cr.w/2,cr.y+cr.h/2,cr.w);g.addColorStop(0,`rgba(255,236,190,${.35*ha})`);g.addColorStop(1,'rgba(255,236,190,0)');ctx.fillStyle=g;ctx.fillRect(cr.x-20,cr.y-20,cr.w+40,cr.h+40)}
}
function drawMat(d){
  const s=d.s;const x=d.x,y=d.y;ctx.save();ctx.translate(x,y);
  ctx.fillStyle='rgba(20,30,10,.25)';ctx.beginPath();ctx.ellipse(2,2,s*1.05,s*.3,0,0,TAU);ctx.fill();
  ctx.beginPath();ctx.moveTo(-s*.95,-s*.22);ctx.lineTo(s*.85,-s*.22);ctx.lineTo(s,s*.2);ctx.lineTo(-s*.8,s*.2);ctx.closePath();
  const g=ctx.createLinearGradient(0,-s*.22,0,s*.2);g.addColorStop(0,'#bfa36f');g.addColorStop(1,'#8f7444');ctx.fillStyle=g;ctx.fill();
  ctx.save();ctx.clip();for(let k=-6;k<7;k++){ctx.fillStyle=k%3===0?'rgba(140,40,30,.7)':'rgba(255,240,200,.12)';ctx.fillRect(-s,k*s*.035,s*2,s*.018)}ctx.restore();
  ctx.restore();
}
function drawDoll(d){
  const s=d.s;const sit=d.state==='sit';const hop=Math.sin(d.hop*Math.PI)*s*.4;
  const bob=sit?0:Math.abs(Math.sin(d.ph))*s*.08;
  ctx.save();ctx.translate(d.x,d.y-bob-hop);ctx.scale(d.face,1);
  if(!sit){ctx.fillStyle='rgba(20,30,10,.25)';ctx.beginPath();ctx.ellipse(0,bob+hop+2,s*.35,s*.1,0,0,TAU);ctx.fill()}
  const lin='#e2d4b6';
  // 脚
  ctx.lineCap='round';ctx.strokeStyle='#cbbd9e';ctx.lineWidth=s*.13;
  if(sit){ctx.beginPath();ctx.moveTo(-s*.08,-s*.15);ctx.lineTo(s*.35,-s*.05);ctx.moveTo(s*.05,-s*.15);ctx.lineTo(s*.42,-s*.1);ctx.stroke()}
  else{const sw=Math.sin(d.ph)*s*.12;ctx.beginPath();ctx.moveTo(-s*.07,-s*.4);ctx.lineTo(-s*.07+sw,0);ctx.moveTo(s*.07,-s*.4);ctx.lineTo(s*.07-sw,0);ctx.stroke()}
  // 服
  const bodyY=sit?-s*.15:-s*.35;
  ctx.save();ctx.beginPath();ctx.moveTo(-s*.14,bodyY-s*.5);ctx.lineTo(s*.14,bodyY-s*.5);ctx.lineTo(s*.28,bodyY);ctx.lineTo(-s*.28,bodyY);ctx.closePath();ctx.clip();
  ctx.drawImage(FAB[d.kind].comp,0,0,160,160,-s*.3,bodyY-s*.52,s*.6,s*.6);
  const g=ctx.createLinearGradient(-s*.3,0,s*.3,0);g.addColorStop(0,'rgba(0,0,0,.28)');g.addColorStop(.4,'rgba(255,255,255,.08)');g.addColorStop(1,'rgba(0,0,0,.3)');ctx.fillStyle=g;ctx.fillRect(-s*.3,bodyY-s*.55,s*.6,s*.6);
  ctx.restore();
  // 腕
  ctx.strokeStyle='#d6c8a8';ctx.lineWidth=s*.1;ctx.beginPath();ctx.moveTo(-s*.12,bodyY-s*.42);ctx.lineTo(-s*.26,bodyY-s*.15+(sit?0:Math.sin(d.ph+1)*s*.05));ctx.moveTo(s*.12,bodyY-s*.42);ctx.lineTo(s*.26,bodyY-s*.15);ctx.stroke();
  if(!sit){ // 丸めた敷物
    ctx.save();ctx.translate(s*.22,bodyY-s*.2);ctx.rotate(-.3);const mg=ctx.createLinearGradient(0,-s*.07,0,s*.07);mg.addColorStop(0,'#cdb27c');mg.addColorStop(1,'#836a3e');ctx.fillStyle=mg;rr(ctx,-s*.06,-s*.07,s*.32,s*.14,s*.06);ctx.fill();ctx.fillStyle='rgba(140,40,30,.6)';ctx.fillRect(s*.06,-s*.07,s*.03,s*.14);ctx.restore();
  }
  // 頭（顔なし・布の縫い目）
  const hy=bodyY-s*.66;const hg=ctx.createRadialGradient(-s*.06,hy-s*.06,s*.02,0,hy,s*.2);hg.addColorStop(0,'#f1e6cf');hg.addColorStop(1,'#bfae8b');
  ctx.fillStyle=hg;ctx.beginPath();ctx.arc(0,hy,s*.18,0,TAU);ctx.fill();
  ctx.strokeStyle='rgba(110,85,55,.6)';ctx.lineWidth=1;ctx.setLineDash([2,2]);ctx.beginPath();ctx.arc(0,hy,s*.18,-1.2,1.2);ctx.stroke();ctx.setLineDash([]);
  // 毛糸の髪
  ctx.strokeStyle=d.kind==='denim'?'#6b3f1f':d.kind==='check'?'#3a2616':'#9a6a30';ctx.lineWidth=s*.04;
  for(let k=0;k<6;k++){const a=-Math.PI+.25+k*.5;ctx.beginPath();ctx.arc(Math.cos(a)*s*.15,hy+Math.sin(a)*s*.15,s*.05,0,TAU);ctx.stroke()}
  ctx.restore();
}

// ============================================================
//  ループ・可視状態
// ============================================================
let raf=0,last=0,running=false;
function loop(now){
  raf=0;if(!running)return;
  let dt=(now-last)/1000;last=now;if(!(dt>0))dt=1/60;dt=Math.min(dt,.05);
  try{update(dt);render()}catch(err){if(!loop.errLogged){loop.errLogged=1;logEv('error',{m:String(err&&err.message)})}}
  raf=requestAnimationFrame(loop);
}
function start(){if(running)return;running=true;last=performance.now();raf=requestAnimationFrame(loop)}
function stop(){running=false;if(raf)cancelAnimationFrame(raf);raf=0}
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){stop();cancelAct();setRumble(0);if(AC&&AC.state==='running'){try{AC.suspend()}catch(e){}}logEv('hidden',{})}
  else{if(AC){try{AC.resume()}catch(e){}}S.wheel.speed=0;start();logEv('visible',{})}
});
window.addEventListener('pagehide',()=>{stop();if(AC){try{AC.suspend()}catch(e){}}});
window.addEventListener('pageshow',()=>{if(!document.hidden)start()});
let rzT=0;
function resize(){
  W=window.innerWidth;H=window.innerHeight;DPR=Math.min(2,window.devicePixelRatio||1);
  canvas.width=Math.round(W*DPR);canvas.height=Math.round(H*DPR);
  computeLayout();buildSprites();
  S.hand.x=LY.handRest.x;S.hand.y=LY.handRest.y;S.hand.ang=LY.handRest.ang;
  for(const d of S.dolls){d.s=LY.pic.P*.55;d.y=clamp(d.y,LY.pic.horizonY,LY.pic.footY+20)}
  S.roof.tx=clamp(S.roof.tx,-LY.pic.slideMax,LY.pic.slideMax);S.roof.x=S.roof.tx;
}
window.addEventListener('resize',()=>{clearTimeout(rzT);cancelAct();rzT=setTimeout(()=>{resize();render()},120)});
window.addEventListener('orientationchange',()=>{clearTimeout(rzT);cancelAct();rzT=setTimeout(()=>{resize();render()},250)});

// テスト・検証用の読み取り口（画面には出ない）
window.__gf={S,get LY(){return LY},knob:()=>knobPos(),hankyTop:()=>hankyTopY(),layerRect:l=>layerRect(l),patchRect:i=>patchRect(i),awX0:()=>awX0(),hintPoint:id=>hintPoint(id)};

initFabrics();
resize();
resetGame();
S.hand.x=LY.handRest.x;S.hand.y=LY.handRest.y;
start();
})();
</script>
