<script>
(() => {
'use strict';
/* =====================================================================
   するるん！むすびめダックスとガラガラ犬小屋  (fr-261029-3 / cel_comic)
   結び目を引く → 引いた輪郭が積み木になって土台へ落ちる → 積み方で崩れ・橋・窓
   → 耳の結び目で笑って尻尾が積み木を押す → 全部ほどけると小屋が完成して昼寝
   ===================================================================== */
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const saEl = document.getElementById('sa');

/* ---------- utils ---------- */
const PI = Math.PI, TAU = PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const ease = t => t <= 0 ? 0 : t >= 1 ? 1 : t * t * (3 - 2 * t);
const easeOutBack = t => { t = clamp(t, 0, 1); const c = 1.7; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };
const rnd = (a, b) => a + Math.random() * (b - a);
const rndi = (a, b) => Math.floor(rnd(a, b + 1));
const hyp = Math.hypot;

/* ---------- palette (cel) ---------- */
const INK = '#1d1410';
const C = {
  room: '#f7eed6', roomShade: '#efe0bf', floor: '#ead6ab', floorShade: '#d9bf8c',
  dog: '#e2512b', dogShade: '#b23a1d', dogLight: '#ff9a74', belly: '#f6c9a0',
  ear: '#7c4321', earShade: '#5a2e15', nose: INK,
  base: '#c49a6c', baseShade: '#9b7249', hole: '#4a3324',
  wall: '#f0cf96', wallShade: '#d7ad6a', door: '#3b2619',
  sky: '#9fd6f2', white: '#ffffff'
};
// block colors: 0 yellow, 1 blue, 2 mint
const BC = [
  { f: '#f6c22c', s: '#d29a0e', l: '#fff0a6' },
  { f: '#3d7ed8', s: '#2a5aa6', l: '#a9cdfb' },
  { f: '#62d0a8', s: '#3aa682', l: '#c8f6e4' }
];

/* ---------- grid / world ---------- */
const COLS = 11, ROWS = 10, CELL = 29;
const BW = 30; // body tube width
let W = 0, H = 0, dpr = 1, sc = 1, worldW = 420, worldH = 760;
let groundY = 700, topY = 180, gridX0 = 0, gridX1 = 0, cxw = 210;
const safe = { t: 0, r: 0, b: 0, l: 0 };

function readSafe() {
  const cs = getComputedStyle(saEl);
  safe.t = parseFloat(cs.paddingTop) || 0; safe.r = parseFloat(cs.paddingRight) || 0;
  safe.b = parseFloat(cs.paddingBottom) || 0; safe.l = parseFloat(cs.paddingLeft) || 0;
}
function layout() {
  W = Math.max(1, window.innerWidth); H = Math.max(1, window.innerHeight);
  dpr = Math.min(2, window.devicePixelRatio || 1);
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  readSafe();
  sc = Math.min(W / 420, H / 600);
  worldW = W / sc; worldH = H / sc;
  cxw = worldW / 2 + (safe.l - safe.r) / sc / 2;
  groundY = worldH - Math.max(46, safe.b / sc + 30);
  topY = Math.max(safe.t / sc + 96, groundY - 400);
  gridX0 = cxw - COLS * CELL / 2; gridX1 = gridX0 + COLS * CELL;
}
const cellX = c => gridX0 + c * CELL;
const cellY = r => groundY - (r + 1) * CELL; // top edge of row r

/* ---------- state ---------- */
const S = {
  mode: 'play', modeT: 0, round: 0, time: 0,
  knots: [], blocks: new Map(), occ: new Int32Array(COLS * ROWS), nextId: 1,
  falling: [], parts: [], fx: [],
  drag: null, target: null, idleT: 0, demo: null, demoUsed: false,
  lastCollapseSide: 0, earDone: false, earFirst: null, earPending: 0,
  house: null, bed: null, sleepPose: 1, events: [], stats: {},
  peek: { idx: -1, t: 0, phase: 'rest', wait: 2, list: [] },
  saveOK: null, saveState: 'none', trans: null, firstTouch: false,
  decoWob: [0, 0, 0]
};
const dog = {
  worry: 1, tilt: 0, surprise: 0, laugh: 0, earTw: 0, blink: 0, blinkT: 2,
  gx: 0, gy: 0, wagAmp: 0.15, wagF: 3, tailReach: 0, pushT: -1, smile: 0,
  sleep: 0, yawn: 0, headPos: null
};
function logEv(type, data) {
  S.events.push({ t: +S.time.toFixed(2), type, data: data || null, round: S.round });
  if (S.events.length > 400) S.events.shift();
  S.stats[type] = (S.stats[type] || 0) + 1;
}

/* ---------- persistence (bed pattern = last roof) ---------- */
const SAVE_KEY = 'gf261103-5.bed.v1';
const DEFAULT_BED = { p: [0, 1, 0, 1, 0, 1], s: 0, std: true };
function validBed(o) {
  if (!o || typeof o !== 'object' || !Array.isArray(o.p)) return false;
  if (o.p.length < 3 || o.p.length > 12) return false;
  for (const v of o.p) if (!Number.isInteger(v) || v < 0 || v > 2) return false;
  if (!Number.isInteger(o.s) || o.s < 0 || o.s > 2) return false;
  return true;
}
function loadBed() {
  let raw = null;
  try { raw = window.localStorage.getItem(SAVE_KEY); }
  catch (e) { S.saveState = 'readError'; return { ...DEFAULT_BED, p: DEFAULT_BED.p.slice() }; }
  if (raw == null) { S.saveState = 'first'; return { ...DEFAULT_BED, p: DEFAULT_BED.p.slice() }; }
  try {
    const o = JSON.parse(raw);
    if (validBed(o)) { S.saveState = 'restored'; return { p: o.p.slice(), s: o.s, std: false }; }
  } catch (e) { /* fallthrough */ }
  S.saveState = 'corrupt';
  try { window.localStorage.removeItem(SAVE_KEY); } catch (e) { /* ignore */ }
  return { ...DEFAULT_BED, p: DEFAULT_BED.p.slice() };
}
function saveBed(b) {
  try { window.localStorage.setItem(SAVE_KEY, JSON.stringify({ p: b.p, s: b.s })); S.saveOK = true; }
  catch (e) { S.saveOK = false; }
}

/* ---------- audio (Web Audio synthesis) ---------- */
let ac = null, master = null, noiseBuf = null, voices = 0, stretchOsc = null;
const MAX_VOICES = 18;
function initAudio() {
  if (ac) { if (ac.state === 'suspended') ac.resume().catch(() => {}); return; }
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  try {
    ac = new AC();
    master = ac.createGain(); master.gain.value = 0.6;
    const comp = ac.createDynamicsCompressor();
    comp.threshold.value = -14; comp.ratio.value = 4;
    master.connect(comp); comp.connect(ac.destination);
    const len = ac.sampleRate * 1;
    noiseBuf = ac.createBuffer(1, len, ac.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    // unlock with a silent blip
    const o = ac.createOscillator(), g = ac.createGain(); g.gain.value = 0;
    o.connect(g); g.connect(master); o.start(); o.stop(ac.currentTime + 0.02);
    if (ac.state === 'suspended') ac.resume().catch(() => {});
  } catch (e) { ac = null; }
}
function tone(freq, dur, o = {}) {
  if (!ac || voices >= MAX_VOICES) return;
  const t0 = ac.currentTime + (o.delay || 0);
  const osc = ac.createOscillator();
  osc.type = o.type || 'sine';
  osc.frequency.setValueAtTime(freq, t0);
  if (o.to) osc.frequency.exponentialRampToValueAtTime(Math.max(20, o.to), t0 + (o.slideT || dur));
  const g = ac.createGain();
  const vol = o.vol == null ? 0.2 : o.vol, at = o.attack || 0.006;
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(vol, t0 + at);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  let node = osc;
  if (o.vib) {
    const l = ac.createOscillator(), lg = ac.createGain();
    l.frequency.value = o.vibF || 9; lg.gain.value = o.vib;
    l.connect(lg); lg.connect(osc.frequency); l.start(t0); l.stop(t0 + dur + 0.05);
  }
  if (o.bp) {
    const f = ac.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = o.bp; f.Q.value = o.q || 4;
    node.connect(f); node = f;
  }
  node.connect(g); g.connect(master);
  voices++;
  osc.onended = () => { voices--; };
  osc.start(t0); osc.stop(t0 + dur + 0.05);
}
function noise(dur, o = {}) {
  if (!ac || !noiseBuf || voices >= MAX_VOICES) return;
  const t0 = ac.currentTime + (o.delay || 0);
  const src = ac.createBufferSource(); src.buffer = noiseBuf;
  const f = ac.createBiquadFilter(); f.type = o.ft || 'bandpass';
  f.frequency.setValueAtTime(o.f || 1200, t0);
  if (o.fTo) f.frequency.exponentialRampToValueAtTime(o.fTo, t0 + dur);
  f.Q.value = o.q || 1;
  const g = ac.createGain();
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(o.vol || 0.15, t0 + (o.attack || 0.005));
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  src.connect(f); f.connect(g); g.connect(master);
  voices++; src.onended = () => { voices--; };
  src.start(t0, Math.random() * 0.5); src.stop(t0 + dur + 0.05);
}
const SFX = {
  squish() { tone(520, 0.14, { to: 300, vol: 0.18, type: 'triangle' }); noise(0.08, { f: 900, vol: 0.05 }); },
  open() { tone(330, 0.22, { to: 520, vol: 0.12, type: 'sine', delay: 0.05 }); },
  untie(cost) { // shururun
    const base = 700 - cost * 60;
    for (let i = 0; i < 3; i++) tone(base * (1 + i * 0.18), 0.12, { to: base * (1.4 + i * 0.2), vol: 0.1, type: 'sine', delay: i * 0.055, vib: 30 });
  },
  untieAll() { for (let i = 0; i < 5; i++) tone(500 + i * 120, 0.14, { to: 900 + i * 150, vol: 0.09, delay: i * 0.05, vib: 40 }); },
  land(w, h) { // small = high, long = low
    const cells = w * h;
    const f = cells <= 1 ? 820 : w >= 5 ? 170 : w >= 4 ? 210 : w >= 3 ? 260 : 380;
    tone(f, 0.16 + cells * 0.02, { to: f * 0.7, vol: 0.22, type: 'triangle' });
    noise(0.07, { f: f * 3, vol: 0.08, q: 2 });
  },
  tick() { tone(1200, 0.05, { vol: 0.05, type: 'square', bp: 1500 }); },
  hole() { tone(1318, 0.18, { vol: 0.15, type: 'sine' }); tone(1975, 0.3, { vol: 0.13, type: 'sine', delay: 0.07 }); },
  bridge() { [523, 659, 784, 1046].forEach((f, i) => tone(f, 0.22, { vol: 0.12, type: 'sine', delay: i * 0.07 })); },
  support() { tone(988, 0.12, { vol: 0.1 }); tone(1480, 0.16, { vol: 0.08, delay: 0.05 }); },
  window() { tone(1568, 0.5, { vol: 0.12, type: 'sine' }); tone(2093, 0.6, { vol: 0.08, delay: 0.1 }); tone(600, 0.25, { to: 1100, vol: 0.06, delay: 0.25 }); },
  collapse() {
    noise(0.7, { f: 300, fTo: 120, vol: 0.12, q: 0.7, ft: 'lowpass' });
    for (let i = 0; i < 9; i++) tone(rnd(180, 520), 0.09, { to: rnd(120, 200), vol: 0.13, type: 'triangle', delay: i * 0.07 + rnd(0, 0.03) });
  },
  laugh() {
    const ps = [560, 520, 540, 480, 500, 440];
    ps.forEach((p, i) => {
      tone(p, 0.11, { to: p * 0.86, vol: 0.18, type: 'sawtooth', bp: 1100, q: 3, delay: i * 0.13, vib: 18, vibF: 25 });
      tone(p * 2, 0.08, { to: p * 1.7, vol: 0.04, type: 'sine', delay: i * 0.13 });
    });
  },
  swish() { noise(0.25, { f: 2500, fTo: 600, vol: 0.09, q: 0.8 }); },
  tilt() { tone(600, 0.12, { to: 760, vol: 0.06 }); },
  surprise() { tone(400, 0.16, { to: 900, vol: 0.09, type: 'sine' }); },
  roofKachi(i) { tone(880 + i * 40, 0.07, { vol: 0.08, type: 'square', bp: 1800, delay: i * 0.06 }); },
  complete() { [523, 659, 784, 1046, 1318].forEach((f, i) => { tone(f, 0.35, { vol: 0.12, delay: i * 0.09 }); tone(f / 2, 0.35, { vol: 0.05, type: 'triangle', delay: i * 0.09 }); }); },
  stuck() { tone(300, 0.3, { to: 520, vol: 0.12, type: 'sine', vib: 40, vibF: 14 }); },
  curl() { tone(400, 0.35, { to: 1200, vol: 0.09, type: 'sine' }); noise(0.3, { f: 1800, fTo: 500, vol: 0.05 }); },
  snore() { noise(1.0, { f: 300, vol: 0.035, attack: 0.5, ft: 'lowpass' }); },
  yawn() { tone(260, 0.8, { to: 520, slideT: 0.4, vol: 0.09, type: 'triangle' }); tone(500, 0.5, { to: 230, vol: 0.06, type: 'triangle', delay: 0.4 }); },
  whoosh() { noise(0.6, { f: 400, fTo: 2000, vol: 0.07 }); },
  tieUp() { for (let i = 0; i < 6; i++) tone(900 - i * 80, 0.1, { to: 700 - i * 70, vol: 0.06, delay: i * 0.08, vib: 20 }); },
  boop() { tone(700, 0.08, { to: 600, vol: 0.06 }); }
};
function stretchSound(on, dist) {
  if (!ac) return;
  try {
    if (on) {
      if (!stretchOsc) {
        const o = ac.createOscillator(), g = ac.createGain();
        o.type = 'sine'; o.frequency.value = 260; g.gain.value = 0.0001;
        g.gain.exponentialRampToValueAtTime(0.045, ac.currentTime + 0.05);
        o.connect(g); g.connect(master); o.start();
        stretchOsc = { o, g };
      }
      stretchOsc.o.frequency.setTargetAtTime(240 + dist * 1.1, ac.currentTime, 0.04);
    } else if (stretchOsc) {
      const s = stretchOsc; stretchOsc = null;
      s.g.gain.setTargetAtTime(0.0001, ac.currentTime, 0.03);
      s.o.stop(ac.currentTime + 0.2);
    }
  } catch (e) { stretchOsc = null; }
}

/* ---------- particles / fx ---------- */
const MAX_PARTS = 90, MAX_FX = 5;
function burst(x, y, n, colors, spd = 160, kind = 'dot') {
  for (let i = 0; i < n; i++) {
    if (S.parts.length >= MAX_PARTS) S.parts.shift();
    const a = rnd(0, TAU), v = rnd(spd * 0.4, spd);
    S.parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - spd * 0.3, life: 0, max: rnd(0.4, 0.8), sz: rnd(3, 6), col: colors[i % colors.length], kind, rot: rnd(0, TAU) });
  }
}
function speedLines(x, y, r = 70) {
  if (S.fx.length >= MAX_FX) S.fx.shift();
  S.fx.push({ kind: 'lines', x, y, r, t: 0, max: 0.45, seed: Math.random() * 100 });
}

/* ---------- grid helpers ---------- */
const occAt = (c, r) => (c < 0 || c >= COLS || r < 0 || r >= ROWS) ? -1 : S.occ[r * COLS + c];
function setOcc(b, v) { for (let y = 0; y < b.h; y++) for (let x = 0; x < b.w; x++) S.occ[(b.r + y) * COLS + b.c + x] = v; }
function heightAt(c) { for (let r = ROWS - 1; r >= 0; r--) if (S.occ[r * COLS + c]) return r + 1; return 0; }
function landRow(c, w) { let m = 0; for (let x = c; x < c + w; x++) m = Math.max(m, heightAt(x)); return m; }
function freeCells(c, r, w, h, selfId) {
  if (c < 0 || c + w > COLS || r < 0 || r + h > ROWS) return false;
  for (let y = r; y < r + h; y++) for (let x = c; x < c + w; x++) { const v = S.occ[y * COLS + x]; if (v && v !== selfId) return false; }
  return true;
}
function supportCols(b) {
  if (b.r === 0) { const a = []; for (let x = 0; x < b.w; x++) a.push(b.c + x); return a; }
  const a = [];
  for (let x = b.c; x < b.c + b.w; x++) { const v = occAt(x, b.r - 1); if (v > 0 && v !== b.id) a.push(x); }
  return a;
}
function unstableDir(b) {
  const sp = supportCols(b);
  if (!sp.length) return 0;
  const com = b.c + b.w / 2, lo = sp[0], hi = sp[sp.length - 1] + 1;
  if (com < lo - 0.001) return -1;
  if (com > hi + 0.001) return 1;
  return 0;
}
function topBlockAt(c) { const h = heightAt(c); if (!h) return null; return S.blocks.get(occAt(c, h - 1)) || null; }
function blockVisualSnap(b) { // remember visual start for tween
  if (!b.anim) b.anim = { fx: b.gx, fy: b.gy, t: 0, dur: 0.3, delay: 0, spin: 0, arc: 0 };
}
function moveBlock(b, nc, nr) { setOcc(b, 0); b.c = nc; b.r = nr; setOcc(b, b.id); }

/* resolve gravity / balance / tower collapse. Returns info */
function resolve(opt = {}) {
  let collapse = false, collapseCol = -1, iter = 0, changed = true;
  const moved = new Set();
  let collapseZone = null;
  const startPos = new Map();
  const remember = b => { if (!startPos.has(b.id)) startPos.set(b.id, { c: b.c, r: b.r }); moved.add(b); };
  while (changed && iter++ < 400) {
    changed = false;
    const list = [...S.blocks.values()].filter(b => b.type !== 'base').sort((a, b) => a.r - b.r);
    // gravity
    for (const b of list) {
      while (b.r > 0 && !supportCols(b).length) { remember(b); moveBlock(b, b.c, b.r - 1); changed = true; }
    }
    // balance: overhanging blocks tip toward overhang and slide off
    for (const b of list) {
      const d = unstableDir(b);
      if (!d) continue;
      let ok = false;
      for (let k = 0; k < b.w + 1; k++) {
        if (!freeCells(b.c + d, b.r, b.w, b.h, b.id)) break;
        remember(b); moveBlock(b, b.c + d, b.r); ok = true; b.tumble = d;
        if (!supportCols(b).length) break;
      }
      if (ok) { changed = true; break; }
    }
    if (changed) continue;
    // tower rule: too tall compared with neighbour -> topple (staircase)
    const th = collapse ? 2 : 3;
    const hs = []; for (let c = 0; c < COLS; c++) hs.push(heightAt(c));
    let best = null;
    for (let c = 0; c < COLS; c++) {
      if (collapseZone && (c < collapseZone[0] || c > collapseZone[1])) continue;
      for (const n of [c - 1, c + 1]) {
        if (n < 0 || n >= COLS) continue;
        const diff = hs[c] - hs[n];
        if (diff >= th && (!best || diff > best.diff)) best = { c, n, diff };
      }
    }
    if (best) {
      const b = topBlockAt(best.c);
      if (b && b.type !== 'base') {
        const d = best.n - best.c;
        const save = { c: b.c, r: b.r };
        let fell = false, steps = 0;
        for (let k = 0; k < b.w + 1; k++) {
          if (!freeCells(b.c + d, b.r, b.w, b.h, b.id)) break;
          moveBlock(b, b.c + d, b.r); steps++;
          if (!supportCols(b).length || unstableDir(b)) { fell = true; break; }
        }
        if (fell) {
          if (!startPos.has(b.id)) startPos.set(b.id, save);
          moved.add(b); b.tumble = d; changed = true;
          if (!collapse) { collapse = true; collapseCol = best.c; collapseZone = [Math.max(0, best.c - 4), Math.min(COLS - 1, best.c + 4)]; }
        } else if (steps) { moveBlock(b, save.c, save.r); }
        if (!fell) {
          // mark this column handled to avoid infinite retry: try the next best via skipping
          // (no change → loop ends)
        }
      }
    }
  }
  // setup tweens
  let k = 0;
  for (const b of moved) {
    const sp = startPos.get(b.id);
    if (!sp || (sp.c === b.c && sp.r === b.r)) { b.tumble = 0; continue; }
    const delay = collapse ? 0.18 + (k++) * 0.05 : (opt.delay || 0);
    b.anim = { fx: b.gx, fy: b.gy, t: 0, dur: 0.32 + Math.abs(sp.r - b.r) * 0.04, delay, spin: (b.tumble || 0) * (b.w === 1 ? PI / 2 : PI / 6), arc: b.tumble ? 0.6 : 0 };
    b.tumble = 0;
  }
  return { collapse, collapseCol, moved };
}

/* ---------- block creation ---------- */
function makeBlock(type, c, r, w, h, col) {
  const b = { id: S.nextId++, type, c, r, w, h, col, gx: c, gy: r, anim: null, wob: 0, flash: 0, isBridge: false };
  S.blocks.set(b.id, b); setOcc(b, b.id);
  return b;
}
function newFoundation() {
  S.blocks.clear(); S.occ.fill(0); S.falling.length = 0;
  // pillars (bridge supports) with a gap
  const gap = Math.random() < 0.65 ? 2 : 3;
  const pl = rndi(2, COLS - 3 - gap);
  const pr = pl + gap + 1;
  // holes: 3 single holes, not under pillars, not adjacent

/* ---------- bed ---------- */
function drawBed(x, y, w, bed, alpha = 1) {

/* ---------- guidance target & idle demo ---------- */
function pickTarget() {
  if (S.mode !== 'play') return null;
  const live = S.knots.filter(k => !k.untied);
  if (!live.length) return null;
  const big = live.find(k => k.kind === 'big');
  if (big && !big.loosened) return big;
  let pool = live.filter(k => k.kind !== 'ear');
  if (!pool.length) return live[0];
  if (S.lastCollapseSide) {
    const opp = pool.filter(k => Math.sign(knotX(k) - cxw) === -S.lastCollapseSide);
    if (opp.length) pool = opp;
  }
  pool.sort((a, b) => b.units - a.units || Math.abs(knotX(a) - cxw) - Math.abs(knotX(b) - cxw));
  return pool[0];
}

/* ---------- update ---------- */
function update(dt) {
  S.time += dt;
  updateMode(dt);
  // knots
  for (const k of S.knots) {
    const tgt = knotRadiusTarget(k);
    k.rv += (tgt - k.rv) * Math.min(1, dt * 10);
    if (k.untied && k.rv < 0.8) k.rv = 0;
    k.sq = Math.max(0, k.sq - dt * 4);
    k.flash = Math.max(0, k.flash - dt * 2);
  }
  // target / idle demo
  S.target = pickTarget();
  if (S.mode === 'play' && !S.drag && !S.falling.length) S.idleT += dt; else if (S.drag) S.idleT = 0;
  if (S.mode === 'play' && S.idleT > 4 && !S.demo && !S.demoUsed && S.target) {
    S.demo = { k: S.target, t: 0 }; S.demoUsed = true; logEv('demo');
  }
  if (S.demo) { S.demo.t += dt; if (S.demo.t > 1.9 || S.mode !== 'play') S.demo = null; }
  // falling blocks
  for (let i = S.falling.length - 1; i >= 0; i--) {
    const f = S.falling[i];
    f.vy = Math.min(f.vy + 1500 * dt, 900);
    f.trail.unshift({ x: f.x, y: f.y }); if (f.trail.length > 4) f.trail.pop();
    f.y += f.vy * dt;
    const tx = cellX(f.tc);
    f.x += (tx - f.x) * Math.min(1, dt * 9);
    let lr = landRow(f.tc, f.w);
    const landTop = cellY(Math.min(ROWS - 1, lr + f.h - 1));
    if (f.y >= landTop) { f.x = tx; S.falling.splice(i, 1); landFalling(f); }
  }
  // block tweens
  for (const b of S.blocks.values()) {
    if (b.anim) {
      const a = b.anim;
      if (a.delay > 0) {
        a.delay -= dt; b.gx = a.fx; b.gy = a.fy;
        b.rotV = a.spin ? Math.sin(S.time * 30) * 0.05 + (a.spin > 0 ? 0.06 : -0.06) : 0;
      } else {
        a.t += dt; const u = clamp(a.t / a.dur, 0, 1);
        const e = u * u; // falling feel
        b.gx = lerp(a.fx, b.c, ease(u)); b.gy = lerp(a.fy, b.r, e) + Math.sin(u * PI) * a.arc;
        b.rotV = a.spin * Math.sin(u * PI) * 0.9;
        if (u >= 1) { b.anim = null; b.gx = b.c; b.gy = b.r; b.rotV = 0; b.squash = 0.6; if (Math.random() < 0.6) tone(rnd(300, 600), 0.06, { vol: 0.07, type: 'triangle' }); }
      }
    } else { b.gx = b.c; b.gy = b.r; }
    b.wob = Math.max(0, b.wob - dt * 2.2);
    b.flash = Math.max(0, b.flash - dt * 1.6);
    b.squash = Math.max(0, (b.squash || 0) - dt * 5);
  }
  // particles
  for (let i = S.parts.length - 1; i >= 0; i--) {
    const p = S.parts[i]; p.life += dt;
    if (p.life > p.max) { S.parts.splice(i, 1); continue; }
    p.vy += 400 * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.rot += dt * 6;
  }
  for (let i = S.fx.length - 1; i >= 0; i--) { const f = S.fx[i]; f.t += dt; if (f.t > f.max) S.fx.splice(i, 1); }
  for (let i = 0; i < S.decoWob.length; i++) S.decoWob[i] = Math.max(0, S.decoWob[i] - dt * 1.5);
  // dog
  dog.tilt = Math.max(0, dog.tilt - dt * 1.6);
  dog.surprise = Math.max(0, dog.surprise - dt * 1.2);
  dog.laugh = Math.max(0, dog.laugh - dt);
  dog.blinkT -= dt; if (dog.blinkT < 0) { dog.blink = 0.12; dog.blinkT = rnd(2, 4.5); }
  dog.blink = Math.max(0, dog.blink - dt);
  if (Math.random() < dt * 0.35) dog.earTw = 1;
  dog.earTw = Math.max(0, dog.earTw - dt * 3);
  const happy = 1 - dog.worry;
  dog.smile += ((S.mode === 'play' ? happy : 1) - dog.smile) * Math.min(1, dt * 2);
  if (dog.laugh <= 0) { dog.wagAmp += ((0.15 + happy * 0.35) - dog.wagAmp) * Math.min(1, dt * 1.5); dog.wagF += (3 + happy * 4 - dog.wagF) * Math.min(1, dt * 2); }
  if (dog.pushT >= 0) {
    dog.pushT += dt;
    dog.tailReach = Math.sin(clamp(dog.pushT / 1.2, 0, 1) * PI);
    if (!dog.pushed && dog.pushT > 0.4) { dog.pushed = true; tailPush(); }
    if (dog.pushT > 1.2) { dog.pushT = -1; dog.pushed = false; dog.tailReach = 0; }
  }
  if (S.earPending > 0) S.earPending -= dt;
  // window peeking
  updatePeek(dt);
}
function updatePeek(dt) {
  const P = S.peek;
  const wins = [...S.blocks.values()].filter(b => b.type === 'win' && !b.anim);
  if (S.mode !== 'play' || !wins.length) { P.phase = 'rest'; P.t = Math.max(0, P.t - dt * 3); P.amt = Math.max(0, (P.amt || 0) - dt * 3); return; }
  if (!wins.find(w => w.id === P.idx)) { P.idx = wins[0].id; }
  P.amt = P.amt || 0;
  P.t += dt;
  if (P.phase === 'rest') { P.amt = Math.max(0, P.amt - dt * 2.5); if (P.t > 2.6) { // next window
      const i = wins.findIndex(w => w.id === P.idx); P.idx = wins[(i + 1) % wins.length].id; P.phase = 'out'; P.t = 0; } }
  else if (P.phase === 'out') { P.amt = Math.min(1, P.amt + dt * 2.5); if (P.t > 2.4) { P.phase = 'rest'; P.t = 0; } }
  if (S.drag) { P.phase = 'rest'; }
}

/* ---------- render ---------- */
function exprNow() {
  const tg = S.target ? knotCenter(S.target) : (S.falling[0] ? { x: S.falling[0].x, y: S.falling[0].y } : { x: cxw, y: groundY - 60 });
  const hp = dog.headPos || neckPos();
  const dx = tg.x - hp.x, dy = tg.y - hp.y, d = hyp(dx, dy) || 1;
  return { worry: dog.worry, smile: dog.smile, laugh: dog.laugh, surprise: dog.surprise, blink: dog.blink, sleep: dog.sleep, gx: dx / d, gy: dy / d };
}
function drawBackground() {
  ctx.fillStyle = C.room; ctx.fillRect(0, 0, worldW, worldH);
  // soft wall stripes (cel two-tone)
  ctx.fillStyle = C.roomShade;
  for (let x = ((cxw % 60) - 60); x < worldW; x += 60) ctx.fillRect(x, 0, 24, groundY);
  // floor
  ctx.fillStyle = C.floor; ctx.fillRect(0, groundY, worldW, worldH - groundY);
  ctx.fillStyle = C.floorShade; ctx.fillRect(0, groundY, worldW, 8);

  // rug under the foundation
  ctx.beginPath(); ctx.ellipse(cxw, groundY + 14, COLS * CELL * 0.62, 12, 0, 0, TAU); ctx.fillStyle = '#f2b8a0'; ctx.fill(); ctx.lineWidth = 3.5; ctx.stroke();
  for (let i = 0; i < decos.length; i++) decos[i].draw(S.decoWob[i]);
}
function drawShelfBed() {
  if (!S.bed) return;
  const np = neckPos();
  const bx = np.x - 34, by = topY + 98;
  let alpha = 1, bxx = bx, byy = by;
  if (S.mode === 'assemble' || S.mode === 'enter' || S.mode === 'sleep') return;
  if (S.mode === 'wake') return;

  ctx.fillStyle = C.base; rrect(bxx - 46, byy + 7, 92, 9, 3); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(bxx + 30, byy + 16); ctx.lineTo(bxx + 40, byy + 34); ctx.stroke();

}
function drawFalling(f) {
  const cs = BC[f.col];
  ctx.save();
  for (let i = f.trail.length - 1; i >= 1; i--) {
    const t = f.trail[i];
    ctx.globalAlpha = 0.35 - i * 0.07; ctx.fillStyle = '#fff';
    ctx.fillRect(t.x, t.y - i * 4, f.w * CELL, f.h * CELL);
  }
  ctx.globalAlpha = 1;
  ctx.translate(f.x + f.w * CELL / 2, f.y + f.h * CELL / 2); ctx.rotate(f.rot * Math.sin(S.time * 12));
  // stretch while falling fast
  const st = clamp(f.vy / 900, 0, 1) * 0.12;
  ctx.scale(1 - st * 0.5, 1 + st);
  drawBlockDots(-f.w * CELL / 2, -f.h * CELL / 2, f.w, f.h, cs, f.kind === 'win' ? 'win' : 'x');
  ctx.restore();
}
function drawFx() {
  for (const f of S.fx) {
    const u = f.t / f.max;
    ctx.save(); ctx.translate(f.x, f.y);
    ctx.fillStyle = INK; ctx.globalAlpha = 0.85 * (1 - u);
    const n = 16;
    for (let i = 0; i < n; i++) {
      const a = i / n * TAU + f.seed;
      const r0 = f.r * (0.55 + u * 0.5), r1 = f.r * (1.1 + u * 0.7) + (i % 2) * 14;
      const w = 0.05;
      ctx.beginPath(); ctx.moveTo(Math.cos(a - w) * r0, Math.sin(a - w) * r0);
      ctx.lineTo(Math.cos(a) * r1, Math.sin(a) * r1); ctx.lineTo(Math.cos(a + w) * r0, Math.sin(a + w) * r0); ctx.fill();
    }
    ctx.restore();
  }
  for (const p of S.parts) {
    const a = 1 - p.life / p.max;
    ctx.globalAlpha = a; ctx.fillStyle = p.col;
    if (p.kind === 'star') {
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      ctx.beginPath(); for (let i = 0; i < 8; i++) { const r = i % 2 ? p.sz * 0.45 : p.sz * 1.3; ctx.lineTo(Math.cos(i * PI / 4) * r, Math.sin(i * PI / 4) * r); }
      ctx.closePath(); ctx.fill(); ctx.lineWidth = 1.5; ctx.strokeStyle = INK; ctx.stroke(); ctx.restore();
    } else { ctx.fillRect(p.x - p.sz / 2, p.y - p.sz / 2, p.sz, p.sz); }
  }

}
function drawHand(x, y, press) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(-0.35);
  const s = 1 - press * 0.1; ctx.scale(s, s);
  ctx.lineWidth = 4; ctx.strokeStyle = INK; ctx.fillStyle = '#fff';
  rrect(-6, -2, 12, 30, 6); ctx.fill(); ctx.stroke(); // index finger (tip at 0,0)
  rrect(-18, 18, 36, 30, 12); ctx.fill(); ctx.stroke();
  rrect(-22, 20, 10, 18, 5); ctx.fill(); ctx.stroke();
  ctx.restore();
}

/* compute the dog body for the current mode */
function bodyNow() {
  const m = S.mode, t = S.modeT;
  if (m === 'play' || m === 'pre') {
    const p = archPath(true);
    return { pts: p.pts, chunks: chunksFrom(p), headMode: 'arch' };
  }
  const arch = () => { const p = archPath(false); return resample(p.pts, NRES); };
  let pts, headMode = 'line', widthK = 1;
  if (m === 'assemble') {
    // the dog shakes out straight, still arched
    pts = arch(); headMode = 'arch';
  } else if (m === 'enter') {
    const from = S.trans.from;
    const walk = resample(groundLine(230), NRES);
    if (t < 1.2) {
      const u = ease(t / 1.2);
      pts = from.map((p, i) => [lerp(p[0], walk[i][0], u), lerp(p[1], walk[i][1], u) - Math.sin(u * PI) * 60]);
    } else if (t < 2.8) {
      const u = (t - 1.2) / 1.6;
      // stuck: the long body jams, butt wiggles
      const push = Math.sin(u * PI * 5) * 7;
      pts = walk.map((p, i) => { const k = i / (NRES - 1); return [p[0] - push * k, p[1] - Math.abs(Math.sin(u * PI * 5 + k * 3)) * 12 * (1 - k)]; });
    } else {
      const u = ease((t - 2.8) / 1.0);
      const curl = resample(curlPath(), NRES);
      pts = walk.map((p, i) => [lerp(p[0], curl[i][0], u), lerp(p[1], curl[i][1], u) - Math.sin(u * PI) * 30]);
      widthK = lerp(1, 0.62, u);
    }
  } else if (m === 'sleep') {
    const curl = resample(curlPath(), NRES);
    const br = Math.sin(S.time * 2.2) * 1.2;
    const d = doorWorld();
    pts = curl.map(p => [p[0] + (p[0] - d.x) * br * 0.03, p[1] + (p[1] - d.y) * br * 0.03]);
    widthK = 0.62;
  } else if (m === 'wake') {
    const curl = resample(curlPath(), NRES);
    const stretch = resample(groundLine(250 + Math.sin(clamp(t / 2, 0, 1) * PI) * 60), NRES);
    const u = ease(t / 1.0);
    pts = curl.map((p, i) => [lerp(p[0], stretch[i][0], u), lerp(p[1], stretch[i][1], u)]);
    widthK = lerp(0.62, 1, u);
  } else if (m === 'scroll') {
    const d = doorWorld();
    pts = resample(groundLine(230), NRES).map(p => [p[0] - (d.x - cxw) * ease(t / 1.4), p[1]]);
  } else if (m === 'tie') {
    const d = doorWorld();
    const from = resample(groundLine(230), NRES).map(p => [p[0] - (d.x - cxw), p[1]]);
    const to = arch();
    const u = ease(t / 1.3);
    pts = from.map((p, i) => [lerp(p[0], to[i][0], u), lerp(p[1], to[i][1], u) - Math.sin(u * PI) * 80]);
    headMode = u > 0.5 ? 'arch' : 'line';
  }
  const w = BW * widthK;
  return { pts, chunks: [{ s: 0, e: Math.floor(pts.length * 0.5), w }, { s: Math.floor(pts.length * 0.5), e: pts.length - 1, w }], headMode, widthK };
}

function render() {
  ctx.setTransform(dpr * sc, 0, 0, dpr * sc, 0, 0);
  drawBackground();
  const m = S.mode;
  drawShelfBed();
  const body = bodyNow();
  if (body.pts.length === NRES) S.lastBody = body.pts;
  const pts = body.pts;
  const tailBase = pts[0];
  // head placement
  const neck = pts[pts.length - 1];
  let ha, hp;
  if (body.headMode === 'arch' && (m === 'play' || m === 'pre' || m === 'assemble' || (m === 'tie' && S.modeT > 0.65))) {
    ha = 2.75 - dog.tilt * 0.35 * Math.sin(S.time * 10) + (dog.laugh > 0 ? 0.2 : 0);
    hp = { x: neck[0] + Math.cos(ha) * 30, y: neck[1] + Math.sin(ha) * 30 };
  } else {
    const p2 = pts[Math.max(0, pts.length - 4)];
    ha = Math.atan2(neck[1] - p2[1], neck[0] - p2[0]);
    hp = { x: neck[0] + Math.cos(ha) * 18, y: neck[1] + Math.sin(ha) * 18 };
    if (m === 'sleep' || (m === 'enter' && S.modeT > 3.3)) { const d = doorWorld(); hp = { x: d.x + S.sleepPose * 4, y: d.y - 18 }; ha = S.sleepPose > 0 ? PI + 0.2 : -0.2; }
  }
  // peeking through a window: head slides behind the blocks
  const P = S.peek; let peekWin = null;
  if (m === 'play' && P.amt > 0.01) {
    peekWin = S.blocks.get(P.idx);
    if (peekWin && peekWin.type === 'win') {
      const wx = cellX(peekWin.gx) + CELL, wy = cellY(peekWin.gy + 1) + CELL;
      hp = { x: lerp(hp.x, wx - 6, ease(P.amt)), y: lerp(hp.y, wy - 2, ease(P.amt)) };
    } else peekWin = null;
  }
  dog.headPos = hp;
  const ex = exprNow();
  if (peekWin) { ex.gx = -0.3; ex.gy = 0.8; ex.smile = Math.max(ex.smile, 0.8); }
  if (m === 'sleep' || (m === 'enter' && S.modeT > 3.5)) { dog.sleep = 1; ex.sleep = 1; } else dog.sleep = 0;
  if (m === 'enter' && S.modeT > 1.2 && S.modeT < 2.8) ex.surprise = 0.7;

  // house slide offset during scroll
  const hox = houseOffsetX();
  // house back wall
  if (S.house && (m === 'assemble' || m === 'enter' || m === 'sleep' || m === 'wake')) {
    drawHouseBack(S.house, m === 'assemble' ? easeOutBack(clamp((S.modeT - 0.1) / 0.5, 0, 1)) : 1);
  }
  if (m === 'scroll' && S.oldHouse) { ctx.save(); ctx.translate(hox, 0); drawHouseBack(S.oldHouse, 1); ctx.restore(); }
  // tail (behind blocks)
  let tailAng, tailLen;
  if (m === 'play' || m === 'pre' || m === 'assemble' || m === 'tie') {
    tailAng = -0.45 + Math.sin(S.time * dog.wagF) * dog.wagAmp * 0.6 - dog.tailReach * 0.15;
    tailLen = 42 + dog.tailReach * 52;
  } else {
    const p3 = pts[4]; tailAng = Math.atan2(tailBase[1] - p3[1], tailBase[0] - p3[0]) - 0.6 + Math.sin(S.time * dog.wagF) * dog.wagAmp * 0.5;
    tailLen = m === 'sleep' ? 26 : 38;
  }
  if (!(m === 'sleep' || (m === 'enter' && S.modeT > 3.2))) drawTail(tailBase[0], tailBase[1], tailAng, tailLen);
  // peek neck + head behind the blocks
  if (peekWin) {
    const nk = neck;
    const pp = [nk]; seg(pp, nk[0], nk[1], hp.x, hp.y, 8);
    drawTube(pp, [{ s: 0, e: pp.length - 1, w: BW * 0.75 }]);
    drawHead(hp.x, hp.y, 2.0, 0.9, ex);
  }
  // blocks
  if (m === 'scroll' && S.oldBlocks) { ctx.save(); ctx.translate(hox, 0); for (const b of S.oldBlocks) drawBlock(b); ctx.restore(); }
  const newOff = m === 'scroll' ? (1 - ease(S.modeT / 1.4)) * (worldW + 80) : 0;
  ctx.save(); ctx.translate(newOff, 0);
  for (const b of S.blocks.values()) if (b.type === 'base') drawBlock(b);
  // holes glow slightly so the gap reads as "fill me"
  if (m === 'play') for (let c = 0; c < COLS; c++) if (heightAt(c) === 0) {
    const x = cellX(c), y = cellY(0);
    ctx.fillStyle = C.hole; ctx.fillRect(x + 2, y + 4, CELL - 4, CELL - 4);
    ctx.globalAlpha = 0.25 + 0.15 * Math.sin(S.time * 3 + c); ctx.fillStyle = '#fff3c4'; ctx.fillRect(x + 6, y + 8, CELL - 12, 4); ctx.globalAlpha = 1;
  }
  for (const b of S.blocks.values()) if (b.type !== 'base') drawBlock(b);
  ctx.restore();
  // roof
  if (S.house && (m === 'assemble' || m === 'enter' || m === 'sleep' || m === 'wake')) {
    const t = m === 'assemble' ? S.modeT : 9;
    const drop = t < 0.55 ? 400 : (1 - easeOutBack(clamp((t - 0.55) / 0.5, 0, 1))) * 300;
    if (t >= 0.55) drawRoof(S.house, drop, m === 'assemble' && t > 1.05 && t < 1.4 ? 1 : 0);
  }
  if (m === 'scroll' && S.oldHouse) { ctx.save(); ctx.translate(hox, 0); drawRoof(S.oldHouse, 0, 0); ctx.restore(); }
  // door & sleeping area
  const inHouse = S.house && (m === 'enter' || m === 'sleep' || m === 'wake');
  if (inHouse || (S.house && m === 'assemble' && S.modeT > 1.0)) drawDoor(S.house);
  // body + legs + head
  const curled = m === 'sleep' || (m === 'enter' && S.modeT > 2.8);
  if (inHouse && !curled) { const d = doorWorld(); ctx.save(); doorClip(); drawBed(d.x, d.y - 6, 38, S.bed || DEFAULT_BED); ctx.restore(); }
  if (curled) {
    const d = doorWorld();
    ctx.save(); doorClip();
    drawBed(d.x, d.y - 6, 38, S.bed || DEFAULT_BED);
    drawTube(pts, body.chunks);
    drawHead(hp.x, hp.y, ha, 0.62, ex);
    ctx.restore();
    if (m === 'sleep') { // sleep bubble
      const bu = (S.time % 2.6) / 2.6;
      ctx.beginPath(); ctx.arc(d.x + 18 + bu * 14, d.y - 52 - bu * 30, 4 + bu * 9, 0, TAU);
      ctx.fillStyle = 'rgba(255,255,255,0.85)'; ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = INK; ctx.stroke();
    }
  } else {
    // legs
    const walking = m === 'enter' && S.modeT < 1.2 || m === 'scroll';
    const lp = walking ? S.time * 14 : 0;
    if (m === 'play' || m === 'pre' || m === 'assemble' || (m === 'tie' && S.modeT > 0.9)) {
      const hip = hipPos();
      drawLeg(hip.x - 6, hip.y + 4, groundY - hip.y - 10, 0);
      drawLeg(hip.x + 8, hip.y + 4, groundY - hip.y - 10, 0);
    } else {
      const a = pts[6], b = pts[pts.length - 10];
      drawLeg(a[0] - 6, a[1] + 6, 16, lp); drawLeg(a[0] + 8, a[1] + 6, 16, lp + PI);
      drawLeg(b[0] - 8, b[1] + 6, 16, lp + PI); drawLeg(b[0] + 6, b[1] + 6, 16, lp);
    }
    drawTube(pts, body.chunks);
    if (m === 'play' || m === 'pre' || m === 'assemble') {
      // front paws on the bed
      const nk = pts[pts.length - 1];
      drawLeg(nk[0] - 4, nk[1] + 8, topY + 92 - nk[1] - 8, 0);
    }
    if (m === 'enter' && S.modeT > 1.0) {
      // head is inside the door: only the long body sticks out
      drawDoor(S.house);
    } else if (!peekWin || P.amt < 0.2) {
      drawHead(hp.x, hp.y, ha, (m === "play" || m === "pre" || m === "assemble" || m === "tie") ? 1.3 : 1, ex);
    }
  }
  // peeking face visible through the window hole
  if (peekWin) {
    const wx = cellX(peekWin.gx) + CELL, wy = cellY(peekWin.gy + 1) + CELL;
    ctx.save(); ctx.beginPath(); ctx.arc(wx, wy, CELL * 2 * 0.27 - 1.5, 0, TAU); ctx.clip();
    ctx.fillStyle = '#2d2a3a'; ctx.fillRect(wx - 20, wy - 20, 40, 40);
    drawHead(hp.x, hp.y + (1 - ease(P.amt)) * 30, 2.0, 0.9, ex);
    ctx.restore();
    ctx.beginPath(); ctx.arc(wx, wy, CELL * 2 * 0.27, 0, TAU); ctx.lineWidth = 3.5; ctx.strokeStyle = INK; ctx.stroke();
  }
  // target sparkle (one only)
  if (S.target && m === 'play' && !S.drag) {
    const c = knotCenter(S.target);
    const pulse = 0.5 + 0.5 * Math.sin(S.time * 6);
    ctx.save(); ctx.globalAlpha = 0.35 + pulse * 0.4;
    ctx.lineWidth = 5; ctx.strokeStyle = '#fff';
    ctx.beginPath(); ctx.arc(c.x, c.y, S.target.rv + 22 + pulse * 5, 0, TAU); ctx.stroke();
    ctx.restore();
    for (let i = 0; i < 3; i++) {
      const a = S.time * 2 + i * TAU / 3, rr = S.target.rv + 30;
      const sx = c.x + Math.cos(a) * rr, sy = c.y + Math.sin(a) * rr;
      ctx.save(); ctx.translate(sx, sy); ctx.rotate(a);
      ctx.beginPath(); for (let j = 0; j < 8; j++) { const r = j % 2 ? 2.5 : 7; ctx.lineTo(Math.cos(j * PI / 4) * r, Math.sin(j * PI / 4) * r); }
      ctx.closePath(); ctx.fillStyle = '#fff6a8'; ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = INK; ctx.stroke(); ctx.restore();
    }
  }
  for (const f of S.falling) drawFalling(f);
  drawFx();
  // idle demo hand (shows a short pull, changes nothing)
  if (S.demo) {
    const c = knotCenter(S.demo.k), t = S.demo.t;
    let hx = c.x + 30, hy = c.y + 70, press = 0, alpha = 1;
    if (t < 0.4) { const u = ease(t / 0.4); hx = lerp(c.x + 60, c.x, u); hy = lerp(c.y + 110, c.y + 4, u); alpha = u; }
    else if (t < 0.6) { hx = c.x; hy = c.y + 4; press = 1; }
    else if (t < 1.3) { const u = ease((t - 0.6) / 0.7); hx = c.x; hy = c.y + 4 + u * 70; press = 1; }
    else { const u = (t - 1.3) / 0.6; hx = c.x; hy = c.y + 74; alpha = 1 - u; }
    if (t > 0.6 && t < 1.5) { // ghost loop stretch (visual only)
      const u = ease(clamp((t - 0.6) / 0.7, 0, 1));
      ctx.save(); ctx.globalAlpha = 0.5 * (t < 1.3 ? 1 : 1 - (t - 1.3) / 0.2);
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 6; ctx.setLineDash([]);
      ctx.beginPath(); ctx.moveTo(c.x - 10, c.y); ctx.lineTo(c.x - 14, c.y + u * 70); ctx.lineTo(c.x + 14, c.y + u * 70); ctx.lineTo(c.x + 10, c.y); ctx.stroke();
      ctx.restore();
    }
    ctx.save(); ctx.globalAlpha = clamp(alpha, 0, 1); drawHand(hx, hy, press); ctx.restore();
  }
}

/* ---------- loop ---------- */
let rafId = 0, lastT = 0, running = false;
function frame(now) {
  rafId = 0;
  if (!running) return;
  let dt = (now - lastT) / 1000; lastT = now;
  if (!(dt > 0)) dt = 0; if (dt > 0.05) dt = 0.05;
  try { update(dt); render(); } catch (e) { console.error(e); }
  rafId = requestAnimationFrame(frame);
}
function start() { if (running) return; running = true; lastT = performance.now(); rafId = requestAnimationFrame(frame); }
function stop() { running = false; if (rafId) cancelAnimationFrame(rafId); rafId = 0; }
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { cancelDrag(); stop(); if (ac && ac.state === 'running') ac.suspend().catch(() => {}); }
  else { start(); if (ac && ac.state === 'suspended') ac.resume().catch(() => {}); }
});
let resizeT = 0;
function onResize() {
  cancelDrag();
  const oldGX = gridX0;
  layout();
  for (const f of S.falling) { f.x += gridX0 - oldGX; }
  S.parts.length = 0; S.fx.length = 0;
}
window.addEventListener('resize', () => { clearTimeout(resizeT); onResize(); resizeT = setTimeout(onResize, 120); });
window.addEventListener('orientationchange', () => setTimeout(onResize, 200));

/* ---------- boot ---------- */
layout();
S.bed = loadBed();
startRound(true);
updateWorry();
start();

/* test/inspection hook (no UI) */
window.__gf = {
  S, dog,
  w2s: (x, y) => ({ x: x * sc, y: y * sc }),
  knotScreen(kind) { const k = S.knots.find(k => k.kind === kind && !k.untied) || S.knots.find(k => !k.untied); if (!k) return null; const c = knotCenter(k); return { x: c.x * sc, y: c.y * sc, kind: k.kind, id: k.id }; },
  knotScreenById(id) { const k = S.knots.find(k => k.id === id); const c = knotCenter(k); return { x: c.x * sc, y: c.y * sc }; },
  cellScreen(c, r) { return { x: (cellX(c) + CELL / 2) * sc, y: (cellY(r) + CELL / 2) * sc }; },
  heights() { return Array.from({ length: COLS }, (_, c) => heightAt(c)); },
  layout: () => ({ W, H, sc, groundY, topY, gridX0, gridX1, CELL, COLS }),
  frames: () => S.time
};
})();
</script>
</body>
