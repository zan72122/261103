// ---------------- meshes ----------------
function polyMesh(polys){
  const P=[],N=[];
  for(const poly of polys){
    let cx=0,cy=0,cz=0;for(const q of poly){cx+=q[0];cy+=q[1];cz+=q[2];}cx/=poly.length;cy/=poly.length;cz/=poly.length;
    const a=poly[0],b=poly[1],c=poly[2];
    const ux=b[0]-a[0],uy=b[1]-a[1],uz=b[2]-a[2],vx=c[0]-a[0],vy=c[1]-a[1],vz=c[2]-a[2];
    let nx=uy*vz-uz*vy,ny=uz*vx-ux*vz,nz=ux*vy-uy*vx;const l=Math.hypot(nx,ny,nz)||1;nx/=l;ny/=l;nz/=l;
    if(nx*cx+ny*cy+nz*cz<0){nx=-nx;ny=-ny;nz=-nz;}
    for(let k=1;k<poly.length-1;k++){for(const q of [poly[0],poly[k],poly[k+1]]){P.push(q[0],q[1],q[2]);N.push(nx,ny,nz);}}
  }
  return {p:new Float32Array(P),n:new Float32Array(N),count:P.length/3};
}
const MC=(function(){const f=[];const h=.5;

         [[-h,-h,h],[h,-h,h],[h,h,h],[-h,h,h]],[[-h,-h,-h],[-h,h,-h],[h,h,-h],[h,-h,-h]]);
  return polyMesh(f);})();
const MP=(function(){const f=[],top=[],bot=[];
  for(let k=0;k<8;k++){const a0=k*TAU/8+TAU/16,a1=(k+1)*TAU/8+TAU/16;
    f.push([[Math.cos(a0)*.5,-.5,Math.sin(a0)*.5],[Math.cos(a1)*.5,-.5,Math.sin(a1)*.5],[Math.cos(a1)*.5,.5,Math.sin(a1)*.5],[Math.cos(a0)*.5,.5,Math.sin(a0)*.5]]);

const MW=(function(){const A=[-.5,-.5,-.5],B=[.5,-.5,-.5],T=[0,.5,-.5],A2=[-.5,-.5,.5],B2=[.5,-.5,.5],T2=[0,.5,.5];

// ---------------- batches & frame stack ----------------
function Batch(){this.a=new Float32Array(10*4096);this.n=0;}
Batch.prototype.ensure=function(k){const need=(this.n+k)*10;if(need>this.a.length){let L=this.a.length;while(L<need)L*=2;const b=new Float32Array(L);b.set(this.a.subarray(0,this.n*10));this.a=b;}};
const SC=new Batch(),SN=new Batch(),DC=new Batch(),DN=new Batch();
let tgtC=DC,tgtN=DN;
const STK=[];for(let i=0;i<32;i++)STK.push(new Float32Array(12));
let sp=0,M=STK[0];
function ident(){sp=0;M=STK[0];M.set([1,0,0,0,1,0,0,0,1,0,0,0]);}
function push(){STK[sp+1].set(M);sp++;M=STK[sp];}
function pop(){sp--;M=STK[sp];}
function tr(x,y,z){M[9]+=M[0]*x+M[3]*y+M[6]*z;M[10]+=M[1]*x+M[4]*y+M[7]*z;M[11]+=M[2]*x+M[5]*y+M[8]*z;}
function rY(a){if(!a)return;const c=Math.cos(a),s=Math.sin(a);for(let i=0;i<3;i++){const x=M[i],z=M[6+i];M[i]=x*c-z*s;M[6+i]=x*s+z*c;}}
function rX(a){if(!a)return;const c=Math.cos(a),s=Math.sin(a);for(let i=0;i<3;i++){const y=M[3+i],z=M[6+i];M[3+i]=y*c+z*s;M[6+i]=-y*s+z*c;}}
function rZ(a){if(!a)return;const c=Math.cos(a),s=Math.sin(a);for(let i=0;i<3;i++){const x=M[i],y=M[3+i];M[i]=x*c+y*s;M[3+i]=-x*s+y*c;}}
function sc(x,y,z){for(let i=0;i<3;i++){M[i]*=x;M[3+i]*=y;M[6+i]*=z;}}
function tp(x,y,z,o){o[0]=M[9]+M[0]*x+M[3]*y+M[6]*z;o[1]=M[10]+M[1]*x+M[4]*y+M[7]*z;o[2]=M[11]+M[2]*x+M[5]*y+M[8]*z;return o;}
// box: mesh scaled (sx,sy,sz) at current frame origin. lit:1=光源あり 0=発光
function box(mesh,sx,sy,sz,col,lit,ns){
  if(lit===undefined)lit=1;
  const b=ns?tgtN:tgtC,cnt=mesh.count;b.ensure(cnt);const a=b.a;let o=b.n*10;
  const X0=M[0],X1=M[1],X2=M[2],Y0=M[3],Y1=M[4],Y2=M[5],Z0=M[6],Z1=M[7],Z2=M[8],tx=M[9],ty=M[10],tz=M[11];
  const ix=1/(sx*(X0*X0+X1*X1+X2*X2)),iy=1/(sy*(Y0*Y0+Y1*Y1+Y2*Y2)),iz=1/(sz*(Z0*Z0+Z1*Z1+Z2*Z2));
  const P=mesh.p,N=mesh.n,r=col[0],g=col[1],bb=col[2];
  for(let i=0,j=0;i<cnt;i++,j+=3){
    const x=P[j]*sx,y=P[j+1]*sy,z=P[j+2]*sz;
    a[o]=tx+X0*x+Y0*y+Z0*z;a[o+1]=ty+X1*x+Y1*y+Z1*z;a[o+2]=tz+X2*x+Y2*y+Z2*z;
    const nx=N[j]*ix,ny=N[j+1]*iy,nz=N[j+2]*iz;
    const wx=X0*nx+Y0*ny+Z0*nz,wy=X1*nx+Y1*ny+Z1*nz,wz=X2*nx+Y2*ny+Z2*nz;const l=1/(Math.sqrt(wx*wx+wy*wy+wz*wz)||1);
    a[o+3]=wx*l;a[o+4]=wy*l;a[o+5]=wz*l;a[o+6]=r;a[o+7]=g;a[o+8]=bb;a[o+9]=lit;o+=10;
  }
  b.n+=cnt;
}
function cube(x,y,z,sx,sy,sz,col,lit,ns){push();tr(x,y,z);box(MC,sx,sy,sz,col,lit,ns);pop();}

const VS='attribute vec3 aP;attribute vec3 aN;attribute vec4 aC;uniform mat4 uVP;uniform mat4 uM;uniform vec3 uL;uniform float uS;uniform vec3 uSC;varying vec3 vC;'+

gl.uniform3f(uL,LT[0],LT[1],LT[2]);gl.uniform3f(uSC,C.shadow[0],C.shadow[1],C.shadow[2]);

// ---------------- camera ----------------
let W=1,H=1,DPR=1;
const VP=new Float32Array(16),PR=new Float32Array(16),VW=new Float32Array(16);
const cam={e:[0,14,12],t:[0,0,-4],fov:0.7,D:20,dir:[0,0.7,0.7]};
const SA={t:0,r:0,b:0,l:0};
function perspective(o,fovy,asp,n,f){const t=1/Math.tan(fovy/2);o.fill(0);o[0]=t/asp;o[5]=t;o[10]=(f+n)/(n-f);o[11]=-1;o[14]=2*f*n/(n-f);}
function lookAt(o,e,c){let zx=e[0]-c[0],zy=e[1]-c[1],zz=e[2]-c[2];let l=Math.hypot(zx,zy,zz);zx/=l;zy/=l;zz/=l;
  let xx=zz,xy=0,xz=-zx;l=Math.hypot(xx,xy,xz)||1;xx/=l;xy/=l;xz/=l;
  const yx=zy*xz-zz*xy,yy=zz*xx-zx*xz,yz=zx*xy-zy*xx;
  o[0]=xx;o[1]=yx;o[2]=zx;o[3]=0;o[4]=xy;o[5]=yy;o[6]=zy;o[7]=0;o[8]=xz;o[9]=yz;o[10]=zz;o[11]=0;
  o[12]=-(xx*e[0]+xy*e[1]+xz*e[2]);o[13]=-(yx*e[0]+yy*e[1]+yz*e[2]);o[14]=-(zx*e[0]+zy*e[1]+zz*e[2]);o[15]=1;}
function mul(o,a,b){const r=new Float32Array(16);for(let i=0;i<4;i++)for(let j=0;j<4;j++){let s=0;for(let k=0;k<4;k++)s+=a[k*4+j]*b[i*4+k];r[i*4+j]=s;}o.set(r);}
function projP(m,x,y,z,o){const cx=m[0]*x+m[4]*y+m[8]*z+m[12],cy=m[1]*x+m[5]*y+m[9]*z+m[13],cw=m[3]*x+m[7]*y+m[11]*z+m[15];o[0]=cx/cw;o[1]=cy/cw;o[2]=cw;return o;}
const KEYPTS=[[-3.5,0,5.3],[3.5,0,5.3],[-3.5,1.5,5.3],[3.5,1.5,5.3],[-5.9,0,-4.2],[5.9,0,-4.2],[0,5.0,-2.5],[-2.4,4.6,4.4],[2.4,4.6,4.4],
  [-7.2,0,-9],[7.4,0,-9],[-6.8,0,-15],[6.8,0,-15],[0,3.9,-11],[4.2,3.9,-10],[-7.6,3.4,-8.2],[7.4,3,-7.4],[-6,4.5,-10.6],[6,4.5,-10.6]];
const KEYPTS_P=[[-3.25,0,5.2],[3.25,0,5.2],[-3.25,1.5,5.2],[3.25,1.5,5.2],[-4.6,0,-4.2],[4.6,0,-4.2],[0,5.0,-2.5],
  [-7.2,0,-8.4],[7.2,0,-8.4],[-5.0,0,-14.6],[5.0,0,-14.6],[0,4.5,-11]];
function camMat(T,D,asp,yawOff,o){const d=cam.dir;let ex=d[0]*D,ez=d[2]*D;if(yawOff){const c=Math.cos(yawOff),s=Math.sin(yawOff);const x=ex*c+ez*s,z=-ex*s+ez*c;ex=x;ez=z;}
  const e=[T[0]+ex,T[1]+d[1]*D,T[2]+ez];perspective(PR,cam.fov,asp,0.5,140);lookAt(VW,e,T);mul(o,PR,VW);return e;}
function fitCam(){
  const asp=W/H,portrait=asp<1;
  const el=portrait?1.0:0.80;cam.dir=[0,Math.sin(el),Math.cos(el)];
  cam.fov=portrait?(asp<0.6?1.25:1.0):(asp>1.7?0.95:0.62);
  const pts=portrait?KEYPTS_P:KEYPTS;
  const ml=(SA.l+4)/W*2,mr=(SA.r+4)/W*2,mt=(SA.t+4)/H*2,mb=(SA.b+4)/H*2;
  const x0=-1+ml,x1=1-mr,y0=-1+mb,y1=1-mt;
  let T=[0,0.5,-4.5],D=30;const m=new Float32Array(16),o=[0,0,0];
  function bb(T,D){camMat(T,D,asp,0,m);let a=1e9,b=-1e9,c=1e9,d=-1e9;for(const p of pts){projP(m,p[0],p[1],p[2],o);if(o[2]<=0)return null;a=Math.min(a,o[0]);b=Math.max(b,o[0]);c=Math.min(c,o[1]);d=Math.max(d,o[1]);}return [a,b,c,d];}
  for(let it=0;it<7;it++){
    let lo=6,hi=140;for(let k=0;k<32;k++){const mid=(lo+hi)/2;const r=bb(T,mid);if(r&&r[0]>=x0&&r[1]<=x1&&r[2]>=y0&&r[3]<=y1)hi=mid;else lo=mid;}
    D=hi;const r=bb(T,D);if(!r)break;
    const cx=(r[0]+r[1])/2-(x0+x1)/2,cy=(r[2]+r[3])/2-(y0+y1)/2;const h=Math.tan(cam.fov/2)*D;
    T=[T[0]+cx*h*asp,T[1]+cy*h*Math.cos(el),T[2]-cy*h*Math.sin(el)];
  }

}
function readSafe(){try{const s=getComputedStyle(document.getElementById('sa'));SA.t=parseFloat(s.paddingTop)||0;SA.r=parseFloat(s.paddingRight)||0;SA.b=parseFloat(s.paddingBottom)||0;SA.l=parseFloat(s.paddingLeft)||0;}catch(e){}}

  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);gl.viewport(0,0,cv.width,cv.height);readSafe();fitCam();}

// ---------------- paths ----------------
function makePath(pts,closed,rad){
  const n=pts.length,out=[];
  const g=i=>pts[(i+n)%n];
  for(let i=0;i<n;i++){
    const P=pts[i];
    if(!closed&&(i===0||i===n-1)){out.push([P[0],P[1],P[2]]);continue;}
    const A=g(i-1),B=g(i+1);const rr=P.length>3?P[3]:rad;
    const la=Math.hypot(A[0]-P[0],A[1]-P[1],A[2]-P[2]),lb=Math.hypot(B[0]-P[0],B[1]-P[1],B[2]-P[2]);
    const r=Math.min(rr,la*0.48,lb*0.48);
    if(r<0.02){out.push([P[0],P[1],P[2]]);continue;}
    const p0=[P[0]+(A[0]-P[0])/la*r,P[1]+(A[1]-P[1])/la*r,P[2]+(A[2]-P[2])/la*r];
    const p2=[P[0]+(B[0]-P[0])/lb*r,P[1]+(B[1]-P[1])/lb*r,P[2]+(B[2]-P[2])/lb*r];
    const st=Math.max(3,Math.ceil(r*6));
    for(let k=0;k<=st;k++){const t=k/st,u=1-t;out.push([u*u*p0[0]+2*u*t*P[0]+t*t*p2[0],u*u*p0[1]+2*u*t*P[1]+t*t*p2[1],u*u*p0[2]+2*u*t*P[2]+t*t*p2[2]]);}
  }
  if(closed)out.push(out[0].slice());
  const cum=[0];for(let i=1;i<out.length;i++){const a=out[i-1],b=out[i];cum.push(cum[i-1]+Math.hypot(b[0]-a[0],b[1]-a[1],b[2]-a[2]));}
  return {pts:out,cum,len:cum[cum.length-1],closed};
}
function pathAt(P,s,o){
  const L=P.len;if(P.closed){s%=L;if(s<0)s+=L;}else s=clamp(s,0,L);
  let lo=0,hi=P.cum.length-1;while(hi-lo>1){const m=(lo+hi)>>1;if(P.cum[m]<=s)lo=m;else hi=m;}
  const a=P.pts[lo],b=P.pts[hi],seg=P.cum[hi]-P.cum[lo],t=seg>0?(s-P.cum[lo])/seg:0;
  o[0]=a[0]+(b[0]-a[0])*t;o[1]=a[1]+(b[1]-a[1])*t;o[2]=a[2]+(b[2]-a[2])*t;
  let dx=b[0]-a[0],dy=b[1]-a[1],dz=b[2]-a[2];const l=Math.hypot(dx,dy,dz)||1;o[3]=dx/l;o[4]=dy/l;o[5]=dz/l;return o;
}
function pathNearest(P,p){let best=1e9,bs=0;for(let i=0;i<P.pts.length;i++){const q=P.pts[i];const d=(q[0]-p[0])**2+(q[1]-p[1])**2*1.5+(q[2]-p[2])**2;if(d<best){best=d;bs=P.cum[i];}}return bs;}

// ---------------- world layout ----------------
const SLOTS=[[-2.4,2.45],[0,2.45],[2.4,2.45],[-2.4,4.35],[0,4.35],[2.4,4.35]];

  leader:null,follow:null,followT:0,signals:0,px:0,pz:0,born:T,honkT:0,prop:0,route:null,path:null,joined:false,refilled:false,exitT:0};}
function newBuild(drop){
  buildNo++;const sixth=['G','W','C','H'][(buildNo-1)%4];
  const parts=shuffle(['W','W','G','H','C',sixth]);
  const slots=shuffle([0,1,2,3,4,5]);
  crates=parts.map((p,i)=>makeCrate(p,slots[i],drop?6+i*0.7:0));
  build={segs:[],order:[],queue:[],done:false,veh:newVehicle(),suggest:-1,sugCd:drop?1.2:0.3,fp:[]};
  demoDone=false;
}
function layoutVehicle(v){
  const s=v.segs,n=s.length;if(!n){v.length=0;return;}
  v.base=s[0];v.kind=KIND[s[0]];v.ground=v.kind==='car'||v.kind==='kart';
  v.carrier=-1;for(let i=0;i<n-1;i++)if(s[i]==='W'&&s[i+1]==='W'){v.carrier=i;break;}
  v.jumpSeg=-1;if(v.ground)for(let i=0;i<n-1;i++)if(s[i]==='W'&&s[i+1]==='G'){v.jumpSeg=i+1;break;}
  v.h2=n>1&&s[1]==='H';v.chimLast=n===6&&s[5]==='C';v.strong=v.kind==='train'||v.chimLast;
  const train=v.kind==='train',gap=train?0.16:0.03;let x=0;v.lens=[];v.segX=[];
  for(let i=0;i<n;i++){let L=train?0.52:0.46;if(v.carrier>=0&&(i===v.carrier||i===v.carrier+1))L=0.74;if(i===0&&!train)L+=0.06;v.lens[i]=L;v.segX[i]=x-L/2;x-=L+gap;}
  v.length=-x-gap;for(let i=0;i<n;i++)v.segX[i]+=v.length/2;
  v.headOff=train?v.segX[0]:0;
}
function closedReady(){const r=[];for(let i=0;i<crates.length;i++){const c=crates[i];if(c.state==='closed'&&c.drop<0.3)r.push(i);}return r;}
function pickSuggest(){const r=closedReady();if(!r.length){build.suggest=-1;return;}let i=r[(Math.random()*r.length)|0];
  if(r.length>1&&i===build.lastSug)i=r[(r.indexOf(i)+1)%r.length];build.suggest=i;build.lastSug=i;crane.sweep=0.55;}

// ---------- 箱を開ける ----------
function crateAnchor(c){return [c.x,c.z-CS/2-0.25];}
function openCrate(i){
  const c=crates[i];if(c.state!=='closed'||build.done)return;
  c.state='open';c.sqv-=7;c.lidv+=4;c.pyv+=9;c.order=build.order.length;
  build.order.push(i);build.queue.push(i);
  if(build.suggest===i){build.suggest=-1;build.sugCd=0.7;}
  burstChips(c.x,CH+0.1,c.z,9);
  S.knock();S.lid();S.part(c.part);
  // 光る足跡（最初の1つは即座に箱の前へ）
  const k=build.order.length-1;
  const prev=k===0?[TABLE.front-0.6,TABLE.z+1.05]:crateAnchor(crates[build.order[k-1]]);
  const end=crateAnchor(c);
  const dx=end[0]-prev[0],dz=end[1]-prev[1],L=Math.hypot(dx,dz)||1,yaw=Math.atan2(-dz,dx);
  const n=Math.max(2,Math.floor(L/0.42));
  build.fp.push({x:end[0],z:end[1],yaw,col:c.part,born:T,ci:i,side:0,vis:false});
  for(let j=0;j<n;j++){const u=j/n;const side=(j&1)?1:-1;
    build.fp.push({x:prev[0]+dx*u+(-dz/L)*0.11*side,z:prev[1]+dz*u+(dx/L)*0.11*side,yaw,col:c.part,born:T+0.03+j*0.035,ci:i,side,vis:false});}
  log('open',{part:c.part,order:k});
}

// ---------- クレーン ----------
function craneTarget(x,z){const dx=x-TOWER[0],dz=z-TOWER[1];return [Math.atan2(dx,dz),Math.max(1.4,Math.hypot(dx,dz))];}
function approach(cur,tgt,k,mx,dt){const d=tgt-cur;let st=clamp(d*k,-mx,mx)*dt;if(Math.abs(st)>=Math.abs(d))return tgt;return cur+st;}
function slotWorld(v,i){const fx=TABLE.front;return [fx-v.length/2+v.segX[i],TABLE.z];}
function previewSlot(v,part){const t={segs:v.segs.concat([part])};layoutVehicle(t);return [TABLE.front-t.length/2+t.segX[t.segs.length-1],TABLE.z];}
function updCrane(dt){
  let ty=crane.yaw,trr=crane.r,thy=crane.hy,lamp=0;
  if(!crane.task&&build.queue.length&&!build.done)crane.task={ci:build.queue.shift(),ph:0,t:0};
  const tk=crane.task;
  if(tk){
    const c=crates[tk.ci];tk.t+=dt;
    if(tk.ph<=3){const a=craneTarget(c.x,c.z);ty=a[0];trr=a[1];}
    else{const p=previewSlot(build.veh,c.part);const a=craneTarget(p[0],p[1]);ty=a[0];trr=a[1];}
    const at=Math.abs(crane.yaw-ty)<0.015&&Math.abs(crane.r-trr)<0.04;
    if(tk.ph===0){thy=3.25;if(at&&Math.abs(crane.hy-thy)<0.3){tk.ph=1;}}
    else if(tk.ph===1){thy=CH+0.55+0.42;if(Math.abs(crane.hy-thy)<0.01){crane.carry=c.part;c.taken=true;const h=c.part==='W'||c.part==='C';S.grab(h);
      if(h){tk.ph=2;tk.t=0;crane.strain=1;S.strain();}else tk.ph=3;}}
    else if(tk.ph===2){thy=CH+0.55+0.42-0.12*Math.sin(clamp(tk.t/0.5,0,1)*PI);if(tk.t>0.55)tk.ph=3;}
    else if(tk.ph===3){thy=3.25;if(Math.abs(crane.hy-thy)<0.2)tk.ph=4;}
    else if(tk.ph===4){thy=3.25;if(at)tk.ph=5;}
    else if(tk.ph===5){thy=table.y+0.86;if(Math.abs(crane.hy-thy)<0.01){attachPart(tk.ci);crane.carry=null;tk.ph=6;}}
    else if(tk.ph===6){thy=3.1;if(Math.abs(crane.hy-thy)<0.4)crane.task=null;}
  }else if(build.done){
    const lv=crane.lookV;if(lv){const a=craneTarget(lv.pos[0],Math.max(lv.pos[2],-3.6));ty=a[0];trr=clamp(a[1],2,6);}thy=3.2;
  }else{
    if(build.suggest>=0){const c=crates[build.suggest];const a=craneTarget(c.x,c.z);ty=a[0]+crane.sweep*Math.sin(T*2.6);trr=a[1];thy=2.95;lamp=1;}
    else{const a=craneTarget(0,TABLE.z);ty=a[0];trr=3;thy=3.1;}
  }
  crane.sweep=Math.max(0,crane.sweep-dt*0.28);
  const y0=crane.yaw,r0=crane.r,h0=crane.hy;
  crane.yaw=approach(crane.yaw,ty,3.2,1.5,dt);crane.r=approach(crane.r,trr,3.5,5,dt);crane.hy=approach(crane.hy,thy,6,5.5,dt);
  crane.motor=damp(crane.motor,clamp((Math.abs(crane.yaw-y0)*3+Math.abs(crane.r-r0)+Math.abs(crane.hy-h0))/Math.max(dt,1e-3)*0.05,0,0.25),8,dt);
  if(motorG&&AC&&AC.state==='running')motorG.gain.setTargetAtTime(crane.motor*0.5,AC.currentTime,0.05);
  crane.strain=Math.max(0,crane.strain-dt*1.6);crane.blink=Math.max(0,crane.blink-dt);crane.lamp=damp(crane.lamp,lamp,5,dt);
  crane.wobv+=(-crane.wob*90-crane.wobv*8)*dt;crane.wob+=crane.wobv*dt;
}
function attachPart(ci){
  const c=crates[ci],v=build.veh;v.segs.push(c.part);layoutVehicle(v);v.pulse=1;
  for(const f of build.fp)if(f.ci===ci)f.vis=true;
  const idx=v.segs.length-1,h=c.part==='W'||c.part==='C';S.connect(idx,h);
  const p=slotWorld(v,idx);
  burstSpark(p[0],table.y+0.5,p[1],10,PGLOW[c.part],2.4);
  log('attach',{part:c.part,i:idx,segs:v.segs.join('')});
  if(v.segs.length===6)later(0.35,complete);
}
function complete(){
  const v=build.veh;build.done=true;S.success();crane.blink=4.5;crane.lookV=v;
  burstSpark(TABLE.front-v.length/2,table.y+0.8,TABLE.z,26,C.lamp,3.2);
  v.pulse=1.4;
  if(!wall.open&&!wall.opening){wall.opening=true;later(0.25,()=>S.wall());log('wallOpen');}
  log('complete',{segs:v.segs.join(''),kind:v.kind,carrier:v.carrier>=0,jumper:v.jumpSeg>=0,strong:v.strong,h2:v.h2});
  later(1.3,()=>{table.ty=0.06;});
  later(2.3,()=>startLeave(v));
}
function startLeave(v){
  const cx=TABLE.front-v.length/2+v.headOff;v.pos=[cx,table.y,TABLE.z];v.yaw=0;
  v.trail=[];for(let k=50;k>=1;k--)v.trail.push([cx-k*0.1,table.y,TABLE.z]);
  const pts=[[cx,0,TABLE.z],[2.7,0,TABLE.z],[3.3,0,-1.4],[3.3,0,-4.2],[3.3,0,-5.6]];
  if(v.kind==='train')pts.push([5.5,0,-5.6],[5.5,0,-9.6],[0,0,-9.6],[0,0,-13.4],[v.h2?-0.8:0.8,0,-13.4]);else pts.push([4.4,0,-5.6]);
  v.path=makePath(pts,false,0.7);v.s=0;v.mode='leave';
  if(v.kind==='plane')v.route=ROUTES.PLANE;else if(v.kind==='train')v.route=v.h2?ROUTES.TRAINR:ROUTES.TRAIN;
  else if(v.jumpSeg>=0)v.route=ROUTES.JUMP;else if(v.kind==='kart'||v.h2)v.route=ROUTES.SKY;else v.route=ROUTES.R1;
  v.speed={car:2.0,kart:2.4,plane:2.6,train:1.6}[v.kind];
  vehicles.push(v);S.honk(v.kind);
  const live=vehicles.filter(q=>q.mode!=='exit');if(live.length>9){const o=live[0];endFollowers(o);o.mode='exit';o.exitT=0;}
}
function refill(){
  for(const c of crates){c.leave=0.001;oldCrates.push(c);}
  for(const f of build.fp)fpOld.push(f);
  table.ty=0.72;newBuild(true);crane.lookV=null;
}

// ---------- 乗り物：町での動き ----------
const TMP=[0,0,0,0,0,0],TMP2=[0,0,0,0,0,0];
function trailAt(v,d,o){
  let prev=v.pos,acc=0;const tr=v.trail;
  for(let k=tr.length-1;k>=0;k--){const p=tr[k];const seg=Math.hypot(prev[0]-p[0],prev[1]-p[1],prev[2]-p[2]);
    if(seg>1e-5&&acc+seg>=d){const t=(d-acc)/seg;o[0]=prev[0]+(p[0]-prev[0])*t;o[1]=prev[1]+(p[1]-prev[1])*t;o[2]=prev[2]+(p[2]-prev[2])*t;
      o[3]=(prev[0]-p[0])/seg;o[4]=(prev[1]-p[1])/seg;o[5]=(prev[2]-p[2])/seg;return o;}
    acc+=seg;prev=p;}
  o[0]=prev[0]-Math.cos(v.yaw)*(d-acc);o[1]=prev[1];o[2]=prev[2]+Math.sin(v.yaw)*(d-acc);o[3]=Math.cos(v.yaw);o[4]=0;o[5]=-Math.sin(v.yaw);return o;
}
function joinRoute(v){v.mode='route';v.s=pathNearest(v.route,v.pos);v.k=2.2;if(!v.joined){v.joined=true;assignPartner(v);}}
function endFollow(v){if(v.mode!=='follow')return;const L=v.leader;v.leader=null;if(L)L.follow=null;v.mode='route';v.s=pathNearest(v.route,v.pos);v.k=1.6;}
function endFollowers(o){for(const q of vehicles)if(q.leader===o)endFollow(q);}
function assignPartner(V){
  let O=null;for(let i=vehicles.length-1;i>=0;i--){const q=vehicles[i];if(q!==V&&q.mode==='route'&&!q.follow&&q.joined){O=q;break;}}
  if(!O)return;
  if(O.kind===V.kind){startFollow(V,O,'chase');log('meet',{mt:'chase',a:V.kind,b:O.kind});}
  else{let F=V,L=O;if(O.kind==='plane'){F=O;L=V;}startFollow(F,L,'pair');log('meet',{mt:'pair',a:V.kind,b:O.kind,air:F.kind==='plane'});}
}
function startFollow(F,L,type){
  F.mode='follow';F.leader=L;L.follow=F;F.ftype=type;F.followT=0;F.signals=0;F.k=1.5;
  if(type==='chase'){F.gap=L.length/2+F.length/2+0.55+(L.kind==='train'?L.length:0);F.offY=0;F.offL=0;}
  else if(F.kind==='plane'){F.gap=0.3;F.offY=2.6;F.offL=0;}
  else{F.gap=0.1;F.offY=0;F.offL=1.05;}
  S.honk(F.kind);later(0.35,()=>S.honk(L.kind));
}
function signalPair(F,L){
  F.flash=1;L.flash=1;signalFlash=1;S.signal();
  const a=F.lights.length?F.lights[0]:F.pos,b=L.lights.length?L.lights[0]:L.pos;
  for(let k=0;k<7;k++){const u=k/6;spawnP(1,lerp(a[0],b[0],u),lerp(a[1],b[1],u)+0.2,lerp(a[2],b[2],u),rnd(-0.3,0.3),rnd(0.6,1.4),rnd(-0.3,0.3),0.8,0.11,k&1?C.lamp:C.lampW,0);}
  log('signal',{a:F.kind,b:L.kind,mt:F.ftype});
}
function updVehicle(v,dt){
  if(v.mode==='build')return;
  v.loadCd-=dt;v.unloadCd-=dt;
  if(v.stopT>0){v.stopT-=dt;v.spd=damp(v.spd,0,9,dt);}else v.spd=damp(v.spd,1,2.5,dt);
  const tg=TMP;let useTan=true;
  if(v.mode==='leave'){v.s+=v.speed*0.85*v.spd*dt;pathAt(v.path,v.s,tg);
    if(!v.refilled&&v.s>3.2){v.refilled=true;refill();}
    if(v.s>=v.path.len-0.01)joinRoute(v);}
  else if(v.mode==='route'){v.s+=v.speed*v.spd*dt;pathAt(v.route,v.s,tg);}
  else if(v.mode==='follow'){
    const L=v.leader;v.followT+=dt;
    if(!L||L.mode==='exit'||v.followT>32||v.signals>=(v.ftype==='chase'?3:2)){endFollow(v);pathAt(v.route,v.s,tg);}
    else{trailAt(L,v.gap,tg);const lx=-tg[5],lz=tg[3];tg[0]+=lx*v.offL;tg[2]+=lz*v.offL;tg[1]+=v.offY;useTan=true;
      if((L.px<0)!==(L.pos[0]<0)&&L.pos[2]<-4.6&&v.followT>1.2){v.signals++;if(v.ftype==='pair')signalPair(v,L);else{S.honk(v.kind);later(0.3,()=>S.honk(L.kind));v.flash=0.6;L.flash=0.6;log('chaseHonk',{a:v.kind});}}}
  }
  else if(v.mode==='exit'){v.exitT+=dt;tg[0]=v.pos[0];tg[1]=v.pos[1];tg[2]=v.pos[2]-dt*3;tg[3]=0;tg[4]=0;tg[5]=-1;if(v.pos[2]<-30){v.gone=true;}}
  v.k=Math.min(10,v.k+dt*(v.mode==='follow'?2:3));
  v.px=v.pos[0];v.pz=v.pos[2];
  const ox=v.pos[0],oy=v.pos[1],oz=v.pos[2];
  v.pos[0]=damp(v.pos[0],tg[0],v.k,dt);v.pos[1]=damp(v.pos[1],tg[1],v.k,dt);v.pos[2]=damp(v.pos[2],tg[2],v.k,dt);
  const mvx=v.pos[0]-ox,mvy=v.pos[1]-oy,mvz=v.pos[2]-oz,mv=Math.hypot(mvx,mvz);
  v.moving=mv/Math.max(dt,1e-4)>0.25;
  let yawT=v.yaw,pitchT=0;
  if(v.mode==='follow'||v.mode==='exit'){if(mv>0.0015)yawT=Math.atan2(-mvz,mvx);pitchT=mv>0.0015?Math.atan2(mvy,mv):0;}
  else{yawT=Math.atan2(-tg[5],tg[3]);pitchT=Math.atan2(tg[4],Math.hypot(tg[3],tg[5]));}
  const yawPrev=v.yaw;v.yaw=angDamp(v.yaw,yawT,8,dt);v.pitch=damp(v.pitch,v.kind==='plane'||v.jumpSeg>=0||v.route===ROUTES.SKY?pitchT:0,8,dt);
  let yr=v.yaw-yawPrev;while(yr>PI)yr-=TAU;while(yr<-PI)yr+=TAU;
  let roll=0;if(v.kind==='plane'&&v.pos[1]>0.6){roll=clamp(-yr/Math.max(dt,1e-3)*0.35,-0.7,0.7);
    if(v.h2&&v.mode==='route'&&v.pos[2]<-10&&v.pos[1]>3.3){roll+=TAU*clamp((5.2-v.pos[0])/10.4,0,1);if(!v.rolling){v.rolling=true;S.whoosh();log('barrel');}}else v.rolling=false;}
  v.roll=v.rolling?roll:damp(v.roll,roll,5,dt);
  // trail
  const lt=v.trail[v.trail.length-1];if(!lt||Math.hypot(lt[0]-v.pos[0],lt[1]-v.pos[1],lt[2]-v.pos[2])>0.07){v.trail.push([v.pos[0],v.pos[1],v.pos[2]]);if(v.trail.length>320)v.trail.splice(0,60);}
  v.dist+=Math.hypot(mvx,mvy,mvz);
  // 状態：空中/地上
  const air=v.pos[1]>0.3&&!(v.route===ROUTES.SKY&&v.pos[1]<1.75&&v.pos[1]>0.05&&v.mode==='route');
  if(v.kind==='plane'){v.gear=damp(v.gear,v.pos[1]<0.9?1:0,4,dt);
    if(air!==v.air&&v.mode!=='leave'){if(air){S.whoosh();log('takeoff');}else{S.land();burstChips(v.pos[0],0.05,v.pos[2],5);log('land');}}}
  else if(v.jumpSeg>=0){v.wingOpen=damp(v.wingOpen,v.moving?1:0,5,dt);
    if(air!==v.air){if(air){S.jump();log('jump');}else{S.land();burstChips(v.pos[0],0.05,v.pos[2],6);}}}
  v.air=air;
  // 道路の反応（車輪が接地）
  const onSurf=(v.kind!=='plane'||v.pos[1]<0.15)&&!(v.jumpSeg>=0&&air)&&v.pos[2]<-4.4;
  if(onSurf){v.glowAcc+=mv;if(v.glowAcc>0.38){v.glowAcc=0;const gy=v.pos[1]>1?v.pos[1]:0;glowTile(v.pos[0],gy,v.pos[2],v.yaw,PGLOW[v.base]);
      if(v.kind==='train'&&v.trail.length>8){}}}
  // 空中橋の反応（羽で飛ぶ）
  if(v.kind==='plane'&&v.pos[1]>1.9&&Math.abs(v.pos[2]-BRIDGEZ)<2.3){for(let i=0;i<6;i++){if(Math.abs(v.pos[0]-LAMPX[i])<0.7){if(lamps[i]<0.4){S.chime(i);if(i===0||i===5)log('bridge',{i});}lamps[i]=1;}}}
  // 積み木運び
  if(v.carrier>=0&&v.mode!=='leave'&&v.mode!=='exit'){
    const rr=v.kind==='train'?5.4:2.6;
    if(!v.load&&v.loadCd<=0&&Math.hypot(v.pos[0]-PILE[0],v.pos[2]-PILE[1])<rr){v.loadCd=6;v.stopT=0.8;const col=[C.red,C.blue,C.green,C.yellow][(Math.random()*4)|0];
      flyBlocks.push({from:[PILE[0],1.2,PILE[1]],to:v,t:0,dur:0.65,col,kind:'load'});S.pop();}
    else if(v.load&&v.unloadCd<=0&&Math.hypot(v.pos[0]-SITE[0],v.pos[2]-SITE[1])<rr){v.unloadCd=6;v.stopT=0.7;const col=v.load;v.load=null;
      const from=v.cargoPos?v.cargoPos.slice():[v.pos[0],v.pos[1]+0.6,v.pos[2]];flyBlocks.push({from,to:null,t:0,dur:0.7,col,kind:'unload'});S.pop();}
  }
  // 煙
  v.smokeT-=dt;
  if(v.smokeT<=0&&v.moving&&v.emit.length&&v.mode!=='exit'){v.smokeT=0.2;
    for(const e of v.emit){if(e[3]){const p=spawnP(2,e[0],e[1],e[2],rnd(-0.2,0.2),1.0,rnd(-0.2,0.2),9,0.16,C.white);if(p){p.seek=true;}}
      else if(Math.random()<0.6)spawnP(2,e[0],e[1],e[2],rnd(-0.15,0.15),0.6,rnd(-0.15,0.15),0.9,0.1,C.silver);}}
  v.flash=Math.max(0,v.flash-dt*0.9);
  v.wobv+=(-v.wob*120-v.wobv*7)*dt;v.wob+=v.wobv*dt;v.pulse=Math.max(0,v.pulse-dt*2.5);
  v.prop+=dt*(v.kind==='plane'?30:0);
}
function updFly(dt){
  for(let i=flyBlocks.length-1;i>=0;i--){const f=flyBlocks[i];f.t+=dt;if(f.t>=f.dur){
      if(f.kind==='load'){if(f.to&&!f.to.gone){f.to.load=f.col;log('load',{kind:f.to.kind});}S.tock(3);}

function update(dt){
  T+=dt;
  for(let i=timeline.length-1;i>=0;i--){if(timeline[i].t<=T){const f=timeline[i].fn;timeline.splice(i,1);f();}}
  // 壁
  if(wall.opening){wall.y-=dt*2.0;wall.shake=1;if(wall.y<-2.9){wall.y=-2.9;wall.opening=false;wall.open=true;}}
  wall.shake=Math.max(0,wall.shake-dt*2);
  table.y=approach(table.y,table.ty,3,1.2,dt);
  // 箱
  const sug=build.suggest;
  for(let i=0;i<crates.length;i++){const c=crates[i];
    if(c.drop>0||c.dropv!==0){c.dropv-=30*dt;c.drop+=c.dropv*dt;if(c.drop<=0){c.drop=0;if(c.dropv<-4){c.dropv=-c.dropv*0.28;S.drop();burstChips(c.x,0.1,c.z,3);}else c.dropv=0;}}
    c.sqv+=(-c.sq*170-c.sqv*11)*dt;c.sq+=c.sqv*dt;
    let lt=-0.27;
    if(c.state==='closed'&&i===sug){lt-=0.2*Math.max(0,Math.sin(T*10))*(Math.sin(T*1.9)>0.3?1:0);}
    c.lidA=damp(c.lidA,lt,30,dt);
    const ut=c.state==='closed'?0:1;c.lidv+=((ut-c.lidU)*60-c.lidv*6)*dt;c.lidU+=c.lidv*dt;
    const pt=c.state==='closed'?0:1;c.pyv+=((pt-c.py)*90-c.pyv*7)*dt;c.py+=c.pyv*dt;
    c.wobv+=(-c.wob*130-c.wobv*7)*dt;c.wob+=c.wobv*dt;
    if(c.state==='closed'&&i===sug&&c.drop<=0){c.hopT+=dt;if(c.hopT>1.5){c.hopT=0;c.hopv=2.3;}}
    if(c.hop>0||c.hopv>0){c.hopv-=22*dt;c.hop+=c.hopv*dt;if(c.hop<=0){c.hop=0;c.hopv=0;}}
    c.spin+=dt*0.9;
  }
  for(let i=oldCrates.length-1;i>=0;i--){const c=oldCrates[i];c.leave+=dt;if(c.leave>0.9)oldCrates.splice(i,1);}
  for(let i=fpOld.length-1;i>=0;i--){fpOld[i].fade=(fpOld[i].fade||1)-dt*0.6;if(fpOld[i].fade<=0)fpOld.splice(i,1);}
  // おすすめの箱
  if(!build.done){if(build.suggest<0||crates[build.suggest].state!=='closed'){build.sugCd-=dt;if(build.sugCd<=0)pickSuggest();}}
  // お手本の手（約4秒操作なし→一度だけ）
  if(!hand.on&&!demoDone&&T-lastInput>4.2&&build.suggest>=0&&!build.done&&crates[build.suggest].drop<=0){hand.on=true;hand.t=0;hand.ci=build.suggest;demoDone=true;log('demo');}
  if(hand.on){hand.t+=dt;const c=crates[hand.ci];if(!c||hand.t>2.0)hand.on=false;else if(hand.t>0.62&&hand.t<0.95){c.demoSq=-0.1*Math.sin((hand.t-0.62)/0.33*PI);}else c.demoSq=0;}
  updCrane(dt);
  for(const v of vehicles)updVehicle(v,dt);
  for(let i=vehicles.length-1;i>=0;i--)if(vehicles[i].gone)vehicles.splice(i,1);
  if(build.veh){const v=build.veh;v.pulse=Math.max(0,v.pulse-dt*2.5);v.wobv+=(-v.wob*120-v.wobv*7)*dt;v.wob+=v.wobv*dt;}
  updFly(dt);
  // 風車
  windmill.w=Math.max(0.25,windmill.w*Math.exp(-0.22*dt));windmill.a+=windmill.w*dt;windmill.glow=Math.max(0,windmill.glow-dt*1.5);
  for(let i=0;i<6;i++)lamps[i]=Math.max(0,lamps[i]-dt*0.45);
  signalFlash=Math.max(0,signalFlash-dt*0.7);
  for(const t of towers)t.sq=Math.max(0,t.sq-dt*3);
  // 粒子
  for(let i=0;i<MAXP;i++){const p=PS[i];if(!p.on)continue;p.life-=dt;if(p.life<=0){p.on=false;pAlive--;continue;}
    if(p.type===0){p.vy-=12*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.z+=p.vz*dt;if(p.y<0.05){p.y=0.05;p.vy*=-0.35;p.vx*=0.6;p.vz*=0.6;}}
    else if(p.type===1){p.vy-=3*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.z+=p.vz*dt;}
    else{if(p.seek){const dx=WM[0]-p.x,dy=WM[1]-p.y,dz=WM[2]-p.z,d=Math.hypot(dx,dy,dz)||1;const sp=2.3;
        p.vx+=(dx/d*sp-p.vx)*1.4*dt;p.vy+=(dy/d*sp+0.15-p.vy)*1.4*dt;p.vz+=(dz/d*sp-p.vz)*1.4*dt;
        if(d<0.6){p.on=false;pAlive--;const nw=Math.min(9,windmill.w+0.8);if(windmill.w<2.5&&nw>=2.5)log('windmill',{w:nw});windmill.w=nw;windmill.glow=1;S.whoosh();continue;}}
      else p.vy+=0.2*dt;
      p.x+=p.vx*dt;p.y+=p.vy*dt;p.z+=p.vz*dt;p.size+=dt*(p.seek?0.08:0.12);}
  }
  for(const g of GT)if(g.life>0)g.life-=dt*0.9;
}

      push();tr(L*0.18,bt+0.33,0);box(MP,0.18,0.42,0.18,C.red);tr(0,0.25,0);box(MP,0.26,0.08,0.26,C.redD);tp(0,0.08,0,tmpv);v.emit.push([tmpv[0],tmpv[1],tmpv[2],true]);pop();}
    // ヘッドライト
    for(const s of [-1,1]){const lc=fl>0?C.lampW:C.lamp;const sz=0.11+fl*0.12;push();tr(L/2+(plane?0.0:0.06),bc+(train?0.2:0.06),s*(plane?0.18:0.2));
      box(MC,0.05+fl*0.1,sz,sz,lc,0);tp(0,0,0,tmpv);if(s===1)v.lights.push([tmpv[0],tmpv[1],tmpv[2]]);pop();}
  }
  // 部品ごとの形
  if(t==='W'&&!(nose&&(k==='car'||kart))){
    const pair=v.carrier>=0&&(i===v.carrier||i===v.carrier+1);
    let wy=0.19,ws=1;if(plane){wy=0.19+(1-v.gear)*0.16;ws=0.7+0.3*v.gear;}
    if(!train)for(const s of [-1,1]){push();tr(0,wy,s*0.36);wheel(0.19*ws,0.12,C.silver,spin,1);pop();}
    else for(const s of [-1,1]){push();tr(0,0.17,s*0.36);wheel(0.17,0.1,C.silver,spin,1);pop();}
    if(pair&&i===v.carrier+1){const span=v.lens[i]+v.lens[i-1]+(train?0.16:0.03);const cx=span/2-v.lens[i]/2;
      if(!train||true){for(const s of [-1,1])cube(cx,bt+0.07,s*0.29,span-0.06,0.12,0.05,C.wood1);cube(-v.lens[i]/2+0.03,bt+0.07,0,0.05,0.12,0.6,C.wood2);
        if(!train)cube(cx+span/2-0.03,bt+0.07,0,0.05,0.12,0.6,C.wood2);}
      if(v.load){push();tr(train?0:cx,bt+0.25,0);box(MC,0.36,0.36,0.36,v.load);tp(0,0,0,tmpv);v.cargoPos=[tmpv[0],tmpv[1],tmpv[2]];pop();}
    }
  }else if(t==='G'&&!(nose&&plane)){
    let fold;if(plane)fold=0;else if(v.jumpSeg===i)fold=lerp(PI/2*0.92,0.08,v.wingOpen);else fold=PI/2*0.92;
    const span=plane?0.75:0.62;
    for(const s of [-1,1]){push();tr(0,bt-0.04,s*0.3);rX(-s*fold);tr(0,0,s*span/2);box(MC,L*0.85,0.05,span,col);cube(0,0.01,s*span/2,L*0.85,0.06,0.1,C.blueL);pop();}
  }else if(t==='H'&&!(nose&&kart)){
    cube(-L*0.28,bt+0.15,0,0.1,0.28,0.4,C.greenD);push();tr(L*0.12,bt+0.18,0);rZ(-0.5);rY(PI/2);drawPart('H',0.4,0);pop();
  }else if(t==='C'&&!(nose&&train)){
    const tall=tail?0.5:0.3;push();tr(0,bt+tall/2,0);box(MP,0.18,tall,0.18,C.red);tr(0,tall/2+0.04,0);box(MP,0.27,0.08,0.27,C.redD);tp(0,0.05,0,tmpv);v.emit.push([tmpv[0],tmpv[1],tmpv[2],v.strong]);pop();
  }
  if(tail&&i>0){
    if(plane){cube(-L*0.2,bt+0.25,0,L*0.55,0.42,0.05,C.blue);cube(-L*0.25,bt+0.03,0,L*0.45,0.05,0.9,C.blueL);}
    else if(!train){for(const s of [-1,1])cube(-L/2-0.01,bc+0.04,s*0.22,0.04,0.08,0.12,C.red,0.2);}
  }
}
function drawVehicle(v,bx,by,bz){
  v.emit.length=0;v.lights.length=0;
  if(v.kind==='train'&&v.mode!=='build'){
    for(let i=0;i<v.segs.length;i++){let x,y,z,yaw;
      if(i===0){x=v.pos[0];y=v.pos[1];z=v.pos[2];yaw=v.yaw;}else{trailAt(v,v.segX[0]-v.segX[i],TMP2);x=TMP2[0];y=TMP2[1];z=TMP2[2];yaw=Math.atan2(-TMP2[5],TMP2[3]);}
      push();tr(x,y,z);rY(yaw);rX(v.wob*0.2);drawSeg(v,i,true);pop();}
    return;}
  push();
  if(v.mode==='build'){tr(bx,by,bz);}else{tr(v.pos[0],v.pos[1],v.pos[2]);rY(v.yaw);rZ(v.pitch);rX(v.roll);}
  rX(v.wob*0.2);const p=1+v.pulse*0.12*Math.sin(v.pulse*12);sc(p,2-p,p);
  for(let i=0;i<v.segs.length;i++){push();tr(v.segX[i],0,0);drawSeg(v,i,false);pop();}
  pop();
}
function drawHand(){
  if(!hand.on)return;const c=crates[hand.ci];if(!c)return;const t=hand.t;
  let y;if(t<0.62)y=lerp(4.2,CH+0.35,1-Math.pow(1-t/0.62,2));else if(t<0.95)y=CH+0.35-0.12*Math.sin((t-0.62)/0.33*PI);else y=lerp(CH+0.35,4.0,clamp((t-0.95)/0.8,0,1));
  const s=t>1.4?Math.max(0.01,1-(t-1.4)/0.6):1;
  push();tr(c.x+0.12,y,c.z+0.25);sc(s*1.5,s*1.5,s*1.5);rZ(0.15);
  cube(0,0.7,0,0.5,0.42,0.36,C.glove);cube(0,0.33,0.02,0.14,0.42,0.14,C.glove);cube(0,0.1,0.02,0.13,0.06,0.13,C.gloveD);
  for(let k=0;k<3;k++)cube(-0.15+k*0.0+0.13*k+0.0,0.47,0.02,0.12,0.14,0.15,C.gloveD);
  cube(-0.3,0.62,0.05,0.12,0.26,0.12,C.glove);cube(0,1.0,0,0.42,0.2,0.32,C.blue);
  pop();
}
function drawTown(){
  // 風車の羽根
  push();tr(WM[0],WM[1],WM[2]);box(MP,0.24,0.2,0.24,C.redD);rZ(windmill.a);
  for(let k=0;k<4;k++){push();rZ(k*PI/2);tr(0.72,0,0.06);box(MC,1.3,0.22,0.05,(k&1)?C.white:C.yellow);cube(0.2,0,0.03,0.9,0.05,0.04,C.woodD);pop();}pop();
  if(windmill.glow>0.05||windmill.w>2)cube(WM[0],1.25,WM[2]+0.1,0.3,0.24,0.04,mixc(C.glass,C.lampW,clamp(windmill.w/5,0,1)),windmill.w>2?0:0.8);
  // 建てた塔
  for(let n=0;n<towers.length;n++){const ti=Math.floor(n/10)%3,h=n%10,lay=Math.floor(n/30);const t=towers[n];const s=1+t.sq*0.25;
    push();tr(SITE[0]+(ti-1)*0.42,0.06+h*0.4+0.19+lay*0.02,SITE[1]+(lay%2)*0.1);sc(s,2-s,s);box(MC,0.38,0.38,0.38,t.col);pop();}
  // 空中橋のランプ
  for(let i=0;i<6;i++){const l=lamps[i];const z=BRIDGEZ+((i&1)?0.46:-0.46);cube(LAMPX[i],1.95,z,0.16,0.16,0.16,l>0.05?mixc(C.lamp,C.lampW,l):C.silverD,l>0.05?0:1);}
  // 信号
  const sf=signalFlash>0?(Math.sin(T*18)>0?1:0.3):0;
  cube(-0.75,1.92,-10.15,0.2,0.5,0.2,C.dark);
  cube(-0.75,2.06,-10.04,0.1,0.1,0.05,sf?C.lampW:hex(0x3fdc6c),0);cube(-0.75,1.9,-10.04,0.1,0.1,0.05,sf?C.lamp:C.dark,sf?0:1);cube(-0.75,1.76,-10.04,0.1,0.1,0.05,sf?C.lampW:C.dark,sf?0:1);
  // 道路の光
  for(const g of GT){if(g.life<=0)continue;push();tr(g.x,g.y+0.065,g.z);rY(g.yaw);box(MC,0.5*g.life+0.1,0.012,0.55,mixc(C.road,g.col,g.life),g.life>0.3?0:1,true);pop();}
  // 飛ぶ積み木
  for(const f of flyBlocks){const u=clamp(f.t/f.dur,0,1);let to;if(f.kind==='load'){const v=f.to;to=v&&!v.gone?(v.cargoPos||[v.pos[0],v.pos[1]+0.7,v.pos[2]]):f.from;}
    else{const n=towers.length,ti=Math.floor(n/10)%3,h=n%10;to=[SITE[0]+(ti-1)*0.42,0.25+h*0.4,SITE[1]];}
    const x=lerp(f.from[0],to[0],u),y=lerp(f.from[1],to[1],u)+Math.sin(u*PI)*1.6,z=lerp(f.from[2],to[2],u);
    push();tr(x,y,z);rY(u*4);rX(u*3);box(MC,0.36,0.36,0.36,f.col);pop();}
}
function drawParticles(){
  for(let i=0;i<MAXP;i++){const p=PS[i];if(!p.on)continue;const a=p.life/p.max;
    let s=p.size;if(p.type===2)s*=Math.min(1,(1-a)*6+0.3)*(p.seek?1:Math.min(1,a*2));else if(p.type===1)s*=Math.min(1,a*2);
    push();tr(p.x,p.y,p.z);rY(p.spin);box(MC,s,s,s,p.col,p.lit,true);pop();}
}
function render(){
  DC.n=0;DN.n=0;tgtC=DC;tgtN=DN;ident();
  drawWall();drawTable();drawCrane();
  const sug=build.done?-1:build.suggest;
  for(let i=0;i<crates.length;i++)drawCrate(crates[i],i===sug,i);
  for(const c of oldCrates)drawCrate(c,false,0);
  drawFootprints(build.fp);drawFootprints(fpOld);
  if(build.veh&&build.veh.mode==='build'&&build.veh.segs.length){const v=build.veh;drawVehicle(v,TABLE.front-v.length/2,table.y,TABLE.z);}
  for(const v of vehicles)drawVehicle(v);
  drawTown();drawParticles();drawHand();
  // camera
  const sway=Math.sin(T*0.25)*0.018;if(dbgCam){perspective(PR,0.7,W/H,0.3,140);lookAt(VW,dbgCam[0],dbgCam[1]);mul(VP,PR,VW);}else camMat(cam.t,cam.D,W/H,sway,VP);
  gl.clearColor(C.floor[0]*0.5,C.floor[1]*0.5,C.floor[2]*0.55,1);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
  gl.uniformMatrix4fv(uVP,false,VP);gl.uniformMatrix4fv(uM,false,IDM);gl.uniform1f(uS,0);
  bindBuf(bufSN);gl.drawArrays(gl.TRIANGLES,0,nSN);
  bindBuf(bufSC);gl.drawArrays(gl.TRIANGLES,0,nSC);
  gl.bindBuffer(gl.ARRAY_BUFFER,bufDC);gl.bufferData(gl.ARRAY_BUFFER,DC.a.subarray(0,DC.n*10),gl.DYNAMIC_DRAW);bindBuf(bufDC);gl.drawArrays(gl.TRIANGLES,0,DC.n);
  if(DN.n){gl.bindBuffer(gl.ARRAY_BUFFER,bufDN);gl.bufferData(gl.ARRAY_BUFFER,DN.a.subarray(0,DN.n*10),gl.DYNAMIC_DRAW);bindBuf(bufDN);gl.drawArrays(gl.TRIANGLES,0,DN.n);}
  // 影
  gl.uniform1f(uS,1);gl.uniformMatrix4fv(uM,false,SHM);gl.enable(gl.POLYGON_OFFSET_FILL);gl.polygonOffset(-1,-1);
  bindBuf(bufSC);gl.drawArrays(gl.TRIANGLES,0,nSC);bindBuf(bufDC);gl.drawArrays(gl.TRIANGLES,0,DC.n);
  gl.disable(gl.POLYGON_OFFSET_FILL);
  if(tapT){respMs=performance.now()-tapT;tapT=0;}
}

// ---------------- input ----------------
const pv=[0,0,0];
function toScreen(x,y,z){projP(VP,x,y,z,pv);return [(pv[0]*0.5+0.5)*W,(1-(pv[1]*0.5+0.5))*H,pv[2]];}
function crateRect(c){let a=1e9,b=-1e9,cc=1e9,d=-1e9;const h=CS/2;
  for(const dx of [-h,h])for(const dy of [0,CH+0.5])for(const dz of [-h,h]){const s=toScreen(c.x+dx,c.drop+dy,c.z+dz);a=Math.min(a,s[0]);b=Math.max(b,s[0]);cc=Math.min(cc,s[1]);d=Math.max(d,s[1]);}
  return [a,b,cc,d];}
let tapT=0,respMs=-1;
function onTap(x,y){
  tapT=performance.now();lastInput=T;demoDone=false;if(hand.on){hand.on=false;for(const c of crates)c.demoSq=0;}
  // 箱
  let best=-1,bd=1e9;
  for(let i=0;i<crates.length;i++){const c=crates[i];if(c.drop>0.6)continue;const r=crateRect(c);const pad=10;
    if(x>=r[0]-pad&&x<=r[1]+pad&&y>=r[2]-pad&&y<=r[3]+pad){const cx=(r[0]+r[1])/2,cy=(r[2]+r[3])/2;const d=Math.hypot(x-cx,y-cy);if(d<bd){bd=d;best=i;}}}
  if(best>=0){const c=crates[best];if(c.state==='closed'&&!build.done)openCrate(best);else{c.wobv+=3;S.tick();}return;}
  // 町の乗り物
  for(const v of vehicles){const s=toScreen(v.pos[0],v.pos[1]+0.3,v.pos[2]);const e=toScreen(v.pos[0]+0.9,v.pos[1]+0.3,v.pos[2]);const r=Math.max(26,Math.abs(e[0]-s[0])*1.3);
    if(Math.hypot(x-s[0],y-s[1])<r){v.wobv+=3;S.honk(v.kind,true);return;}}
  // 組み立て台の乗り物・クレーン
  if(build.veh&&build.veh.segs.length){const s=toScreen(TABLE.front-build.veh.length/2,table.y+0.4,TABLE.z);if(Math.hypot(x-s[0],y-s[1])<60){build.veh.wobv+=2.5;S.tick();return;}}
  {const s=toScreen(TOWER[0],3,TOWER[1]);const e=toScreen(TOWER[0],5.8,TOWER[1]);if(Math.abs(x-s[0])<34&&y>e[1]-20&&y<s[1]+80){crane.wobv+=2;S.tick();return;}}
}
cv.addEventListener('pointerdown',e=>{e.preventDefault();initAudio();onTap(e.clientX,e.clientY);},{passive:false});
for(const ev of ['pointerup','pointercancel','pointermove','pointerleave'])cv.addEventListener(ev,e=>{e.preventDefault();if(ev==='pointerup')initAudio();},{passive:false});
for(const ev of ['touchstart','touchmove','touchend'])document.addEventListener(ev,e=>{if(e.cancelable)e.preventDefault();if(ev==='touchend')initAudio();},{passive:false});
for(const ev of ['gesturestart','gesturechange','gestureend','contextmenu','dblclick','selectstart'])document.addEventListener(ev,e=>e.preventDefault(),{passive:false});
window.addEventListener('resize',resize);window.addEventListener('orientationchange',()=>setTimeout(resize,120));

// ---------------- loop ----------------
let running=false,raf=0,lastT=0,dbgCam=null;
function frame(ts){raf=requestAnimationFrame(frame);let dt=(ts-lastT)/1000;lastT=ts;if(!(dt>0))dt=0;dt=Math.min(dt,0.05);
  const n=Math.max(1,Math.round(timeScale));for(let k=0;k<n;k++)update(dt);render();}
function start(){if(running)return;running=true;lastT=performance.now();raf=requestAnimationFrame(frame);}
function stop(){running=false;cancelAnimationFrame(raf);}
document.addEventListener('visibilitychange',()=>{if(document.hidden){stop();if(AC&&AC.suspend)AC.suspend().catch(()=>{});}else{if(AC&&AC.resume)AC.resume().catch(()=>{});start();}});

// ---------------- 検証用の読み取り口（ゲームの動作には影響しない） ----------------
window.__gf={
  crates:()=>crates.map((c,i)=>{const r=crateRect(c);return {i,part:c.part,state:c.state,taken:c.taken,cx:(r[0]+r[1])/2,cy:(r[2]+r[3])/2,rect:r};}),
  state:()=>({T,build:build.segs,veh:build.veh?build.veh.segs.join(''):'',order:build.order.slice(),suggest:build.suggest,done:build.done,wall:wall.open,
    vehicles:vehicles.map(v=>({id:v.id,kind:v.kind,segs:v.segs.join(''),mode:v.mode,x:+v.pos[0].toFixed(2),y:+v.pos[1].toFixed(2),z:+v.pos[2].toFixed(2),load:!!v.load,wing:+v.wingOpen.toFixed(2),ftype:v.ftype||'',leader:v.leader?v.leader.id:0})),
    windmill:+windmill.w.toFixed(2),towers:towers.length,particles:pAlive,hand:hand.on,crane:{task:!!crane.task,carry:crane.carry},lid:crates.map(c=>+c.lidU.toFixed(2))}),
  log:()=>LOG.slice(),resp:()=>respMs,audio:()=>AC?AC.state:'none',speed:n=>{timeScale=n;},
  screen:(x,y,z)=>toScreen(x,y,z),cam:(e,t)=>{dbgCam=e?[e,t]:null;},
  bench:n=>{const t0=performance.now();for(let k=0;k<n;k++){update(1/60);render();}return (performance.now()-t0)/n;},verts:()=>DC.n+DN.n+nSC+nSN
};

buildStatic();resize();newBuild(false);start();
})();
</script>
