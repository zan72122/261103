<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">
<title>チョキチョキ！もじゃもじゃ床屋と積み木のおうち</title>
<style>
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#6c8095;
  touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  overscroll-behavior:none;-webkit-tap-highlight-color:transparent;}
canvas{position:fixed;left:0;top:0;width:100%;height:100%;display:block;touch-action:none;outline:none;}
#sa{position:fixed;left:0;top:0;width:0;height:0;visibility:hidden;pointer-events:none;
  padding-top:env(safe-area-inset-top);padding-right:env(safe-area-inset-right);
  padding-bottom:env(safe-area-inset-bottom);padding-left:env(safe-area-inset-left);}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="sa"></div>
<script>
(function(){
'use strict';
/* ============================================================
   チョキチョキ！もじゃもじゃ床屋と積み木のおうち
   核: 髪やひげを横スワイプで切る → 切れ端の角材が落ちて家の材料になる
   ============================================================ */
const cv = document.getElementById('c');
const ctx = cv.getContext('2d', { alpha: false });
const saEl = document.getElementById('sa');

let W = 0, H = 0, DPR = 1, K = 1, LW = 390, LH = 840;
const SA = { t: 0, r: 0, b: 0, l: 0 };
const L = { ox: 0, oy: 0, base: 780, headTop: 112, horizon: 412, mirrorX: 147 };

const V = 20;            // 髪ボクセル
const CELL = 36;         // 家の積み木1マス
const COLS = 7;
const MAXR = 10;
const ROWLIM = 9;        // これより上は載らずに転がり落ちる
const DEP = 18;          // 積み木の奥行き
const HDEP = 11;         // 髪ボクセルの奥行き
const GAP = 64;
const SPACING = COLS * CELL + GAP;
const DOORC = 3;
const SLOTS = [1, 5];    // 窓の候補列
const MAXPART = 90;
const MAXRUBBLE = 36;

/* ---------- 色 (1面1色・光源は左上) ---------- */
function shade(hex, f) {
  const n = parseInt(hex.slice(1), 16);
  let r = n >> 16, g = (n >> 8) & 255, b = n & 255;
  if (f > 0) { r += (255 - r) * f; g += (255 - g) * f; b += (255 - b) * f; }
  else { r *= 1 + f; g *= 1 + f; b *= 1 + f; }
  return 'rgb(' + (r | 0) + ',' + (g | 0) + ',' + (b | 0) + ')';
}
function pal(hex) { return { f: hex, t: shade(hex, 0.24), s: shade(hex, -0.3) }; }
const P = {
  brown: pal('#8a5a3a'), cream: pal('#eee0c0'), mint: pal('#74c6a9'), ver: pal('#e0553a'),
  skin: pal('#e9b48b'), slab: pal('#d6c9ad'), mann: pal('#b6c3cf'), door: pal('#5c3f2c'),
  chair: pal('#c84a32'), wall: pal('#7d8fa3'), hand: pal('#e9b48b'), ghost: pal('#f6f1e4')
};
const BG = '#6c8095', FLOOR = '#8e9cab', FLOORLN = '#8393a3', DARK = '#262d3a', GAPC = '#3b4656';

/* ---------- かつら(長さ違い) ---------- */
const WIGS = [
  { hair: 'ver', bang: 3, side: 3, beard: 3 },     // みじかい
  { hair: 'brown', bang: 4, side: 5, beard: 5 },   // ふつう(最初の髪)
  { hair: 'mint', bang: 5, side: 6, beard: 6 }     // ながい
];

let TID = 0;
function T(kind, x, root, len, stub, col) {
  return { id: ++TID, kind, x, root, len, stub, col, disp: len, sq: 0, sqv: 0, ph: Math.random() * 6, hop: 0, part: 0 };
}
function makeTufts(w, grow) {
  const a = [];
  [-2, -1, 0, 1, 2].forEach(x => a.push(T('bang', x, 1, w.bang, 1, w.hair)));
  [-4, 4].forEach(x => a.push(T('side', x, 1, w.side, 1, w.hair)));
  [-2, -1, 0, 1, 2].forEach(x => a.push(T('beard', x, 6.6, w.beard, 1, 'cream')));
  [-0.75, 0.75].forEach(x => a.push(T('mus', x, 5.1, 2, 0, 'brown')));
  if (grow) a.forEach(t => { t.disp = 0; });
  return a;
}
const WIG_TUFTS = WIGS.map(w => makeTufts(w, false));

/* ---------- 状態 ---------- */
const S = {
  t: 0, mode: 'build', houses: [], cur: null, tufts: [], pieces: [], parts: [], trail: [], rings: [], timers: [],
  uncle: {
    x: 0, y: 0, tx: 0, ty: 0, tilt: 0, bow: 0, bowT: 0, shrug: 0, expr: 'neutral', exprT: 0,
    blink: 0, blinkT: 2.5, burst: [0, 0], seen: [false, false], lx: 0, ly: 600, px: 0, py: 0,
    mirror: 0, mirrorT: 0, blush: 0, laugh: 0, partT: 0, partCool: 3, partAmt: 0, hairCol: 'brown', bounce: 0, turn: 0
  },
  hands: [{ x: -124, y: 364, g: null }, { x: 124, y: 364, g: null }],
  hat: { state: 'hook', x: 0, y: 0, drop: 0, fly: null },
  shelf: 0, shelfT: 0, wigFly: null, wigSpec: WIGS[1], cycle: 0, suggest: 0,
  idle: 0, demoAt: 4, demo: null, target: null, targetCool: 0,
  combo: 0, lastCut: -9, wob: { mirror: 0, hat: 0, face: 0, shelf: [0, 0, 0] }, active: null, plotCx: 0,
  compPending: false, BID: 0, log: []
};
function after(d, fn) { S.timers.push({ t: S.t + d, fn }); }
function rand(a, b) { return a + Math.random() * (b - a); }
function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
function lerp(a, b, t) { return a + (b - a) * t; }
function note(ev) { S.log.push({ t: +S.t.toFixed(2), ev }); if (S.log.length > 400) S.log.shift(); }

/* ---------- レイアウト ---------- */
function readSafe() {
  try {
    const cs = getComputedStyle(saEl);
    SA.t = parseFloat(cs.paddingTop) || 0; SA.r = parseFloat(cs.paddingRight) || 0;
    SA.b = parseFloat(cs.paddingBottom) || 0; SA.l = parseFloat(cs.paddingLeft) || 0;
  } catch (e) { SA.t = SA.r = SA.b = SA.l = 0; }
}
function layout() {
  W = Math.max(1, window.innerWidth); H = Math.max(1, window.innerHeight);
  DPR = Math.min(2, window.devicePixelRatio || 1);
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  readSafe();
  const aw = Math.max(200, W - SA.l - SA.r), ah = Math.max(300, H - SA.t - SA.b);
  K = Math.min(aw / 390, ah / 840);
  LW = aw / K; LH = ah / K;
  L.ox = SA.l + aw / 2; L.oy = SA.t;
  L.base = LH - 58;
  L.headTop = 112;
  L.horizon = L.headTop + 15 * V;
  L.mirrorX = Math.min(LW / 2 - 50, 250);
  placeHouses(true);
}
function placeHouses(snap) {
  const n = S.houses.length;
  S.plotCx = (LW < 560 && n > 1) ? 56 : 0;
  S.houses.forEach((h, i) => {
    h.tcx = S.plotCx - (n - 1 - i) * SPACING;
    if (snap) h.cx = h.tcx;
  });
}
function X0(h) { return h.cx - COLS * CELL / 2; }
function headTop() { return L.headTop + S.uncle.y; }
function toL(e) { return { x: (e.clientX - L.ox) / K, y: (e.clientY - L.oy) / K }; }

/* ---------- 音 (Web Audio 合成) ---------- */
let AC = null, master = null, noiseBuf = null;
function initAudio() {
  try {
    if (!AC) {
      const C = window.AudioContext || window.webkitAudioContext;
      if (!C) return;
      AC = new C();
      master = AC.createGain(); master.gain.value = 0.55; master.connect(AC.destination);
      noiseBuf = AC.createBuffer(1, AC.sampleRate * 0.5, AC.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      const b = AC.createBuffer(1, 1, AC.sampleRate), s = AC.createBufferSource();
      s.buffer = b; s.connect(master); s.start(0);
    }
    if (AC.state === 'suspended') { const p = AC.resume(); if (p && p.catch) p.catch(() => {}); }
  } catch (e) { AC = null; }
}
function tone(f, dur, o) {
  if (!AC || AC.state !== 'running') return;
  o = o || {};
  try {
    const t0 = AC.currentTime + (o.delay || 0);
    const osc = AC.createOscillator(), g = AC.createGain();
    osc.type = o.type || 'sine';
    osc.frequency.setValueAtTime(f, t0);
    if (o.to) osc.frequency.exponentialRampToValueAtTime(Math.max(20, o.to), t0 + dur);
    const v = o.vol == null ? 0.2 : o.vol;
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(v, t0 + (o.attack || 0.006));
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(g); g.connect(master);
    osc.start(t0); osc.stop(t0 + dur + 0.03);
  } catch (e) {}
}
function noise(dur, o) {
  if (!AC || AC.state !== 'running' || !noiseBuf) return;
  o = o || {};
  try {
    const t0 = AC.currentTime + (o.delay || 0);
    const s = AC.createBufferSource(); s.buffer = noiseBuf;
    const f = AC.createBiquadFilter(); f.type = o.type || 'bandpass'; f.frequency.value = o.freq || 2000; f.Q.value = o.q || 1;
    const g = AC.createGain(); const v = o.vol == null ? 0.2 : o.vol;
    g.gain.setValueAtTime(v, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    s.connect(f); f.connect(g); g.connect(master);
    s.start(t0, Math.random() * 0.2); s.stop(t0 + dur + 0.02);
  } catch (e) {}
}
const sfx = {
  snip(c) {
    const p = 1 + Math.min(c, 6) * 0.05;
    noise(0.035, { freq: 5200 * p, type: 'highpass', vol: 0.22 });
    tone(2500 * p, 0.035, { type: 'square', vol: 0.05, to: 1700 * p });
    noise(0.03, { freq: 6500 * p, type: 'highpass', vol: 0.16, delay: 0.055 });
  },
  knock(sz) {
    const f = sz <= 1 ? 880 : sz <= 2 ? 640 : sz <= 4 ? 430 : 290;
    tone(f, 0.13, { type: 'triangle', vol: 0.28, to: f * 0.72 });
    noise(0.05, { freq: f * 1.6, q: 2, vol: 0.13 });
  },
  squish() { tone(340, 0.13, { vol: 0.2, to: 210 }); },
  blink() { tone(1750, 0.03, { vol: 0.08 }); tone(2100, 0.03, { vol: 0.08, delay: 0.13 }); },
  giggle() { for (let i = 0; i < 6; i++) tone(640 + (i % 2) * 170 + i * 18, 0.07, { type: 'triangle', vol: 0.12, delay: i * 0.085 }); },
  creak() { tone(150, 0.45, { type: 'sawtooth', vol: 0.06, to: 96 }); },
  relief() { tone(392, 0.18, { vol: 0.14, to: 523 }); tone(659, 0.25, { vol: 0.11, delay: 0.15 }); },
  crash() {
    for (let i = 0; i < 5; i++) tone(rand(250, 560), 0.1, { type: 'triangle', vol: 0.2, delay: i * 0.06, to: 180 });
    noise(0.32, { freq: 700, q: 0.7, vol: 0.18 });
  },
  roll() { tone(210, 0.22, { type: 'triangle', vol: 0.14, to: 170 }); noise(0.2, { freq: 300, q: 0.8, vol: 0.08 }); },
  windowChime() { tone(1319, 0.5, { vol: 0.12 }); tone(1760, 0.6, { vol: 0.09, delay: 0.1 }); tone(2637, 0.4, { vol: 0.05, delay: 0.2 }); },
  click(i) { tone(950 + i * 30, 0.04, { type: 'square', vol: 0.06 }); },
  bump() { tone(130, 0.2, { vol: 0.3, to: 88 }); noise(0.06, { freq: 420, vol: 0.12 }); },
  fanfare() {
    [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.18, { type: 'triangle', vol: 0.18, delay: i * 0.11 }));
    [523, 659, 784, 1047].forEach(f => tone(f, 0.9, { type: 'sine', vol: 0.08, delay: 0.5 }));
  },
  pop() { tone(480, 0.09, { to: 980, vol: 0.14 }); },
  wig() { noise(0.25, { freq: 1300, q: 0.6, vol: 0.09 }); tone(380, 0.32, { to: 900, vol: 0.11, delay: 0.12 }); },
  grow() { tone(300, 0.5, { to: 760, vol: 0.08, type: 'triangle' }); },
  step(i, up) { tone(up ? 620 + i * 85 : 1150 - i * 85, 0.08, { type: 'triangle', vol: 0.14 }); },
  bridge() { tone(784, 0.45, { vol: 0.12, to: 1047 }); tone(1568, 0.6, { vol: 0.06, delay: 0.2 }); },
  tap() { tone(560, 0.05, { vol: 0.06 }); },
  combo(n) { tone(880 + n * 60, 0.06, { type: 'triangle', vol: 0.07 }); }
};

/* ---------- 家 ---------- */
function newHouse(cx) {
  const g = [];
  for (let c = 0; c < COLS; c++) g.push(new Array(MAXR).fill(0));
  g[DOORC][0] = -1; g[DOORC][1] = -1;
  return {
    cx, tcx: cx, g, blocks: [], windows: new Set(), eave: 0, roof: null, rubble: [], orderN: 0,
    tiltL: 0, tiltR: 0, tiltLT: 0, tiltRT: 0, tiltState: 0, done: false, conn: null,
    doorWob: 0, wob: 0, leftH: 0, rightH: 0, topH: 0, glow: 0
  };
}
function colHeight(h, c) {
  for (let r = MAXR - 1; r >= 0; r--) if (h.g[c][r] !== 0) return r + 1;
  return 0;
}
function filled(h, c, r) { return c >= 0 && c < COLS && r >= 0 && r < MAXR && h.g[c][r] !== 0; }
function wallH(h, side) {
  let m = 0;
  const cs = side < 0 ? [0, 1, 2] : [4, 5, 6];
  for (const c of cs) m = Math.max(m, colHeight(h, c));
  return m;
}
function slotOpen(h, c) {
  if (h.g[c][1] !== 0 || h.g[c][2] !== 0) return false;
  for (let r = 3; r < MAXR; r++) if (h.g[c][r] !== 0) return false;
  return true;
}
function neighborsFilled(h, c) {
  return filled(h, c - 1, 1) && filled(h, c - 1, 2) && filled(h, c + 1, 1) && filled(h, c + 1, 2);
}
// 小片が収まる一番低い場所(隙間を優先して埋める・窓の口は残す)
function fillableRow(h, c) {
  const isSlot = SLOTS.indexOf(c) >= 0;
  const win = h.windows.has(c);
  const open = isSlot && !win && slotOpen(h, c);
  for (let r = 0; r < ROWLIM; r++) {
    if (h.g[c][r] !== 0) continue;
    if (isSlot && (r === 1 || r === 2) && (win || open)) continue;
    if (open && r === 3 && !neighborsFilled(h, c)) return -1;
    return r;
  }
  return -1;
}
function restRow(h, c0, w) {
  let r = 0;
  for (let c = c0; c < c0 + w; c++) r = Math.max(r, colHeight(h, c));
  return r;
}
function hOf(n) { return n <= 2 ? 1 : n <= 4 ? 2 : 3; }
function colF(xv) { return (xv + 4.5) / 9 * COLS; }

function planSmall(h, cf) {
  const c0 = clamp(Math.floor(cf), 0, COLS - 1);
  let best = null;
  for (const dc of [0, -1, 1]) {
    const c = c0 + dc;
    if (c < 0 || c >= COLS) continue;
    const r = fillableRow(h, c);
    if (r < 0) continue;
    if (!best || r < best.r) best = { c, r };
  }
  if (!best) {
    for (let c = 0; c < COLS; c++) {
      const r = fillableRow(h, c);
      if (r >= 0 && (!best || r < best.r || (r === best.r && Math.abs(c - c0) < Math.abs(best.c - c0)))) best = { c, r };
    }
  }
  if (!best) best = { c: c0, r: colHeight(h, c0), over: true };
  return best;
}
function planBlock(p) {
  const h = S.cur;
  if (p.fixedC != null) {
    return { c: p.fixedC, r: restRow(h, p.fixedC, p.w) };
  }
  const cf = p.cf != null ? p.cf : colF(p.xs.reduce((a, b) => a + b, 0) / p.xs.length);
  if (p.w === 1 && p.h === 1) return planSmall(h, cf);
  const w = Math.min(p.w, COLS);
  const c0 = clamp(Math.round(cf - w / 2), 0, COLS - w);
  return { c: c0, r: restRow(h, c0, w) };
}
function findTower(h, c0, w, r) {
  let best = null;
  const cand = [c0 - 1, c0 - 2, c0 + w, c0 + w + 1];
  for (const tc of cand) {
    if (tc < 0 || tc >= COLS) continue;
    const ch = colHeight(h, tc);
    if (tc === DOORC && ch <= 2) continue;
    if (ch >= r + 2 && ch >= 3) {
      const dist = tc < c0 ? c0 - tc : tc - (c0 + w - 1);
      if (!best || dist < best.dist || (dist === best.dist && ch > best.ch)) best = { tc, dist, ch, dir: tc < c0 ? -1 : 1 };
    }
  }
  return best;
}
function blockSide(b) { const cc = b.c + (b.w - 1) / 2; return cc < 3 ? -1 : cc > 3 ? 1 : 0; }

function placeBlock(h, p, c, r) {
  const b = { id: ++S.BID, c, r, w: p.w, h: p.h, col: p.col, order: h.orderN++, kind: p.kind, land: 1, pop: 0, ry: r, small: p.w === 1 && p.h === 1 };
  for (let cc = c; cc < c + b.w; cc++) for (let rr = r; rr < r + b.h; rr++) h.g[cc][rr] = b.id;
  h.blocks.push(b);
  // 窓: 小片が開口の上にまぐさとして載り、左右が埋まっていたら窓枠
  if (b.small && SLOTS.indexOf(c) >= 0 && r === 3 && !h.windows.has(c) &&
      h.g[c][1] === 0 && h.g[c][2] === 0 && h.g[c][0] !== 0 && neighborsFilled(h, c)) {
    h.windows.add(c);
    sfx.windowChime();
    const x = X0(h) + (c + 0.5) * CELL, y = L.base - 2 * CELL;
    burst(x, y, 10, 'spark', P.mint.f);
    S.uncle.expr = 'happy'; S.uncle.exprT = 1.0;
    note('window:' + c);
  }
  return b;
}
function knock(h, list, dir) {
  const x0 = X0(h);
  for (const b of list) {
    const i = h.blocks.indexOf(b);
    if (i < 0) continue;
    h.blocks.splice(i, 1);
    for (let cc = b.c; cc < b.c + b.w; cc++) for (let rr = b.r; rr < b.r + b.h; rr++) if (h.g[cc][rr] === b.id) h.g[cc][rr] = 0;
    const d = dir || (blockSide(b) || (Math.random() < 0.5 ? -1 : 1));
    addRubble(h, x0 + (b.c + b.w / 2) * CELL, L.base - (b.ry + b.h / 2) * CELL, b, d);
  }
}
function addRubble(h, x, y, b, dir) {
  h.rubble.push({
    rx: x - h.cx, y, vx: dir * rand(110, 260), vy: rand(-380, -200), rot: 0, vr: dir * rand(4, 9),
    w: b.w, h: b.h, col: b.col, rest: false, fy: L.base + rand(12, 44), s: 0.72
  });
  while (h.rubble.length > MAXRUBBLE) h.rubble.shift();
}
// 支えを失った積み木を落とす(窓の口は保護)
function resettle(h) {
  for (let c = 0; c < COLS; c++) for (let r = 0; r < MAXR; r++) if (h.g[c][r] > 0) h.g[c][r] = 0;
  for (const c of h.windows) { h.g[c][1] = -2; h.g[c][2] = -2; }
  const bl = h.blocks.slice().sort((a, b) => a.r - b.r);
  for (const b of bl) {
    let r = b.r;
    while (r > 0) {
      let free = true;
      for (let c = b.c; c < b.c + b.w; c++) if (h.g[c][r - 1] !== 0) { free = false; break; }
      if (!free) break;
      r--;
    }
    b.r = r;
    for (let c = b.c; c < b.c + b.w; c++) for (let rr = r; rr < r + b.h; rr++) h.g[c][rr] = b.id;
  }
  for (const c of h.windows) {
    if (h.g[c][1] === -2) h.g[c][1] = 0;
    if (h.g[c][2] === -2) h.g[c][2] = 0;
  }
  for (const c of Array.from(h.windows)) {
    if (!(filled(h, c, 3) && filled(h, c, 0) && neighborsFilled(h, c))) h.windows.delete(c);
  }
}
function updateTilt(h, depth) {
  const Lh = wallH(h, -1), Rh = wallH(h, 1), d = Lh - Rh;
  if (Math.abs(d) >= 4 && !depth) {
    const side = d > 0 ? -1 : 1, low = Math.min(Lh, Rh);
    const cs = side < 0 ? [0, 1, 2] : [4, 5, 6];
    const list = h.blocks.filter(b => b.r + b.h > low + 2 && cs.some(c => c >= b.c && c < b.c + b.w));
    if (list.length) {
      knock(h, list, side);
      resettle(h);
      sfx.crash();
      S.uncle.expr = 'oops'; S.uncle.exprT = 1.3; S.uncle.shrug = 1;
      note('collapse:' + (side < 0 ? 'L' : 'R'));
      return updateTilt(h, 1);
    }
  }
  h.tiltLT = d >= 2 ? -Math.min(10, (d - 1) * 4) : 0;
  h.tiltRT = d <= -2 ? Math.min(10, (-d - 1) * 4) : 0;
  const st = d >= 2 ? -1 : d <= -2 ? 1 : 0;
  if (st !== 0 && h.tiltState === 0) {
    sfx.creak(); S.uncle.expr = 'worried'; S.uncle.exprT = 1.6; note('tilt:' + (st < 0 ? 'L' : 'R'));
  } else if (st === 0 && h.tiltState !== 0) {
    sfx.relief(); S.uncle.expr = 'happy'; S.uncle.exprT = 1.2;

/* ---------- 粒子 ---------- */
function burst(x, y, n, type, col) {
  for (let i = 0; i < n; i++) {
    if (S.parts.length >= MAXPART) S.parts.shift();
    const a = rand(0, Math.PI * 2), sp = type === 'spark' ? rand(60, 200) : rand(40, 160);
    S.parts.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - (type === 'dust' ? 40 : 80), life: type === 'spark' ? 0.6 : 0.5, max: 0.6, col, sz: type === 'spark' ? rand(3, 6) : rand(3, 7), type, rot: rand(0, 3) });

/* ---------- 切る ---------- */
function tuftGeo(t) {

}

    let p;

      p = { type: 'eave', x, y: yCut + cutLen * V, vx: 0, vy: -60, w: 1, h: 1, elen: cutLen, col: t.col, s: 0.6, rot: 0, vr: 0, state: 'fall', xs: [t.x], t: 0 };
    } else {
      p = { type: 'block', x, y: yCut + cutLen * V, vx: 0, vy: -140, w: 1, h: hOf(cutLen), col: t.col, s: V / CELL, rot: rand(-0.12, 0.12), vr: rand(-2, 2), state: 'fall', xs: [t.x], kind: t.kind, t: 0 };
    }

  if (S.combo >= 3) sfx.combo(S.combo);
  burst(g.x, yCut, 4, 'hair', P[t.col].f);
  burst(g.x, yCut, 2, 'spark', '#ffffff');

  else if (t.kind === 'beard') { u.expr = isTarget ? 'shrug' : 'wow'; u.exprT = 0.9; u.shrug = 1; }
  else if (t.kind === 'side') { u.expr = isTarget ? 'happy' : 'wow'; u.exprT = 0.8; }

}

/* ---------- タップ ---------- */
function hitTuft(x, y) {

    const g = tuftGeo(t);
    const hb = (t.kind === 'mus' ? 0.4 : 0.5) * V + 10;
    const tip = g.root + Math.max(t.len, 0.6) * V;
    if (Math.abs(x - g.x) > hb || y < g.root - 6 || y > tip + 0.5 * V) continue;
    const d = Math.abs(x - g.x) + (t.kind === 'mus' ? -4 : 0);

}
function hitRubble(x, y) {

  for (let i = h.rubble.length - 1; i >= 0; i--) {
    const r = h.rubble[i];
    const rx = h.cx + r.rx, w = r.w * CELL * r.s, hh = r.h * CELL * r.s;

}
function wigPos(i) { const sp = Math.min(150, LW * 0.3); return { x: (i - 1) * sp, y: 14 - (1 - S.shelf) * 150 }; }
function hitWig(x, y) {
  const sp = Math.min(150, LW * 0.3);

}

  }
  if (S.mode === 'build') {
    const t = hitTuft(x, y);

  }

    const x0 = X0(h);

/* ---------- 角材の落下・着地 ---------- */
function updatePieces(dt) {
  const h = S.cur;
  for (let i = S.pieces.length - 1; i >= 0; i--) {
    const p = S.pieces[i];
    p.t += dt;
    if (p.type === 'eave') {
      const x0 = X0(h), tx = x0 + (DOORC + 0.5) * CELL, ty = L.base - 2 * CELL - 4;
      p.vy += 1500 * dt; p.y += p.vy * dt;
      p.x += (tx - p.x) * Math.min(1, dt * 5);
      p.s += (1 - p.s) * Math.min(1, dt * 4);
      if (p.y >= ty && p.vy > 0) {
        h.eave = Math.min(4, h.eave + p.elen);
        sfx.knock(1);
        burst(tx, ty, 5, 'dust', '#e8ddc6');
        S.pieces.splice(i, 1);
        note('eave:' + h.eave);
      }
      continue;
    }
    if (p.state === 'fall') {
      p.vy += 2000 * dt; p.y += p.vy * dt;
      p.rot += p.vr * dt; p.rot *= Math.pow(0.1, dt);
      p.s += (1 - p.s) * Math.min(1, dt * 4.5);
      p.plan = planBlock(p);
      const pl = p.plan;
      const tx = X0(h) + (pl.c + p.w / 2) * CELL, ty = L.base - pl.r * CELL;
      p.x += (tx - p.x) * Math.min(1, dt * 7);
      if (p.y >= ty && p.vy > 0) {
        p.x = tx; p.y = ty;
        landPiece(p, pl, i);
      }
    } else if (p.state === 'roll') {
      p.rt += dt;
      const k = clamp(p.rt / p.rdur, 0, 1);
      const x0 = X0(h);
      const fx = x0 + (p.rc0 + p.w / 2) * CELL, txx = x0 + (p.rc1 + p.w / 2) * CELL;
      p.x = lerp(fx, txx, k);
      p.y = L.base - lerp(p.rr0, p.rr0, k) * CELL - Math.sin(k * Math.PI * Math.max(1, Math.abs(p.rc1 - p.rc0))) * 6;
      p.rot = p.rdir * k * Math.PI * 0.5 * Math.max(1, Math.abs(p.rc1 - p.rc0));
      if (k >= 1) {
        // 塔にぶつかる
        const t = p.tower;
        const list = h.blocks.filter(b => t.tc >= b.c && t.tc < b.c + b.w && b.r + b.h > p.rr0 + 1);
        knock(h, list, p.rdir);
        resettle(h);
        sfx.crash();
        burst(x0 + (t.tc + 0.5) * CELL, L.base - (p.rr0 + 2) * CELL, 10, 'dust', '#e8ddc6');
        S.uncle.expr = 'oops'; S.uncle.exprT = 1.3; S.uncle.shrug = 1;
        note('roll-crash:' + list.length);
        p.state = 'fall'; p.fixedC = p.rc1; p.noroll = true; p.lock = false; p.vy = -200; p.rot = 0; p.vr = 0;
      }
    }
  }
}
function landPiece(p, pl, i) {
  const h = S.cur;
  // 大きな角材は、そばに高い塔があると転がって塔を崩す
  if (!p.noroll && p.w * p.h >= 4) {
    const tw = findTower(h, pl.c, p.w, pl.r);
    if (tw) {
      let c1 = tw.dir < 0 ? tw.tc + 1 : tw.tc - p.w;
      c1 = clamp(c1, 0, COLS - p.w);
      p.state = 'roll'; p.rc0 = pl.c; p.rc1 = c1; p.rr0 = pl.r; p.rt = 0; p.rdir = tw.dir; p.tower = tw;
      p.rdur = 0.22 + 0.17 * Math.abs(c1 - pl.c);
      sfx.knock(p.w * p.h); sfx.roll();
      note('roll:' + pl.c + '->' + c1 + ' tower' + tw.tc);
      return;
    }
  }
  S.pieces.splice(i, 1);
  if (pl.over || pl.r + p.h > ROWLIM) {
    // 載りきらず転がり落ちる(床に残る)
    addRubble(h, p.x, p.y - p.h * CELL / 2, p, Math.random() < 0.5 ? -1 : 1);
    sfx.knock(p.w * p.h);
    note('overflow');
    return;
  }
  const b = placeBlock(h, p, pl.c, pl.r);
  b.ry = pl.r;
  sfx.knock(p.w * p.h);
  burst(p.x, p.y, Math.min(6, 2 + p.w * p.h), 'dust', '#e8ddc6');
  updateTilt(h);
  S.targetCool = 0;
  note('land:' + p.w + 'x' + p.h + '@' + b.c + ',' + b.r);
}

/* ---------- 完成 ---------- */
function allCut() { return S.tufts.every(t => t.len <= t.stub); }

  S.demo = null;
  h.leftH = wallH(h, -1); h.rightH = wallH(h, 1); h.topH = restMax(h);
  note('complete:L' + h.leftH + ':R' + h.rightH + ':top' + h.topH);

  const n = bl.length, step = Math.min(0.09, 1.5 / Math.max(1, n));

  const doorX = () => X0(h) + (DOORC + 0.5) * CELL;
  after(t, () => { h.glow = 1; u.ty = 54; u.bowT = 0.6; S.hands[1].g = { x: doorX() + 6, y: L.base - 1.1 * CELL }; u.expr = 'happy'; u.exprT = 1; });
  after(t + 0.75, () => { h.doorWob = 1; sfx.bump(); u.expr = 'shy'; u.exprT = 1.6; u.blush = 1.4; S.hands[1].g = { x: doorX() + 22, y: L.base - 1.6 * CELL }; });
  after(t + 1.45, () => { u.ty = 0; u.bowT = 0; S.hands[1].g = null; S.hands[0].g = { x: -L.mirrorX, y: L.headTop + 46 }; });
  after(t + 1.95, () => { S.hat.state = 'carry'; sfx.pop(); S.hands[0].g = { x: h.cx - 20, y: L.base - h.topH * CELL - 120 }; });
  after(t + 2.6, () => {

  });

    burst(h.cx, L.base - h.topH * CELL - 20, 10, 'spark', P.ver.f);
    u.expr = 'proud'; u.exprT = 1.8; u.bowT = 1;
    note('roof');

  after(t + 3.9, () => { u.bowT = 0; });
  let t2 = t + 4.1;
  const prev = S.houses.length > 1 ? S.houses[S.houses.length - 2] : null;

    after(t2, () => {
      const H1 = prev.rightH, H2 = h.leftH, type = Math.abs(H1 - H2) <= 1 ? 'bridge' : 'stairs';
      h.conn = { type, H1, H2, prog: 0, n: Math.max(1, Math.abs(H1 - H2)), last: -1 };
      if (type === 'bridge') sfx.bridge();
      note('connect:' + type + ':' + H1 + '->' + H2);
    });
    t2 += 1.6;
  }
  after(t2, () => { S.mode = 'choose'; S.shelfT = 1; S.suggest = suggestWig(); S.idle = 0; S.demoAt = 4; });
}
function suggestWig() {
  // 前の家より低くなりそうな短いかつら → 次は同じくらい → 長い と順に誘う(選ぶのは自由)
  return [0, 1, 2][S.cycle % 3];
}
function pickWig(i) {
  if (S.mode !== 'choose') return;
  S.mode = 'trans';
  const wp = wigPos(i);
  S.wigFly = { i, t: 0, x0: wp.x, y0: wp.y, x1: S.uncle.x, y1: headTop() - 1.2 * V };
  S.wob.shelf[i] = 1;
  sfx.wig();
  note('wig:' + i);
  after(0.55, () => {
    const spec = WIGS[i];
    S.wigSpec = spec; S.uncle.hairCol = spec.hair;
    S.tufts = makeTufts(spec, true);
    S.uncle.seen = [false, false];

    S.cycle++;
    const h = newHouse(0);
    S.houses.push(h);
    S.cur = h;
    while (S.houses.length > 3) S.houses.shift();
    placeHouses(false);
    h.cx = h.tcx + LW * 0.7;
    S.hat = { state: 'hook', x: 0, y: 0, drop: 1, fly: null };

/* ---------- 誘導 (次に触る物は1つだけ) ---------- */
function coversEye(t) { return t.kind === 'bang' && Math.abs(t.x) >= 1 && t.len > 2; }
function eyeHidden(i) {
  const sx = i === 0 ? -1 : 1;
  return S.tufts.some(t => t.kind === 'bang' && Math.sign(t.x) === sx && Math.abs(t.x) >= 1 && t.disp > 2.05);
}
function computeTarget() {
  if (S.mode === 'choose') return { type: 'wig', i: S.suggest };
  if (S.mode !== 'build') return null;
  const cand = S.tufts.filter(t => t.len > t.stub);
  if (!cand.length) return null;
  const longest = arr => arr.reduce((a, b) => (b.len - b.stub > a.len - a.stub || (b.len - b.stub === a.len - a.stub && Math.abs(b.x) > Math.abs(a.x))) ? b : a);
  const cov = cand.filter(coversEye);
  if (cov.length) return { type: 'tuft', t: longest(cov) };
  const h = S.cur;
  const d = wallH(h, -1) - wallH(h, 1);
  const nonMus = cand.filter(t => t.kind !== 'mus');
  if (Math.abs(d) >= 2 && nonMus.length) {
    const want = d > 0 ? 1 : -1;
    const side = nonMus.filter(t => Math.sign(t.x) === want);
    if (side.length) return { type: 'tuft', t: longest(side) };
  }
  const order = ['beard', 'side', 'bang'];
  const mus = cand.filter(t => t.kind === 'mus');
  if (mus.length && (h.blocks.length >= 7 || !nonMus.length)) return { type: 'tuft', t: mus[0] };
  for (const k of order) {
    const c = cand.filter(t => t.kind === k);
    if (c.length) {
      // 低い側の壁に落ちる房を優先
      const lowSide = d > 0 ? 1 : d < 0 ? -1 : 0;
      const pref = lowSide ? c.filter(t => Math.sign(t.x) === lowSide) : [];
      return { type: 'tuft', t: longest(pref.length ? pref : c) };
    }
  }
  return { type: 'tuft', t: mus[0] || cand[0] };
}

/* ---------- 入力 ---------- */
function onDown(e) {
  if (e.cancelable) e.preventDefault();
  initAudio();
  const p = toL(e);
  S.rings.push({ x: p.x, y: p.y, t: 0 }); if (S.rings.length > 6) S.rings.shift();
  S.idle = 0; S.demoAt = 4; S.demo = null;
  if (S.active) return;                       // 2本目以降の指は無視
  S.active = { id: e.pointerId, x: p.x, y: p.y, travel: 0, cut: new Set(), group: null };
  try { cv.setPointerCapture(e.pointerId); } catch (_) {}
  S.trail.length = 0; S.trail.push({ x: p.x, y: p.y, t: S.t });
  tapAt(p.x, p.y);
}
function onMove(e) {

  if (e.cancelable) e.preventDefault();
  let evs = (e.getCoalescedEvents && e.getCoalescedEvents()) || null;
  if (!evs || !evs.length) evs = [e];
  for (const ev of evs) {
    const p = toL(ev);
    if (Math.abs(p.x - a.x) + Math.abs(p.y - a.y) < 0.5) continue;
    if (S.mode === 'build') cutSegment(a.x, a.y, p.x, p.y);
    a.x = p.x; a.y = p.y;
    S.trail.push({ x: p.x, y: p.y, t: S.t });
  }
  if (S.trail.length > 40) S.trail.splice(0, S.trail.length - 40);
  S.idle = 0;
}
function onUp(e) {
  if (!S.active || e.pointerId !== S.active.id) return;

}
function endStroke() {

cv.addEventListener('pointerdown', onDown, { passive: false });

cv.addEventListener('pointerup', onUp);

/* ---------- 更新 ---------- */
function update(dt) {
  S.t += dt;
  for (let i = 0; i < S.timers.length; i++) {
    const tm = S.timers[i];
    if (tm.t <= S.t) { S.timers.splice(i, 1); i--; try { tm.fn(); } catch (e) { console.warn(e); } }
  }
  if (!S.active) S.idle += dt;
  updateUncle(dt);
  updateTufts(dt);
  updatePieces(dt);
  updateHouses(dt);
  updateFx(dt);
  // 誘導
  S.targetCool -= dt;
  if (S.targetCool <= 0) { S.target = computeTarget(); S.targetCool = 0.4; }
  if ((S.mode === 'build' || S.mode === 'choose') && !S.active && S.target && !S.demo && S.idle >= S.demoAt) {
    startDemo();
    S.demoAt = S.idle + 12;  // 連続して催促しない
  }
  if (S.demo) { S.demo.t += dt; if (S.demo.t >= S.demo.dur || S.active) S.demo = null; }
  // 完成
  if (S.mode === 'build' && !S.compPending && allCut() && S.pieces.length === 0) {
    S.compPending = true;
    after(0.45, () => {
      S.compPending = false;
      if (S.mode === 'build' && allCut() && S.pieces.length === 0) startComplete();
    });
  }
}
function startDemo() {
  const tg = S.target;
  if (tg.type === 'tuft') {
    const g = tuftGeo(tg.t);
    const y = clamp(g.tip - 0.7 * V, g.root + (tg.t.stub + 0.5) * V, g.tip);
    S.demo = { type: 'swipe', t: 0, dur: 1.5, x0: g.x - 70, x1: g.x + 70, y };
  } else if (tg.type === 'wig') {
    const p = wigPos(tg.i);
    S.demo = { type: 'tap', t: 0, dur: 1.5, x0: p.x, y: p.y + 50 };
  }
}
function updateUncle(dt) {
  const u = S.uncle;
  u.x += (u.tx - u.x) * Math.min(1, dt * 6);
  u.y += (u.ty - u.y) * Math.min(1, dt * 5);
  u.bow += (u.bowT - u.bow) * Math.min(1, dt * 6);
  if (u.exprT > 0) { u.exprT -= dt; if (u.exprT <= 0) u.expr = 'neutral'; }
  u.shrug = Math.max(0, u.shrug - dt * 1.6);
  u.laugh = Math.max(0, u.laugh - dt);
  u.blush = Math.max(0, u.blush - dt * 0.8);
  u.bounce = Math.max(0, u.bounce - dt * 2.5);
  // 目が見えたら ぱちぱち
  for (let i = 0; i < 2; i++) {
    const vis = !eyeHidden(i);
    if (vis && !u.seen[i] && S.mode !== 'trans') {
      u.seen[i] = true; u.burst[i] = 0.7; sfx.blink(); note('eye' + i + ':open');
    }
    if (!vis) u.seen[i] = false;
    u.burst[i] = Math.max(0, u.burst[i] - dt);
  }
  u.blinkT -= dt;
  if (u.blinkT <= 0) { u.blink = 0.13; u.blinkT = rand(2.2, 4.5); }
  u.blink = Math.max(0, u.blink - dt);
  // 視線
  let lx = 0, ly = 700;
  const tg = S.target;
  if (tg && tg.type === 'tuft') { const g = tuftGeo(tg.t); lx = g.x; ly = g.tip + 10; }
  else if (tg && tg.type === 'wig') { const p = wigPos(tg.i); lx = p.x; ly = p.y; }
  if (S.mirrorAt && S.t >= S.mirrorAt && S.mode === 'build') { u.mirrorT = 0.9; S.mirrorAt = 0; }
  if (u.mirrorT > 0) { u.mirrorT -= dt; lx = L.mirrorX; ly = L.headTop + 40; }
  if (S.mode === 'complete' && S.cur) { lx = S.cur.cx; ly = L.base - 60; }
  u.lx += (lx - u.lx) * Math.min(1, dt * 8); u.ly += (ly - u.ly) * Math.min(1, dt * 8);
  u.mirror += ((u.mirrorT > 0 ? 1 : 0) - u.mirror) * Math.min(1, dt * 7);
  // 片側のひげだけ短いと首をかしげる / 家が傾くと心配
  let bl = 0, br = 0;
  for (const t of S.tufts) if (t.kind === 'beard') { if (t.x < 0) bl += t.len; else if (t.x > 0) br += t.len; }
  let tilt = clamp((br - bl) * 0.8, -4.5, 4.5);
  if (S.cur && S.cur.tiltState) tilt += S.cur.tiltState * -1.5;
  if (u.laugh > 0) tilt += Math.sin(S.t * 30) * 3 * Math.min(1, u.laugh);
  u.tilt += (tilt - u.tilt) * Math.min(1, dt * 5);
  // 待つ間は前髪をかき分ける
  u.partCool -= dt;
  if (S.mode === 'build' && u.partT <= 0 && u.partCool <= 0 && S.idle > 2.5 && !S.demo && (eyeHidden(0) || eyeHidden(1))) {
    u.partT = 1.6; u.partCool = 7.5;
  }
  if (u.partT > 0) {
    u.partT -= dt;
    const k = 1 - u.partT / 1.6;
    u.partAmt = Math.sin(clamp(k, 0, 1) * Math.PI);
    S.hands[1].g = { x: u.x + 1.6 * V, y: headTop() + 2.6 * V };
    if (u.partT <= 0) { u.partAmt = 0; S.hands[1].g = null; }
    if (S.active) { u.partT = 0; u.partAmt = 0; S.hands[1].g = null; }
  }
  // 手
  const top = headTop();
  for (let i = 0; i < 2; i++) {
    const hd = S.hands[i];
    const dx = (i ? 1 : -1) * 6.3 * V + u.x, dy = top + 12.4 * V - u.shrug * 10;
    const g = hd.g || { x: dx, y: dy };
    hd.x += (g.x - hd.x) * Math.min(1, dt * 7);
    hd.y += (g.y - hd.y) * Math.min(1, dt * 7);
  }
  // 帽子
  const hat = S.hat;
  if (hat.state === 'hook') { hat.x = -L.mirrorX; hat.y = L.headTop + 74; hat.drop = Math.max(0, hat.drop - dt * 2.2); }
  else if (hat.state === 'carry') { hat.x = S.hands[0].x + 4; hat.y = S.hands[0].y - 6; }
  else if (hat.state === 'fly' && hat.fly) {
    const f = hat.fly; f.t = Math.min(1, f.t + dt / 0.45);
    hat.x = lerp(f.x0, f.x1, f.t); hat.y = lerp(f.y0, f.y1, f.t) - Math.sin(f.t * Math.PI) * 50;
  }
  if (S.wigFly) S.wigFly.t = Math.min(1, S.wigFly.t + dt / 0.5);
  S.shelf += (S.shelfT - S.shelf) * Math.min(1, dt * 6);
  for (const k of ['mirror', 'hat', 'face']) S.wob[k] = Math.max(0, S.wob[k] - dt * 2.5);
  for (let i = 0; i < 3; i++) S.wob.shelf[i] = Math.max(0, S.wob.shelf[i] - dt * 2.5);
}
function updateTufts(dt) {
  const tg = S.target && S.target.type === 'tuft' ? S.target.t : null;
  for (const t of S.tufts) {
    const acc = -170 * t.sq - 11 * t.sqv;
    t.sqv += acc * dt; t.sq += t.sqv * dt;
    t.sq = clamp(t.sq, -0.35, 0.4);
    if (t.disp < t.len) t.disp = Math.min(t.len, t.disp + dt * 7);
    if (t.disp > t.len) t.disp = t.len;
    if (t === tg && S.mode === 'build') {
      const ph = (S.t % 1.5);
      t.hop = ph < 0.36 ? Math.sin(ph / 0.36 * Math.PI) * 7 : 0;
    } else t.hop *= Math.pow(0.02, dt);
    t.part = (t.kind === 'bang' ? Math.sign(t.x) : 0) * S.uncle.partAmt;
  }
}
function updateHouses(dt) {
  for (const h of S.houses) {
    h.cx += (h.tcx - h.cx) * Math.min(1, dt * 4.5);
    h.tiltL += (h.tiltLT - h.tiltL) * Math.min(1, dt * 5);
    h.tiltR += (h.tiltRT - h.tiltR) * Math.min(1, dt * 5);
    h.doorWob = Math.max(0, h.doorWob - dt * 2);
    h.wob = Math.max(0, h.wob - dt * 3);
    h.glow = Math.max(0, h.glow - dt * 0.7);
    if (h.roof) h.roof.pop = Math.max(0, h.roof.pop - dt * 3);
    for (const b of h.blocks) {
      b.land = Math.max(0, b.land - dt * 5);
      b.pop = Math.max(0, b.pop - dt * 4);
      b.ry += (b.r - b.ry) * Math.min(1, dt * 12);
      if (Math.abs(b.ry - b.r) < 0.01) b.ry = b.r;
    }
    for (const r of h.rubble) {
      if (r.rest) continue;
      r.vy += 1700 * dt;
      r.rx += r.vx * dt; r.y += r.vy * dt; r.rot += r.vr * dt;
      const wx = h.cx + r.rx, lim = LW / 2 - 18;
      if (h === S.cur && (wx < -lim || wx > lim)) { r.vx *= -0.5; r.rx = clamp(wx, -lim, lim) - h.cx; }
      if (r.y >= r.fy && r.vy > 0) {
        r.y = r.fy;
        if (r.vy > 300) { r.vy *= -0.32; r.vx *= 0.5; r.vr *= 0.5; sfx.knock(2); }
        else { r.rest = true; r.vy = 0; r.rot = Math.round(r.rot / (Math.PI / 2)) * (Math.PI / 2) + rand(-0.15, 0.15); }
      }
    }
    if (h.conn && h.conn.prog < 1) {
      h.conn.prog = Math.min(1, h.conn.prog + dt / 1.1);
      const k = Math.floor(h.conn.prog * h.conn.n);
      if (h.conn.type === 'stairs' && k !== h.conn.last && k < h.conn.n) { h.conn.last = k; sfx.step(k, h.conn.H2 > h.conn.H1); }
      if (h.conn.prog >= 1) {
        burst((X0(h) - GAP / 2), L.base - Math.max(h.conn.H1, h.conn.H2) * CELL, 12, 'spark', '#ffffff');
        if (h.conn.type === 'stairs') sfx.windowChime();
      }
    }

  while (S.houses.length > 2 && S.houses[0].cx < -LW / 2 - SPACING) S.houses.shift();
}
function updateFx(dt) {
  for (let i = S.parts.length - 1; i >= 0; i--) {
    const q = S.parts[i];
    q.life -= dt;
    if (q.life <= 0) { S.parts.splice(i, 1); continue; }
    q.vy += (q.type === 'spark' ? 200 : 700) * dt;
    q.x += q.vx * dt; q.y += q.vy * dt; q.rot += dt * 6;
  }
  for (let i = S.rings.length - 1; i >= 0; i--) { S.rings[i].t += dt; if (S.rings[i].t > 0.35) S.rings.splice(i, 1); }
  while (S.trail.length && S.t - S.trail[0].t > 0.22) S.trail.shift();
}

/* ---------- 描画ヘルパ ---------- */
function cube(x, y, w, h, d, c) {
  const dx = d * 0.55, dy = d * 0.5;
  ctx.fillStyle = c.t;
  ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + dx, y - dy); ctx.lineTo(x + w + dx, y - dy); ctx.lineTo(x + w, y); ctx.closePath(); ctx.fill();
  ctx.fillStyle = c.s;
  ctx.beginPath(); ctx.moveTo(x + w, y); ctx.lineTo(x + w + dx, y - dy); ctx.lineTo(x + w + dx, y + h - dy); ctx.lineTo(x + w, y + h); ctx.closePath(); ctx.fill();
  ctx.fillStyle = c.f; ctx.fillRect(x, y, w, h);
}
function rect(x, y, w, h, col) { ctx.fillStyle = col; ctx.fillRect(x, y, w, h); }
function shadow(x, y, w, len) {
  ctx.fillStyle = 'rgba(28,36,50,0.26)';
  ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + w, y); ctx.lineTo(x + w + len * 0.9, y - len * 0.35); ctx.lineTo(x + len * 0.9, y - len * 0.35); ctx.closePath(); ctx.fill();
}

/* ---------- 部屋 ---------- */

  ctx.strokeStyle = FLOORLN; ctx.lineWidth = 2; ctx.beginPath();

function drawHat(cx, by, sx, sy) {

/* ---------- おじさん ---------- */
function drawTuft(t, cx, top, glow, sc) {
  const x = cx + t.x * V, root = top + t.root * V;
  const len = t.disp;
  if (len <= 0.02) return;
  const w = (t.kind === 'mus' ? 1.0 : 0.94) * V * (1 + Math.max(0, t.sq) * 0.6);
  const step = V * (1 - t.sq);
  const n = Math.ceil(len - 0.001);
  const hop = t.hop || 0;
  const col = P[t.col];
  if (glow) {
    ctx.globalAlpha = 0.28 + 0.2 * Math.sin(S.t * 6);
    rect(x - w / 2 - 6, root - 3 - hop, w + 12 + HDEP * 0.55, len * step + 9, '#ffffff');
    ctx.globalAlpha = 1;
  }
  for (let i = n - 1; i >= 0; i--) {
    const frac = Math.min(1, len - i);
    const sway = Math.sin(S.t * 1.7 + t.ph + i * 0.7) * i * 0.45 + t.part * (i + 1) * 4.5;
    const vy = root + i * step - hop;
    cube(x - w / 2 + sway, vy, w, step * frac + 0.6, HDEP, col);
  }
}
function drawHeadCore(cx, top, tufts, hairCol, mann, features) {
  const skin = mann ? P.mann : P.skin;
  // 顔
  cube(cx - 3.5 * V, top, 7 * V, 7.7 * V, 26, skin);
  // 耳
  if (!mann) { cube(cx - 3.9 * V, top + 3.2 * V, 0.5 * V, 1.4 * V, 8, skin); cube(cx + 3.4 * V, top + 3.2 * V, 0.5 * V, 1.4 * V, 8, skin); }
  for (const t of tufts) if (t.kind === 'side') drawTuft(t, cx, top, false);
  // 髪のかたまり(帽子のように頭に乗る)
  cube(cx - 4.5 * V, top - 1.2 * V, 9 * V, 2.3 * V, 30, P[hairCol]);
  if (features) drawFace(cx, top);
  else if (mann) { rect(cx - 0.4 * V, top + 4 * V, 0.8 * V, 1 * V, P.mann.s); }
  for (const t of tufts) if (t.kind === 'beard') drawTuft(t, cx, top, false);
  for (const t of tufts) if (t.kind === 'mus') drawTuft(t, cx, top, false);
  for (const t of tufts) if (t.kind === 'bang') drawTuft(t, cx, top, false);
}
function drawFace(cx, top) {
  const u = S.uncle;
  const e = u.expr;
  const turn = u.mirror * 5;
  const fx = cx + turn;
  // 眉
  const by = top + 2.25 * V - (e === 'surprise' || e === 'wow' ? 4 : 0);
  for (let i = 0; i < 2; i++) {
    const ex = fx + (i ? 1.5 : -1.5) * V;
    if (e === 'worried') {
      rect(ex - 0.45 * V, by + (i ? -2 : 2), 0.45 * V, 0.22 * V, P.brown.s);
      rect(ex, by + (i ? 2 : -2), 0.45 * V, 0.22 * V, P.brown.s);
    } else rect(ex - 0.45 * V, by, 0.9 * V, 0.24 * V, P.brown.s);
  }
  // 目
  const ang = Math.atan2(u.ly - (top + 3.4 * V), u.lx - fx);
  const px = Math.cos(ang) * 2.6, py = Math.sin(ang) * 2.2;
  for (let i = 0; i < 2; i++) {
    const ex = fx + (i ? 1.5 : -1.5) * V, ey = top + 3.4 * V;
    let closed = u.blink > 0;
    if (u.burst[i] > 0 && Math.sin(u.burst[i] * 26) > 0.2) closed = true;
    const happy = e === 'happy' || e === 'giggle' || e === 'proud' || e === 'shrug';
    if (happy) {
      rect(ex - 0.42 * V, ey, 0.25 * V, 0.2 * V, DARK);
      rect(ex - 0.2 * V, ey - 0.25 * V, 0.4 * V, 0.2 * V, DARK);
      rect(ex + 0.18 * V, ey, 0.25 * V, 0.2 * V, DARK);
    } else if (closed) {
      rect(ex - 0.4 * V, ey, 0.8 * V, 0.16 * V, DARK);
    } else {
      const big = (e === 'surprise' || e === 'wow' || e === 'oops') ? 1.22 : e === 'shy' ? 0.85 : 1;
      const w = 0.62 * V * big, h = 0.8 * V * big;
      rect(ex - w / 2 + px, ey - h / 2 + py, w, h, DARK);
      rect(ex - w / 2 + px + 2, ey - h / 2 + py + 2, w * 0.36, h * 0.3, '#ffffff');
    }
  }
  // ほっぺ
  const bl = Math.max(u.blush, e === 'giggle' || e === 'shy' ? 1 : 0);
  if (bl > 0) {
    ctx.globalAlpha = Math.min(1, bl) * 0.5;
    rect(fx - 2.8 * V, top + 4.5 * V, 1.1 * V, 0.55 * V, P.ver.f);
    rect(fx + 1.7 * V, top + 4.5 * V, 1.1 * V, 0.55 * V, P.ver.f);
    ctx.globalAlpha = 1;
  }
  // 鼻
  cube(fx - 0.55 * V, top + 3.9 * V, 1.1 * V, 1.2 * V, 12, P.skin);
  // 口
  const my = top + 6.0 * V;
  if (e === 'giggle') {
    const o = Math.abs(Math.sin(S.t * 22));
    rect(fx - 1.1 * V, my - 0.1 * V, 2.2 * V, (0.45 + o * 0.35) * V, DARK);
    rect(fx - 0.6 * V, my + 0.25 * V + o * 0.3 * V, 1.2 * V, 0.2 * V, P.ver.f);
  } else if (e === 'surprise' || e === 'wow' || e === 'oops') {
    rect(fx - 0.35 * V, my, 0.7 * V, 0.7 * V, DARK);
  } else if (e === 'happy' || e === 'proud' || e === 'shrug') {
    rect(fx - 1.0 * V, my, 2.0 * V, 0.5 * V, DARK);
    rect(fx - 0.5 * V, my + 0.3 * V, 1.0 * V, 0.2 * V, P.ver.f);
  } else if (e === 'worried') {
    rect(fx - 0.8 * V, my + 0.2 * V, 0.5 * V, 0.2 * V, DARK); rect(fx - 0.3 * V, my, 0.6 * V, 0.2 * V, DARK); rect(fx + 0.3 * V, my + 0.2 * V, 0.5 * V, 0.2 * V, DARK);
  } else if (e === 'shy') {
    rect(fx - 0.6 * V, my + 0.1 * V, 1.2 * V, 0.22 * V, DARK);
  } else {
    rect(fx - 0.7 * V, my + 0.1 * V, 1.4 * V, 0.25 * V, DARK);
  }
}
function drawUncle() {

  cube(cx - 5.9 * V, top + 8.4 * V - sh, 11.8 * V, 6.6 * V + sh, 44, P.mint);
  cube(cx - 6.9 * V, top + 9.2 * V - sh * 1.3, 2.2 * V, 1.6 * V, 30, P.mint);
  cube(cx + 4.7 * V, top + 9.2 * V - sh * 1.3, 2.2 * V, 1.6 * V, 30, P.mint);
  // 首
  cube(cx - 1.2 * V, top + 7.4 * V, 2.4 * V, 1.2 * V, 16, P.skin);
  // 頭(かしげ・おじぎ)
  const wf = Math.sin(S.t * 30) * S.wob.face * 0.03;
  const bob = -Math.abs(Math.sin(S.t * 14)) * u.bounce * 5 + u.bow * 16;
  ctx.save();
  ctx.translate(cx, top + 8 * V);
  ctx.rotate((u.tilt * Math.PI) / 180 + wf);
  ctx.translate(-cx, -(top + 8 * V) + bob);
  // 前髪・ひげは誘導対象を光らせる
  const tg = S.target && S.target.type === 'tuft' && S.mode === 'build' ? S.target.t : null;
  cube(cx - 3.5 * V, top, 7 * V, 7.7 * V, 26, P.skin);
  cube(cx - 3.9 * V, top + 3.2 * V, 0.5 * V, 1.4 * V, 8, P.skin);
  cube(cx + 3.4 * V, top + 3.2 * V, 0.5 * V, 1.4 * V, 8, P.skin);
  for (const t of S.tufts) if (t.kind === 'side') drawTuft(t, cx, top, t === tg);
  cube(cx - 4.5 * V, top - 1.2 * V, 9 * V, 2.3 * V, 30, P[u.hairCol]);
  drawFace(cx, top);
  for (const t of S.tufts) if (t.kind === 'beard') drawTuft(t, cx, top, t === tg);
  for (const t of S.tufts) if (t.kind === 'mus') drawTuft(t, cx, top, t === tg);
  for (const t of S.tufts) if (t.kind === 'bang') drawTuft(t, cx, top, t === tg);
  ctx.restore();
  // 手
  for (let i = 0; i < 2; i++) drawHand(S.hands[i].x, S.hands[i].y, P.hand, i ? 1 : -1);
}
function drawHand(x, y, c, side) {
  cube(x - 15, y - 12, 30, 24, 12, c);
  cube(x + (side > 0 ? -21 : 13), y - 6, 8, 12, 8, c);
}
function drawDemoHand(x, y, press) {
  const s = 1.7 * (1 - press * 0.12);
  // 指さし(白い手袋)。指先が切る位置
  rect(x - 7 * s + 3, y + 3, 15 * s, 24 * s, 'rgba(30,38,52,0.35)');
  rect(x - 15 * s + 3, y + 19 * s + 3, 34 * s, 30 * s, 'rgba(30,38,52,0.35)');
  cube(x - 5 * s, y, 10 * s, 22 * s, 8, P.ghost);
  cube(x - 15 * s, y + 18 * s, 32 * s, 28 * s, 12, P.ghost);
  rect(x - 15 * s, y + 34 * s, 32 * s, 3, P.ghost.s);
}

/* ---------- 家の描画 ---------- */
function drawHouse(h, cur) {
  const x0 = X0(h), base = L.base;
  const wob = Math.sin(S.t * 32) * h.wob * 1.5;
  ctx.save(); ctx.translate(wob, 0);
  const tm = restMax(h);
  shadow(x0 + COLS * CELL + 6, base + 8, 14, Math.min(26, 8 + tm * 3));
  // 土台
  cube(x0 - 8, base, COLS * CELL + 16, 12, DEP + 8, P.slab);
  if (h.glow > 0) { ctx.globalAlpha = h.glow * 0.5; rect(x0 - 8, base, COLS * CELL + 16, 12, '#ffffff'); ctx.globalAlpha = 1; }
  // 開いた隙間(家の中の暗がり)
  const groups = [[], [], []];
  for (const b of h.blocks) groups[blockSide(b) + 1].push(b);
  for (let gi = 0; gi < 3; gi++) {
    ctx.save();
    applyTilt(h, gi - 1, x0, base);
    for (let c = 0; c < COLS; c++) {
      const side = c < 3 ? -1 : c > 3 ? 1 : 0;
      if (side !== gi - 1) continue;
      const top = colHeight(h, c);
      for (let r = 0; r < top; r++) {
        if (h.g[c][r] === 0) {
          const win = h.windows.has(c) && (r === 1 || r === 2);
          rect(x0 + c * CELL, base - (r + 1) * CELL, CELL, CELL, win ? '#9fd0e0' : GAPC);
        }
      }
    }
    // 窓
    for (const c of h.windows) {
      const side = c < 3 ? -1 : 1;
      if (side !== gi - 1) continue;
      const wx = x0 + c * CELL, wy = base - 3 * CELL;
      rect(wx, wy, CELL, 2 * CELL, '#9fd0e0');
      rect(wx + 4, wy + 6, 8, 18, '#d8eef4');
    }
    const bl = groups[gi].slice().sort((a, b) => a.r - b.r || a.c - b.c);
    for (const b of bl) drawBlock(x0, base, b);
    for (const c of h.windows) {
      const side = c < 3 ? -1 : 1;
      if (side !== gi - 1) continue;
      const wx = x0 + c * CELL, wy = base - 3 * CELL;
      cube(wx - 2, wy - 2, CELL + 4, 5, 6, P.mint);
      cube(wx - 2, wy + 2 * CELL - 3, CELL + 4, 5, 6, P.mint);
      rect(wx - 2, wy, 4, 2 * CELL, P.mint.f);
      rect(wx + CELL - 2, wy, 4, 2 * CELL, P.mint.f);
      rect(wx + CELL / 2 - 2, wy, 4, 2 * CELL, P.mint.f);
      rect(wx, wy + CELL - 2, CELL, 4, P.mint.f);
    }
    ctx.restore();
  }
  // 玄関
  const dx = x0 + DOORC * CELL, dw = Math.sin(S.t * 40) * h.doorWob * 2;
  rect(dx + 2 + dw, base - 2 * CELL + 4, CELL - 4, 2 * CELL - 4, '#2e3644');
  rect(dx + 5 + dw, base - 2 * CELL + 8, CELL - 10, 2 * CELL - 8, P.door.f);
  rect(dx + CELL - 11 + dw, base - CELL, 4, 4, P.cream.f);
  cube(dx - 1 + dw, base - 2 * CELL, CELL + 2, 5, 8, P.mint);
  // ひさし(口ひげ)
  if (h.eave > 0) {
    const ew = CELL * (0.7 + 0.32 * h.eave);
    cube(x0 + (DOORC + 0.5) * CELL - ew / 2, base - 2 * CELL - 7, ew, 7, DEP + 18, P.brown);
  }
  // 屋根(帽子)
  if (h.roof) {
    const sxx = (COLS * CELL + 24) / 64, p = h.roof.pop;
    drawHat(h.cx, h.roof.y - p * 10, sxx * (1 + p * 0.08), 1.1 * (1 - p * 0.2));
  }
  ctx.restore();
  // 床に残った角材
  for (const r of h.rubble) {
    const rx = h.cx + r.rx, w = r.w * CELL * r.s, hh = r.h * CELL * r.s;
    if (r.rest) shadow(rx + w / 2, r.y, 6, 8);
    ctx.save(); ctx.translate(rx, r.y - hh / 2); ctx.rotate(r.rot);
    cube(-w / 2, -hh / 2, w, hh, DEP * r.s, P[r.col]);
    ctx.restore();
  }
}
function applyTilt(h, side, x0, base) {
  if (side < 0 && Math.abs(h.tiltL) > 0.05) {
    const wob = h.tiltLT ? Math.sin(S.t * 3) * 0.6 : 0;
    ctx.translate(x0, base); ctx.rotate((h.tiltL + wob) * Math.PI / 180); ctx.translate(-x0, -base);
  } else if (side > 0 && Math.abs(h.tiltR) > 0.05) {
    const x1 = x0 + COLS * CELL, wob = h.tiltRT ? Math.sin(S.t * 3) * 0.6 : 0;
    ctx.translate(x1, base); ctx.rotate((h.tiltR + wob) * Math.PI / 180); ctx.translate(-x1, -base);
  }
}
function drawBlock(x0, base, b) {
  const w = b.w * CELL, hh = b.h * CELL;
  const x = x0 + b.c * CELL, y = base - (b.ry + b.h) * CELL;
  const sq = b.land * 0.12, pp = b.pop * 0.14;
  const sw = w * (1 + sq + pp), shh = hh * (1 - sq + pp);
  cube(x + (w - sw) / 2 + 0.5, y + (hh - shh) - (b.pop * 4) + 0.5, sw - 1, shh - 1, DEP, P[b.col]);
}
function drawConnector(prev, h, H1, H2, prog, ghost) {
  const xa = X0(prev) + COLS * CELL + 4, xb = X0(h);
  const base = L.base, ya = base - H1 * CELL, yb = base - H2 * CELL;
  const type = Math.abs(H1 - H2) <= 1 ? 'bridge' : 'stairs';
  ctx.globalAlpha = ghost ? 0.3 : 1;
  if (type === 'bridge') {
    const len = (xb - xa) * prog;
    const ye = lerp(ya, yb, prog);
    ctx.fillStyle = P.mint.t;
    ctx.beginPath(); ctx.moveTo(xa, ya); ctx.lineTo(xa + 8, ya - 8); ctx.lineTo(xa + len + 8, ye - 8); ctx.lineTo(xa + len, ye); ctx.closePath(); ctx.fill();
    ctx.fillStyle = P.mint.f;
    ctx.beginPath(); ctx.moveTo(xa, ya); ctx.lineTo(xa + len, ye); ctx.lineTo(xa + len, ye + 9); ctx.lineTo(xa, ya + 9); ctx.closePath(); ctx.fill();
    if (!ghost) {
      for (let k = 0; k <= 4; k++) {
        const f = k / 4; if (f > prog) break;
        const px = lerp(xa, xb, f), py = lerp(ya, yb, f);
        cube(px - 2, py - 18, 4, 18, 4, P.ver);
      }
      if (prog > 0.95) { cube(xa, ya - 20, xb - xa, 3, 4, P.ver); }
    }
  } else {
    const n = Math.abs(H1 - H2), up = H2 > H1;
    const sw = (xb - xa) / n;
    const shown = Math.ceil(n * prog - 0.001);
    for (let i = 0; i < shown; i++) {
      const hgt = up ? H1 + i + 1 : H1 - i - 1;
      const y = base - hgt * CELL;
      const x = xa + i * sw;
      cube(x, y, sw - 1, 9, 12, P.cream);
      rect(x + sw / 2 - 2, y + 9, 4, base - y - 9, P.cream.s);
    }
  }
  ctx.globalAlpha = 1;
}
function drawGuide(prev, h) {
  // 前の家の高さ = つなぎ目。新しい土台の左の壁にその高さを薄く示す
  const H1 = prev.rightH;
  const x0 = X0(h), y = L.base - H1 * CELL;
  ctx.globalAlpha = 0.28 + 0.12 * Math.sin(S.t * 3);
  rect(x0, y - 3, 3 * CELL, 4, '#ffffff');
  ctx.globalAlpha = 1;
  const pr = X0(prev) + COLS * CELL;
  cube(pr - 4, y - 6, 10, 6, 6, P.mint);
}

/* ---------- 本描画 ---------- */
function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = BG; ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.setTransform(DPR * K, 0, 0, DPR * K, DPR * L.ox, DPR * L.oy);
  drawRoom();
  // かつらの棚
  if (S.shelf > 0.01) {
    for (let i = 0; i < 3; i++) {
      if (S.wigFly && S.wigFly.i === i) continue;
      const p = wigPos(i);
      const glow = S.mode === 'choose' && S.target && S.target.type === 'wig' && S.target.i === i;
      const hop = glow ? Math.max(0, Math.sin((S.t % 1.5) / 0.36 * Math.PI)) * ((S.t % 1.5) < 0.36 ? 6 : 0) : 0;
      const wb = Math.sin(S.t * 30) * S.wob.shelf[i] * 0.1;
      ctx.save(); ctx.translate(p.x, p.y - hop); ctx.rotate(wb);
      if (glow) { ctx.globalAlpha = 0.25 + 0.15 * Math.sin(S.t * 6); rect(-40, -6, 80, 96, '#ffffff'); ctx.globalAlpha = 1; }
      cube(-22, 78, 44, 8, 10, P.mint);
      ctx.scale(0.27, 0.27);
      drawHeadCore(0, 1.2 * V + 4, WIG_TUFTS[i], WIGS[i].hair, true, false);
      ctx.restore();
    }
  }
  // 家とつなぎ
  const n = S.houses.length;
  for (let i = 0; i < n; i++) {
    const h = S.houses[i];
    if (h.cx + SPACING < -LW / 2 - 40 || h.cx - SPACING > LW / 2 + 40) continue;
    const prev = i > 0 ? S.houses[i - 1] : null;
    if (prev && h.conn) drawConnector(prev, h, h.conn.H1, h.conn.H2, h.conn.prog, false);
    else if (prev && h === S.cur && !h.done && S.mode === 'build') {
      drawConnector(prev, h, prev.rightH, wallH(h, -1), 1, true);
    }
    drawHouse(h, h === S.cur);
    if (prev && h === S.cur && !h.done && S.mode === 'build') drawGuide(prev, h);
  }
  drawUncle();
  // 運ばれる帽子
  if (S.hat.state === 'carry' || S.hat.state === 'fly') {
    const f = S.hat.state === 'fly' && S.hat.fly ? S.hat.fly.t : 0;
    const sxx = lerp(1, (COLS * CELL + 24) / 64, f), syy = lerp(1, 1.1, f);
    drawHat(S.hat.x, S.hat.y, sxx, syy);
  }
  // かつら
  if (S.wigFly) {
    const f = S.wigFly, k = f.t;
    const x = lerp(f.x0, f.x1, k), y = lerp(f.y0, f.y1, k) - Math.sin(k * Math.PI) * 40, s = lerp(0.27, 1, k);
    ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
    drawHeadCore(0, 1.2 * V, WIG_TUFTS[f.i], WIGS[f.i].hair, true, false);
    ctx.restore();
  }
  // 落ちる角材
  for (const p of S.pieces) {
    if (p.type === 'eave') {
      const ew = CELL * (0.7 + 0.32 * p.elen) * p.s;
      cube(p.x - ew / 2, p.y - 7, ew, 7, DEP * p.s, P[p.col]);
      continue;
    }
    const w = p.w * CELL * p.s, hh = p.h * CELL * p.s;
    ctx.save(); ctx.translate(p.x, p.y - hh / 2); ctx.rotate(p.rot);
    cube(-w / 2, -hh / 2, w, hh, DEP * p.s, P[p.col]);
    ctx.restore();
  }
  // 粒子
  for (const q of S.parts) {
    ctx.globalAlpha = clamp(q.life / q.max, 0, 1);
    ctx.fillStyle = q.col;
    ctx.save(); ctx.translate(q.x, q.y); ctx.rotate(q.rot); ctx.fillRect(-q.sz / 2, -q.sz / 2, q.sz, q.sz); ctx.restore();
  }
  ctx.globalAlpha = 1;
  // 切断線
  if (S.trail.length > 1) {
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    for (let i = 1; i < S.trail.length; i++) {
      const a = S.trail[i - 1], b = S.trail[i];
      const al = clamp(1 - (S.t - b.t) / 0.22, 0, 1);
      ctx.strokeStyle = 'rgba(255,255,255,' + (0.9 * al).toFixed(3) + ')';
      ctx.lineWidth = 6 * al + 1;
      ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
    }
  }
  for (const r of S.rings) {
    const k = r.t / 0.35;
    ctx.strokeStyle = 'rgba(255,255,255,' + (0.5 * (1 - k)).toFixed(3) + ')'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(r.x, r.y, 8 + k * 16, 0, Math.PI * 2); ctx.stroke();
  }
  // お手本の手
  if (S.demo) {
    const d = S.demo, k = d.t / d.dur;
    const fade = Math.min(1, d.t / 0.2, (d.dur - d.t) / 0.2);
    ctx.globalAlpha = clamp(fade, 0, 1);
    if (d.type === 'swipe') {
      const m = clamp((k - 0.2) / 0.6, 0, 1);
      const e = m * m * (3 - 2 * m);
      const x = lerp(d.x0, d.x1, e);
      if (m > 0) {
        ctx.strokeStyle = 'rgba(255,255,255,0.85)'; ctx.lineWidth = 5; ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(lerp(d.x0, d.x1, Math.max(0, e - 0.35)), d.y); ctx.lineTo(x, d.y); ctx.stroke();
      }
      drawDemoHand(x, d.y, 0);
    } else {
      const press = Math.max(0, Math.sin(k * Math.PI * 3));
      drawDemoHand(d.x0, d.y + press * 4, press);
    }
    ctx.globalAlpha = 1;
  }
}

/* ---------- ループ ---------- */
let last = 0, running = true, raf = 0;
function loop(now) {
  if (!running) return;
  let dt = (now - last) / 1000;
  last = now;
  if (!(dt > 0)) dt = 0;
  dt = Math.min(dt, 1 / 30);   // 復帰時の時間の飛躍を防ぐ
  update(dt);
  render();
  raf = requestAnimationFrame(loop);
}
document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    running = false; cancelAnimationFrame(raf);
    endStroke();
    try { if (AC && AC.state === 'running') AC.suspend(); } catch (e) {}
  } else {
    endStroke();
    if (!running) { running = true; last = performance.now(); raf = requestAnimationFrame(loop); }
    try { if (AC && AC.state === 'suspended') { const p = AC.resume(); if (p && p.catch) p.catch(() => {}); } } catch (e) {}
  }
});

/* ---------- 開始 ---------- */
function init() {
  S.tufts = makeTufts(WIGS[1], false);
  const h = newHouse(0);
  S.houses.push(h); S.cur = h;
  layout();
  S.hands[0].x = -6.3 * V; S.hands[0].y = L.headTop + 12.4 * V;
  S.hands[1].x = 6.3 * V; S.hands[1].y = L.headTop + 12.4 * V;
  S.hat.x = -L.mirrorX; S.hat.y = L.headTop + 74;
  last = performance.now();
  raf = requestAnimationFrame(loop);
}
// 自動テスト用の参照(画面には出ない)
window.__G = {
  S, L, V, CELL, WIGS,
  toClient(x, y) { return { x: L.ox + x * K, y: L.oy + y * K }; },
  tuftClient(t) { const g = tuftGeo(t); return { x: L.ox + g.x * K, root: L.oy + g.root * K, tip: L.oy + g.tip * K, k: K }; },
  colHeight, wallH, restMax, X0
};
init();
})();
</script>
