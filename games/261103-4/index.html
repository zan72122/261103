<script>
(function(){
'use strict';
/* =====================================================================
   ぎゅるるん！ハンカチ柄うつし工房とピクニック屋根  (games/261103-4)
   一指で円盤の取っ手を回し、重ねた布を鉄ローラーに通して白いハンカチへ柄をうつす。
   文字UIなし・外部通信なし・単一ファイル。
   ===================================================================== */
const cvs=document.getElementById('c');
const ctx=cvs.getContext('2d');
const SA=document.getElementById('sa');
const TAU=Math.PI*2, PI=Math.PI;
let W=390,H=844,DPR=1;

/* ---------------- utilities ---------------- */
const clamp=(v,a,b)=>v<a?a:(v>b?b:v);
const lerp=(a,b,t)=>a+(b-a)*t;
const ease=t=>{t=clamp(t,0,1);return t*t*(3-2*t);};
const smooth=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t);};
const backOut=t=>{t=clamp(t,0,1);const s=1.9;return 1+(s+1)*Math.pow(t-1,3)+s*Math.pow(t-1,2);};
const dist=(ax,ay,bx,by)=>Math.hypot(ax-bx,ay-by);
const wrapA=a=>{while(a>PI)a-=TAU;while(a<-PI)a+=TAU;return a;};
function mk(w,h){const c=document.createElement('canvas');c.width=Math.max(1,Math.round(w));c.height=Math.max(1,Math.round(h));return c;}
function hash2(x,y){let h=(Math.imul(x|0,374761393)+Math.imul(y|0,668265263))|0;h=Math.imul(h^(h>>>13),1274126177);h^=h>>>16;return (h>>>0)/4294967296;}
function vnoise(x,y){const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi;const u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
  const a=hash2(xi,yi),b=hash2(xi+1,yi),c=hash2(xi,yi+1),d=hash2(xi+1,yi+1);return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v;}
function vnoiseP(x,y,px,py){const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi;const u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
  const m=(a,p)=>((a%p)+p)%p;const x0=m(xi,px),x1=m(xi+1,px),y0=m(yi,py),y1=m(yi+1,py);
  const a=hash2(x0,y0),b=hash2(x1,y0),c=hash2(x0,y1),d=hash2(x1,y1);return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v;}
function fbm(x,y){return vnoise(x,y)*0.5+vnoise(x*2.03+17.1,y*2.03+5.3)*0.3+vnoise(x*4.07+3.7,y*4.07+11.9)*0.2;}
function rrect(g,x,y,w,h,r){r=Math.min(r,w/2,h/2);g.beginPath();g.moveTo(x+r,y);g.lineTo(x+w-r,y);g.quadraticCurveTo(x+w,y,x+w,y+r);
  g.lineTo(x+w,y+h-r);g.quadraticCurveTo(x+w,y+h,x+w-r,y+h);g.lineTo(x+r,y+h);g.quadraticCurveTo(x,y+h,x,y+h-r);g.lineTo(x,y+r);g.quadraticCurveTo(x,y,x+r,y);g.closePath();}
function polyPath(g,pts){g.beginPath();g.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<pts.length;i++)g.lineTo(pts[i][0],pts[i][1]);g.closePath();}
function line(g,a,b,c,d){g.beginPath();g.moveTo(a,b);g.lineTo(c,d);g.stroke();}
let seedR=12345;function srand(s){seedR=s|0||1;}function rnd(){seedR=(Math.imul(seedR,1103515245)+12345)|0;return ((seedR>>>8)&0xffffff)/16777216;}

/* ---------------- constants ---------------- */
const RES=144;             // transfer resolution of a handkerchief
const DISP=288;            // display resolution of pattern cloth
const FEED_PER_TURN=0.42;  // handkerchief lengths per full turn
const BITE=0.068;          // initial bite into rollers
const PMAX_PARTS=90;
const PTYPES=['lace','check','dots','denim'];
const SHELF_CAP=8;

/* ---------------- fabric patterns (x,y in 0..1 of a handkerchief) ---------------- */
function patDenim(x,y,o){
  const N=42;
  const tw=0.5+0.5*Math.sin((x*N+y*N)*TAU);
  const slub=vnoise(x*150,y*5)-0.5, mott=fbm(x*8,y*8)-0.5, wear=fbm(x*3+7,y*3+2);
  let b=0.62+0.24*tw+0.22*slub+0.26*mott+(wear>0.66?(wear-0.66)*1.3:0);
  const fl=hash2(Math.floor(x*300),Math.floor(y*300));
  const w=fl>0.955?0.5:(fl>0.885?0.2:0);
  o[0]=lerp(22+22*b,196,w);o[1]=lerp(38+38*b,204,w);o[2]=lerp(66+74*b,214,w);o[3]=1;
}
function bandC(f){return f<0.3?1:((f>0.5&&f<0.6)?2:((f>0.7&&f<0.735)?1:0));}
function patCheck(x,y,o){
  const P=3,T=66;
  const fx=(x*P)%1,fy=(y*P)%1;
  const ti=Math.floor(x*T),tj=Math.floor(y*T);
  const warp=((ti+tj)&3)<2;
  const which=warp?bandC(fx):bandC(fy);
  if(!which){o[3]=0;return;}
  const across=warp?(x*T)%1:(y*T)%1;
  const s=0.8+0.26*Math.sin(across*PI)+0.1*(vnoise(x*250,y*250)-0.5)+0.08*(vnoise(warp?x*T:x*3,warp?y*3:y*T)-0.5);
  if(which===1){o[0]=170*s;o[1]=28*s;o[2]=34*s;}else{o[0]=28*s;o[1]=38*s;o[2]=88*s;}
  o[3]=1;
}
function patDots(x,y,o){
  const P=4.4;const gy=y*P,row=Math.floor(gy);const gx=x*P+(row&1)*0.5;
  const dx=gx-Math.floor(gx)-0.5,dy=gy-row-0.5;const d=Math.sqrt(dx*dx+dy*dy);
  const R0=0.29+0.03*(vnoise(x*30,y*30)-0.5);
  let a=clamp((R0-d)/0.035,0,1);
  if(a<=0){o[3]=0;return;}
  const k=vnoise(x*120,y*120),k2=vnoise(x*320,y*320),st=vnoise(x*4,y*160);
  if(k<0.3)a*=0.18+k*1.6;
  a*=0.8+0.2*k2;
  if(st<0.2)a*=0.45;
  const e=d/R0;
  o[0]=lerp(242,192,e*e);o[1]=lerp(188,126,e*e);o[2]=lerp(36,12,e*e);o[3]=clamp(a,0,1);
}
function patLace(x,y,o){
  const k=17;
  const a1=Math.abs((((x+y)*k)%1+1)%1-0.5),a2=Math.abs((((x-y)*k)%1+1)%1-0.5);
  let t=Math.max(smooth(0.37,0.46,a1),smooth(0.37,0.46,a2));
  const P=3;const gx=x*P,gy=y*P;const dx=gx-Math.floor(gx)-0.5,dy=gy-Math.floor(gy)-0.5;
  const r=Math.sqrt(dx*dx+dy*dy),th=Math.atan2(dy,dx);
  const pet=0.3*(0.68+0.32*Math.abs(Math.cos(th*3)));
  if(r<pet&&r>0.07){
    const inner=r<pet-0.035;
    if(inner){t=Math.max(t,0.72+0.28*((Math.floor(x*120)+Math.floor(y*120))&1));
      const vein=Math.abs(Math.sin(th*3));if(r>0.11&&vein<0.09)t=0;}
    else t=1;
  }
  if(Math.abs(r-0.4)<0.022)t=1;
  if(Math.abs(r-0.046)<0.015)t=1;
  if(r<0.03)t=0;
  // small picot dots in the gaps
  const cx2=Math.abs(dx)-0.5,cy2=Math.abs(dy)-0.5;const rc=Math.sqrt(cx2*cx2+cy2*cy2);
  if(rc<0.07&&rc>0.035)t=1;
  if(t<=0.02){o[3]=0;return;}
  const sh=0.82+0.18*vnoise(x*200,y*200);
  o[0]=246*sh;o[1]=238*sh;o[2]=218*sh;o[3]=t;
}
const PF={lace:patLace,check:patCheck,dots:patDots,denim:patDenim};
const GROUND={lace:null,check:[232,220,194,0.55],dots:[244,239,224,0.5],denim:null};
const INKTINT={lace:[0.8,0.74,0.62],check:[1,1,1],dots:[1,1,1],denim:[1.05,1.05,1.05]};
const INKA={lace:1,check:0.96,dots:0.96,denim:0.93};
const FIBERCOL={lace:'#efe4cc',check:'#a8262c',dots:'#e3ae22',denim:'#2c4677',item:'#f4f0e6'};

const SW={};
function genInk(type){
  const N=RES,f=PF[type],out=new Float32Array(N*N*4),o=[0,0,0,0],t=INKTINT[type],ia=INKA[type];
  for(let j=0;j<N;j++)for(let i=0;i<N;i++){o[3]=0;f((i+.5)/N,(j+.5)/N,o);const k=(j*N+i)*4;
    out[k]=o[0]*t[0];out[k+1]=o[1]*t[1];out[k+2]=o[2]*t[2];out[k+3]=o[3]*ia;}
  return out;
}
function genDisp(type){
  const N=DISP,c=mk(N,N),g=c.getContext('2d'),im=g.createImageData(N,N),d=im.data,f=PF[type],gr=GROUND[type],o=[0,0,0,0];
  const sc=mk(N,N),sg=sc.getContext('2d'),sim=sg.createImageData(N,N),sd=sim.data;
  for(let j=0;j<N;j++)for(let i=0;i<N;i++){
    const x=(i+.5)/N,y=(j+.5)/N;o[3]=0;f(x,y,o);
    let r=o[0],gg=o[1],b=o[2],a=o[3];
    if(gr){const gs=0.9+0.1*Math.sin(((x*66)%1)*PI)*Math.sin(((y*66)%1)*PI)+0.06*(vnoise(x*90,y*90)-.5);
      const ga=gr[3]*(1-a),A=a+ga;if(A>0){r=(r*a+gr[0]*gs*ga)/A;gg=(gg*a+gr[1]*gs*ga)/A;b=(b*a+gr[2]*gs*ga)/A;}a=A;}
    const ex=Math.min(x,1-x),ey=Math.min(y,1-y),e=Math.min(ex,ey);
    if(e<0.04){const vert=ex<ey;const coord=(vert?y:x)*N*0.5;const ti=Math.floor(coord);
      const Lf=0.006+0.03*hash2(ti,vert?(x<.5?1:2):(y<.5?3:4));a*=smooth(0,Lf,e);if(e<Lf&&(coord%1)>0.55)a*=0.35;}
    const k=(j*N+i)*4;d[k]=r;d[k+1]=gg;d[k+2]=b;d[k+3]=a*255;
    sd[k]=38;sd[k+1]=24;sd[k+2]=12;sd[k+3]=a*255*0.45;
  }
  g.putImageData(im,0,0);sg.putImageData(sim,0,0);
  return {disp:c,shadow:sc};
}

/* ---------------- handkerchief objects ---------------- */
const BASEN=new Float32Array(RES*RES);
let nextId=1;
function newHankie(){
  return {id:nextId++,ink:new Float32Array(RES*RES*4),cv:null,cx:null,img:null,dirty:true,pcv:null,pdirty:true,
    p:BITE,fold:null,theta:PI,thTarget:null,thCb:null,wasFolded:false,sources:new Set(),inkVer:0,completedVer:-1,
    slideX:0,sliding:false,out:false,ox:0,oy:0,offX:0,offY:0,outSlide:0,flipT:0,lift:0,peek:0,peekOpen:0,wig:0,
    inUse:false,fly:null,shownSources:0,celebrated:false,sway:Math.random()*TAU};
}
function refreshHankie(h){
  if(!h.cv){h.cv=mk(RES,RES);h.cx=h.cv.getContext('2d');h.img=h.cx.createImageData(RES,RES);}
  const d=h.img.data,ink=h.ink;
  for(let i=0,n=RES*RES;i<n;i++){const k=i*4,a=ink[k+3],bn=BASEN[i];
    const br=248*bn,bg=246*bn,bb=239*bn;
    d[k]=br+(ink[k]-br)*a;d[k+1]=bg+(ink[k+1]-bg)*a;d[k+2]=bb+(ink[k+2]-bb)*a;d[k+3]=255;}
  h.cx.putImageData(h.img,0,0);h.dirty=false;h.pdirty=true;
}
function patchCanvasOf(h){
  if(h.dirty)refreshHankie(h);
  if(!h.pcv||h.pdirty){
    if(!h.pcv)h.pcv=mk(RES,RES);
    const g=h.pcv.getContext('2d'),im=g.createImageData(RES,RES),d=im.data,ink=h.ink;
    for(let j=0;j<RES;j++)for(let i=0;i<RES;i++){const k=(j*RES+i)*4,a=ink[k+3],bn=BASEN[j*RES+i];
      const ga=0.5*(1-a),A=a+ga;
      d[k]=(ink[k]*a+246*bn*ga)/A;d[k+1]=(ink[k+1]*a+244*bn*ga)/A;d[k+2]=(ink[k+2]*a+236*bn*ga)/A;
      const e=Math.min(i,RES-1-i,j,RES-1-j);d[k+3]=A*255*(e<1?0.6:1);}
    g.putImageData(im,0,0);h.pdirty=false;
  }
  return h.pcv;
}
function cloneHankie(src){const h=newHankie();h.ink.set(src.ink);src.sources.forEach(s=>h.sources.add(s));h.inkVer=src.inkVer;h.dirty=true;return h;}
function hankieColor(h){ // average ink color for fibers
  let r=0,g=0,b=0,a=0;for(let i=0;i<RES*RES;i+=37){const k=i*4,w=h.ink[k+3];r+=h.ink[k]*w;g+=h.ink[k+1]*w;b+=h.ink[k+2]*w;a+=w;}
  if(a<0.5)return '#f4f0e6';return 'rgb('+(r/a|0)+','+(g/a|0)+','+(b/a|0)+')';
}

/* ---------------- folds ---------------- */
const S2=Math.SQRT1_2;
const FOLDS={L:{n:[-1,0]},R:{n:[1,0]},T:{n:[0,-1]},B:{n:[0,1]},TL:{n:[-S2,-S2]},BR:{n:[S2,S2]},TR:{n:[S2,-S2]},BL:{n:[-S2,S2]}};
function clipHalf(poly,n,sign){const out=[];const f=v=>((v[0]-.5)*n[0]+(v[1]-.5)*n[1])*sign;
  for(let i=0;i<poly.length;i++){const a=poly[i],b=poly[(i+1)%poly.length];const fa=f(a),fb=f(b);
    if(fa>=-1e-9)out.push(a);if((fa>=-1e-9)!==(fb>=-1e-9)){const t=fa/(fa-fb);out.push([a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t]);}}
  return out;}
(function(){const sq=[[0,0],[1,0],[1,1],[0,1]];for(const k in FOLDS){const F=FOLDS[k];F.B=clipHalf(sq,F.n,1);F.A=clipHalf(sq,F.n,-1);
  let mn=1,mx=0;for(const p of F.A){mn=Math.min(mn,p[0]);mx=Math.max(mx,p[0]);}F.uMin=mn;F.uMax=mx;
  F.span=(k.length===2)?Math.SQRT2:1;
  const cr=F.B.filter(p=>Math.abs((p[0]-.5)*F.n[0]+(p[1]-.5)*F.n[1])<1e-6);F.crease=cr.slice(0,2);}})();
function uRange(h){if(!h.fold)return [0,1];const F=FOLDS[h.fold];return [F.uMin,F.uMax];}
function pMinOf(h){return 1-uRange(h)[1]+BITE;}
function pMaxOf(h){return 1-uRange(h)[0]-0.012;}
function isFinished(h){return !!h&&!h.out&&h.p>=pMaxOf(h)-1e-3&&(!h.fold||h.theta<0.01);}

/* ---------------- state ---------------- */
const G={t:0,scene:'work',trans:null,unlocked:false,revealDone:false,revealAt:0,deliverAt:0,
  hankie:null,patches:[],shelf:[],fav:null,flying:[],parts:[],
  disc:{ang:0,vel:0,acc:0,pressed:false,squeeze:0,sqV:0,wob:0,wobV:0,lastFeedT:-9},
  snag:null,shake:0,lastInput:0,demoDone:false,lastHint:-9,firstTap:false,
  swUse:{lace:0,check:0,dots:0,denim:0},swHop:[0,0,0,0],laceCount:0,made:0,everFolded:false,foldOffers:0,reuse:0,
  shelfAtPic:0,decorWig:[0,0],doorHop:0,target:null,emph:0,saveStatus:'init',
  log:{},
  pic:{c:100,poleH:80,cx:0,cy:0,homeX:0,homeY:0,slots:[null,null,null,null,null,null],inited:false,moves:0,changes:0,
    dolls:[],rug:{x:0,y:0},flutter:0,cellHop:-1,cellHopT:0,miniHop:0}
};
function logD(k,v){if(!G.log[k])G.log[k]={t:+G.t.toFixed(2),v:v||true};}

/* ---------------- textures ---------------- */
const TEX={};
let WEAVE=null;
function genStaticTex(){
  // linen bench tile (device px)
  {const n=256,c=mk(n,n),g=c.getContext('2d'),im=g.createImageData(n,n),d=im.data;
    for(let j=0;j<n;j++)for(let i=0;i<n;i++){
      const wv=((i>>1)+(j>>1))&1?1:-1;
      const thr=Math.sin(((j%3)/3)*PI)*0.5+Math.sin(((i%3)/3)*PI)*0.5;
      const slub=vnoiseP(i*0.04,j*0.5,256*0.04,128)-0.5, slub2=vnoiseP(i*0.5,j*0.03,128,256*0.03)-0.5;
      const big=vnoiseP(i/64,j/64,4,4)-0.5, fine=hash2(i,j)-0.5;
      let v=0.93+0.025*wv+0.05*thr+0.07*slub+0.05*slub2+0.05*big+0.04*fine;
      let r=228*v,gg=215*v,b=186*v;
      if(hash2(i*7+3,j*5+1)>0.9985){r*=0.55;gg*=0.48;b*=0.4;}
      const k=(j*n+i)*4;d[k]=r;d[k+1]=gg;d[k+2]=b;d[k+3]=255;}
    g.putImageData(im,0,0);TEX.linen=c;}
  // dark wood (horizontal grain)
  {const w=640,h=140,c=mk(w,h),g=c.getContext('2d'),im=g.createImageData(w,h),d=im.data;
    for(let j=0;j<h;j++)for(let i=0;i<w;i++){
      const warp=fbm(i*0.004,j*0.03)*22;
      const gr=Math.sin((j*0.42+warp));const gr2=Math.sin(j*1.7+warp*2.2);
      const pore=hash2(i>>1,j)>0.93?-0.08:0;
      const streak=vnoise(i*0.01,j*0.6)-0.5;
      let v=0.78+0.1*gr+0.05*gr2+0.18*streak+pore;
      const k=(j*w+i)*4;d[k]=96*v;d[k+1]=60*v;d[k+2]=34*v;d[k+3]=255;}
    g.putImageData(im,0,0);TEX.wood=c;}
  // light wood (spools, knobs)
  {const w=256,h=64,c=mk(w,h),g=c.getContext('2d'),im=g.createImageData(w,h),d=im.data;
    for(let j=0;j<h;j++)for(let i=0;i<w;i++){const warp=fbm(i*0.01,j*0.05)*14;const gr=Math.sin(j*0.5+warp);
      let v=0.85+0.08*gr+0.12*(vnoise(i*0.02,j*0.7)-0.5);const k=(j*w+i)*4;d[k]=176*v;d[k+1]=124*v;d[k+2]=76*v;d[k+3]=255;}
    g.putImageData(im,0,0);TEX.lwood=c;}
  // felt grass tile
  {const n=256,c=mk(n,n),g=c.getContext('2d'),im=g.createImageData(n,n),d=im.data;
    for(let j=0;j<n;j++)for(let i=0;i<n;i++){
      const a=vnoiseP(i/16,j/16,16,16),b=vnoiseP(i/5,j/5,51.2,51.2),f=hash2(i,j);
      const fib=Math.sin((i*0.9+j*0.4)+b*6)*0.5+0.5;
      let v=0.78+0.18*a+0.1*b+0.08*(f-0.5)+0.04*fib;
      const k=(j*n+i)*4;d[k]=54*v;d[k+1]=82*v;d[k+2]=38*v;d[k+3]=255;
      if(f>0.996){d[k]=120;d[k+1]=140;d[k+2]=70;}}
    g.putImageData(im,0,0);TEX.felt=c;}
  // cotton weave overlay (device px, alpha)
  {const n=48,c=mk(n,n),g=c.getContext('2d'),im=g.createImageData(n,n),d=im.data;
    for(let j=0;j<n;j++)for(let i=0;i<n;i++){const w=((i>>1)+(j>>1))&1;const nn=hash2(i*3,j*5);
      const sl=vnoiseP(i*0.25,j*0.06,12,2.88);
      const al=(w?0.07:0.015)+nn*0.04+(sl>0.7?0.04:0);const k=(j*n+i)*4;

    const cr=AC.createOscillator();cr.type='sawtooth';cr.frequency.value=110;const cbp=AC.createBiquadFilter();cbp.type='bandpass';cbp.frequency.value=1150;cbp.Q.value=9;

  let o=null;try{o=JSON.parse(raw);}catch(e){o=null;}

/* ---------------- feeding & transfer ---------------- */
function transfer(h,p0,p1){
  const R=RES;let i0=Math.floor((1-p1)*R-0.5)+1,i1=Math.floor((1-p0)*R-0.5);
  i0=Math.max(0,i0);i1=Math.min(R-1,i1);if(i1<i0)return;
  const pts=G.patches;if(!pts.length)return;
  const F=h.fold?FOLDS[h.fold]:null;
  const offs=pts.map(p=>({ou:Math.round(p.du*R),ov:Math.round(p.dv*R),ink:p.ink,p,hit:false}));
  let wrote=false;const ink=h.ink;const salt=(h.inkVer*7)&255;
  for(let i=i0;i<=i1;i++){const cu=(i+.5)/R;
    for(let j=0;j<R;j++){const cv=(j+.5)/R;let ri=-1,rj=-1;
      if(F){const dd=(cu-0.5)*F.n[0]+(cv-0.5)*F.n[1];if(dd>1e-6)continue;
        if(dd<-1e-6){const qx=cu-2*dd*F.n[0],qy=cv-2*dd*F.n[1];ri=Math.floor(qx*R);rj=Math.floor(qy*R);if(ri<0||rj<0||ri>=R||rj>=R)ri=-1;}}
      let A=0,r=0,g=0,b=0;
      for(let k=offs.length-1;k>=0;k--){const o=offs[k];const pi=i-o.ou,pj=j-o.ov;if(pi<0||pj<0||pi>=R||pj>=R)continue;
        const idx=(pj*R+pi)*4,a=o.ink[idx+3];if(a<=0.003)continue;const w=(1-A)*a;
        r+=w*o.ink[idx];g+=w*o.ink[idx+1];b+=w*o.ink[idx+2];A+=w;if(w>0.04)o.hit=true;if(A>0.99)break;}
      if(A<0.01)continue;
      r/=A;g/=A;b/=A;
      const aa=A*(0.84+0.16*hash2(i*3+salt,j*5+7));
      put(ink,(j*R+i)*4,r,g,b,aa);if(ri>=0)put(ink,(rj*R+ri)*4,r,g,b,aa);
      wrote=true;
    }
  }
  if(wrote){h.dirty=true;h.inkVer++;
    for(const o of offs)if(o.hit){const key=o.p.src==='swatch'?o.p.type:('item'+o.p.item.id);
      if(!h.sources.has(key)){h.sources.add(key);h.newSrcT=G.t;}
      if(o.p.src!=='swatch'){h.reused=true;o.p.item.sources.forEach(s=>h.sources.add('in:'+s));}}
    // discovery bookkeeping
    const lay=offs.filter(o=>o.hit).map(o=>o.p.type);
    if(lay.length>=2){const top=lay[lay.length-1],bot=lay[0];logD('stack:'+bot+'>'+top);}
    if(lay.includes('lace'))logD('lace-pass');
    if(F)logD('fold-pass:'+h.fold);
  }
}
function put(ink,k,r,g,b,a){const a0=ink[k+3];const na=a+a0*(1-a);if(na<=0)return;const w0=a0*(1-a);
  ink[k]=(r*a+ink[k]*w0)/na;ink[k+1]=(g*a+ink[k+1]*w0)/na;ink[k+2]=(b*a+ink[k+2]*w0)/na;ink[k+3]=na;}

  const h=G.hankie;if(!h||h.out||h.sliding||G.trans)return;
  if(h.fold&&h.theta>0.001)return;if(!h.fold&&h.theta<PI-0.001)return;

      if(1-p0>us&&1-np<=us){np=1-us;G.snag={patch:pt,strain:0,release:0,pull:0.4,t0:G.t};SFX.snag();logD('snag');break;}}}

/* ---------------- game flow ---------------- */

function currentTarget(){
  if(G.trans)return null;

    const h=G.hankie;if(!h||h.sliding)return null;
    if(G.snag)return {k:'discRev'};
    if(h.out||isFinished(h))return h.fold?{k:'flap'}:{k:'out'};
    if(h.fold&&!G.patches.length&&h.p<=pMinOf(h)+0.012)return {k:'swatch',i:leastUsedSwatch()};
    if(freshTargetIdle(h)){
      if(G.revealDone&&G.shelf.length-G.shelfAtPic>=2)return {k:'door'};
      if(h.offerFold)return {k:'fold'};
      if(G.made>=2&&G.reuse===0&&G.shelf.some(it=>!it.inUse))return {k:'shelfItem',i:lastFreeShelf()};
      return {k:'swatch',i:leastUsedSwatch()};

    const P=G.pic;

    if(P.changes===0&&G.shelf.length)return {k:'item',i:Math.max(0,G.shelf.length-1)};

function canGeom(sc){const P=G.pic,c=P.c*(sc==null?1:sc);return {c,x0:P.cx-1.5*c,y0:P.cy-c,w:3*c,h:2*c,hem:c*0.16,val:c*0.28};}

    for(let i=0;i<6;i++){const it=P.slots[i];if(!it||used.has(it)){P.slots[i]=newItems.shift()||it||items[0]||null;}used.add(P.slots[i]);}}

  let moving=0;
  P.dolls.forEach((d,i)=>{const tx=cx+offs[i][0]*c,ty=cy+offs[i][1]*c;const dx=tx-d.x,dy=ty-d.y,dd=Math.hypot(dx,dy);

      d.ph+=dt*9;if(Math.sin(d.ph)>0.97&&Math.random()<0.3)SFX.step();}
    else{d.walk=Math.max(0,d.walk-dt*4);d.sit=Math.min(1,d.sit+dt*2.5);}

function startDisc(x,y){
  const D=G.disc;D.pressed=true;D.squeeze=Math.max(D.squeeze,0.92);D.sqV=0;SFX.squeeze();
  if(!G.firstTap){G.firstTap=true;feed(0.05);logD('first-tap');}
  const a0=Math.atan2(y-L.disc.y,x-L.disc.x);
  return {kind:'disc',last:a0,move(mx,my){const dx=mx-L.disc.x,dy=my-L.disc.y,r=Math.hypot(dx,dy);const a=Math.atan2(dy,dx);
      if(r<L.disc.r*0.16){this.last=a;return;}let d=wrapA(a-this.last);this.last=a;if(Math.abs(d)>1.2)d=Math.sign(d)*1.2;applyCrank(d);},
    up(){D.pressed=false;D.wobV+=clamp(-D.vel*0.012,-0.12,0.12);}};
}
function patchDrag(pt,x,y,rx,ry,rs,from){
  const d={kind:'patch',pt,item:pt.item||null,fu:(x-rx)/rs,fv:(y-ry)/rs,s:rs,x:rx,y:ry,mx:x,my:y,from,
    move(mx,my){this.mx=mx;this.my=my;},
    up(mx,my,cancel){
      if(!cancel&&G.scene==='work'){
        if(pt.src!=='swatch'&&hitHook(mx,my)){setFav(pt.item);returnPatch(pt,{x:this.x,y:this.y,s:this.s});return;}
        if(dropPatch(pt,mx-this.fu*L.S,my-this.fv*L.S))return;
      }
      if(!cancel&&G.scene==='pic'&&pt.src!=='swatch'){
        if(hitHook(mx,my)){setFav(pt.item);pt.item.inUse=false;return;}
        const ci=hitCell(mx,my);if(ci>=0){G.pic.slots[ci]=pt.item;pt.item.inUse=false;G.pic.changes++;G.pic.cellHop=ci;G.pic.cellHopT=1;G.pic.flutter=1;SFX.swap();logD('canopy-replace');return;}
      }
      returnPatch(pt,{x:this.x,y:this.y,s:this.s});
    },
    update(dt){const ts=G.scene==='work'?L.S:G.pic.c;this.s=lerp(this.s,ts,1-Math.exp(-dt*14));this.x=this.mx-this.fu*this.s;this.y=this.my-this.fv*this.s;},
    draw(){ctx.save();ctx.globalAlpha=0.5;ctx.drawImage(pt.shadow,this.x+this.s*0.05,this.y+this.s*0.08,this.s,this.s);ctx.globalAlpha=1;ctx.drawImage(pt.disp,this.x,this.y,this.s,this.s);
      if(pt.src!=='swatch'||pt.type!=='lace'){ctx.beginPath();ctx.rect(this.x,this.y,this.s,this.s);ctx.clip();weaveFill(this.x,this.y,this.s,this.s,0.7);}ctx.restore();}};
  return d;
}
function dropPatch(pt,x,y){
  const h=G.hankie;if(!h||h.out||h.sliding)return false;
  const f=hankieFrame(h),S=L.S;let du=(x-f.x)/S,dv=(y-f.y)/S;const uN=1-h.p;
  du=Math.min(du,uN-1);
  const ou=Math.min(du+1,uN)-Math.max(du,0),ov=Math.min(dv+1,1)-Math.max(dv,0);
  if(ou<0.12||ov<0.12)return false;
  pt.du=Math.max(du,-0.9);pt.dv=clamp(dv,-0.88,0.88);
  if(pt.type==='lace'&&!pt.decided){pt.decided=true;G.laceCount++;pt.snaggable=(G.laceCount%3===2);}
  G.patches.push(pt);
  while(G.patches.length>4){const b=G.patches.shift();returnPatch(b);}
  if(pt.src==='swatch')G.swUse[pt.type]++;else{G.reuse++;logD('reuse-place');}
  if(G.patches.length>=2)logD('layered');
  if(h.offerFold)h.offerFold=false;
  SFX.drop();return true;
}
function startSwatch(i,x,y){const s=L.sw[i];const pt=swatchPatch(s.type);SFX.pick();G.swHop[i]=0.5;return patchDrag(pt,x,y,s.x,s.y,s.s,'swatch');}
function startPatchMove(k,x,y){const pt=G.patches[k];const r=patchRect(pt);G.patches.splice(k,1);if(G.snag&&G.snag.patch===pt){pt.snagDone=true;G.snag=null;SFX.release();}SFX.pick();logD('patch-moved');return patchDrag(pt,x,y,r.x,r.y,r.s,'inlet');}
function startItem(item,src,x,y){
  const s=src==='fav'?{x:L.hook.x+L.hook.s*0.1,y:L.hook.y+L.hook.s*0.1,s:L.hook.s*0.8}:L.slots[G.shelf.indexOf(item)];
  item.inUse=true;const pt=itemPatch(item,src);SFX.pick();
  return patchDrag(pt,x,y,s.x,s.y,s.s,src);
}
function startFold(fz,x,y){
  const h=G.hankie;
  if(fz.unfold){const F=FOLDS[h.fold];return {kind:'fold',pr:0,move(mx,my){const pr=clamp(((mx-x)*F.n[0]+(my-y)*F.n[1])/(L.S*F.span),0,1);h.theta=PI*pr;this.pr=pr;},
    up(){if(this.pr>0.3){animTheta(h,PI,()=>{h.fold=null;h.theta=PI;const d=h.p-BITE;if(d>0){h.p=BITE;h.slideX+=d*L.S;}});SFX.open();}else animTheta(h,0);}};}
  const F=FOLDS[fz.key];h.fold=fz.key;h.theta=PI;h.thTarget=null;
  return {kind:'fold',pr:0,move(mx,my){const pr=clamp(((mx-x)*-F.n[0]+(my-y)*-F.n[1])/(L.S*F.span),0,1);h.theta=PI*(1-pr);this.pr=pr;},
    up(){if(this.pr>0.3){animTheta(h,0,()=>commitFold(h));SFX.fold();}else animTheta(h,PI);}};
}
function startOut(x,y){
  const h=G.hankie;makeOut(h);
  if(h.fold){const F=FOLDS[h.fold];return {kind:'open',pr:0,move(mx,my){const pr=clamp(((mx-x)*F.n[0]+(my-y)*F.n[1])/(L.S*F.span),0,1);h.theta=PI*pr;this.pr=pr;},
    up(mx,my,c){if(this.pr>0.22||(!c&&this.moved<14)){animTheta(h,PI,()=>afterOpen(h));SFX.open();}else animTheta(h,0);}};}
  SFX.pick();
  return {kind:'outmove',move(mx,my){h.offX=mx-x;h.offY=my-y;},
    up(mx,my,c){if(!c&&overShelf(mx,my)){shelve(h,hitHook(mx,my));}else if(!c&&this.moved<12){h.liftT=0;h.bounce=1;}}};
}
function hitCell(x,y){const g=canGeom();if(x<g.x0||x>g.x0+g.w||y<g.y0||y>g.y0+g.h)return -1;return Math.floor((y-g.y0)/g.c)*3+Math.floor((x-g.x0)/g.c);}
function hitCanopyMove(x,y){const g=canGeom();const pad=14;
  const inOuter=x>=g.x0-g.hem-pad&&x<=g.x0+g.w+g.hem+pad&&y>=g.y0-g.hem-pad&&y<=g.y0+g.h+g.hem+g.val*1.3+pad;
  const onPole=(Math.abs(x-(g.x0-g.hem*0.4))<22||Math.abs(x-(g.x0+g.w+g.hem*0.4))<22)&&y>g.y0+g.h&&y<g.y0+g.h+G.pic.poleH;
  return inOuter||onPole;}
function downPic(x,y){
  const m=L.mini;if(x>=m.x-8&&x<=m.x+m.s+8&&y>=m.y+m.s*0.15&&y<=m.y+m.s*0.95)return {kind:'tap',up(ux,uy,c){if(!c&&this.moved<30)goWork();}};
  const si=hitShelf(x,y);if(si>=0)return startItem(G.shelf[si],'item',x,y);
  if(hitHook(x,y)&&G.fav&&!G.fav.inUse)return startItem(G.fav,'fav',x,y);
  const ci=hitCell(x,y);if(ci>=0&&G.pic.slots[ci])return startCell(ci,x,y);
  if(hitCanopyMove(x,y))return startCanopy(x,y);
  for(const d of G.pic.dolls){if(dist(x,y,d.x,d.y-G.pic.c*0.3)<G.pic.c*0.35){d.hop=1;SFX.tick();return null;}}
  return null;
}
function startCanopy(x,y){const P=G.pic;const cx0=P.cx,cy0=P.cy;SFX.slide();
  return {kind:'canopy',move(mx,my){const f=L.field,c=P.c;P.cx=clamp(cx0+mx-x,f.x+c*0.6,f.x+f.w-c*0.6);P.cy=clamp(cy0+my-y,f.y+c*0.95,f.y+f.h-c*2.5);P.flutter=Math.max(P.flutter,0.6);},
    up(){if(this.moved>12){P.moves++;logD('canopy-move');}}};}
function startCell(i,x,y){const P=G.pic,g=canGeom();const it=P.slots[i];SFX.pick();
  const rx=g.x0+(i%3)*g.c,ry=g.y0+Math.floor(i/3)*g.c;
  return {kind:'cell',i,item:it,fu:(x-rx)/g.c,fv:(y-ry)/g.c,mx:x,my:y,
    move(mx,my){this.mx=mx;this.my=my;},
    up(mx,my,c){const j=c?-1:hitCell(mx,my);if(j>=0&&j!==i){const t=P.slots[j];P.slots[j]=it;P.slots[i]=t;P.changes++;P.cellHop=j;P.cellHopT=1;P.flutter=1;SFX.swap();logD('canopy-swap');}
      else if(!c&&hitHook(mx,my)){setFav(it);}},
    draw(){const s=P.c;const x0=this.mx-this.fu*s,y0=this.my-this.fv*s;ctx.drawImage(TEX.sqShadow,x0+6,y0+10,s,s);drawThumb(it,x0,y0,s);}};}

/* ---------------- update loop ---------------- */
function update(dt){
  G.t+=dt;
  for(let i=timers.length-1;i>=0;i--){if(G.t>=timers[i].t){const f=timers[i].fn;timers.splice(i,1);f();}}
  const D=G.disc;
  const inst=dt>0?D.acc/dt:0;D.acc=0;D.vel=lerp(D.vel,inst,1-Math.exp(-dt*12));
  // squeeze spring with bounce-back
  const sqT=D.pressed?1:0;D.sqV+=(sqT-D.squeeze)*260*dt;D.sqV*=Math.exp(-dt*16);D.squeeze+=D.sqV*dt;D.squeeze=clamp(D.squeeze,-0.25,1.1);
  D.wobV+=-D.wob*120*dt;D.wobV*=Math.exp(-dt*7);D.wob+=D.wobV*dt;
  const snagPull=G.snag?G.snag.pull:0;
  G.shake=lerp(G.shake,Math.min(1,Math.abs(D.vel)/7)*0.8+snagPull*1.6,1-Math.exp(-dt*10));
  if(G.snag){G.snag.pull=Math.max(0.15,G.snag.pull-dt*0.7);}
  const h=G.hankie;
  if(h){
    if(h.sliding){}else if(Math.abs(h.slideX)>0.3){h.slideX*=Math.exp(-dt*9);}else h.slideX=0;
    if(Math.abs(h.outSlide)>0.3)h.outSlide*=Math.exp(-dt*9);else h.outSlide=0;
    if(h.out&&!(drag&&drag.kind==='outmove')&&!h.carry){h.offX*=Math.exp(-dt*10);h.offY*=Math.exp(-dt*10);}
    if(h.thTarget!=null){const d=h.thTarget-h.theta;const st=dt*9;if(Math.abs(d)<=st){h.theta=h.thTarget;h.thTarget=null;
        if(h.theta>=PI-1e-3&&h.fold){h.fold=null;}const cb=h.thCb;h.thCb=null;if(cb)cb();}else h.theta+=Math.sign(d)*st;}
    h.lift=lerp(h.lift,h.liftT||0,1-Math.exp(-dt*8));h.peek=lerp(h.peek,(h.peekT||0)+(G.target&&G.target.k==='fold'&&!drag?hopCurve()*0.5*G.emph:0),1-Math.exp(-dt*8));
    h.peekOpen=lerp(h.peekOpen,(h.peekOpenT||0)+(G.target&&G.target.k==='flap'&&!drag?hopCurve()*0.5*G.emph:0),1-Math.exp(-dt*8));
    h.wig=Math.max(0,h.wig-dt*2.5);h.bounce=Math.max(0,(h.bounce||0)-dt*2.5);
    // out hankie emphasis: corner lift when it's the target
    if(G.target&&G.target.k==='out'&&!drag&&!hand.kind){h.liftT=hopCurve()*0.7*G.emph;}else if(!hand.kind)h.liftT=0;
    // fibres at the nip while feeding
    if(!h.out&&Math.abs(D.vel)>0.6&&G.scene==='work'&&Math.random()<Math.min(0.9,Math.abs(D.vel)*0.06)){
      const tp=G.patches.length?G.patches[G.patches.length-1]:null;const col=tp?(FIBERCOL[tp.type]||FIBERCOL.item):FIBERCOL.item;
      emitFibers(L.nipX+(D.vel>0?L.rw*0.6:-L.rw*0.6),L.hy+Math.random()*L.S,col,1,8);}
    if(!h.out&&h.p>=pMaxOf(h)-1e-4&&h.inkVer!==h.completedVer&&h.theta<0.01||(!h.out&&!h.fold&&h.p>=pMaxOf(h)-1e-4&&h.inkVer!==h.completedVer))onComplete(h);
    // show-off pinch when new pattern emerged and the crank pauses
    if(!h.out&&h.newSrcT&&G.t-D.lastFeedT>0.8&&!hand.kind&&!drag&&h.sources.size>h.shownSources&&h.p>0.3&&G.scene==='work'){
      h.shownSources=h.sources.size;
      handPlay('show',[{x:()=>hankieFrame(h).x+L.S*0.94,y:()=>hankieFrame(h).y+L.S*0.06,dur:0.55,pinch:0.9,done(){h.liftT=1;}},
        {x:()=>hankieFrame(h).x+L.S*0.9,y:()=>hankieFrame(h).y+L.S*0.1,dur:0.8,follow:true,done(){h.liftT=0;},cancel(){h.liftT=0;}}]);}
  }
  if(G.hookHop)G.hookHop=Math.max(0,G.hookHop-dt*2.5);if(G.doorHop)G.doorHop=Math.max(0,G.doorHop-dt*2);
  for(let i=0;i<4;i++)G.swHop[i]=Math.max(0,G.swHop[i]-dt*2.5);for(let i=0;i<2;i++)G.decorWig[i]=Math.max(0,G.decorWig[i]-dt*1.8);
  for(const it of G.shelf){if(it.fly){it.fly.t+=dt*2.2;if(it.fly.t>=1)it.fly=null;}}
  for(let i=G.flying.length-1;i>=0;i--){const f=G.flying[i];f.t+=dt*2.6;if(f.t>=1){G.flying.splice(i,1);f.done&&f.done();}}
  if(drag&&drag.update)drag.update(dt);
  updParts(dt);
  handUpdate(dt);
  // deliveries and reveal
  if(!G.hankie&&G.deliverAt&&G.t>=G.deliverAt&&G.scene==='work'&&!G.trans){G.deliverAt=0;deliverHankie();}
  if(G.revealAt&&G.t>=G.revealAt&&!G.trans&&!drag){G.revealAt=0;if(!G.hankie){G.deliverAt=0;deliverHankie();handStop();}goPicnic();}
  // transitions
  if(G.trans){const T=G.trans;T.t+=dt;
    if(T.first){const st=Math.floor(clamp(T.t/1.0,0,1)*6);if(st>T.stitched){T.stitched=st;SFX.stitch();}if(!T.basa&&T.t>=1.9){T.basa=true;SFX.basa();G.pic.flutter=1;}}
    if(T.t>=T.dur){if(T.kind==='toPic'){G.scene='pic';G.revealDone=true;G.shelfAtPic=G.shelf.length;logD('picnic');}else{G.scene='work';}G.trans=null;G.lastInput=G.t;}}
  if(G.scene==='pic'||(G.trans&&G.trans.kind==='toPic'))updatePicnic(dt);
  // guidance
  G.target=currentTarget();
  const idle=G.t-G.lastInput;
  G.emph=drag?0:0.4+0.6*clamp((idle-1.5)/2,0,1);
  if(!drag&&!hand.kind&&!G.trans&&G.target){
    if(G.target.k==='disc'&&!G.demoDone&&idle>4&&G.scene==='work')startDemo();
    else if(G.target.k==='discRev'&&idle>1.6&&G.t-G.lastHint>3.5)doHint(G.target);
    else if(idle>4.3&&G.t-G.lastHint>6.5&&(G.demoDone||G.target.k!=='disc'))doHint(G.target);
  }
  // automatic tidy-up so the play never stalls
  if(G.scene==='work'&&h&&!drag&&!hand.kind&&!G.trans&&(h.out||isFinished(h))&&idle>7.5){
    if(h.fold)autoOpen(h);else if(G.t-(h.openT||0)>1)autoShelve(h);
  }
  if(G.snag&&G.t-G.snag.t0>14)freeSnag(true);
  updateCrankSound(dt);
}
function render(){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  const T=G.trans;
  if(!T){if(G.scene==='work')drawWorkshop();else drawPicnic(1);return;}
  if(T.kind==='toPic'){
    if(T.first){const t=T.t;
      if(t<1.0){drawWorkshop();sewOverlay(t/1.0,0);}
      else if(t<1.9){const k=ease((t-1.0)/0.9);drawPicnic(0);drawPanels(k);sewOverlay(1,k);}
      else{const k=(t-1.9)/(T.dur-1.9);drawPicnic(0.55+0.45*backOut(k));}
    }else{drawPicnic(1);drawPanels(ease(T.t/T.dur));}
  }else{drawPicnic(1);drawPanels(1-ease(T.t/T.dur));}
}
let last=0,raf=0;
function frame(ts){
  raf=requestAnimationFrame(frame);
  let dt=last?(ts-last)/1000:0.016;last=ts;if(!(dt>0))dt=0.016;dt=Math.min(dt,1/20);
  try{update(dt);render();}catch(err){if(!frame.err){frame.err=1;console.warn(err);}}
}
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){if(raf){cancelAnimationFrame(raf);raf=0;}endDrag(true);G.disc.pressed=false;G.disc.vel=0;if(AC&&AC.state==='running'){try{AC.suspend();}catch(e){}}}
  else{last=0;G.lastInput=G.t;if(!raf)raf=requestAnimationFrame(frame);if(AC&&AC.state==='suspended'){try{AC.resume();}catch(e){}}}
});
let rzT=0;
function onResize(){endDrag(true);layout();}
window.addEventListener('resize',()=>{clearTimeout(rzT);rzT=setTimeout(onResize,120);});
window.addEventListener('orientationchange',()=>{clearTimeout(rzT);rzT=setTimeout(onResize,250);});

/* ---------------- boot ---------------- */
function boot(){
  genStaticTex();
  PTYPES.forEach(t=>{const d=genDisp(t);SW[t]={ink:genInk(t),disp:d.disp,shadow:d.shadow};});
  layout();
  G.hankie=newHankie();
  const pt=swatchPatch('check');pt.du=-G.hankie.p;pt.dv=0.3;G.patches.push(pt);G.swUse.check++;
  loadFav();
  raf=requestAnimationFrame(frame);
}
// test hook (read-only view for automated checks; no UI)
window.__gf={G,get L(){return L;},hand,FOLDS,pMaxOf,pMinOf,isFinished,hankieFrame,canGeom};
boot();
})();
</script>
