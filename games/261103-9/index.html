<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1b0f08">
<title>どん、ちりん！ころころ音玉の大演奏会</title>
<style>
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#1b0f08;
  overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none;
  -webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;}
body{position:fixed;inset:0;}
canvas{position:absolute;left:0;top:0;width:100%;height:100%;display:block;touch-action:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;}
#sa{position:absolute;left:0;top:0;width:0;height:0;visibility:hidden;pointer-events:none;
  padding-top:env(safe-area-inset-top,0px);padding-right:env(safe-area-inset-right,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="sa"></div>
<script>
(() => {
'use strict';
/* ============================================================
   どん、ちりん！ころころ音玉の大演奏会
   大太鼓→鉄玉(右・重い)  鈴→ガラス玉(左・軽い)  トライアングル→真ちゅう玉(左・中)
   お盆が重さで傾く → 釣り合うと中央の溝が開く → 満杯/片寄りで流出 → 舞台が開き再演
   ============================================================ */
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const saEl = document.getElementById('sa');

/* ---------- utils ---------- */
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const ease = t => t <= 0 ? 0 : t >= 1 ? 1 : t * t * (3 - 2 * t);
const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const R0 = rng(7);

/* ---------- constants ---------- */
const WEIGHT = { iron: 4, brass: 2, glass: 1 };
const SIDE = { iron: 'R', brass: 'L', glass: 'L' };
const INSTMAT = { drum: 'iron', bell: 'glass', tri: 'brass' };
const MAXA = 0.27;          // 最大傾き(rad)
const TILTK = 2.4;          // 傾きの柔らかさ
const BAL_TOL = 1;          // 釣り合いの余裕(重さ単位)
const SIDE_CAP = 7;         // 片寄りで溢れる個数
const FULL = 8;             // 満杯
const SONG_MAX = 24;        // 一曲の上限(投入順は保持)
const MAX_FLY = 10;
const MAX_PART = 140;
const FLY_DUR = 0.5;
const DISP_DT = 0.34;       // 出口の間隔(発音順を守る)
const DROP_DUR = 0.52;
// 音階
const BAR_SCALE = [55, 57, 60, 62, 64, 67, 69, 72];           // 木琴・鉄琴(ペンタトニック)
const CHIME_SCALE = [62, 64, 66, 68, 69, 73, 76];            // 中央の特別な音階(リディア風)
const BAR_REG = { iron: [0, 1, 2], brass: [3, 4], glass: [5, 6, 7] };
const CHIME_REG = { iron: [0, 1], brass: [2, 3, 4], glass: [5, 6] };

/* ---------- state ---------- */
const S = {
  t: 0, nextId: 1, balls: [], bowls: { L: [], R: [] }, pending: [],
  tray: { ang: 0, vel: 0, sag: 0, sagV: 0, gate: 0, wob: 0 },
  balanced: false, concert: null, stage: 0, rows: [], rowTried: false,
  cycle: 0, goal: null, uses: { drum: 0, bell: 0, tri: 0 },
  lastInput: -1, demoShown: false, demo: null,
  parts: [], ev: [], inst: { drum: { hit: -99, pow: 0 }, bell: { hit: -99 }, tri: { hit: -99 } },
  barGlow: { L: new Array(8).fill(-99), R: new Array(8).fill(-99), C: new Array(7).fill(-99) },
  beadGlow: {}, reso: -99, trayTap: -99, rowTap: [-99, -99, -99],
  log: [], releases: [], target: null, landings: 0, firstTap: -1, firstVisual: -1,
};
function at(delay, f) { S.ev.push({ t: S.t + delay, f }); }

/* ---------- layout ---------- */
const L = {};
let W = 0, H = 0, DPR = 1;
const C = {}; // caches
function readSafe() {
  const cs = getComputedStyle(saEl);
  return { t: parseFloat(cs.paddingTop) || 0, r: parseFloat(cs.paddingRight) || 0, b: parseFloat(cs.paddingBottom) || 0, l: parseFloat(cs.paddingLeft) || 0 };
}
function layout() {
  const sa = readSafe();
  W = Math.max(1, window.innerWidth); H = Math.max(1, window.innerHeight);
  DPR = Math.min(2, window.devicePixelRatio || 1);
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  const left = sa.l, right = W - sa.r, top = sa.t, bottom = H - sa.b;
  const Wc = right - left, Hc = bottom - top, cx = left + Wc / 2;
  const portrait = Hc > Wc * 1.05;
  Object.assign(L, { left, right, top, bottom, Wc, Hc, cx, portrait });
  let R, Lh;
  if (portrait) {
    L.pivotY = top + Hc * 0.145;
    L.drumY = top + Hc * 0.5;
    R = Math.min(Wc * 0.25, Hc * 0.13);
    Lh = Wc * 0.42;
    L.y0 = top + Hc * 0.72; L.y1 = top + Hc * 0.915;
  } else {
    L.pivotY = top + Hc * 0.13;
    L.drumY = top + Hc * 0.5;
    R = Math.min(Hc * 0.15, Wc * 0.13);
    Lh = Math.min(Wc * 0.31, Hc * 0.62);
    L.y0 = top + Hc * 0.73; L.y1 = top + Hc * 0.91;
  }
  L.R = R; L.Lh = Lh;
  L.br = clamp(R * 0.15, 9, 22);
  const br = L.br;
  L.beamY = top + Math.max(4, Hc * 0.012); L.beamH = Math.max(10, Hc * 0.022);
  L.hang = br * 1.9; L.th = br * 1.15;
  L.bowlX = Math.min(Lh * 0.6, Lh - 4.3 * br);
  L.sp = br * 2.1;
  L.arcH = Hc * 0.07;
  const s = clamp(R * 0.42, 24, 64);
  if (portrait) {
    L.bell = { x: left + Wc * 0.13, y: L.drumY - R * 0.05, s };
    L.tri = { x: right - Wc * 0.13, y: L.drumY - R * 0.05, s };
  } else {
    L.bell = { x: cx - Wc * 0.25, y: L.drumY, s };
    L.tri = { x: cx + Wc * 0.25, y: L.drumY, s };
  }
  L.lipH = Math.max(8, Hc * 0.018); L.slitH = Math.max(7, Hc * 0.013);
  L.stTop = L.y0 + L.lipH;
  L.insTop = L.stTop + 2; L.insBot = L.y1 - br * 2.5;
  L.insH = Math.max(20, L.insBot - L.insTop);
  const gap = br * 1.4, pad = Math.max(8, Wc * 0.02);
  L.xylo = { x0: left + pad, x1: cx - gap / 2 };
  L.metal = { x0: cx + gap / 2, x1: right - pad };
  // バー
  L.bars = { L: [], R: [] };
  for (const side of ['L', 'R']) {
    const a = side === 'L' ? L.xylo : L.metal;
    const n = 8, aw = a.x1 - a.x0, bw = aw / n;
    const cyI = (L.insTop + L.insBot) / 2;
    for (let i = 0; i < n; i++) {
      const h = L.insH * (1 - i * 0.055);
      const xc = side === 'L' ? a.x0 + bw * (i + 0.5) : a.x1 - bw * (i + 0.5);
      L.bars[side].push({ x: xc, y: cyI, w: bw * 0.8, h });
    }
  }
  // 受け溝(演奏済みの並び)
  L.trSp = br * 2.05;
  L.trN = Math.max(6, Math.floor((Wc - 2 * pad - br) / L.trSp));
  L.trX0 = cx - (L.trN - 1) * L.trSp / 2;
  // 前の曲の棚
  L.ledge = { y: L.y1, h: bottom - L.y1 };
  L.slots = [];
  for (let i = 0; i < 3; i++) L.slots.push({ x: left + Wc * i / 3, y: L.y1 + 2, w: Wc / 3, h: Math.max(30, bottom - L.y1 - 4) });
  L.tiny = Math.min(br * 0.42, (Wc / 3 - 18) / (8 * 2.2));
  // 中央のチャイム
  L.chimes = [];
  const cwid = Math.min(Lh * 0.46, Wc * 0.22);
  for (let j = 0; j < 7; j++) L.chimes.push({ x: -cwid + (2 * cwid) * j / 6, len: br * (3.3 - j * 0.27) });
  L.chimeY = L.hang + L.th + br * 0.55;
  buildCaches();
}

/* ---------- canvas helpers ---------- */
function mk(w, h) {
  const c = document.createElement('canvas');
  c.width = Math.max(1, Math.ceil(w * DPR)); c.height = Math.max(1, Math.ceil(h * DPR));
  const g = c.getContext('2d'); g.scale(DPR, DPR);
  return { c, g, w, h };
}
function woodGrain(g, x, y, w, h, base, dir, seed, opt = {}) {
  const r = rng(seed);
  const gr = dir === 'v' ? g.createLinearGradient(x, 0, x + w, 0) : g.createLinearGradient(0, y, 0, y + h);
  gr.addColorStop(0, base[0]); gr.addColorStop(0.5, base[1]); gr.addColorStop(1, base[2] || base[0]);
  g.fillStyle = gr; g.fillRect(x, y, w, h);
  g.save(); g.beginPath(); g.rect(x, y, w, h); g.clip();
  const n = opt.n || Math.ceil((dir === 'v' ? w : h) / 2.2);
  for (let i = 0; i < n; i++) {
    const a = 0.05 + r() * (opt.a || 0.16);
    g.strokeStyle = r() < 0.7 ? `rgba(18,8,3,${a})` : `rgba(150,96,58,${a * 0.6})`;
    g.lineWidth = 0.4 + r() * 1.4;
    g.beginPath();
    const off = r() * (dir === 'v' ? w : h), amp = 1 + r() * 4, fr = 0.004 + r() * 0.02, ph = r() * 6;
    if (dir === 'v') {
      for (let yy = y; yy <= y + h + 8; yy += 8) { const xx = x + off + Math.sin(yy * fr + ph) * amp + Math.sin(yy * fr * 3.1) * amp * 0.3; yy === y ? g.moveTo(xx, yy) : g.lineTo(xx, yy); }
    } else {
      for (let xx = x; xx <= x + w + 8; xx += 8) { const yy = y + off + Math.sin(xx * fr + ph) * amp + Math.sin(xx * fr * 2.7) * amp * 0.3; xx === x ? g.moveTo(xx, yy) : g.lineTo(xx, yy); }
    }
    g.stroke();
  }
  // 節(木目の渦)
  const knots = opt.knots ?? 1;
  for (let k = 0; k < knots; k++) {
    const kx = x + r() * w, ky = y + r() * h, kr = 3 + r() * Math.min(w, h) * 0.08;
    const kg = g.createRadialGradient(kx, ky, 0, kx, ky, kr);
    kg.addColorStop(0, 'rgba(15,6,2,0.35)'); kg.addColorStop(1, 'rgba(15,6,2,0)');
    g.fillStyle = kg; g.beginPath(); g.ellipse(kx, ky, dir === 'v' ? kr * 0.6 : kr * 1.6, dir === 'v' ? kr * 1.6 : kr * 0.6, 0, 0, 7); g.fill();
  }
  g.restore();
}
function shade(g, x, y, w, h, dir, stops) {
  const gr = dir === 'v' ? g.createLinearGradient(0, y, 0, y + h) : g.createLinearGradient(x, 0, x + w, 0);
  for (const [o, c] of stops) gr.addColorStop(o, c);
  g.fillStyle = gr; g.fillRect(x, y, w, h);
}

/* ---------- caches ---------- */
function buildCaches() {
  buildBG(); buildBalls(); buildTray(); buildDrum(); buildGiant(); buildPanels();
}
function buildBG() {
  const o = mk(W, H), g = o.g;
  // 奥の壁:濃い胡桃色の板張り
  const pw = Math.max(48, W / 8);
  let i = 0;
  for (let x = 0; x < W; x += pw, i++) {
    const v = i % 2 ? ['#2c190e', '#3a2314', '#2a170c'] : ['#311c10', '#40271a', '#2d190e'];
    woodGrain(g, x, 0, pw + 1, H, v, 'v', 100 + i, { a: 0.18, knots: 1 });
    shade(g, x, 0, 6, H, 'h', [[0, 'rgba(8,3,1,0.55)'], [1, 'rgba(8,3,1,0)']]);
    shade(g, x + pw - 3, 0, 3, H, 'h', [[0, 'rgba(120,80,50,0)'], [1, 'rgba(120,80,50,0.12)']]);
  }
  // 上からの柔らかな光と周辺の陰
  let rg = g.createRadialGradient(W / 2, L.pivotY, 10, W / 2, H * 0.45, Math.max(W, H) * 0.75);
  rg.addColorStop(0, 'rgba(255,190,120,0.10)'); rg.addColorStop(0.5, 'rgba(0,0,0,0)'); rg.addColorStop(1, 'rgba(0,0,0,0.55)');
  g.fillStyle = rg; g.fillRect(0, 0, W, H);
  // 梁
  const by = L.beamY, bh = L.beamH;
  woodGrain(g, 0, 0, W, by + bh, ['#24140a', '#4a2c19', '#2a170c'], 'h', 300, { a: 0.2 });
  shade(g, 0, by + bh, W, bh * 0.8, 'v', [[0, 'rgba(0,0,0,0.5)'], [1, 'rgba(0,0,0,0)']]);
  shade(g, 0, by + bh * 0.1, W, bh * 0.25, 'v', [[0, 'rgba(255,200,140,0)'], [0.5, 'rgba(255,200,140,0.12)'], [1, 'rgba(255,200,140,0)']]);
  // 舞台の奥(開いたときの暗がり)
  const y0 = L.y0, st = L.stTop, y1 = L.y1;
  shade(g, 0, st, W, y1 - st, 'v', [[0, '#0b0503'], [0.6, '#160b06'], [1, '#22130a']]);
  rg = g.createRadialGradient(W / 2, y1, 5, W / 2, y1, W * 0.6);
  rg.addColorStop(0, 'rgba(120,70,30,0.25)'); rg.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = rg; g.fillRect(0, st, W, y1 - st);
  // 受け溝(舞台前の溝)
  const ty = y1 - L.br * 1.05;
  shade(g, 0, ty - L.br * 0.2, W, L.br * 1.5, 'v', [[0, 'rgba(0,0,0,0)'], [0.5, 'rgba(60,35,18,0.55)'], [1, 'rgba(0,0,0,0.6)']]);
  // 舞台の縁(リップ)
  woodGrain(g, 0, y0, W, L.lipH, ['#5a3620', '#6e4428', '#3a2213'], 'h', 400, { a: 0.2 });
  shade(g, 0, y0, W, 2, 'v', [[0, 'rgba(255,210,160,0.35)'], [1, 'rgba(255,210,160,0)']]);
  shade(g, 0, y0 - L.lipH * 0.6, W, L.lipH * 0.6, 'v', [[0, 'rgba(0,0,0,0)'], [1, 'rgba(0,0,0,0.35)']]);
  // 前の曲の棚
  woodGrain(g, 0, y1, W, H - y1, ['#4a2c18', '#3a2213', '#26150b'], 'h', 500, { a: 0.18 });
  shade(g, 0, y1, W, 3, 'v', [[0, 'rgba(255,210,160,0.3)'], [1, 'rgba(255,210,160,0)']]);
  for (const sl of L.slots) {
    const cyy = sl.y + sl.h / 2;
    const gg = g.createLinearGradient(0, cyy - L.tiny * 4, 0, cyy + L.tiny * 4);
    gg.addColorStop(0, 'rgba(0,0,0,0)'); gg.addColorStop(0.5, 'rgba(10,4,1,0.35)'); gg.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = gg; g.fillRect(sl.x + 10, cyy - L.tiny * 4, sl.w - 20, L.tiny * 8);
  }
  C.bg = o;
}
function ballSprite(mat, r) {
  const s = Math.ceil(r * 2 + 4), o = mk(s, s), g = o.g, c = s / 2;
  const circ = () => { g.beginPath(); g.arc(c, c, r, 0, 7); };
  let gr;
  if (mat === 'iron') {
    gr = g.createRadialGradient(c - r * 0.38, c - r * 0.42, r * 0.05, c, c, r);
    gr.addColorStop(0, '#c9ccce'); gr.addColorStop(0.28, '#8d9296'); gr.addColorStop(0.72, '#4b4f53'); gr.addColorStop(1, '#222426');
    g.fillStyle = gr; circ(); g.fill();
    g.save(); circ(); g.clip();
    gr = g.createRadialGradient(c, c + r * 0.85, 0, c, c + r * 0.85, r * 0.9);
    gr.addColorStop(0, 'rgba(150,88,45,0.5)'); gr.addColorStop(1, 'rgba(150,88,45,0)');
    g.fillStyle = gr; g.fillRect(0, 0, s, s);
    const rr = rng(11);
    for (let i = 0; i < 26; i++) { g.fillStyle = `rgba(${rr() < 0.5 ? '20,20,22' : '200,200,205'},${0.05 + rr() * 0.08})`; g.fillRect(c - r + rr() * 2 * r, c - r + rr() * 2 * r, 1, 1); }
    g.restore();
    gr = g.createRadialGradient(c - r * 0.4, c - r * 0.45, 0, c - r * 0.4, c - r * 0.45, r * 0.38);
    gr.addColorStop(0, 'rgba(255,255,255,0.45)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = gr; circ(); g.fill();
  } else if (mat === 'brass') {
    gr = g.createRadialGradient(c - r * 0.35, c - r * 0.4, r * 0.05, c, c, r);
    gr.addColorStop(0, '#fff0b0'); gr.addColorStop(0.3, '#e0ad45'); gr.addColorStop(0.75, '#93621a'); gr.addColorStop(1, '#4b300a');
    g.fillStyle = gr; circ(); g.fill();
    g.save(); circ(); g.clip();
    gr = g.createRadialGradient(c, c + r * 0.85, 0, c, c + r * 0.85, r * 0.9);
    gr.addColorStop(0, 'rgba(120,60,20,0.45)'); gr.addColorStop(1, 'rgba(120,60,20,0)');
    g.fillStyle = gr; g.fillRect(0, 0, s, s);
    g.restore();
  } else {
    gr = g.createRadialGradient(c, c, r * 0.15, c, c, r);
    gr.addColorStop(0, 'rgba(215,236,245,0.06)'); gr.addColorStop(0.6, 'rgba(190,220,235,0.12)'); gr.addColorStop(0.9, 'rgba(165,205,225,0.38)'); gr.addColorStop(1, 'rgba(225,242,252,0.6)');
    g.fillStyle = gr; circ(); g.fill();
    g.save(); circ(); g.clip();
    // 内部の屈折(逆さまの舞台)
    gr = g.createRadialGradient(c, c - r * 0.25, 0, c, c - r * 0.25, r * 0.75);
    gr.addColorStop(0, 'rgba(70,38,18,0.32)'); gr.addColorStop(1, 'rgba(70,38,18,0)');
    g.fillStyle = gr; g.fillRect(0, 0, s, s);
    gr = g.createRadialGradient(c + r * 0.12, c + r * 0.55, 0, c + r * 0.12, c + r * 0.55, r * 0.42);
    gr.addColorStop(0, 'rgba(255,236,190,0.8)'); gr.addColorStop(1, 'rgba(255,236,190,0)');
    g.fillStyle = gr; g.fillRect(0, 0, s, s);
    g.strokeStyle = 'rgba(255,255,255,0.32)'; g.lineWidth = r * 0.09; g.lineCap = 'round';
    g.beginPath(); g.arc(c, c, r * 0.78, 2.1, 3.1); g.stroke();
    g.restore();
  }
  // 鏡面ハイライト
  g.fillStyle = mat === 'glass' ? 'rgba(255,255,255,0.92)' : 'rgba(255,255,250,0.7)';
  g.beginPath(); g.ellipse(c - r * 0.38, c - r * 0.45, r * 0.2, r * 0.12, -0.6, 0, 7); g.fill();
  return o;
}
function bandSprite(r) {
  const s = Math.ceil(r * 2 + 4), o = mk(s, s), g = o.g, c = s / 2;
  g.save(); g.beginPath(); g.arc(c, c, r, 0, 7); g.clip();
  const gr = g.createLinearGradient(0, c - r * 0.16, 0, c + r * 0.16);
  gr.addColorStop(0, 'rgba(80,45,8,0)'); gr.addColorStop(0.35, 'rgba(80,45,8,0.45)'); gr.addColorStop(0.55, 'rgba(255,230,150,0.35)'); gr.addColorStop(1, 'rgba(80,45,8,0)');
  g.fillStyle = gr; g.fillRect(0, c - r * 0.16, s, r * 0.32);
  g.fillStyle = 'rgba(70,40,8,0.5)'; g.beginPath(); g.arc(c + r * 0.55, c, r * 0.09, 0, 7); g.fill();
  g.restore();
  return o;
}
function buildBalls() {
  C.ball = { iron: ballSprite('iron', L.br), brass: ballSprite('brass', L.br), glass: ballSprite('glass', L.br) };
  C.band = bandSprite(L.br);
}
// お盆(左右半分ずつ描くためローカル座標で一枚)
function buildTray() {
  const { Lh, br, th, hang, bowlX } = L;
  const cap = br * 0.55, m = br * 1.2;
  const w = 2 * Lh + 2 * cap + 4, h = th + m + 4;
  const o = mk(w, h), g = o.g;
  const ox = Lh + cap + 2, oy = m - hang; // local(x,y) -> (x+ox, y+oy)
  C.trayOX = ox; C.trayOY = oy;
  const top = hang + oy, bot = hang + th + oy;
  const dip = (x) => { let d = 0; for (const s of [-1, 1]) { const u = (x - s * bowlX) / (br * 4.4); if (Math.abs(u) < 1) d += (Math.cos(u * Math.PI) + 1) / 2; } return d * br * 0.38; };

  g = ctx.createRadialGradient(0, r * 0.5, 0, 0, r * 0.5, r * 0.62);
  g.addColorStop(0, 'rgba(10,5,0,0.95)'); g.addColorStop(0.5, 'rgba(10,5,0,0.6)'); g.addColorStop(1, 'rgba(10,5,0,0)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.ellipse(0, r * 0.5, r * 0.62, r * 0.12, 0, 0, 7); ctx.fill();
  ctx.fillStyle = 'rgba(255,250,225,0.75)'; ctx.beginPath(); ctx.ellipse(-r * 0.38, -r * 0.42, r * 0.2, r * 0.11, -0.6, 0, 7); ctx.fill();
  ctx.restore();
}
function drawBell() {
  const o = L.bell, s = o.s, lt = S.t - S.inst.bell.hit;
  const hit = lt >= 0 && lt < 1 ? Math.exp(-lt * 4.5) : 0;
  const hop = -hopFor('bell') * s * 0.12;
  const idle = S.target === 'bell' ? 0 : Math.sin(S.t * 1.7) * 0.02;
  const reso = S.reso > 0 && S.t - S.reso < 2 ? Math.exp(-(S.t - S.reso) * 1.5) : 0;
  // 支柱
  const pw = Math.max(5, s * 0.14), topY = o.y - s * 0.95;
  woodGrain(ctx, o.x - pw / 2, topY, pw, L.y0 - topY, ['#2b170b', '#5d3820', '#24130a'], 'v', 61, { n: 4, knots: 0 });
  woodGrain(ctx, o.x - s * 0.8, topY - pw * 0.4, s * 1.6, pw * 0.8, ['#2b170b', '#5d3820', '#24130a'], 'h', 62, { n: 4, knots: 0 });
  drawGlow(o.x, L.y0, s * 0.8, 0.3, '0,0,0');
  const bells = [[-0.5, -0.15, 0], [0.5, -0.15, 1], [0, 0.32, 2]];
  for (const [bx, by, i] of bells) {
    const rot = Math.sin(lt * 70 + i * 2) * hit * 0.4 + idle + Math.sin(S.t * 50 + i) * reso * 0.15;
    const ax = o.x + bx * s * 0.75, ay = topY;
    const cx = o.x + bx * s + Math.sin(rot) * s * 0.3, cy = o.y + by * s + hop;
    // 紐(麻の色、細い)
    ctx.strokeStyle = 'rgba(150,100,55,0.85)'; ctx.lineWidth = Math.max(1.5, s * 0.04);
    ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(cx, cy - s * 0.3); ctx.stroke();
    suzu(cx, cy, s * 0.34, rot);
  }
}
function drawTri() {
  const o = L.tri, s = o.s, lt = S.t - S.inst.tri.hit;
  const ring = lt >= 0 && lt < 3 ? Math.exp(-lt * 1.1) : 0;
  const hop = -hopFor('tri') * s * 0.12;
  const reso = S.reso > 0 && S.t - S.reso < 2.2 ? Math.exp(-(S.t - S.reso) * 1.2) : 0;
  // 吊り台
  const pw = Math.max(5, s * 0.14), armY = o.y - s * 1.35, postX = o.x + s * 0.95;
  woodGrain(ctx, postX - pw / 2, armY, pw, L.y0 - armY, ['#2b170b', '#5d3820', '#24130a'], 'v', 71, { n: 4, knots: 0 });
  woodGrain(ctx, o.x - pw, armY - pw * 0.4, postX - o.x + pw * 1.5, pw * 0.8, ['#2b170b', '#5d3820', '#24130a'], 'h', 72, { n: 4, knots: 0 });
  drawGlow(postX, L.y0, s * 0.6, 0.3, '0,0,0');
  const sway = Math.sin(lt * 9) * ring * 0.12 + (S.target === 'tri' ? 0 : Math.sin(S.t * 1.3) * 0.02) + Math.sin(S.t * 40) * reso * 0.04;
  const topY = o.y - s * 0.78 + hop;
  ctx.strokeStyle = 'rgba(150,100,55,0.85)'; ctx.lineWidth = Math.max(1.5, s * 0.04);
  ctx.beginPath(); ctx.moveTo(o.x, armY); ctx.lineTo(o.x + Math.sin(sway) * s * 0.3, topY); ctx.stroke();
  ctx.save(); ctx.translate(o.x + Math.sin(sway) * s * 0.3, topY); ctx.rotate(sway);
  const vib = Math.sin(lt * 90) * ring * s * 0.012;
  const a = [0, 0], b = [-s * 0.74 + vib, s * 1.3], c2 = [s * 0.74 - vib, s * 1.3];
  // 鋼の棒(太い描画で材そのものを表す)
  const g = ctx.createLinearGradient(-s * 0.8, 0, s * 0.8, s * 1.3);
  g.addColorStop(0, '#5a6064'); g.addColorStop(0.3, '#eef1f3'); g.addColorStop(0.5, '#8a9196'); g.addColorStop(0.7, '#dfe3e6'); g.addColorStop(1, '#40464a');
  ctx.strokeStyle = g; ctx.lineWidth = Math.max(4, s * 0.1); ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.beginPath(); ctx.moveTo(b[0] + s * 0.12, b[1] - s * 0.2); ctx.lineTo(a[0], a[1]); ctx.lineTo(c2[0], c2[1]); ctx.lineTo(b[0] + s * 0.14, b[1]); ctx.stroke();
  // 余韻のきらめきが棒を走る
  if (ring > 0.02 || reso > 0.02) {
    const v = Math.max(ring, reso);
    const u = (S.t * 1.7) % 1, pts = [[b[0] + s * 0.12, b[1] - s * 0.2], a, c2, [b[0] + s * 0.14, b[1]]];
    const seg = Math.min(2, Math.floor(u * 3)), f = u * 3 - seg;
    const px = lerp(pts[seg][0], pts[seg + 1][0], f), py = lerp(pts[seg][1], pts[seg + 1][1], f);
    ctx.globalCompositeOperation = 'lighter';
    drawGlow(px, py, s * 0.3, 0.7 * v, '255,250,235');
    drawGlow(0, s * 0.8, s * 1.4, 0.13 * v, '230,240,255');
    ctx.globalCompositeOperation = 'source-over';
  }
  ctx.restore();
}
function drawParts() {
  ctx.globalCompositeOperation = 'lighter';
  for (const p of S.parts) {
    const a = clamp(p.life / p.max, 0, 1);
    let col, r = L.br * 0.13 * p.s;
    if (p.type === 'spark') col = `rgba(255,${150 + 80 * a | 0},80,${a})`;
    else if (p.type === 'glint') col = `rgba(255,215,120,${a * 0.9})`;
    else if (p.type === 'shard') { col = `rgba(220,240,255,${a * 0.9})`; r *= 0.8; }
    else { ctx.globalCompositeOperation = 'source-over'; col = `rgba(140,95,60,${a * 0.6})`; r *= 1.2; }
    ctx.fillStyle = col; ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, 7); ctx.fill();
    ctx.globalCompositeOperation = 'lighter';
  }
  ctx.globalCompositeOperation = 'source-over';
}
function drawHand() {
  const d = S.demo; if (!d) return;
  const tp = targetPos(d.target); if (!tp) return;
  const t = d.t;
  let ax, ay, al;
  const tx = tp.x + tp.r * 0.12, ty = tp.y + tp.r * 0.12;
  const sx = tx + tp.r * 0.9, sy = ty + tp.r * 1.3;
  if (t < 0.6) { const u = ease(t / 0.6); ax = lerp(sx, tx, u); ay = lerp(sy, ty, u); al = u; }
  else if (t < 0.95) { const u = (t - 0.6) / 0.35, pr = Math.sin(u * Math.PI); ax = tx - pr * 4; ay = ty + pr * 6; al = 1; }
  else { const u = ease((t - 0.95) / 1.05); ax = lerp(tx, sx, u); ay = lerp(ty, sy, u); al = 1 - u; }
  const hs = clamp(L.R * 0.5, 34, 70);
  ctx.save(); ctx.globalAlpha = al * 0.92; ctx.translate(ax, ay); ctx.rotate(-0.5);
  drawGlow(hs * 0.15, hs * 0.85, hs * 0.75, 0.25, '0,0,0');
  const skin = (x0, y0, x1, y1) => { const g = ctx.createLinearGradient(x0, y0, x1, y1); g.addColorStop(0, '#e2ad84'); g.addColorStop(0.5, '#c88a60'); g.addColorStop(1, '#8a5534'); return g; };
  // 人差し指
  ctx.fillStyle = skin(-hs * 0.12, 0, hs * 0.12, 0);
  ctx.beginPath(); ctx.ellipse(0, hs * 0.32, hs * 0.11, hs * 0.36, 0, 0, 7); ctx.fill();
  // 手のひら
  ctx.fillStyle = skin(-hs * 0.3, hs * 0.5, hs * 0.4, hs * 1.1);
  ctx.beginPath(); ctx.ellipse(hs * 0.12, hs * 0.82, hs * 0.3, hs * 0.32, 0.2, 0, 7); ctx.fill();
  // 握った指の丸み
  for (let i = 0; i < 3; i++) { ctx.beginPath(); ctx.ellipse(hs * (0.2 + i * 0.12), hs * (0.58 + i * 0.03), hs * 0.1, hs * 0.13, 0.3, 0, 7); ctx.fill(); }
  ctx.fillStyle = 'rgba(255,230,205,0.45)'; ctx.beginPath(); ctx.ellipse(-hs * 0.03, hs * 0.08, hs * 0.04, hs * 0.07, 0, 0, 7); ctx.fill();
  ctx.restore();
}
function draw() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.drawImage(C.bg.c, 0, 0, W, H);
  // 共鳴で舞台全体が温かく光る
  if (S.reso > 0 && S.t - S.reso < 2.5) {
    const a = 0.22 * Math.exp(-(S.t - S.reso) * 1.3);
    ctx.globalCompositeOperation = 'lighter';
    drawGlow(L.cx, L.y0, Math.max(W, H) * 0.7, a, '255,170,90');
    ctx.globalCompositeOperation = 'source-over';
  }
  drawStage();
  drawRows();
  drawHanger();
  drawChimes();
  // 中央経路の玉(太鼓の後ろを通る)
  for (const b of S.balls) if ((b.state === 'drop' || b.state === 'bounce') && b.layer === 'back') drawBall(b);
  drawTray();
  for (const b of S.balls) if (b.state === 'bowl' || b.state === 'line') drawBall(b);
  // 誘導の光
  const tg = S.target;
  if (tg && !tg.startsWith('row')) {
    const tp = targetPos(tg), pulse = 0.22 + 0.14 * Math.sin(S.t * 4);
    ctx.globalCompositeOperation = 'lighter';
    drawGlow(tp.x, tp.y, tp.r * 1.45, pulse, tg === 'drum' ? '255,170,100' : tg === 'bell' ? '255,210,110' : '220,235,255');
    ctx.globalCompositeOperation = 'source-over';
  } else if (tg) {
    const tp = targetPos(tg);
    ctx.globalCompositeOperation = 'lighter';
    drawGlow(tp.x, tp.y, tp.r, 0.18 + 0.1 * Math.sin(S.t * 4), '255,200,120');
    ctx.globalCompositeOperation = 'source-over';
  }
  drawBell(); drawTri(); drawDrum();
  for (const b of S.balls) if (b.state === 'fly' || ((b.state === 'drop' || (b.state === 'bounce' && b.u <= 0.6)) && b.layer !== 'back') || b.state === 'toRow') drawBall(b);
  drawParts();
  drawHand();
}

/* ---------- loop ---------- */
let raf = 0, last = 0, running = true, needLayout = true;
function frame(now) {
  raf = 0;
  if (!running) return;
  if (needLayout) { needLayout = false; layout(); }
  const dt = last ? Math.min(1 / 30, Math.max(0, (now - last) / 1000)) : 1 / 60;
  last = now;
  try { update(dt); draw(); } catch (e) { console.warn(e); }
  raf = requestAnimationFrame(frame);
}
function start() { if (!raf && running) { last = 0; raf = requestAnimationFrame(frame); } }
document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    running = false; if (raf) cancelAnimationFrame(raf); raf = 0; activePointers.clear();
    if (AC && AC.state === 'running') { try { AC.suspend(); } catch (e) {} }
  } else {
    running = true; if (AC) { try { AC.resume(); } catch (e) {} } start();
  }
});
window.addEventListener('pagehide', () => { running = false; if (raf) cancelAnimationFrame(raf); raf = 0; });
window.addEventListener('pageshow', () => { if (!document.hidden) { running = true; start(); } });
window.addEventListener('resize', () => { needLayout = true; });
window.addEventListener('orientationchange', () => { needLayout = true; });

// 自動テスト用の読み取り専用スナップショット
window.__otodama = {
  snap() {
    const st = trayStats(false), c = S.concert;
    return {
      t: S.t, ang: S.tray.ang, gate: S.tray.gate, stage: S.stage, balanced: S.balanced, stats: st,
      bowls: { L: S.bowls.L.map(b => b.mat + ':' + b.state), R: S.bowls.R.map(b => b.mat + ':' + b.state) },
      concert: c ? { phase: c.phase, path: c.path, queue: c.queue.map(b => b.mat), played: c.played.slice(), adds: c.adds, replayRow: c.replayRow } : null,
      rows: S.rows.map(r => ({ mats: r.mats.slice(), path: r.path })), target: S.target, demo: !!S.demo, demoShown: S.demoShown,
      balls: S.balls.length, flying: flyingCount(), parts: S.parts.length, log: S.log.slice(), releases: S.releases.slice(),
      firstTap: S.firstTap, firstVisual: S.firstVisual, drumHit: S.inst.drum.hit, cycle: S.cycle, goal: S.goal,
      audio: AC ? AC.state : 'none', running, layout: { cx: L.cx, drumY: L.drumY, R: L.R, bell: L.bell, tri: L.tri, slots: L.slots, pivotY: L.pivotY, Lh: L.Lh, br: L.br, y0: L.y0, y1: L.y1 },
    };
  },
};
layout();
start();
})();
</script>
