function knitFill(g,x0,y0,w,h,s,fn,opt){
 opt=opt||{};const loose=opt.loose||0;const rh=s*.78;
 const groups=new Map();
 const cols=Math.ceil(w/s),rows=Math.ceil(h/rh)+1;
 const lrx=Math.max(.1,s*.24),lry=Math.max(.1,s*.5),hrx=Math.max(.1,s*.09),hry=Math.max(.1,s*.2);
 for(let r=0;r<rows;r++){for(let c=0;c<cols;c++){
  const px=x0+(c+.5)*s,py=y0+(r+.5)*rh;
  const pal=fn(px,py,c,r);if(!pal)continue;
  let G=groups.get(pal);if(!G){G={bg:new Path2D(),leg:new Path2D(),hi:new Path2D()};groups.set(pal,G);}
  G.bg.rect(px-s/2,py-rh/2,s,rh+.6);
  let jx=0,jy=0;
  if(loose){const hh=hash(r*977+c*131+7);if(hh<loose*.32)continue;jx=(hash(c*31+r*17+3)-.5)*loose*s*.7;jy=(hash(c*7+r*53+9)-.5)*loose*s*.7;}
  for(let sd=-1;sd<=1;sd+=2){
   const cx=px+sd*s*.22+jx,cy=py+jy,ro=sd*.5;
   G.leg.moveTo(cx+lrx*Math.cos(ro),cy+lrx*Math.sin(ro));G.leg.ellipse(cx,cy,lrx,lry,ro,0,TAU);

  }

 groups.forEach((G,p)=>{g.fillStyle=p[2];g.fill(G.hi);});

  const n=Math.floor(w*h/(s*s)*.25);for(let i=0;i<n;i++){const x=x0+hash(i*3+1)*w,y=y0+hash(i*5+2)*h,a=hash(i*7+3)*TAU,l=s*(.4+hash(i*11)*.6);g.moveTo(x,y);g.quadraticCurveTo(x+Math.cos(a+1)*l*.6,y+Math.sin(a+1)*l*.6,x+Math.cos(a)*l,y+Math.sin(a)*l);}

const SZ=[20,15,11.5,8.5,6.4,4.8];
function lvl(m){return m>=.999?5:Math.min(4,Math.floor(m*5));}
function jNew(f){return {c:[{f,a:1}],mix:0,unr:0,rib:false,exp:false};}
function jClone(j){return {c:j.c.map(o=>({f:o.f,a:o.a})),mix:j.mix,unr:j.unr,rib:j.rib,exp:j.exp};}
function jMerge(j1,a1,j2,a2){const m=new Map();for(const o of j1.c)m.set(o.f,(m.get(o.f)||0)+o.a*a1);for(const o of j2.c)m.set(o.f,(m.get(o.f)||0)+o.a*a2);
 const t=a1+a2||1;const c=[];m.forEach((v,f)=>c.push({f,a:v/t}));
 return {c,mix:(j1.mix*a1+j2.mix*a2)/t,unr:(j1.unr*a1+j2.unr*a2)/t,rib:j1.rib||j2.rib,exp:j1.exp&&j2.exp};}
function jSig(j){return j.c.map(o=>o.f+Math.round(o.a*10)).join('')+lvl(j.mix)+(j.unr>.3?'u':'')+(j.rib?'r':'');}
function amt(c){let a=0;for(const p of c.parts)a+=p.a;return a;}
function fill(c){return amt(c)+(c.items?c.items.length:0);}
function addPart(c,j,a){if(a<=0)return;
 if(c.kind==='jar'){if(!c.parts.length)c.parts.push({j:jClone(j),a});else{const p=c.parts[0];p.j=jMerge(p.j,p.a,j,a);p.a+=a;}return;}
 const sg=jSig(j);for(const p of c.parts){if(jSig(p.j)===sg){p.j=jMerge(p.j,p.a,j,a);p.a+=a;return;}}
 c.parts.push({j:jClone(j),a});
 if(c.parts.length>3){c.parts.sort((x,y)=>y.a-x.a);const q=c.parts.pop(),r=c.parts[c.parts.length-1];r.j=jMerge(r.j,r.a,q.j,q.a);r.a+=q.a;}}
function takeFrom(c,d){const tot=amt(c);if(tot<=0)return [];d=Math.min(d,tot);const out=[];
 for(const p of c.parts){const x=p.a/tot*d;if(x>0){out.push({j:p.j,a:x});p.a-=x;}}
 c.parts=c.parts.filter(p=>p.a>1e-4);return out;}
function domPart(c){let b=null;for(const p of c.parts)if(!b||p.a>b.a)b=p;return b;}
function Ainv(a){return a<=.5?Math.sqrt(a/2):1-Math.sqrt((1-a)/2);}
function juiceFn(j,P){const base=FR[j.c[0].f].pal;if(j.c.length<2)return ()=>base;
 const th=[];let cum=0;for(let i=j.c.length-1;i>=1;i--){cum+=j.c[i].a;th.push([Ainv(Math.min(.97,cum)),FR[j.c[i].f].pal]);}
 return (x,y)=>{const u=((x/P)%1+1)%1,v=((y/P)%1+1)%1;const dd=Math.abs(u-.5)+Math.abs(v-.5);for(const t of th){if(dd<t[0])return t[1];}return base;};}
function partsFn(parts,cx,cy,R,P){
 if(parts.length===1)return juiceFn(parts[0].j,P);
 let tot=0;for(const p of parts)tot+=p.a;const fns=parts.map(p=>{const j=jClone(p.j);let mi=0;j.c.forEach((o,i)=>{if(o.a>j.c[mi].a+.02)mi=i;});if(mi){const d=j.c.splice(mi,1)[0];j.c.unshift(d);}const base=FR[j.c[0].f].pal;const rest=j.c.slice(1);return (x,y,c,r)=>{const h=hash((c|0)*7919+(r|0)*104729+11);let cum=0;for(const o of rest){cum+=o.a*.45;if(h<cum)return FR[o.f].pal;}return base;};});const cum=[];let s=0;for(const p of parts){s+=p.a/tot;cum.push(s);}
 return (x,y,c,r)=>{const dx=x-cx,dy=y-cy;const an=Math.atan2(dy,dx)/TAU+.5;const rr=Math.hypot(dx,dy)/R;const u=((an+rr*2.3)%1+1)%1;
  if(u<.04||u>.96)return C.ecr;
  for(let i=0;i<cum.length;i++){if(u<cum[i]){if(Math.abs(cum[i]-u)<.04&&i<cum.length-1)return C.ecr;return fns[i](x,y,c,r);}}
  return fns[fns.length-1](x,y,c,r);};}
function partsMix(parts){let a=0,m=0,u=0;for(const p of parts){a+=p.a;m+=p.j.mix*p.a;u+=p.j.unr*p.a;}return a?{mix:m/a,unr:u/a}:{mix:0,unr:0};}
